title: Learning Biology For Life
subtitle: Biology, Philosophy & Future Sciences
name: MD. Yusuf
email: yusuf.38bcs@gmail.com
description: A Neural Network of Education System
url: https://learningbiologyforlife.org
baseurl: ''
repository: yusuf38bcs-oss/yusuf38bcs-oss.github.io
logo: /assets/images/logo.png
favicon: /assets/images/favicon.ico
lang: en
locale: en_US
timezone: Asia/Dhaka
encoding: utf-8
future: false
safe: true
incremental: false
strict_front_matter: true
theme: minimal-mistakes-jekyll
minimal_mistakes_skin: dark

include:
  - _pages
  - _redirects

exclude:
  - README.md
  - docs
  - _backup
  - cloudflare-worker-prompt.txt
  - cloudflare-hello-world-domain-guide.md
  - gmail-gemini-ai-workplan.md
  - wrangler.jsonc
  - worker
  - scripts
  - audit-reports
  - node_modules
  - vendor
  - .github
  - Gemfile
  - Gemfile.lock
  - package.json
  - package-lock.json

# -----------------------------------------------------------------------------
# Jekyll Polyglot bilingual architecture scaffold
# Branch-only experiment: feature/bilingual-polyglot
# -----------------------------------------------------------------------------
languages:
  - en
  - bn
default_lang: en
exclude_from_localization:
  - assets
  - css
  - images
  - javascript
  - js
  - worker
  - node_modules
  - vendor
  - .github
  - scripts
parallel_localization: false
fallback_canonical_to_default_lang: true

plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-seo-tag
  - jekyll-include-cache
  - jekyll-paginate
  - jekyll-polyglot

search: true
search_full_content: false
breadcrumbs: true

brevo:
  enabled: true
  form_url: "https://ba976988.sibforms.com/serve/MUIFALS-Pj9niCnQzIC4Kz6AUNdZDEzk6wpWynTJG4d4dXNvGQtJiWM9njds4R5HIX_H5WnDQEPdzJFFynemiOv1t4W_9_ksGnqajmgFditGqg_YbFJgkLKO9HyuxT58mr0lnmuHRE3GDAnh4YEVdxd6Occr7A-hSgMDnS8xxf6OklDU966E4xJ6lfmE6eO0CymEsN25WAsywHtYGQ=="

adsense:
  client: ca-pub-9144658795059352

atom_feed:
  hide: false

paginate: 10
paginate_path: /page:num/
permalink: /blog/:title/

markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  hard_wrap: false
  syntax_highlighter: rouge

liquid:
  error_mode: warn

sass:
  sass_dir: _sass
  style: compressed

collections:
  biology:
    output: true
    permalink: /:collection/:path/
  synaptic-bridge:
    output: true
    permalink: /:collection/:path/
  life-philosophy:
    output: true
    permalink: /:collection/:path/
  life-practices:
    output: true
    permalink: /:collection/:path/
  socratic:
    output: true
    permalink: /:collection/:path/
  concepts:
    output: true
    permalink: /matrix/:path/
  mcq-arena:
    output: true
    permalink: /mcq-arena/:path/

defaults:
  - scope:
      path: about.bn.md
      type: pages
    values:
      locale: bn_BD
  - scope:
      path: _pages/hubs/biology.bn.md
      type: pages
    values:
      locale: bn_BD
  - scope:
      path: _pages/hubs/biology.md
      type: pages
    values:
      lang: en
      locale: en_US
      page_id: biology
  - scope:
      path: ''
      type: posts
    values:
      layout: single
      author_profile: true
      toc: true
      classes: wide
  - scope:
      path: ''
      type: biology
    values:
      layout: single
      author_profile: true
      toc: true
      classes: wide
  - scope:
      path: ''
      type: synaptic-bridge
    values:
      layout: single
      author_profile: true
      toc: true
      classes: wide
  - scope:
      path: ''
      type: life-philosophy
    values:
      layout: single
      author_profile: true
      toc: true
      classes: wide
  - scope:
      path: ''
      type: life-practices
    values:
      layout: single
      author_profile: true
      toc: true
      classes: wide
