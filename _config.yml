title: "Learning Biology for Life"
tagline: "Read - Reflect - Seek Knowledge"
description: "A Synaptic Bridge approach to biology, behaviour, leadership, and lifelong learning."
url: "https://yusuf38bcs-oss-github-io.pages.dev"
baseurl: ""
lang: "en"
timezone: "Asia/Dhaka"

remote_theme: "mmistakes/minimal-mistakes"
minimal_mistakes_skin: "default"

author:
  name: "Yusuf"
  title: "Biology Educator & Learning Designer"
  bio: "Exploring biology as a living bridge between scientific understanding, human behaviour, leadership, and reflective intelligence."
  email: "yusuf.38bcs@gmail.com"
  image: "/assets/images/profile.jpg"

logo: "/assets/images/logo.png"
banner: "/assets/images/header-bg.jpg"

markdown: kramdown
highlighter: rouge

kramdown:
  input: GFM
  hard_wrap: false
  syntax_highlighter: rouge
  math_engine: mathjax

permalink: /:categories/:title/

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-paginate
  - jekyll-remote-theme
  - jekyll-include-cache

paginate: 10
paginate_path: /page:num/

sass:
  style: compressed

exclude:
  - README.md
  - node_modules
  - vendor
  - package.json
  - package-lock.json
  - cloudflare-worker
  - Gemfile.lock
  - .wrangler
  - .env
  - "*.gdoc"
  - "*.gsheet"

include:
  - _pages
  - ads.txt

collections:
  biology:
    output: true
    permalink: /biology/:path/
  life_practices:
    output: true
    permalink: /life-practices/:path/
  socratic:
    output: true
    permalink: /socratic/:path/
  legal:
    output: true
    permalink: /:path/

defaults:
  - scope:
      path: ""
    values:
      layout: default
      image: "/assets/images/header-bg.jpg"
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author: "Learning Biology for Life"
      comments: false
      toc: true
  - scope:
      path: ""
      type: biology
    values:
      layout: single
      author: "Learning Biology for Life"
      toc: true
      sidebar: academic
  - scope:
      path: ""
      type: life_practices
    values:
      layout: single
      author: "Learning Biology for Life"
      toc: true
      sidebar: socratic
  - scope:
      path: ""
      type: socratic
    values:
      layout: single
      author: "Learning Biology for Life"
      toc: false
      sidebar: socratic
  - scope:
      path: ""
      type: legal
    values:
      layout: page
      author: "Learning Biology for Life"
      toc: false

navigation:
  main_data_file: "navigation"

ai:
  enabled: true
  endpoint: "https://synaptic-bridge-gemini-proxy.yusuf-38bcs.workers.dev/api/gemini"
  cooldownMs: 1200
  maxRetries: 3
  cacheEnabled: true
  memoryEnabled: true
  analytics: false

analytics:
  gtm_id: "GTM-WPZ6MPK4"

brevo:
  enabled: true
  form_url: "https://ba976988.sibforms.com/serve/MUIFALS-Pj9niCnQzIC4Kz6AUNdZDEzk6wpWynTJG4d4dXNvGQtJiWM9njds4R5HIX_H5WnDQEPdzJFFynemiOv1t4W_9_ksGnqajmgFditGqg_YbFJgkLKO9HyuxT58mr0lnmuHRE3GDAnh4YEVdxd6Occr7A-hSgMDnS8xxf6OklDU966E4xJ6lfmE6eO0CymEsN25WAsywHtYGQ=="

cookie_policy:
  enabled: true
  consent_key: "lbfl_cookie_consent_v1"

search:
  enabled: true
  placeholder: "Search biology, behaviour, leadership..."

social:
  github: "https://github.com/yusuf38bcs-oss"

footer:
  description: "Learning Biology for Life connects biological concepts with reflection, leadership, behaviour, and practical wisdom through a Synaptic Bridge learning model."