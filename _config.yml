# =========================================================================
# LEARNING BIOLOGY FOR LIFE - SOVEREIGN CONFIGURATION MATRIX
# Fully Optimized for Jekyll 4.x, GitHub Actions, and Cloudflare Pages
# =========================================================================

title: "Learning Biology For Life"
description: "Biology, Zoology, Ecology, Human Behaviour, Leadership, Digital Pedagogy and Lifelong Learning Ecosystem"
bio: "38th BCS Education Cadre Officer | Zoology Educator | Digital Pedagogy Researcher"

# CORE SITE LOGISTICS
locale: "en-US"
timezone: "Asia/Dhaka"
url: "https://learningbiologyforlife.org" # FIXED: Synced explicitly with Cloudflare Production DNS
baseurl: ""
repository: "yusuf38bcs-oss/yusuf38bcs-oss.github.io"

# THEME MEMBRANE OVERLAY (Minimal Mistakes Architecture)
remote_theme: "mmistakes/minimal-mistakes@4.24.4"
minimal_mistakes_skin: "dark"
logo: "/assets/images/logo-main.png"

# SIDEBAR & SEARCH UTILITIES
search: true
breadcrumbs: true

# ENGINE COMPILER MATRIX
markdown: kramdown
highlighter: rouge
permalink: "/:categories/:title/"

kramdown:
  input: GFM
  hard_wrap: false
  syntax_highlighter: rouge

sass:
  style: compressed

# PAGINATION TUNNEL CONTROL
paginate: 5
paginate_path: "/page:num/"

# ACTIVE CORE INCLUSION PLUGINS (W3C & CLOUD COMPLIANT)
plugins:
  - jekyll-paginate
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-seo-tag
  - jekyll-include-cache
  - jekyll-remote-theme

# CORE ARCHIVE ROUTING NODES
category_archive:
  type: liquid
  path: /categories/

tag_archive:
  type: liquid
  path: /tags/

atom_feed:
  path: feed.xml

# CUSTOM COLLECTIONS VECTOR MATRIX
collections:
  biology:
    output: true
    permalink: /biology/:path/
  socratic:
    output: true
    permalink: /socratic/:path/
  synaptic-bridge:
    output: true
    permalink: /synaptic-bridge/:path/
  research-node:
    output: true
    permalink: /research-node/:path/
  life-practices:
    output: true
    permalink: /life-practices/:path/
  life-philosophy:
    output: true
    permalink: /life-philosophy/:path/

# GLOBAL SITE SCHEMAS & DEFAULT NODE VALUES
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "single"
      author_profile: true
      read_time: true
      comments: false
      share: true
      related: true
      toc: true
  - scope:
      path: ""
      type: "biology"
    values:
      layout: "single"
      author_profile: true
      read_time: true
      share: true
      related: true
      toc: true
  - scope:
      path: ""
      type: "socratic"
    values:
      layout: "single"
      author_profile: true
      read_time: true
      toc: true
  - scope:
      path: ""
      type: "synaptic-bridge"
    values:
      layout: "single"
      author_profile: true
      read_time: true
      toc: true
  - scope:
      path: ""
      type: "research-node"
    values:
      layout: "single"
      author_profile: true
      read_time: true
      toc: true
  - scope:
      path: ""
      type: "life-practices"
    values:
      layout: "single"
      author_profile: true
      read_time: true
      toc: true
  - scope:
      path: ""
      type: "life-philosophy"
    values:
      layout: "single"
      author_profile: true
      read_time: true
      toc: true

# GLOBAL AUTHOR ID MEMBRANE
author:
  name: "Md. Yusuf"
  avatar: "/assets/images/profile.jpg"
  bio: "38th BCS Education Cadre Officer | Zoology Educator | Digital Pedagogy Researcher"
  location: "Bangladesh"
  links:
    - label: "Website"
      icon: "fas fa-fw fa-link"
      url: "https://learningbiologyforlife.org"

# FOOTER INTERACTIVE NODE MAPPING
footer:
  links:
    - label: "Sovereign Portal"
      icon: "fas fa-fw fa-globe"
      url: "https://learningbiologyforlife.org"
  social:
    type: "Person"
    name: "Md. Yusuf"
  brevo:
    form_url: "https://ba976988.sibforms.com/serve/MUIFALS-Pj9niCnQzIC4Kz6AUNdZDEzk6wpWynTJG4d4dXNvGQtJiWM9njds4R5HIX_H5WnDQEPdzJFFynemiOv1t4W_9_ksGnqajmgFditGqg_YbFJgkLKO9HyuxT58mr0lnmuHRE3GDAnh4YEVdxd6Occr7A-hSgMDnS8xxf6OklDU966E4xJ6lfmE6eO0CymEsN25WAsywHtYGQ=="

# HTML MINIFICATION COMPRESSION LAYER
compress_html:
  clippings: all
  ignore:
    envs: ["development"]

# STRICT SYSTEM COMPILER EXCLUSION SHIELD
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - vendor/bundle
  - vendor/cache
  - vendor/gems
  - vendor/ruby
  - .sass-cache
  - .jekyll-cache
  - .git
  - .github
  - README.md
