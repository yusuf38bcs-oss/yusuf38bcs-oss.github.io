``` yaml
\# =========================================================
\# CORE SITE IDENTITY
\# =========================================================
title: "Learning Biology For Life"
subtitle: "The Synaptic Bridge"
description: >
 A cognitive biology education platform connecting scientific theory,
leadership, human behavior, systems thinking, and reflective intelligence.
url: "https://learningbiologyforlife.org"
baseurl: ""
repository: "yusuf38bcs-oss/yusuf38bcs-oss.github.io"
logo: "/assets/images/logo.png"
favicon: "/assets/images/favicon.png"
locale: "en-US"
timezone: "Asia/Dhaka"
encoding: "utf-8"

\# =========================================================
\# THEME & BRANDING
\# =========================================================
remote\_theme: "mmistakes/minimal-mistakes@4.24.0"
minimal\_mistakes\_skin: "air"
name: "Learning Biology For Life"
tagline: "Where Biology Meets Leadership, Cognition, and Human Growth."
teaser: "/assets/images/default-teaser.jpg"
breadcrumbs: true
words\_per\_minute: 180
enable\_copy\_code\_button: true

\# =========================================================
\# AUTHOR PROFILE
\# =========================================================
author:
 name: "MD. YUSUF"
 avatar: "/assets/images/profile.jpg"
 bio: >
 Lecturer of Zoology, 38th BCS (General Education) Cadre Officer,
and creator of the Synaptic Bridge Framework.
 location: "Bangladesh"
 employer: "Government Education"
 links:
 - label: "LinkedIn"
 icon: "fab fa-fw fa-linkedin"
 url: "\[link removed\]
 - label: "GitHub"
 icon: "fab fa-fw fa-github"
 url: "https://github.com/yusuf38bcs-oss"

\# =========================================================
\# PLUGINS & SYSTEM SETTINGS
\# =========================================================
plugins:
 - jekyll-include-cache
 - jekyll-feed
 - jekyll-seo-tag
 - jekyll-paginate
 - jekyll-sitemap
 - jekyll-redirect-from
 - jekyll-archives

paginate: 6
paginate\_path: "/page:num/"
markdown: kramdown
highlighter: rouge
permalink: /:categories/:title/

\# =========================================================
\# DEFAULTS (FRONT-MATTER INHERITANCE)
\# =========================================================
defaults:
 - scope:
 path: ""
 type: posts
 values:
 layout: "single"
 author\_profile: true
 read\_time: true
 share: true
 related: true
 toc: true
 toc\_sticky: true
 show\_date: true
 classes: wide
 ai:
 enabled: true
 advanced: false
 podcast: true
 quiz: true
 - scope:
 path: ""
 type: pages
 values:
 layout: "single"
 author\_profile: false
 header:
 overlay\_image: "/assets/images/header-bg.jpg"
 overlay\_color: "\#000"
 overlay\_filter: "0.5"

\# =========================================================
\# BUILD EXCLUSIONS
\# =========================================================
exclude:
 - Gemfile
 - Gemfile.lock
 - node\_modules
 - vendor
 - README.md
 - package.json
 - package-lock.json

\# =========================================================
\# CUSTOM COGNITIVE DATA
\# =========================================================
synaptic\_ai:
 enabled: true
 framework: "Synaptic Bridge"
 architecture: "Modular Cognitive System"

```

This is the corrected and consolidated content for your `_config.yml` file, which should resolve the YAML syntax errors from previous deployment attempts.
