# =========================================================
# Learning Biology for Life
# Final Optimized Jekyll + Cloudflare Configuration
# =========================================================

title: "Learning Biology for Life"

tagline: "Read • Reflect • Seek Knowledge"

description: >
  A Synaptic Bridge approach to biology,
  behaviour, leadership, reflective intelligence,
  and lifelong learning.

url: "https://learningbiologyforlife.org"

baseurl: ""

lang: "en"

locale: "en-BD"

timezone: "Asia/Dhaka"

encoding: "utf-8"

# =========================================================
# THEME
# =========================================================

remote_theme: "mmistakes/minimal-mistakes"

minimal_mistakes_skin: "dark"

# =========================================================
# SITE BRANDING
# =========================================================

logo: "/assets/images/logo.png"

masthead_title: "Learning Biology for Life"

teaser: "/assets/images/site/default-teaser.webp"

og_image: "/assets/images/site/social-preview.webp"

# =========================================================
# SITE SETTINGS
# =========================================================

breadcrumbs: true

search: true

search_full_content: true

atom_feed:
  hide: false

future: true

show_date: true

read_more: "disabled"

words_per_minute: 180

# =========================================================
# AUTHOR
# =========================================================

author:
  name: "MD. Yusuf"

  avatar: "/assets/images/profile.jpg"

  bio: >
    Biology Educator, Learning Designer,
    Civil Service Officer, and lifelong learner
    exploring biology through systems thinking,
    leadership, behaviour, and digital pedagogy.

  location: "Bangladesh"

  email: "yusuf.38bcs@gmail.com"

  links:

    - label: "GitHub"
      icon: "fab fa-github"
      url: "https://github.com/yusuf38bcs-oss"

# =========================================================
# MARKDOWN
# =========================================================

markdown: kramdown

highlighter: rouge

kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  syntax_highlighter: rouge
  math_engine: mathjax

# =========================================================
# URL STRUCTURE
# =========================================================

permalink: /:categories/:title/

paginate: 10

paginate_path: /page:num/

category_archive:
  type: liquid
  path: /categories/

tag_archive:
  type: liquid
  path: /tags/

# =========================================================
# PLUGINS
# =========================================================

plugins:

  - jekyll-feed

  - jekyll-seo-tag

  - jekyll-sitemap

  - jekyll-paginate

  - jekyll-remote-theme

  - jekyll-include-cache

# =========================================================
# SASS
# =========================================================

sass:
  sass_dir: _sass
  style: compressed

# =========================================================
# COMPRESS HTML
# =========================================================

compress_html:
  clippings: all
  comments: all
  endings: all
  startings: []
  blanklines: false

# =========================================================
# INCLUDE / EXCLUDE
# =========================================================

include:

  - _pages

  - ads.txt

  - .htaccess

exclude:

  - README.md

  - LICENSE

  - node_modules

  - vendor

  - package.json

  - package-lock.json

  - Gemfile.lock

  - .sass-cache

  - .jekyll-cache

  - .jekyll-metadata

  - .bundle

  - .wrangler

  - cloudflare-worker

  - worker

  - workers

  - "*.gdoc"

  - "*.gsheet"

  - "*.tmp"

  - feed_restore.py

  - .env

  - .DS_Store

# =========================================================
# COLLECTIONS
# =========================================================

collections:

  biology:
    output: true
    permalink: /biology/:path/

  life-practices:
    output: true
    permalink: /life-practices/:path/

  socratic:
    output: true
    permalink: /socratic/:path/

  mcq-arena:
    output: true
    permalink: /mcq-arena/:path/

  synaptic-bridge:
    output: true
    permalink: /synaptic-bridge/:path/

  research-node:
    output: true
    permalink: /research-node/:path/

  life-philosophy:
    output: true
    permalink: /life-philosophy/:path/

  legal:
    output: true
    permalink: /:path/

# =========================================================
# DEFAULTS
# =========================================================

defaults:

  # Homepage hero - CORRECTED PATH
  - scope:
      path: "index.md"
    values:
      layout: home
      header:
        overlay_image: "/assets/images/header-bg.webp"
        overlay_filter: "linear-gradient(to bottom, rgba(2,6,23,0.22) 0%, rgba(2,6,23,0.72) 60%, rgba(1,7,14,0.88) 100%)"

  # All other pages - standard header
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: false
      read_time: true
      related: true
      share: false
      toc_sticky: true
      comments: false
      classes: wide
      header:
        overlay_image: "/assets/images/header-bg.webp"
        overlay_filter: 0.45

# =========================================================
# ANALYTICS
# =========================================================

analytics:
  provider: "google-gtag"

  google:
    tracking_id: "G-GQ4LENQ3R7"
    anonymize_ip: true
