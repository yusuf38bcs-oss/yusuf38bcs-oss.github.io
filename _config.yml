# --- SITE CONFIGURATION PLATFORM ENGINE ---
title: "Learning Biology For Life"
locale: "en-US"
remote_theme: "mmistakes/minimal-mistakes@4.24.0"
minimal_mistakes_skin: "dark"

# --- ABSOLUTE BRAND ASSET MAPPING ---
logo: "/assets/images/logo-main.png"
favicon: "/assets/images/favicon.ico"

# --- SITE INTERACTIVE NAVIGATION PARAMETERS ---
plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jekyll-include-cache
  - jekyll-remote-theme
  - jekyll-seo-tag

# --- PAGINATION ARCHITECTURE ---
paginate: 5
paginate_path: "/page:num/"

# --- CUSTOM COLLECTIONS ROUTING BLUEPRINT ---
collections:
  biology:
    output: true
    permalink: /biology/:path/
  socratic:
    output: true
    permalink: /socratic/:title/
  life-practices:
    output: true
    permalink: /life-practices/:title/

# --- DEFAULT MANIFEST HEADER SETTINGS ---
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "single"
      read_time: true
      comments: false
      share: true
      related: true

# --- AUTHOR BIO DATA METRIC ---
author:
  name: "Md. Yusuf"
  avatar: "/assets/images/prolile.jpg"
  bio: "Lecturer, Dept of Zoology | 38th BCS Education Cadre Officer"
  location: "Bangladesh"

# --- BREVO NEWSLETTER ENGINE ---
brevo:
  form_url: "https://ba976988.sibforms.com/serve/MUIFALS-Pj9niCnQzIC4Kz6AUNdZDEzk6wpWynTJG4d4dXNvGQtJiWM9njds4R5HIX_H5WnDQEPdzJFFynemiOv1t4W_9_ksGnqajmgFditGqg_YbFJgkLKO9HyuxT58mr0lnmuHRE3GDAnh4YEVdxd6Occr7A-hSgMDnS8xxf6OklDU966E4xJ6lfmE6eO0CymEsN25WAsywHtYGQ=="

# --- DEFENSIVE ENGINE EXCLUSION MATRIX ---
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/
  - .jekyll-cache/
  - homepage_reproduction_env/
  - .git/
  - .github/
