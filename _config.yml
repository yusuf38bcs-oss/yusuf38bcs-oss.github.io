# Site Settings
title: "Learning Biology for Life"
description: "A Synaptic Bridge Approach connecting scientific theory to reality through case studies and leadership insights."
url: "https://learningbiologyforlife.org"
repository: "yusuf38bcs-oss/yusuf38bcs-oss.github.io"
logo: "/assets/images/logo.png"

# Theme Settings
remote_theme: "mmistakes/minimal-mistakes@4.24.0"
minimal_mistakes_skin: "air"

# Author Details
author:
  name: "MD. YUSUF"
  avatar: "/assets/images/profile.jpg"
  bio: "38th BCS (General Education) Cadre Officer & Lecturer of Zoology. Working on Empowering Leadership, Digital Pedagogy, and 4IR Education."
  location: "Barishal-8200, Bangladesh"
  links:
    - label: "LinkedIn"
      icon: "fab fa-fw fa-linkedin"
      url: "https://www.linkedin.com/in/md-yusuf-128b94404"
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/yusuf38bcs-oss"

# Plugins
plugins:
  - jekyll-include-cache
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-redirect-from

# Exclude from build process
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor

# Allow Jekyll to read the _pages directory
collections:
  pages:
    output: true
    permalink: /:path/

# Global Features
search: true
search_full_content: true

header:
  overlay_color: "#e6f2f5"

# Default Front Matter for _posts
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: true
      share: true
      related: true
