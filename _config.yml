# --- DEFENSIVE ENGINE EXCLUSION MATRIX ---
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/
  - .jekyll-cache/
  - homepage_reproduction_env/
  - .git/
  - .github/
