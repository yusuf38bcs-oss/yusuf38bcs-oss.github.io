# =========================================================
# Learning Biology for Life
# Final Production Configuration
# =========================================================

title: "Learning Biology for Life"

tagline: "Read • Reflect • Seek Knowledge"

description: >
  A Neural Educational Ecosystem integrating
  biology, systems thinking, reflective learning,
  behavioural science, leadership,
  spirituality and AI-assisted pedagogy.

url: "https://learningbiologyforlife.org"

baseurl: ""

lang: "en"

locale: "en-BD"

timezone: "Asia/Dhaka"

encoding: "utf-8"

# =========================================================
# THEME
# =========================================================

remote_theme: "mmistakes/minimal-mistakes"

minimal_mistakes_skin: "dark"

# =========================================================
# SITE BRANDING
# =========================================================

logo: "/assets/images/branding/nav-bar.png"

masthead_title: "Learning Biology for Life"

teaser: "/assets/images/site/default-teaser.webp"

og_image: "/assets/images/site/social-preview.webp"

favicon: "/assets/icons/favicon.ico"

# =========================================================
# SITE SETTINGS
# =========================================================

breadcrumbs: true

search: true

search_full_content: true

future: true

show_date: true

read_more: "disabled"

words_per_minute: 180

atom_feed:
  hide: false

# =========================================================
# AUTHOR
# =========================================================

author:

  name: "MD. Yusuf"

  avatar: "/assets/images/profile.jpg"

  bio: >
    Biology Educator, Learning Designer,
    Civil Service Officer and lifelong learner
    exploring biology through systems thinking,
    reflective intelligence, behaviour,
    leadership and digital pedagogy.

  location: "Bangladesh"

  email: "yusuf.38bcs@gmail.com"

  links:

    - label: "GitHub"
      icon: "fab fa-github"
      url: "https://github.com/yusuf38bcs-oss"

# =========================================================
# MARKDOWN
# =========================================================

markdown: kramdown

highlighter: rouge

kramdown:

  input: GFM

  hard_wrap: false

  auto_ids: true

  syntax_highlighter: rouge

  math_engine: mathjax

# =========================================================
# URL STRUCTURE
# =========================================================

permalink: /:categories/:title/

paginate: 10

paginate_path: /page:num/

category_archive:
  type: liquid
  path: /categories/

tag_archive:
  type: liquid
  path: /tags/

# =========================================================
# PLUGINS
# =========================================================

plugins:

  - jekyll-feed

  - jekyll-seo-tag

  - jekyll-sitemap

  - jekyll-paginate

  - jekyll-remote-theme

  - jekyll-include-cache

# =========================================================
# SASS
# =========================================================

sass:

  sass_dir: _sass

  style: compressed

# =========================================================
# HTML COMPRESSION
# =========================================================

compress_html:

  clippings: all

  comments: all

  endings: all

  startings: []

  blanklines: false

# =========================================================
# INCLUDE / EXCLUDE
# =========================================================

include:

  - _pages

  - ads.txt

  - .htaccess

exclude:

  - README.md

  - LICENSE

  - node_modules

  - vendor

  - package.json

  - package-lock.json

  - Gemfile.lock

  - .sass-cache

  - .jekyll-cache

  - .jekyll-metadata

  - .bundle

  - .wrangler

  - cloudflare-worker

  - worker

  - workers

  - "*.gdoc"

  - "*.gsheet"

  - "*.tmp"

  - feed_restore.py

  - .env

  - .DS_Store

# =========================================================
# COLLECTIONS
# =========================================================

collections:

  biology:
    output: true
    permalink: /biology/:path/

  life-practices:
    output: true
    permalink: /life-practices/:path/

  socratic:
    output: true
    permalink: /socratic/:path/

  mcq-arena:
    output: true
    permalink: /mcq-arena/:path/

  synaptic-bridge:
    output: true
    permalink: /synaptic-bridge/:path/

  research-node:
    output: true
    permalink: /research-node/:path/

  life-philosophy:
    output: true
    permalink: /life-philosophy/:path/

  legal:
    output: true
    permalink: /:path/

# =========================================================
# DEFAULTS
# =========================================================

defaults:

  # =====================================================
  # HOMEPAGE HERO
  # =====================================================

  - scope:
      path: "index.md"

    values:

      layout: home

      classes: wide

      author_profile: false

      page_class: hero-immersive

      header:

        overlay_image: "/assets/images/header-bg.webp"

        overlay_filter: 0.24

        caption: null

  # =====================================================
  # STANDARD PAGES
  # =====================================================

  - scope:
      path: ""
      type: pages

    values:

      layout: single

      author_profile: false

      read_time: true

      related: true

      share: false

      comments: false

      toc_sticky: true

      classes: wide

      header:

        overlay_image: "/assets/images/header-bg.webp"

        overlay_filter: 0.42

  # =====================================================
  # POSTS
  # =====================================================

  - scope:
      path: ""
      type: posts

    values:

      layout: single

      author_profile: false

      read_time: true

      related: true

      share: false

      comments: false

      classes: wide

      toc: true

      toc_sticky: true

      header:

        overlay_image: "/assets/images/header-bg.webp"

        overlay_filter: 0.45

# =========================================================
# ANALYTICS
# =========================================================

analytics:

  provider: "google-gtag"

  google:

    tracking_id: "G-GQ4LENQ3R7"

    anonymize_ip: true

# =========================================================
# SEO
# =========================================================

twitter:
  username: ""

facebook:
  username: ""

social:
  type: Organization
  name: "Learning Biology for Life"

# =========================================================
# PERFORMANCE
# =========================================================

lsi: false

incremental: false

strict_front_matter: false
