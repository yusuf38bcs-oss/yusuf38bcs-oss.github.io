# Learning Biology For Life - Core Configuration
title: "Learning Biology For Life"
name: "Md. Yusuf"
description: "The Synaptic Bridge — where biology meets leadership, cognition, and life."
url: "https://yourdomain.com"
baseurl: ""
repository: "yourusername/learning-biology-for-life"
timezone: "Asia/Dhaka"

# Theme Settings
theme: "minimal-mistakes-jekyll"
minimal_mistakes_skin: "dark"
breadcrumbs: true

# Author Details
author:
  name: "Md. Yusuf"
  bio: "Cognitive Architect | Bridging Evolution, Mind & Leadership"
  avatar: "/assets/images/avatar.jpg"

# Localization & Taxonomy Archives
locale: "en-US"
category_archive:
  type: liquid
  path: /categories/
tag_archive:
  type: liquid
  path: /tags/

# Pagination Settings
paginate: 6
paginate_path: "/page:num/"

# Defaults for Posts
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "single"
      author_profile: false

# Integrations
newsletter:
  provider: "brevo"
  action: "https://example-brevo-link.com/subscribe"
formspree_id: "your-id"

# Plugins
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-paginate
  - jekyll-archives


