        overlay_filter: rgba(8,27,41,0.55)
      
      # Default AI Synapses for all posts
      ai:
        enabled: true
        advanced: false
        podcast: true
        quiz: true
        translator: true
        tutor: false
        journal: false
        image: false

  # -------------------------------------------------------
  # PAGES (Static content like About, Contact)
  # -------------------------------------------------------
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: false
      ai:
        enabled: false # Disable AI on structural pages

