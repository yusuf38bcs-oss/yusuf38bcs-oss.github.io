# =========================================================
# FOOTER
# =========================================================

footer:

  links:

    - label: "GitHub"
      icon: "fab fa-github"
      url: "https://github.com/yusuf38bcs-oss"

# =========================================================
# AI SYSTEM
# =========================================================

ai:

  enabled: true

  endpoint: "https://synapticai-proxy.yusuf-38bcs.workers.dev/api/gemini"

  cooldownMs: 1200

  maxRetries: 3

  cacheEnabled: true

  memoryEnabled: true

  analytics: false

# =========================================================
# SECURITY + PERFORMANCE
# =========================================================

strict_front_matter: false

liquid:
  error_mode: warn
  strict_filters: false
  strict_variables: false

incremental: false

lsi: false

safe: false

# =========================================================
# DEVELOPMENT
# =========================================================

keep_files:

  - assets

  - images
