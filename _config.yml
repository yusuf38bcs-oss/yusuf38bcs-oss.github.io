# =========================================================================
# LEARNING BIOLOGY FOR LIFE - SOVEREIGN CONFIGURATION
# =========================================================================

title: "Learning Biology For Life"
subtitle: "Biology, Philosophy & Future Sciences"
name: "Md Yusuf"
email: yusuf.38bcs@gmail.com
description: "A Neural Network of Education System: Where Biology Meets Life in a Synaptic Approach."
url: "https://learningbiologyforlife.org"
baseurl: ""
logo: "/assets/images/logo.png"
favicon: "/assets/images/favicon.ico"
repository: "yusuf38bcs-oss/yusuf38bcs-oss.github.io"

# Theme
remote_theme: "mmistakes/minimal-mistakes@4.24.0"
minimal_mistakes_skin: "dark"

# Plugins
plugins:
  - jekyll-paginate
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-seo-tag
  - jekyll-include-cache
  - jekyll-remote-theme

# Pagination
paginate: 10
paginate_path: /page:num/

# Collections
collections:
  biology:
    output: true
    permalink: /:collection/:path/
  synaptic-bridge:
    output: true
    permalink: /:collection/:path/
  life-philosophy:
    output: true
    permalink: /:collection/:path/
  life-practices:
    output: true
    permalink: /:collection/:path/
  socratic:
    output: true
    permalink: /:collection/:path/

# Defaults
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: single
      author_profile: true
      sidebar:
        nav: "synaptic_nav"
  - scope:
      path: ""
      type: "biology"
    values:
      layout: single
      author_profile: true
      sidebar:
        nav: "synaptic_nav"
  - scope:
      path: "_pages"
      type: "pages"
    values:
      layout: single
      author_profile: false

# Build settings
markdown: kramdown
highlighter: rouge
permalink: /:categories/:title/
timezone: Asia/Dhaka

# Exclude
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - .sass-cache
  - .jekyll-cache
  - .jekyll-metadata
  - README.md
  - LICENSE