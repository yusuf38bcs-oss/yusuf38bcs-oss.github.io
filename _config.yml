title: Learning Biology For Life
subtitle: Biology, Philosophy & Future Sciences
name: MD. Yusuf
email: yusuf.38bcs@gmail.com
description: A Neural Network of Education System
url: https://learningbiologyforlife.org
baseurl: ''
repository: yusuf38bcs-oss/yusuf38bcs-oss.github.io
logo: /assets/images/logo.png
favicon: /assets/images/favicon.ico
lang: en
locale: en_US
timezone: Asia/Dhaka
encoding: utf-8
future: true
safe: true
incremental: false
strict_front_matter: true
theme: minimal-mistakes-jekyll
minimal_mistakes_skin: dark

plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-seo-tag
  - jekyll-include-cache
  - jekyll-paginate

search: true
search_full_content: true
breadcrumbs: true

atom_feed:
  hide: false

paginate: 10
paginate_path: /page:num/
permalink: /blog/:title/

markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  hard_wrap: false
  syntax_highlighter: rouge

liquid:
  error_mode: warn

sass:
  sass_dir: _sass
  style: compressed

collections:
  biology:
    output: true
    permalink: /:collection/:path/
  synaptic-bridge:
    output: true
    permalink: /:collection/:path/
  life-philosophy:
    output: true
    permalink: /:collection/:path/
  life-practices:
    output: true
    permalink: /:collection/:path/
  socratic:
    output: true
    permalink: /:collection/:path/
  concepts:
    output: true
    permalink: /matrix/:path/

defaults:
  - scope:
      path: ''
      type: posts
    values:
      layout: single
      author_profile: true
      toc: true
      classes: wide
  - scope:
      path: ''
      type: biology
    values:
      layout: single
      author_profile: true
      toc: true
      classes: wide
  - scope:
      path: ''
      type: synaptic-bridge
    values:
      layout: single
      author_profile: true
      toc: true
      classes: wide
  - scope:
      path: ''
      type: life-philosophy
    values:
      layout: single
      author_profile: true
      toc: true
      classes: wide
  - scope:
      path: ''
      type: life-practices
    values:
      layout: single
      author_profile: true
      toc: true
      classes: wide
  - scope:
      path: ''
      type: socratic
    values:
      layout: single
      author_profile: true
      toc: true
      classes: wide
  - scope:
      path: _pages
      type: pages
    values:
      layout: single
      author_profile: false
      classes: wide
  - scope:
      path: ''
      type: concepts
    values:
      layout: concept_node
      author_profile: false
      classes: wide
      mastery_state: locked
      cognitive_depth: 1

author:
  name: MD. Yusuf
  bio: BCS Education Cadre Officer | Digital Pedagogy | 4IR Education
  location: Bangladesh

include:
  - _pages

keep_files:
  - assets
  - network

exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - .sass-cache
  - .jekyll-cache
  - .jekyll-metadata
  - .tmp
  - .tmp/**
  - .tmp.driveupload
  - .tmp.driveupload/**
  - .tmp.drivedownload
  - .tmp.drivedownload/**
  - README.md
  - LICENSE
