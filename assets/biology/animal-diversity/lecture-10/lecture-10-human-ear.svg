<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">Human ear pathway</title>
<desc id="desc">Original educational diagram for LBFL Animal Diversity–II (223101).</desc>
<style>
.bg{fill:#fbfaf5} .box{fill:#fff;stroke:#0f5f5a;stroke-width:3;rx:16} .soft{fill:#e9f5f1;stroke:#0f5f5a;stroke-width:2;rx:16}
.warm{fill:#fff3d6;stroke:#9a6a00;stroke-width:2;rx:16} .rose{fill:#fbe9e6;stroke:#a33c2b;stroke-width:2;rx:16}
.line{stroke:#0f5f5a;stroke-width:4;fill:none;marker-end:url(#a)} .red{stroke:#a33c2b;stroke-width:4;fill:none;marker-end:url(#r)}
.blue{stroke:#245b91;stroke-width:4;fill:none;marker-end:url(#b)} .dash{stroke:#667;stroke-width:2;stroke-dasharray:7 7;fill:none}
.head{font:700 34px Arial,sans-serif;fill:#0f5f5a} .txt{font:26px Arial,sans-serif;fill:#163331}
.small{font:21px Arial,sans-serif;fill:#324d4b} .tiny{font:18px Arial,sans-serif;fill:#445}
</style>
<defs>
<marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#0f5f5a"/></marker>
<marker id="r" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#a33c2b"/></marker>
<marker id="b" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#245b91"/></marker>
</defs>
<rect class="bg" width="100%" height="100%"/>

<text x="600" y="48" text-anchor="middle" class="head">Human ear: sound → mechanical vibration → neural signal</text>
<rect x="40" y="140" width="180" height="75" class="box"/><text x="130" y="187" text-anchor="middle" class="small">Pinna + canal</text>
<rect x="265" y="140" width="170" height="75" class="box"/><text x="350" y="187" text-anchor="middle" class="small">Eardrum</text>
<rect x="480" y="140" width="210" height="75" class="warm"/><text x="585" y="172" text-anchor="middle" class="tiny">malleus → incus</text><text x="585" y="198" text-anchor="middle" class="tiny">→ stapes</text>
<rect x="735" y="140" width="170" height="75" class="box"/><text x="820" y="187" text-anchor="middle" class="small">Cochlea</text>
<rect x="950" y="140" width="200" height="75" class="soft"/><text x="1050" y="187" text-anchor="middle" class="small">Auditory nerve</text>
<path d="M220 177 L265 177" class="line"/><path d="M435 177 L480 177" class="line"/><path d="M690 177 L735 177" class="line"/><path d="M905 177 L950 177" class="line"/>
<rect x="225" y="365" width="750" height="160" class="box"/><text x="600" y="405" text-anchor="middle" class="head">Cochlear transduction</text><text x="600" y="452" text-anchor="middle" class="small">fluid wave → basilar membrane → stereocilia bend</text><text x="600" y="490" text-anchor="middle" class="small">hair-cell signal → cochlear nerve → brain</text>

</svg>