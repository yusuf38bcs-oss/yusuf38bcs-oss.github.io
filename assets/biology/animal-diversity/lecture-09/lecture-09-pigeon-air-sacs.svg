<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">Pigeon air sacs</title>
<desc id="desc">Original educational diagram for LBFL Animal Diversity–II (223101).</desc>
<style>
.bg{fill:#fbfaf5} .box{fill:#fff;stroke:#0f5f5a;stroke-width:3;rx:16} .soft{fill:#e9f5f1;stroke:#0f5f5a;stroke-width:2;rx:16}
.warm{fill:#fff3d6;stroke:#9a6a00;stroke-width:2;rx:16} .rose{fill:#fbe9e6;stroke:#a33c2b;stroke-width:2;rx:16}
.line{stroke:#0f5f5a;stroke-width:4;fill:none;marker-end:url(#a)} .red{stroke:#a33c2b;stroke-width:4;fill:none;marker-end:url(#r)}
.blue{stroke:#245b91;stroke-width:4;fill:none;marker-end:url(#b)} .dash{stroke:#667;stroke-width:2;stroke-dasharray:7 7;fill:none}
.head{font:700 34px Arial,sans-serif;fill:#0f5f5a} .txt{font:26px Arial,sans-serif;fill:#163331}
.small{font:21px Arial,sans-serif;fill:#324d4b} .tiny{font:18px Arial,sans-serif;fill:#445}
</style>
<defs>
<marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#0f5f5a"/></marker>
<marker id="r" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#a33c2b"/></marker>
<marker id="b" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#245b91"/></marker>
</defs>
<rect class="bg" width="100%" height="100%"/>

<text x="600" y="48" text-anchor="middle" class="head">Pigeon: air sacs and lung ventilation</text>
<rect x="60" y="120" width="180" height="75" class="box"/><text x="150" y="166" text-anchor="middle" class="small">Fresh air</text>
<rect x="300" y="120" width="220" height="75" class="soft"/><text x="410" y="166" text-anchor="middle" class="small">Posterior air sacs</text>
<rect x="580" y="120" width="220" height="75" class="warm"/><text x="690" y="166" text-anchor="middle" class="small">Lung parabronchi</text>
<rect x="860" y="120" width="220" height="75" class="soft"/><text x="970" y="166" text-anchor="middle" class="small">Anterior air sacs</text>
<path d="M240 157 L300 157" class="line"/><path d="M520 157 L580 157" class="line"/><path d="M800 157 L860 157" class="line"/>
<text x="600" y="270" text-anchor="middle" class="head">Traditional pigeon air-sac count</text>
<rect x="70" y="330" width="180" height="75" class="box"/><text x="160" y="376" text-anchor="middle" class="small">2 cervical</text>
<rect x="290" y="330" width="190" height="75" class="box"/><text x="385" y="376" text-anchor="middle" class="small">1 interclavicular</text>
<rect x="520" y="330" width="210" height="75" class="box"/><text x="625" y="376" text-anchor="middle" class="small">2 ant. thoracic</text>
<rect x="770" y="330" width="210" height="75" class="box"/><text x="875" y="376" text-anchor="middle" class="small">2 post. thoracic</text>
<rect x="500" y="480" width="200" height="75" class="box"/><text x="600" y="526" text-anchor="middle" class="small">2 abdominal</text>
<text x="600" y="630" text-anchor="middle" class="small">Air sacs are mainly ventilatory bellows; principal gas exchange occurs in the rigid lung.</text>

</svg>