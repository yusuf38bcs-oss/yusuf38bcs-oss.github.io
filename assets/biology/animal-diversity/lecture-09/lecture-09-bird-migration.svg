<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">Bird migration cues</title>
<desc id="desc">Original educational diagram for LBFL Animal Diversity–II (223101).</desc>
<style>
.bg{fill:#fbfaf5} .box{fill:#fff;stroke:#0f5f5a;stroke-width:3;rx:16} .soft{fill:#e9f5f1;stroke:#0f5f5a;stroke-width:2;rx:16}
.warm{fill:#fff3d6;stroke:#9a6a00;stroke-width:2;rx:16} .rose{fill:#fbe9e6;stroke:#a33c2b;stroke-width:2;rx:16}
.line{stroke:#0f5f5a;stroke-width:4;fill:none;marker-end:url(#a)} .red{stroke:#a33c2b;stroke-width:4;fill:none;marker-end:url(#r)}
.blue{stroke:#245b91;stroke-width:4;fill:none;marker-end:url(#b)} .dash{stroke:#667;stroke-width:2;stroke-dasharray:7 7;fill:none}
.head{font:700 34px Arial,sans-serif;fill:#0f5f5a} .txt{font:26px Arial,sans-serif;fill:#163331}
.small{font:21px Arial,sans-serif;fill:#324d4b} .tiny{font:18px Arial,sans-serif;fill:#445}
</style>
<defs>
<marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#0f5f5a"/></marker>
<marker id="r" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#a33c2b"/></marker>
<marker id="b" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#245b91"/></marker>
</defs>
<rect class="bg" width="100%" height="100%"/>

<text x="600" y="48" text-anchor="middle" class="head">Bird migration: from seasonal decision to navigation</text>
<rect x="60" y="125" width="220" height="90" class="soft"/><text x="170" y="160" text-anchor="middle" class="small">Seasonal cues</text><text x="170" y="192" text-anchor="middle" class="tiny">photoperiod, weather</text>
<rect x="340" y="125" width="220" height="90" class="box"/><text x="450" y="160" text-anchor="middle" class="small">Internal program</text><text x="450" y="192" text-anchor="middle" class="tiny">timing + fattening</text>
<rect x="620" y="125" width="220" height="90" class="warm"/><text x="730" y="160" text-anchor="middle" class="small">Migration</text><text x="730" y="192" text-anchor="middle" class="tiny">departure + route</text>
<rect x="900" y="125" width="220" height="90" class="box"/><text x="1010" y="160" text-anchor="middle" class="small">Destination</text><text x="1010" y="192" text-anchor="middle" class="tiny">breed / feed</text>
<path d="M280 170 L340 170" class="line"/><path d="M560 170 L620 170" class="line"/><path d="M840 170 L900 170" class="line"/>
<text x="600" y="325" text-anchor="middle" class="head">Orientation toolkit</text>
<rect x="110" y="390" width="200" height="75" class="soft"/><text x="210" y="436" text-anchor="middle" class="small">Sun compass</text>
<rect x="365" y="390" width="200" height="75" class="soft"/><text x="465" y="436" text-anchor="middle" class="small">Star compass</text>
<rect x="620" y="390" width="200" height="75" class="soft"/><text x="720" y="436" text-anchor="middle" class="small">Magnetic cues</text>
<rect x="875" y="390" width="200" height="75" class="soft"/><text x="975" y="436" text-anchor="middle" class="small">Landmarks/odor</text>
<text x="600" y="610" text-anchor="middle" class="small">Different species combine multiple cues; no single mechanism explains every migration.</text>

</svg>