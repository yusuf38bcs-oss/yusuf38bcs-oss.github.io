<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">Petromyzon life cycle</title>
<desc id="desc">Original educational diagram for LBFL Animal Diversity–II (223101).</desc>
<style>
.bg{fill:#fbfaf5} .box{fill:#fff;stroke:#0f5f5a;stroke-width:3;rx:16} .soft{fill:#e9f5f1;stroke:#0f5f5a;stroke-width:2;rx:16}
.warm{fill:#fff3d6;stroke:#9a6a00;stroke-width:2;rx:16} .rose{fill:#fbe9e6;stroke:#a33c2b;stroke-width:2;rx:16}
.line{stroke:#0f5f5a;stroke-width:4;fill:none;marker-end:url(#a)} .red{stroke:#a33c2b;stroke-width:4;fill:none;marker-end:url(#r)}
.blue{stroke:#245b91;stroke-width:4;fill:none;marker-end:url(#b)} .dash{stroke:#667;stroke-width:2;stroke-dasharray:7 7;fill:none}
.head{font:700 34px Arial,sans-serif;fill:#0f5f5a} .txt{font:26px Arial,sans-serif;fill:#163331}
.small{font:21px Arial,sans-serif;fill:#324d4b} .tiny{font:18px Arial,sans-serif;fill:#445}
</style>
<defs>
<marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#0f5f5a"/></marker>
<marker id="r" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#a33c2b"/></marker>
<marker id="b" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#245b91"/></marker>
</defs>
<rect class="bg" width="100%" height="100%"/>

<text x="600" y="48" text-anchor="middle" class="head">Petromyzon: life-cycle logic</text>
<rect x="55" y="145" width="175" height="85" class="soft"/><text x="142" y="197" text-anchor="middle" class="txt">Egg</text>
<rect x="285" y="145" width="220" height="85" class="box"/><text x="395" y="180" text-anchor="middle" class="txt">Ammocoete</text><text x="395" y="210" text-anchor="middle" class="tiny">filter feeder</text>
<rect x="560" y="145" width="205" height="85" class="warm"/><text x="662" y="180" text-anchor="middle" class="txt">Metamorphosis</text><text x="662" y="210" text-anchor="middle" class="tiny">remodeling</text>
<rect x="820" y="145" width="220" height="85" class="box"/><text x="930" y="180" text-anchor="middle" class="txt">Juvenile/adult</text><text x="930" y="210" text-anchor="middle" class="tiny">species-specific feeding</text>
<path d="M230 187 L285 187" class="line"/><path d="M505 187 L560 187" class="line"/><path d="M765 187 L820 187" class="line"/>
<rect x="820" y="360" width="220" height="85" class="rose"/><text x="930" y="395" text-anchor="middle" class="txt">Spawning</text><text x="930" y="425" text-anchor="middle" class="tiny">freshwater nest</text>
<path d="M930 230 L930 360" class="line"/><path d="M820 402 C600 610 240 560 142 230" class="line"/>
<text x="600" y="575" text-anchor="middle" class="small">Many lampreys are semelparous: adults die after spawning.</text>

</svg>