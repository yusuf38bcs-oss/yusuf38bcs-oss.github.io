<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">Myxine and Petromyzon comparison</title>
<desc id="desc">Original educational diagram for LBFL Animal Diversity–II (223101).</desc>
<style>
.bg{fill:#fbfaf5} .box{fill:#fff;stroke:#0f5f5a;stroke-width:3;rx:16} .soft{fill:#e9f5f1;stroke:#0f5f5a;stroke-width:2;rx:16}
.warm{fill:#fff3d6;stroke:#9a6a00;stroke-width:2;rx:16} .rose{fill:#fbe9e6;stroke:#a33c2b;stroke-width:2;rx:16}
.line{stroke:#0f5f5a;stroke-width:4;fill:none;marker-end:url(#a)} .red{stroke:#a33c2b;stroke-width:4;fill:none;marker-end:url(#r)}
.blue{stroke:#245b91;stroke-width:4;fill:none;marker-end:url(#b)} .dash{stroke:#667;stroke-width:2;stroke-dasharray:7 7;fill:none}
.head{font:700 34px Arial,sans-serif;fill:#0f5f5a} .txt{font:26px Arial,sans-serif;fill:#163331}
.small{font:21px Arial,sans-serif;fill:#324d4b} .tiny{font:18px Arial,sans-serif;fill:#445}
</style>
<defs>
<marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#0f5f5a"/></marker>
<marker id="r" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#a33c2b"/></marker>
<marker id="b" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#245b91"/></marker>
</defs>
<rect class="bg" width="100%" height="100%"/>

<text x="600" y="50" text-anchor="middle" class="head">Living cyclostomes: Myxine vs Petromyzon</text>
<text x="300" y="110" text-anchor="middle" class="head">Myxine (hagfish)</text><text x="900" y="110" text-anchor="middle" class="head">Petromyzon (lamprey)</text>
<rect x="70" y="150" width="460" height="390" class="soft"/>
<rect x="670" y="150" width="460" height="390" class="warm"/>
<text x="120" y="205" class="small">• marine scavenger/predator</text><text x="120" y="250" class="small">• slime glands</text><text x="120" y="295" class="small">• barbels around mouth</text><text x="120" y="340" class="small">• keratinous tooth plates</text><text x="120" y="385" class="small">• no ammocoete stage</text><text x="120" y="430" class="small">• vertebral elements extremely reduced</text>
<text x="720" y="205" class="small">• freshwater spawning</text><text x="720" y="250" class="small">• suctorial oral disc in adults</text><text x="720" y="295" class="small">• seven gill openings/side</text><text x="720" y="340" class="small">• ammocoete larva</text><text x="720" y="385" class="small">• metamorphosis</text><text x="720" y="430" class="small">• rudimentary vertebral elements</text>
<rect x="330" y="590" width="540" height="75" class="box"/><text x="600" y="620" text-anchor="middle" class="small">Shared: jawless, persistent notochord, single median nostril, no paired fins</text><text x="600" y="650" text-anchor="middle" class="tiny">Modern genomics strongly supports a monophyletic Cyclostomata.</text>

</svg>