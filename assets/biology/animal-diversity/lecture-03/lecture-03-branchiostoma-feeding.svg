<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">Branchiostoma filter feeding</title>
<desc id="desc">Original educational diagram for LBFL Animal Diversity–II (223101).</desc>
<style>
.bg{fill:#fbfaf5} .box{fill:#fff;stroke:#0f5f5a;stroke-width:3;rx:16} .soft{fill:#e9f5f1;stroke:#0f5f5a;stroke-width:2;rx:16}
.warm{fill:#fff3d6;stroke:#9a6a00;stroke-width:2;rx:16} .rose{fill:#fbe9e6;stroke:#a33c2b;stroke-width:2;rx:16}
.line{stroke:#0f5f5a;stroke-width:4;fill:none;marker-end:url(#a)} .red{stroke:#a33c2b;stroke-width:4;fill:none;marker-end:url(#r)}
.blue{stroke:#245b91;stroke-width:4;fill:none;marker-end:url(#b)} .dash{stroke:#667;stroke-width:2;stroke-dasharray:7 7;fill:none}
.head{font:700 34px Arial,sans-serif;fill:#0f5f5a} .txt{font:26px Arial,sans-serif;fill:#163331}
.small{font:21px Arial,sans-serif;fill:#324d4b} .tiny{font:18px Arial,sans-serif;fill:#445}
</style>
<defs>
<marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#0f5f5a"/></marker>
<marker id="r" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#a33c2b"/></marker>
<marker id="b" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#245b91"/></marker>
</defs>
<rect class="bg" width="100%" height="100%"/>

<text x="600" y="50" text-anchor="middle" class="head">Branchiostoma: suspension-feeding pathway</text>
<rect x="40" y="145" width="170" height="80" class="soft"/><text x="125" y="195" text-anchor="middle" class="small">Water + food</text>
<rect x="255" y="145" width="180" height="80" class="box"/><text x="345" y="180" text-anchor="middle" class="small">Oral cirri</text><text x="345" y="208" text-anchor="middle" class="tiny">screen particles</text>
<rect x="480" y="145" width="180" height="80" class="box"/><text x="570" y="195" text-anchor="middle" class="small">Buccal cavity</text>
<rect x="705" y="145" width="180" height="80" class="warm"/><text x="795" y="180" text-anchor="middle" class="small">Pharynx</text><text x="795" y="208" text-anchor="middle" class="tiny">endostyle mucus</text>
<rect x="930" y="145" width="220" height="80" class="box"/><text x="1040" y="195" text-anchor="middle" class="small">Epipharyngeal groove</text>
<path d="M210 185 L255 185" class="blue"/><path d="M435 185 L480 185" class="blue"/><path d="M660 185 L705 185" class="blue"/><path d="M885 185 L930 185" class="line"/>
<rect x="190" y="355" width="210" height="80" class="soft"/><text x="295" y="390" text-anchor="middle" class="small">Gill slits → atrium</text><text x="295" y="418" text-anchor="middle" class="tiny">water route</text>
<rect x="495" y="355" width="210" height="80" class="soft"/><text x="600" y="405" text-anchor="middle" class="small">Atriopore → outside</text>
<rect x="800" y="355" width="210" height="80" class="warm"/><text x="905" y="390" text-anchor="middle" class="small">Food cord → gut</text><text x="905" y="418" text-anchor="middle" class="tiny">digestive route</text>
<path d="M795 225 C710 280 400 270 295 355" class="blue"/><path d="M400 395 L495 395" class="blue"/><path d="M1040 225 C1030 285 955 300 905 355" class="line"/>
<text x="600" y="595" text-anchor="middle" class="small">Most respiratory gas exchange occurs across the body surface; the pharynx is primarily a feeding filter.</text>

</svg>