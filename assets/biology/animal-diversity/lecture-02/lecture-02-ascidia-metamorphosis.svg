<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">Ascidia retrogressive metamorphosis</title>
<desc id="desc">Original educational diagram for LBFL Animal Diversity–II (223101).</desc>
<style>
.bg{fill:#fbfaf5} .box{fill:#fff;stroke:#0f5f5a;stroke-width:3;rx:16} .soft{fill:#e9f5f1;stroke:#0f5f5a;stroke-width:2;rx:16}
.warm{fill:#fff3d6;stroke:#9a6a00;stroke-width:2;rx:16} .rose{fill:#fbe9e6;stroke:#a33c2b;stroke-width:2;rx:16}
.line{stroke:#0f5f5a;stroke-width:4;fill:none;marker-end:url(#a)} .red{stroke:#a33c2b;stroke-width:4;fill:none;marker-end:url(#r)}
.blue{stroke:#245b91;stroke-width:4;fill:none;marker-end:url(#b)} .dash{stroke:#667;stroke-width:2;stroke-dasharray:7 7;fill:none}
.head{font:700 34px Arial,sans-serif;fill:#0f5f5a} .txt{font:26px Arial,sans-serif;fill:#163331}
.small{font:21px Arial,sans-serif;fill:#324d4b} .tiny{font:18px Arial,sans-serif;fill:#445}
</style>
<defs>
<marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#0f5f5a"/></marker>
<marker id="r" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#a33c2b"/></marker>
<marker id="b" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#245b91"/></marker>
</defs>
<rect class="bg" width="100%" height="100%"/>

<text x="600" y="50" text-anchor="middle" class="head">Ascidia: retrogressive metamorphosis</text>
<rect x="70" y="135" width="210" height="90" class="soft"/><text x="175" y="170" text-anchor="middle" class="txt">Tadpole larva</text><text x="175" y="202" text-anchor="middle" class="small">motile chordate plan</text>
<rect x="355" y="135" width="210" height="90" class="warm"/><text x="460" y="170" text-anchor="middle" class="txt">Attachment</text><text x="460" y="202" text-anchor="middle" class="small">adhesive papillae</text>
<rect x="640" y="135" width="210" height="90" class="rose"/><text x="745" y="170" text-anchor="middle" class="txt">Tail resorption</text><text x="745" y="202" text-anchor="middle" class="small">notochord lost</text>
<rect x="925" y="135" width="210" height="90" class="box"/><text x="1030" y="170" text-anchor="middle" class="txt">Adult</text><text x="1030" y="202" text-anchor="middle" class="small">sessile filter feeder</text>
<path d="M280 180 L355 180" class="line"/><path d="M565 180 L640 180" class="line"/><path d="M850 180 L925 180" class="line"/>
<rect x="100" y="360" width="280" height="170" class="soft"/><text x="240" y="398" text-anchor="middle" class="small">Larval structures</text><text x="240" y="438" text-anchor="middle" class="tiny">notochord</text><text x="240" y="470" text-anchor="middle" class="tiny">dorsal nerve cord</text><text x="240" y="502" text-anchor="middle" class="tiny">post-anal tail</text>
<rect x="820" y="360" width="280" height="170" class="warm"/><text x="960" y="398" text-anchor="middle" class="small">Adult specializations</text><text x="960" y="438" text-anchor="middle" class="tiny">large branchial basket</text><text x="960" y="470" text-anchor="middle" class="tiny">siphons</text><text x="960" y="502" text-anchor="middle" class="tiny">sessile feeding</text>
<path d="M380 445 C550 570 690 570 820 445" class="line"/>
<text x="600" y="650" text-anchor="middle" class="small">“Retrogressive” describes loss/reorganization of larval chordate structures; it does not mean the adult is evolutionarily inferior.</text>

</svg>