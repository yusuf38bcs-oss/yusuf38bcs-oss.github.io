<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">Ascidia feeding and reversible circulation</title>
<desc id="desc">Original educational diagram for LBFL Animal Diversity–II (223101).</desc>
<style>
.bg{fill:#fbfaf5} .box{fill:#fff;stroke:#0f5f5a;stroke-width:3;rx:16} .soft{fill:#e9f5f1;stroke:#0f5f5a;stroke-width:2;rx:16}
.warm{fill:#fff3d6;stroke:#9a6a00;stroke-width:2;rx:16} .rose{fill:#fbe9e6;stroke:#a33c2b;stroke-width:2;rx:16}
.line{stroke:#0f5f5a;stroke-width:4;fill:none;marker-end:url(#a)} .red{stroke:#a33c2b;stroke-width:4;fill:none;marker-end:url(#r)}
.blue{stroke:#245b91;stroke-width:4;fill:none;marker-end:url(#b)} .dash{stroke:#667;stroke-width:2;stroke-dasharray:7 7;fill:none}
.head{font:700 34px Arial,sans-serif;fill:#0f5f5a} .txt{font:26px Arial,sans-serif;fill:#163331}
.small{font:21px Arial,sans-serif;fill:#324d4b} .tiny{font:18px Arial,sans-serif;fill:#445}
</style>
<defs>
<marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#0f5f5a"/></marker>
<marker id="r" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#a33c2b"/></marker>
<marker id="b" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#245b91"/></marker>
</defs>
<rect class="bg" width="100%" height="100%"/>

<text x="600" y="45" text-anchor="middle" class="head">Ascidia: filter feeding + reversible circulation</text>
<text x="295" y="105" text-anchor="middle" class="head">Water / food route</text>
<rect x="60" y="150" width="180" height="70" class="box"/><text x="150" y="193" text-anchor="middle" class="small">Oral siphon</text>
<rect x="285" y="150" width="210" height="70" class="box"/><text x="390" y="193" text-anchor="middle" class="small">Branchial basket</text>
<rect x="540" y="150" width="170" height="70" class="warm"/><text x="625" y="193" text-anchor="middle" class="small">Endostyle</text>
<path d="M240 185 L285 185" class="blue"/><path d="M495 185 L540 185" class="line"/>
<rect x="120" y="300" width="180" height="70" class="soft"/><text x="210" y="343" text-anchor="middle" class="small">Atrium</text>
<rect x="355" y="300" width="180" height="70" class="soft"/><text x="445" y="343" text-anchor="middle" class="small">Atrial siphon</text>
<rect x="590" y="300" width="180" height="70" class="box"/><text x="680" y="343" text-anchor="middle" class="small">Gut</text>
<path d="M390 220 C390 255 250 260 210 300" class="blue"/><path d="M300 335 L355 335" class="blue"/><path d="M625 220 L680 300" class="line"/>
<text x="900" y="105" text-anchor="middle" class="head">Blood route</text>
<rect x="815" y="160" width="170" height="70" class="box"/><text x="900" y="203" text-anchor="middle" class="small">Heart</text>
<rect x="815" y="310" width="170" height="70" class="soft"/><text x="900" y="353" text-anchor="middle" class="small">Branchial vessels</text>
<rect x="815" y="460" width="170" height="70" class="warm"/><text x="900" y="503" text-anchor="middle" class="small">Viscera</text>
<path d="M870 230 L870 310" class="red"/><path d="M870 380 L870 460" class="red"/>
<path d="M930 460 L930 380" class="blue"/><path d="M930 310 L930 230" class="blue"/>
<text x="900" y="585" text-anchor="middle" class="tiny">Peristaltic contractions periodically reverse direction.</text>

</svg>