<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">Classification evidence flow</title>
<desc id="desc">Original educational diagram created for LBFL Animal Diversity–II Lecture 01.</desc>
<style>
.bg{fill:#fbfaf5} .box{fill:#fff;stroke:#0f5f5a;stroke-width:3} .soft{fill:#e9f5f1;stroke:#0f5f5a;stroke-width:2}
.warm{fill:#fff3d6;stroke:#9a6a00;stroke-width:2} .line{stroke:#0f5f5a;stroke-width:4;fill:none;marker-end:url(#a)}
.dash{stroke:#667;stroke-width:2;stroke-dasharray:7 7;fill:none} .head{font:700 34px Arial,sans-serif;fill:#0f5f5a}
.txt{font:26px Arial,sans-serif;fill:#163331} .small{font:21px Arial,sans-serif;fill:#324d4b} .tiny{font:18px Arial,sans-serif;fill:#445}
.red{stroke:#a33c2b;stroke-width:4;fill:none;marker-end:url(#r)} .blue{stroke:#245b91;stroke-width:4;fill:none;marker-end:url(#b)}
</style>
<defs>
<marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#0f5f5a"/></marker>
<marker id="r" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#a33c2b"/></marker>
<marker id="b" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#245b91"/></marker>
</defs>
<rect class="bg" width="100%" height="100%"/>

<text x="600" y="55" text-anchor="middle" class="head">How to classify an unknown chordate</text>
<rect x="430" y="110" width="340" height="80" class="soft"/><text x="600" y="160" text-anchor="middle" class="txt">Observe the organism</text>
<rect x="120" y="285" width="260" height="90" class="box"/><text x="250" y="322" text-anchor="middle" class="small">Body-plan evidence</text><text x="250" y="352" text-anchor="middle" class="small">notochord, nerve cord...</text>
<rect x="470" y="285" width="260" height="90" class="box"/><text x="600" y="322" text-anchor="middle" class="small">Developmental evidence</text><text x="600" y="352" text-anchor="middle" class="small">embryo/larva/adult</text>
<rect x="820" y="285" width="260" height="90" class="box"/><text x="950" y="322" text-anchor="middle" class="small">Derived characters</text><text x="950" y="352" text-anchor="middle" class="small">jaw, skeleton, amnion...</text>
<path d="M560 190 C500 240 330 245 250 285" class="line"/><path d="M600 190 L600 285" class="line"/><path d="M640 190 C700 240 870 245 950 285" class="line"/>
<rect x="350" y="470" width="500" height="90" class="warm"/><text x="600" y="506" text-anchor="middle" class="small">Compare multiple independent characters</text><text x="600" y="540" text-anchor="middle" class="small">Diagnostic evidence > superficial similarity</text>
<path d="M250 375 C250 430 430 430 470 470" class="line"/><path d="M600 375 L600 470" class="line"/><path d="M950 375 C950 430 770 430 730 470" class="line"/>
<rect x="430" y="620" width="340" height="70" class="soft"/><text x="600" y="665" text-anchor="middle" class="txt">Defend classification</text>
<path d="M600 560 L600 620" class="line"/>

</svg>