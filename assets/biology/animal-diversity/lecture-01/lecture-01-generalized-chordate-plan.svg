<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">Generalized chordate body plan</title>
<desc id="desc">Original educational diagram created for LBFL Animal Diversity–II Lecture 01.</desc>
<style>
.bg{fill:#fbfaf5} .box{fill:#fff;stroke:#0f5f5a;stroke-width:3} .soft{fill:#e9f5f1;stroke:#0f5f5a;stroke-width:2}
.warm{fill:#fff3d6;stroke:#9a6a00;stroke-width:2} .line{stroke:#0f5f5a;stroke-width:4;fill:none;marker-end:url(#a)}
.dash{stroke:#667;stroke-width:2;stroke-dasharray:7 7;fill:none} .head{font:700 34px Arial,sans-serif;fill:#0f5f5a}
.txt{font:26px Arial,sans-serif;fill:#163331} .small{font:21px Arial,sans-serif;fill:#324d4b} .tiny{font:18px Arial,sans-serif;fill:#445}
.red{stroke:#a33c2b;stroke-width:4;fill:none;marker-end:url(#r)} .blue{stroke:#245b91;stroke-width:4;fill:none;marker-end:url(#b)}
</style>
<defs>
<marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#0f5f5a"/></marker>
<marker id="r" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#a33c2b"/></marker>
<marker id="b" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#245b91"/></marker>
</defs>
<rect class="bg" width="100%" height="100%"/>

<text x="600" y="52" text-anchor="middle" class="head">Generalized chordate body plan</text>
<!-- body outline -->
<path d="M125 365 C170 235 350 190 625 205 C840 215 1015 280 1090 360 C1010 438 835 505 620 510 C355 520 170 480 125 365 Z" class="soft"/>
<!-- gut -->
<path d="M245 390 C410 405 650 405 905 395" class="red"/>
<text x="610" y="438" text-anchor="middle" class="small">digestive tube</text>
<!-- nerve cord and notochord -->
<path d="M230 277 C430 250 690 250 950 300" class="blue"/>
<text x="580" y="238" text-anchor="middle" class="small">dorsal hollow nerve cord</text>
<path d="M225 312 C430 290 695 292 960 330" class="line"/>
<text x="575" y="350" text-anchor="middle" class="small">notochord</text>
<!-- pharyngeal slits -->
<path d="M330 338 L310 415 M365 333 L345 420 M400 329 L380 422 M435 326 L415 423" class="dash"/>
<text x="380" y="470" text-anchor="middle" class="small">pharyngeal slits / arches</text>
<!-- endostyle -->
<path d="M295 405 C345 435 410 440 470 423" class="red"/>
<text x="300" y="505" class="small">endostyle/thyroid axis</text>
<!-- anus and tail -->
<circle cx="870" cy="397" r="7" fill="#a33c2b"/>
<text x="865" y="455" text-anchor="middle" class="small">anus</text>
<path d="M885 400 C965 405 1025 390 1080 362" class="line"/>
<text x="995" y="475" text-anchor="middle" class="small">post-anal tail</text>
<!-- labels -->
<text x="600" y="620" text-anchor="middle" class="small">Key idea: chordate identity is defined by a combination of developmental/body-plan characters, not by external appearance.</text>

</svg>