<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">Chordate trait persistence</title>
<desc id="desc">Original educational diagram created for LBFL Animal Diversity–II Lecture 01.</desc>
<style>
.bg{fill:#fbfaf5} .box{fill:#fff;stroke:#0f5f5a;stroke-width:3} .soft{fill:#e9f5f1;stroke:#0f5f5a;stroke-width:2}
.warm{fill:#fff3d6;stroke:#9a6a00;stroke-width:2} .line{stroke:#0f5f5a;stroke-width:4;fill:none;marker-end:url(#a)}
.dash{stroke:#667;stroke-width:2;stroke-dasharray:7 7;fill:none} .head{font:700 34px Arial,sans-serif;fill:#0f5f5a}
.txt{font:26px Arial,sans-serif;fill:#163331} .small{font:21px Arial,sans-serif;fill:#324d4b} .tiny{font:18px Arial,sans-serif;fill:#445}
.red{stroke:#a33c2b;stroke-width:4;fill:none;marker-end:url(#r)} .blue{stroke:#245b91;stroke-width:4;fill:none;marker-end:url(#b)}
</style>
<defs>
<marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#0f5f5a"/></marker>
<marker id="r" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#a33c2b"/></marker>
<marker id="b" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#245b91"/></marker>
</defs>
<rect class="bg" width="100%" height="100%"/>

<text x="600" y="50" text-anchor="middle" class="head">Where the five chordate characters are visible</text>
<text x="345" y="112" text-anchor="middle" class="small">Notochord</text><text x="500" y="112" text-anchor="middle" class="small">Dorsal tube</text>
<text x="660" y="112" text-anchor="middle" class="small">Pharynx</text><text x="815" y="112" text-anchor="middle" class="small">Endostyle/thyroid</text>
<text x="990" y="112" text-anchor="middle" class="small">Post-anal tail</text>
<rect x="60" y="142" width="1080" height="76" class="soft"/><text x="185" y="188" text-anchor="middle" class="small">Tunicate larva</text><text x="345" y="188" text-anchor="middle" class="txt">●</text><text x="500" y="188" text-anchor="middle" class="txt">●</text><text x="660" y="188" text-anchor="middle" class="txt">●</text><text x="815" y="188" text-anchor="middle" class="txt">●</text><text x="990" y="188" text-anchor="middle" class="txt">●</text><rect x="60" y="237" width="1080" height="76" class="box"/><text x="185" y="283" text-anchor="middle" class="small">Adult ascidian</text><text x="345" y="283" text-anchor="middle" class="txt">○</text><text x="500" y="283" text-anchor="middle" class="txt">○</text><text x="660" y="283" text-anchor="middle" class="txt">●</text><text x="815" y="283" text-anchor="middle" class="txt">●</text><text x="990" y="283" text-anchor="middle" class="txt">○</text><rect x="60" y="332" width="1080" height="76" class="soft"/><text x="185" y="378" text-anchor="middle" class="small">Adult lancelet</text><text x="345" y="378" text-anchor="middle" class="txt">●</text><text x="500" y="378" text-anchor="middle" class="txt">●</text><text x="660" y="378" text-anchor="middle" class="txt">●</text><text x="815" y="378" text-anchor="middle" class="txt">●</text><text x="990" y="378" text-anchor="middle" class="txt">●</text><rect x="60" y="427" width="1080" height="76" class="box"/><text x="185" y="473" text-anchor="middle" class="small">Vertebrate embryo</text><text x="345" y="473" text-anchor="middle" class="txt">●</text><text x="500" y="473" text-anchor="middle" class="txt">●</text><text x="660" y="473" text-anchor="middle" class="txt">●</text><text x="815" y="473" text-anchor="middle" class="tiny">thyroid primordium</text><text x="990" y="473" text-anchor="middle" class="txt">●</text><rect x="60" y="522" width="1080" height="76" class="soft"/><text x="185" y="568" text-anchor="middle" class="small">Adult human</text><text x="345" y="568" text-anchor="middle" class="tiny">remnant/derivative</text><text x="500" y="568" text-anchor="middle" class="tiny">brain + spinal cord</text><text x="660" y="568" text-anchor="middle" class="tiny">derivatives</text><text x="815" y="568" text-anchor="middle" class="tiny">thyroid</text><text x="990" y="568" text-anchor="middle" class="tiny">no external tail</text><text x="600" y="665" text-anchor="middle" class="tiny">● obvious/present; ○ lost or strongly reduced in the adult. “Derivative” means the embryonic structure contributes to later anatomy.</text>
</svg>