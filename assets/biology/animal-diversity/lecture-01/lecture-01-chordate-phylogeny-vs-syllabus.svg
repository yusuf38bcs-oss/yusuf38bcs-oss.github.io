<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">Chordate phylogeny and syllabus scaffold</title>
<desc id="desc">Original educational diagram created for LBFL Animal Diversity–II Lecture 01.</desc>
<style>
.bg{fill:#fbfaf5} .box{fill:#fff;stroke:#0f5f5a;stroke-width:3} .soft{fill:#e9f5f1;stroke:#0f5f5a;stroke-width:2}
.warm{fill:#fff3d6;stroke:#9a6a00;stroke-width:2} .line{stroke:#0f5f5a;stroke-width:4;fill:none;marker-end:url(#a)}
.dash{stroke:#667;stroke-width:2;stroke-dasharray:7 7;fill:none} .head{font:700 34px Arial,sans-serif;fill:#0f5f5a}
.txt{font:26px Arial,sans-serif;fill:#163331} .small{font:21px Arial,sans-serif;fill:#324d4b} .tiny{font:18px Arial,sans-serif;fill:#445}
.red{stroke:#a33c2b;stroke-width:4;fill:none;marker-end:url(#r)} .blue{stroke:#245b91;stroke-width:4;fill:none;marker-end:url(#b)}
</style>
<defs>
<marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#0f5f5a"/></marker>
<marker id="r" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#a33c2b"/></marker>
<marker id="b" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#245b91"/></marker>
</defs>
<rect class="bg" width="100%" height="100%"/>

<text x="600" y="48" text-anchor="middle" class="head">Chordate relationships: modern phylogeny and NU study scaffold</text>
<text x="300" y="105" text-anchor="middle" class="head">Modern relationship</text>
<rect x="80" y="155" width="230" height="75" class="box"/><text x="195" y="202" text-anchor="middle" class="txt">Cephalochordata</text>
<rect x="390" y="155" width="230" height="75" class="box"/><text x="505" y="202" text-anchor="middle" class="txt">Tunicata</text>
<rect x="390" y="310" width="230" height="75" class="box"/><text x="505" y="357" text-anchor="middle" class="txt">Vertebrata</text>
<path d="M195 230 C195 520 505 520 505 385" class="line"/>
<path d="M505 230 L505 310" class="line"/>
<text x="355" y="505" text-anchor="middle" class="small">Tunicata + Vertebrata = Olfactores</text>
<text x="355" y="545" text-anchor="middle" class="tiny">Cephalochordata branches earlier.</text>

<text x="900" y="105" text-anchor="middle" class="head">NU 223101 study sequence</text>
<rect x="700" y="150" width="400" height="55" class="soft"/><text x="900" y="185" text-anchor="middle" class="small">Urochordata → Cephalochordata</text>
<rect x="700" y="230" width="400" height="55" class="soft"/><text x="900" y="265" text-anchor="middle" class="small">Myxini → Cephalaspidomorphi</text>
<rect x="700" y="310" width="400" height="55" class="soft"/><text x="900" y="345" text-anchor="middle" class="small">Chondrichthyes → Osteichthyes</text>
<rect x="700" y="390" width="400" height="55" class="soft"/><text x="900" y="425" text-anchor="middle" class="small">Amphibia → Reptilia → Aves → Mammalia</text>
<text x="900" y="505" text-anchor="middle" class="small">Use this as an exam/course scaffold,</text>
<text x="900" y="540" text-anchor="middle" class="small">not as a literal ancestor → descendant chain.</text>
<rect x="120" y="610" width="960" height="62" class="warm"/><text x="600" y="650" text-anchor="middle" class="small">Exam nomenclature and modern phylogeny can differ. Learn both, but label which framework you are using.</text>

</svg>