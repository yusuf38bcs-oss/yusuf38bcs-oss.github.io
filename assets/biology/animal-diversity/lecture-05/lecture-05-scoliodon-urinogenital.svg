<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">Scoliodon urinogenital system</title>
<desc id="desc">Original educational diagram for LBFL Animal Diversity–II (223101).</desc>
<style>
.bg{fill:#fbfaf5} .box{fill:#fff;stroke:#0f5f5a;stroke-width:3;rx:16} .soft{fill:#e9f5f1;stroke:#0f5f5a;stroke-width:2;rx:16}
.warm{fill:#fff3d6;stroke:#9a6a00;stroke-width:2;rx:16} .rose{fill:#fbe9e6;stroke:#a33c2b;stroke-width:2;rx:16}
.line{stroke:#0f5f5a;stroke-width:4;fill:none;marker-end:url(#a)} .red{stroke:#a33c2b;stroke-width:4;fill:none;marker-end:url(#r)}
.blue{stroke:#245b91;stroke-width:4;fill:none;marker-end:url(#b)} .dash{stroke:#667;stroke-width:2;stroke-dasharray:7 7;fill:none}
.head{font:700 34px Arial,sans-serif;fill:#0f5f5a} .txt{font:26px Arial,sans-serif;fill:#163331}
.small{font:21px Arial,sans-serif;fill:#324d4b} .tiny{font:18px Arial,sans-serif;fill:#445}
</style>
<defs>
<marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#0f5f5a"/></marker>
<marker id="r" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#a33c2b"/></marker>
<marker id="b" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#245b91"/></marker>
</defs>
<rect class="bg" width="100%" height="100%"/>

<text x="600" y="50" text-anchor="middle" class="head">Scoliodon: urinogenital pathways</text>
<text x="300" y="105" text-anchor="middle" class="head">Male</text><text x="900" y="105" text-anchor="middle" class="head">Female</text>
<rect x="70" y="150" width="210" height="75" class="box"/><text x="175" y="196" text-anchor="middle" class="small">Testis</text>
<rect x="340" y="150" width="210" height="75" class="soft"/><text x="445" y="196" text-anchor="middle" class="small">Kidney</text>
<rect x="70" y="300" width="210" height="90" class="warm"/><text x="175" y="335" text-anchor="middle" class="tiny">vasa efferentia</text><text x="175" y="365" text-anchor="middle" class="tiny">→ vas deferens</text>
<rect x="340" y="300" width="210" height="90" class="soft"/><text x="445" y="350" text-anchor="middle" class="small">ureter</text>
<rect x="205" y="485" width="230" height="80" class="box"/><text x="320" y="533" text-anchor="middle" class="small">sinus → cloaca</text>
<path d="M175 225 L175 300" class="line"/><path d="M175 390 C175 440 260 455 285 485" class="line"/><path d="M445 225 L445 300" class="blue"/><path d="M445 390 C445 440 385 455 355 485" class="blue"/>
<rect x="650" y="150" width="210" height="75" class="box"/><text x="755" y="196" text-anchor="middle" class="small">Ovary</text>
<rect x="920" y="150" width="210" height="75" class="soft"/><text x="1025" y="196" text-anchor="middle" class="small">Kidney</text>
<rect x="650" y="300" width="210" height="90" class="warm"/><text x="755" y="335" text-anchor="middle" class="tiny">oviduct</text><text x="755" y="365" text-anchor="middle" class="tiny">+ shell gland</text>
<rect x="920" y="300" width="210" height="90" class="soft"/><text x="1025" y="350" text-anchor="middle" class="small">ureter</text>
<rect x="785" y="485" width="230" height="80" class="box"/><text x="900" y="533" text-anchor="middle" class="small">openings → cloaca</text>
<path d="M755 225 L755 300" class="line"/><path d="M755 390 C755 440 830 455 855 485" class="line"/><path d="M1025 225 L1025 300" class="blue"/><path d="M1025 390 C1025 440 960 455 930 485" class="blue"/>
<text x="600" y="655" text-anchor="middle" class="tiny">Exam focus: relation of kidney, ducts and reproductive organs; draw male and female separately.</text>

</svg>