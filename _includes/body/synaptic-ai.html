<div id="synaptic-floating-ai-root" class="synaptic-floating-ai-shell">
  <button id="socraticTriggerBtn" class="synaptic-core-bubble-btn" type="button" aria-label="Open Socratic AI Assistant">
    <svg class="synaptic-bubble-icon" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
      <path stroke-linecap="round" stroke-linejoin="round" d="M12 18.75a6 6 0 006-6v-1.5m-6 7.5a6 6 0 01-6-6v-1.5m6 7.5v3.75m-3.75 0h7.5M12 15.75a3 3 0 01-3-3V4.5a3 3 0 116 0v8.25a3 3 0 01-3 3z" />
    </svg>
  </button>

  <div id="ai-floating-panel" class="socratic-floating-panel hidden-node" role="dialog" aria-modal="false" aria-labelledby="socratic-panel-title-text">
    <div class="socratic-panel-header-node">
      <div class="header-identity-block">
        <p id="socratic-panel-title-text" class="socratic-panel-title-text">✨ Synaptic AI Mentor</p>
        <p class="socratic-panel-subtitle-text">Floating Reflective Inquiry Hub</p>
      </div>
      <button class="socratic-panel-close-trigger" type="button" aria-label="Close Socratic AI Assistant">&times;</button>
    </div>

    <div id="ai-floating-chat-stream" class="socratic-chat-viewport-stream" aria-live="polite">
      <div class="ai-stream-message-bubble">
        Welcome, student of Life Sciences. What biological blueprint, feedback mechanism, or systemic truth shall we investigate today?
      </div>
    </div>

    <div class="socratic-input-console-footer">
      <label class="socratic-console-label" for="ai-floating-query">Socratic query</label>
      <textarea id="ai-floating-query" rows="2" placeholder="Formulate a Socratic query..." class="socratic-console-textarea-field"></textarea>
      <div class="socratic-action-button-row">
        <button class="socratic-console-clear-btn" type="button">Reset inquiry</button>
        <button class="socratic-console-submit-btn" id="ai-floating-submit-trigger" type="button">Inquire</button>
      </div>
    </div>
  </div>
</div>

<style>
  .synaptic-floating-ai-shell{position:fixed!important;bottom:1.5rem!important;right:1.5rem!important;z-index:9999999!important;font-family:'Inter',-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif!important}.synaptic-core-bubble-btn{width:60px!important;height:60px!important;border:0!important;border-radius:50%!important;cursor:pointer!important;display:flex!important;align-items:center!important;justify-content:center;background:linear-gradient(135deg,#00d4b2 0%,#3b82f6 100%)!important;box-shadow:0 8px 24px rgba(0,0,0,.38)!important;transition:transform .2s ease!important;outline:none!important;padding:0!important}.synaptic-core-bubble-btn:hover{transform:translateY(-2px) scale(1.04)}.synaptic-core-bubble-btn:focus-visible{outline:3px solid rgba(103,232,249,.95)!important;outline-offset:4px}.synaptic-bubble-icon{width:26px;height:26px;color:#020617!important}.socratic-floating-panel{position:fixed!important;bottom:6rem!important;right:1.5rem!important;width:min(90vw,380px)!important;height:min(520px,calc(100svh - 8rem))!important;display:flex!important;flex-direction:column!important;border-radius:12px!important;background:#0d1527!important;border:1px solid rgba(0,212,178,.22)!important;box-shadow:0 20px 50px rgba(0,0,0,.65)!important;overflow:hidden;box-sizing:border-box;transition:opacity .2s ease,transform .2s ease}.socratic-floating-panel.hidden-node{display:none!important;opacity:0;pointer-events:none}.socratic-panel-header-node{padding:1rem 1.25rem!important;border-bottom:1px solid rgba(0,212,178,.12)!important;display:flex;justify-content:space-between;align-items:center;background:#020617!important}.socratic-panel-title-text{margin:0!important;font-size:1.05rem!important;color:#fff!important;font-weight:850!important;letter-spacing:-.01em}.socratic-panel-subtitle-text{margin:.15rem 0 0!important;font-size:.78rem!important;color:#cbd5e1!important;font-weight:600}.socratic-panel-close-trigger{background:transparent!important;border:0!important;color:#cbd5e1!important;font-size:1.65rem!important;cursor:pointer!important;line-height:1!important;padding:.1rem .25rem!important}.socratic-panel-close-trigger:focus-visible{outline:2px solid #67e8f9;outline-offset:2px}.socratic-chat-viewport-stream{flex:1!important;overflow-y:auto!important;padding:1.1rem!important;display:flex!important;flex-direction:column!important;gap:1rem!important;background:#020617!important}.ai-stream-message-bubble,.user-stream-message-bubble{padding:10px 14px!important;border-radius:8px!important;font-size:.9rem!important;line-height:1.55!important;max-width:88%!important;box-sizing:border-box!important;text-align:left!important;word-spacing:normal!important;letter-spacing:normal!important}.ai-stream-message-bubble{align-self:flex-start!important;background:#0d1527!important;color:#e2e8f0!important;border:1px solid rgba(255,255,255,.06)}.user-stream-message-bubble{align-self:flex-end!important;background:rgba(0,212,178,.08)!important;border:1px solid rgba(0,212,178,.25)!important;color:#fff!important}.socratic-input-console-footer{padding:1rem!important;background:#0d1527!important;border-top:1px solid rgba(0,212,178,.12)!important;box-sizing:border-box}.socratic-console-label{display:block;margin-bottom:.4rem;color:#cbd5e1;font-size:.8rem;font-weight:700}.socratic-console-textarea-field{width:100%!important;background:#020617!important;border:1px solid rgba(255,255,255,.1)!important;border-radius:6px!important;color:#fff!important;padding:10px 12px!important;font-size:.9rem!important;line-height:1.4!important;resize:vertical!important;outline:none!important;box-sizing:border-box}.socratic-console-textarea-field:focus{border-color:rgba(0,212,178,.55)!important}.socratic-action-button-row{display:flex;justify-content:flex-end;gap:.75rem;margin-top:.75rem}.socratic-console-clear-btn{background:transparent!important;border:1px solid rgba(255,255,255,.12)!important;color:#cbd5e1!important;padding:6px 14px!important;border-radius:4px!important;font-size:.8rem!important;font-weight:700!important;cursor:pointer!important}.socratic-console-submit-btn{background:linear-gradient(135deg,#00d4b2 0%,#3b82f6 100%)!important;border:0!important;color:#020617!important;padding:6px 16px!important;border-radius:4px!important;font-weight:800!important;font-size:.8rem!important;text-transform:uppercase;cursor:pointer!important;letter-spacing:.02em}.socratic-console-submit-btn:disabled{background:#1e293b!important;color:#94a3b8!important;cursor:not-allowed!important}@media(max-width:480px){.socratic-floating-panel{right:1rem!important;bottom:5.6rem!important;width:calc(100vw - 2rem)!important;height:min(440px,calc(100svh - 7rem))!important}.synaptic-floating-ai-shell{bottom:1rem!important;right:1rem!important}}@media(prefers-reduced-motion:reduce){.synaptic-core-bubble-btn,.socratic-floating-panel{transition:none!important}}
</style>

<script>
  (function () {
    "use strict";

    var root = document.getElementById("synaptic-floating-ai-root");
    if (!root) return;

    var panel = document.getElementById("ai-floating-panel");
    var trigger = document.getElementById("socraticTriggerBtn");
    var closeBtn = root.querySelector(".socratic-panel-close-trigger");
    var clearBtn = root.querySelector(".socratic-console-clear-btn");
    var submitBtn = document.getElementById("ai-floating-submit-trigger");
    var queryInput = document.getElementById("ai-floating-query");
    var chatBox = document.getElementById("ai-floating-chat-stream");
    var aiCorePromise = null;

    function appendBubble(className, content, asHtml) {
      var bubble = document.createElement("div");
      bubble.className = className;
      if (asHtml) bubble.innerHTML = content;
      else bubble.textContent = content;
      chatBox.appendChild(bubble);
      chatBox.scrollTop = chatBox.scrollHeight;
      return bubble;
    }

    function togglePanel() {
      if (!panel) return;
      panel.classList.toggle("hidden-node");
      if (!panel.classList.contains("hidden-node")) {
        window.setTimeout(function () { if (queryInput) queryInput.focus(); }, 60);
      }
    }

    function clearChat() {
      if (!chatBox) return;
      chatBox.innerHTML = '<div class="ai-stream-message-bubble">🧠 Inquiry state reset. Start a new analytical question whenever you are ready.</div>';
    }

    function ensureSynapticAI() {
      if (window.SynapticAI) return Promise.resolve(window.SynapticAI);
      if (aiCorePromise) return aiCorePromise;
      var src = "{{ '/assets/js/core/ai-core.js' | relative_url }}?v={{ site.time | date: '%Y%m%d' }}";
      var loader = window.lbflLoadScript || function (url) {
        return new Promise(function (resolve, reject) {
          var s = document.createElement("script");
          s.src = url;
          s.async = true;
          s.onload = resolve;
          s.onerror = reject;
          document.head.appendChild(s);
        });
      };
      aiCorePromise = loader(src).then(function () {
        if (!window.SynapticAI) throw new Error("Synaptic AI core did not initialize.");
        return window.SynapticAI;
      });
      return aiCorePromise;
    }

    async function submitQuery() {
      if (!queryInput || !chatBox || !submitBtn) return;
      var rawPrompt = queryInput.value.trim();
      if (!rawPrompt) return;

      appendBubble("user-stream-message-bubble", rawPrompt, false);
      queryInput.value = "";
      var loadingBubble = appendBubble("ai-stream-message-bubble", "⚡ Synaptic alignment processing...", false);
      submitBtn.disabled = true;
      queryInput.disabled = true;

      try {
        var SynapticAI = await ensureSynapticAI();
        var response = await SynapticAI.generate({
          model: "deep",
          type: "text",
          useMemory: true,
          systemInstruction: "You are a floating Socratic biology mentor. Guide students toward self-awareness, life-science patterns, and conceptual clarity using brief, targeted, left-aligned response structures.",
          prompt: rawPrompt
        });
        loadingBubble.remove();
        appendBubble("ai-stream-message-bubble", SynapticAI.renderMarkdown(response.text || response.output || "No context tracks returned."), true);
      } catch (err) {
        loadingBubble.remove();
        appendBubble("ai-stream-message-bubble", '<span style="color:#f87171;font-weight:700;">⚠️ Synaptic Loop Interrupted:</span> ' + String((err && err.message) || "Network validation mismatch."), true);
      } finally {
        submitBtn.disabled = false;
        queryInput.disabled = false;
        queryInput.focus();
      }
    }

    if (trigger) trigger.addEventListener("click", togglePanel);
    if (closeBtn) closeBtn.addEventListener("click", togglePanel);
    if (clearBtn) clearBtn.addEventListener("click", clearChat);
    if (submitBtn) submitBtn.addEventListener("click", submitQuery);
    if (queryInput) {
      queryInput.addEventListener("keydown", function (event) {
        if ((event.ctrlKey || event.metaKey) && event.key === "Enter") submitQuery();
      });
    }

    window.toggleFloatingAI = togglePanel;
    window.clearFloatingChatStream = clearChat;
    window.triggerFloatingInquiryLoop = submitQuery;
  })();
</script>
