<section class="synaptic-ai-panel" data-ai-widget>
  <div class="ai-panel-header">
    <div class="ai-neural-core-status">
      <div class="status-pulse-core"></div>
      <span class="status-text-node">AI Core Sync Active</span>
    </div>
    <h2 class="ai-panel-title">{{ include.title | default: "Synaptic AI Tutor" }}</h2>
    <p class="ai-panel-desc">
      {{ include.description | default: "Ask a Socratic biology question to map your understanding across our interdisciplinary arrays." }}
    </p>
  </div>

  <div class="ai-panel-body">
    <textarea
      class="ai-input-console"
      data-ai-prompt
      rows="4"
      placeholder="Formulate your query or conceptual contradiction here..."
    ></textarea>

    <div class="ai-action-control-strip">
      <button class="ai-btn-submit" data-ai-submit>
        Generate Response
      </button>
      <button class="ai-btn-clear" data-ai-clear-memory>
        Clear Memory
      </button>
    </div>
  </div>

  <div class="ai-output-viewport" data-ai-output style="display: none;"></div>
</section>

<style>
  .synaptic-ai-panel {
    background: #0d1527 !important;
    border: 1px solid rgba(0, 212, 178, 0.12) !important;
    border-radius: 12px !important;
    padding: 2.25rem !important;
    margin: 2.5rem auto !important;
    max-width: 800px;
    box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif !important;
    box-sizing: border-box;
  }

  .ai-neural-core-status {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: rgba(0, 212, 178, 0.04);
    border: 1px solid rgba(0, 212, 178, 0.15);
    padding: 6px 12px;
    border-radius: 20px;
    margin-bottom: 1.25rem;
  }

  .status-pulse-core {
    width: 6px;
    height: 6px;
    background: #00d4b2;
    border-radius: 50%;
    box-shadow: 0 0 8px #00d4b2;
    animation: corePulse 2s infinite ease-in-out;
  }

  .status-text-node {
    font-size: 0.75rem !important;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: #00d4b2 !important;
    font-weight: 700;
  }

  .ai-panel-title {
    color: #ffffff !important;
    font-size: 1.6rem !important;
    font-weight: 800 !important;
    margin: 0 0 0.5rem 0 !important;
    letter-spacing: -0.02em;
    text-align: left;
  }

  .ai-panel-desc {
    color: #94a3b8 !important;
    font-size: 0.95rem !important;
    line-height: 1.6 !important;
    margin: 0 0 1.75rem 0 !important;
    text-align: justify;
  }

  /* High-Comfort Console Area */
  .ai-input-console {
    width: 100% !important;
    background: #020617 !important;
    border: 1px solid rgba(255, 255, 255, 0.05) !important;
    border-radius: 8px !important;
    padding: 1.2rem !important;
    color: #ffffff !important;
    font-size: 0.95rem !important;
    line-height: 1.6 !important;
    outline: none !important;
    resize: vertical;
    box-sizing: border-box;
    transition: border-color 0.25s ease, box-shadow 0.25s ease;
    box-shadow: inset 0 2px 4px rgba(0,0,0,0.3);
  }

  .ai-input-console:focus {
    border-color: rgba(0, 212, 178, 0.4) !important;
    box-shadow: 0 0 15px rgba(0, 212, 178, 0.08), inset 0 2px 4px rgba(0,0,0,0.3) !important;
  }

  .ai-input-console::placeholder {
    color: #475569;
  }

  /* Button Controllers Configuration */
  .ai-action-control-strip {
    display: flex;
    justify-content: flex-start;
    align-items: center;
    gap: 1.25rem;
    margin-top: 1.25rem;
    flex-wrap: wrap;
  }

  .ai-btn-submit {
    background: linear-gradient(135deg, #00d4b2 0%, #3b82f6 100%) !important;
    color: #020617 !important;
    font-weight: 700 !important;
    padding: 12px 28px !important;
    border: none !important;
    border-radius: 6px !important;
    cursor: pointer !important;
    font-size: 0.9rem !important;
    text-transform: uppercase;
    letter-spacing: 0.02em;
    transition: transform 0.2s ease, box-shadow 0.2s ease !important;
    box-shadow: 0 4px 14px rgba(0, 212, 178, 0.15);
  }

  .ai-btn-submit:hover:not(:disabled) {
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(0, 212, 178, 0.35);
  }

  .ai-btn-submit:disabled {
    background: #1e293b !important;
    color: #64748b !important;
    cursor: not-allowed !important;
    box-shadow: none !important;
    transform: none !important;
  }

  .ai-btn-clear {
    background: transparent !important;
    color: #64748b !important;
    font-weight: 600 !important;
    padding: 11px 24px !important;
    border: 1px solid rgba(255, 255, 255, 0.08) !important;
    border-radius: 6px !important;
    cursor: pointer !important;
    font-size: 0.9rem !important;
    transition: all 0.2s ease !important;
  }

  .ai-btn-clear:hover {
    border-color: rgba(239, 68, 68, 0.3);
    color: #ef4444 !important;
    background: rgba(239, 68, 68, 0.02) !important;
  }

  /* Output Screen Component Container */
  .ai-output-viewport {
    margin-top: 2rem;
    padding: 1.5rem;
    background: #020617 !important;
    border-radius: 8px;
    border-left: 3px solid #00d4b2;
    color: #e2e8f0 !important;
    font-size: 0.98rem !important;
    line-height: 1.65 !important;
    text-align: justify;
    box-shadow: inset 0 2px 4px rgba(0,0,0,0.4);
  }

  .ai-output-viewport p {
    margin: 0 0 1rem 0 !important;
  }
  .ai-output-viewport p:last-child {
    margin-bottom: 0 !important;
  }

  .ai-thinking-node {
    color: #00d4b2 !important;
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 8px;
    animation: textPulse 1.5s infinite linear;
  }

  /* Structural System Keyframe Animations */
  @keyframes corePulse {
    0%, 100% { opacity: 0.6; transform: scale(1); }
    50% { opacity: 1; transform: scale(1.15); }
  }
  @keyframes textPulse {
    0%, 100% { opacity: 0.7; }
    50% { opacity: 1; }
  }

  /* Responsive Multi-Device Adaptations */
  @media (max-width: 480px) {
    .synaptic-ai-panel {
      padding: 1.5rem !important;
      margin: 1.5rem 0 !important;
    }
    .ai-panel-title {
      font-size: 1.35rem !important;
    }
    .ai-action-control-strip {
      flex-direction: column !important;
      align-items: stretch !important;
      gap: 0.85rem !important;
    }
    .ai-btn-submit, .ai-btn-clear {
      width: 100% !important;
      text-align: center !important;
    }
  }
</style>

<script>
  document.addEventListener("DOMContentLoaded", function () {
    const widget = document.querySelector("[data-ai-widget]");
    if (!widget || !window.SynapticAI) return;

    const input = widget.querySelector("[data-ai-prompt]");
    const output = widget.querySelector("[data-ai-output]");
    const submit = widget.querySelector("[data-ai-submit]");
    const clear = widget.querySelector("[data-ai-clear-memory]");

    submit.addEventListener("click", async function () {
      if (!input.value.trim()) return;

      // Unveiling the console monitor viewport and locking active interactions
      output.style.display = "block";
      output.innerHTML = '<span class="ai-thinking-node">⚡ Synaptic Core Thinking...</span>';
      submit.disabled = true;
      input.disabled = true;

      try {
        const result = await window.SynapticAI.generate({
          model: "deep",
          type: "text",
          useMemory: true,
          systemInstruction: "You are a Socratic biology tutor. Ask thoughtful, leading questions based on life sciences and divine cosmic balance before giving direct answers.",
          prompt: input.value
        });

        output.innerHTML = window.SynapticAI.renderMarkdown(result.text || result.output || "");
      } catch (err) {
        output.innerHTML = `<span style="color: #ef4444; font-weight: 600;">⚠️ Synaptic Misfire:</span> ${err.message || "Please re-verify network metrics and try again."}`;
      } finally {
        // Restoring engine interactive access parameters
        submit.disabled = false;
        input.disabled = false;
      }
    });

    clear.addEventListener("click", function () {
      window.SynapticAI.clearMemory();
      output.style.display = "block";
      output.innerHTML = '<span style="color: #00d4b2; font-weight: 600;">🧠 Synaptic Memory Restructured.</span> Session context cleared for this timeline.';
      input.value = "";
    });
  });
</script>
