<div
  id="gdpr-banner"
  data-cookie-banner
  aria-live="polite"
  role="region"
  aria-label="Cookie consent notice"
  hidden
>
  <p class="gdpr-text">
    We use cookies for analytics, site stability, and learning improvements.
  </p>

  <div class="gdpr-buttons">
    <button
      class="gdpr-accept"
      type="button"
      data-gdpr-consent="granted"
      data-cookie-consent-action="accept"
    >
      Accept
    </button>

    <button
      class="gdpr-decline"
      type="button"
      data-gdpr-consent="denied"
      data-cookie-consent-action="decline"
    >
      Decline
    </button>
  </div>
</div>
