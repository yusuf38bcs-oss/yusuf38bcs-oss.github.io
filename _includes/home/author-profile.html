<section class="home-author-profile" aria-labelledby="home-author-profile-title">
  <div class="home-author-profile__shell">
    <div class="home-author-profile__media" aria-hidden="true">
      <img src="{{ site.author.avatar | default: site.logo | relative_url }}" alt="" loading="lazy" decoding="async">
    </div>

    <div class="home-author-profile__content">
      <p class="home-author-profile__eyebrow">About the Author</p>
      <h2 id="home-author-profile-title">{{ site.author.name | default: site.name }}</h2>
      <p class="home-author-profile__bio">{{ site.author.bio }}</p>

      <div class="home-author-profile__meta" aria-label="Author profile metadata">
        {% if site.author.location %}
          <span>{{ site.author.location }}</span>
        {% endif %}
        {% if site.author.email %}
          <span>{{ site.author.email }}</span>
        {% endif %}
      </div>

      <div class="home-author-profile__actions">
        <a class="home-author-profile__primary" href="{{ '/about/' | relative_url }}">Read Full Author Profile</a>
        <a class="home-author-profile__secondary" href="{{ '/contact/' | relative_url }}">Contact</a>
      </div>
    </div>
  </div>
</section>

<style>
  .home-author-profile {
    position: relative;
    isolation: isolate;
    padding: clamp(3rem, 7vw, 6rem) clamp(1rem, 4vw, 2rem);
    background:
      radial-gradient(circle at top left, rgba(0, 212, 178, 0.10), transparent 34%),
      linear-gradient(180deg, #020617 0%, #08111f 100%);
    border-top: 1px solid rgba(0, 212, 178, 0.10);
    border-bottom: 1px solid rgba(0, 212, 178, 0.10);
  }

  .home-author-profile__shell {
    width: min(1120px, 100%);
    margin: 0 auto;
    display: grid;
    grid-template-columns: 180px minmax(0, 1fr);
    gap: clamp(1.5rem, 4vw, 3rem);
    align-items: center;
    padding: clamp(1.5rem, 4vw, 2.75rem);
    border-radius: 28px;
    background: linear-gradient(145deg, rgba(15, 23, 42, 0.82), rgba(2, 6, 23, 0.78));
    border: 1px solid rgba(0, 212, 178, 0.18);
    box-shadow: 0 24px 70px rgba(0, 0, 0, 0.42), inset 0 1px 0 rgba(255, 255, 255, 0.04);
  }

  .home-author-profile__media {
    width: 160px;
    height: 160px;
    border-radius: 50%;
    padding: 10px;
    background: linear-gradient(135deg, rgba(0, 212, 178, 0.85), rgba(59, 130, 246, 0.85));
    box-shadow: 0 0 34px rgba(0, 212, 178, 0.18);
  }

  .home-author-profile__media img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    border-radius: 50%;
    background: #020617;
    border: 3px solid rgba(2, 6, 23, 0.88);
  }

  .home-author-profile__eyebrow {
    margin: 0 0 0.65rem 0;
    color: #7fffe7;
    font-size: 0.78rem;
    font-weight: 800;
    letter-spacing: 0.16em;
    text-transform: uppercase;
  }

  .home-author-profile h2 {
    margin: 0 0 1rem 0;
    color: #ffffff;
    font-size: clamp(2rem, 4vw, 3.2rem);
    line-height: 1.08;
    letter-spacing: -0.03em;
  }

  .home-author-profile__bio {
    margin: 0;
    max-width: 780px;
    color: #cbd5e1;
    font-size: clamp(1rem, 1.6vw, 1.12rem);
    line-height: 1.75;
    text-align: left;
  }

  .home-author-profile__meta {
    display: flex;
    flex-wrap: wrap;
    gap: 0.75rem;
    margin-top: 1.35rem;
  }

  .home-author-profile__meta span {
    display: inline-flex;
    align-items: center;
    border-radius: 999px;
    border: 1px solid rgba(148, 163, 184, 0.20);
    background: rgba(15, 23, 42, 0.72);
    color: #94a3b8;
    padding: 0.45rem 0.8rem;
    font-size: 0.86rem;
    font-weight: 650;
  }

  .home-author-profile__actions {
    display: flex;
    flex-wrap: wrap;
    gap: 0.9rem;
    margin-top: 1.6rem;
  }

  .home-author-profile__primary,
  .home-author-profile__secondary {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border-radius: 12px;
    padding: 0.75rem 1.2rem;
    font-weight: 800;
    text-decoration: none !important;
    transition: transform 180ms ease, border-color 180ms ease, box-shadow 180ms ease;
  }

  .home-author-profile__primary {
    color: #020617 !important;
    background: linear-gradient(135deg, #00d4b2, #3b82f6);
    box-shadow: 0 0 24px rgba(0, 212, 178, 0.22);
  }

  .home-author-profile__secondary {
    color: #e2e8f0 !important;
    background: rgba(2, 6, 23, 0.46);
    border: 1px solid rgba(148, 163, 184, 0.24);
  }

  .home-author-profile__primary:hover,
  .home-author-profile__secondary:hover {
    transform: translateY(-2px);
  }

  @media (max-width: 720px) {
    .home-author-profile__shell {
      grid-template-columns: 1fr;
      text-align: center;
    }

    .home-author-profile__media {
      margin: 0 auto;
      width: 132px;
      height: 132px;
    }

    .home-author-profile__bio {
      text-align: left;
    }

    .home-author-profile__meta,
    .home-author-profile__actions {
      justify-content: center;
    }
  }
</style>
