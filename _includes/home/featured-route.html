{% assign featured = site.data.homepage.featured_route %}
{% if featured.enabled %}
<section
  class="lbfl-home-v2__section lbfl-home-v2__featured"
  aria-labelledby="lbfl-home-v2-featured-title"
>
  <div>
    <p class="lbfl-home-v2__eyebrow">{{ featured.eyebrow }}</p>
    <h2 id="lbfl-home-v2-featured-title">{{ featured.title }}</h2>
    <p>{{ featured.summary }}</p>
    <p class="lbfl-home-v2__featured-meta">
      {{ featured.lesson_count }} connected lessons
    </p>
  </div>

  <div class="lbfl-home-v2__actions">
    <a
      class="lbfl-home-v2__button lbfl-home-v2__button--primary"
      href="{{ featured.start_url | relative_url }}"
    >
      Begin Lecture 01
    </a>
    <a
      class="lbfl-home-v2__button lbfl-home-v2__button--secondary"
      href="{{ featured.chapter_url | relative_url }}"
    >
      View the chapter
    </a>
  </div>
</section>
{% endif %}
