<section class="recent-posts-viewport" style="padding: 5rem 1.5rem; background: #090d16; border-top: 1px solid rgba(255,255,255,0.05);">
  <div style="max-width: 800px; margin: 0 auto;">
    <h2 style="font-size: 1.75rem; color: #ffffff; margin-bottom: 2.5rem; text-align: left;">⚡ Latest Scientific Logs</h2>
    
    <div style="display: flex; flex-direction: column; gap: 1.5rem;">
      {% for doc in site.documents %}
        {% if doc.collection != 'posts' %}
          <article style="background: #0f172a; padding: 1.5rem; border-radius: 8px; border-left: 4px solid #00d4b2; box-shadow: 0 4px 20px rgba(0,0,0,0.2);">
            <span style="font-size: 0.8rem; color: #00d4b2; text-transform: uppercase; font-weight: bold; letter-spacing: 0.05em;">{{ doc.collection }}</span>
            <h3 style="margin: 0.4rem 0; font-size: 1.25rem;"><a href="{{ doc.url | relative_url }}" style="color: #ffffff; text-decoration: none;">{{ doc.title }}</a></h3>
            <p style="color: #94a3b8; margin: 0; font-size: 0.9rem;">{{ doc.excerpt | strip_html | truncatewords: 25 }}</p>
          </article>
        {% endif %}
      {% endfor %}
    </div>
    
  </div>
</section>
