{% assign posts = site.posts | limit: 6 %}
<section class="home-section recent-posts">
  <h2 class="section-title">Latest Scientific Logs</h2>
  {% if posts.size > 0 %}
    <div class="card-grid">
      {% for post in posts %}
        {% include components/archive-single.html %}
      {% endfor %}
    </div>
    <div class="section-cta">
      <a href="{{ '/archive/' | relative_url }}" class="btn btn--primary">View Archive</a>
    </div>
  {% else %}
    <p class="archive__warning">Awaiting fresh scientific logs. Check back soon.</p>
    <div class="section-cta">
      <a href="{{ '/categories/' | relative_url }}" class="btn btn--primary">Browse Categories</a>
    </div>
  {% endif %}
</section>
