<meta charset="utf-8">

<meta
  http-equiv="X-UA-Compatible"
  content="IE=edge">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1, viewport-fit=cover">

<meta
  name="theme-color"
  content="#07111d">

<meta
  name="color-scheme"
  content="dark">

<meta
  name="format-detection"
  content="telephone=no">

<meta
  name="robots"
  content="index, follow">

<meta
  name="author"
  content="{{ site.author.name | default: site.title }}">

<meta
  name="generator"
  content="Jekyll">

<meta
  name="description"
  content="{{ page.description | default: site.description | strip_html | strip_newlines | truncate: 160 }}">

<!-- =========================================================
     TITLE
========================================================= -->

<title>
  {% if page.title %}
    {{ page.title }} |
  {% endif %}
  {{ site.title }}
</title>

<!-- =========================================================
     CANONICAL
========================================================= -->

<link
  rel="canonical"
  href="{{ page.url | absolute_url }}">

<!-- =========================================================
     FAVICON SYSTEM
========================================================= -->

<link
  rel="icon"
  type="image/x-icon"
  href="{{ '/assets/icons/favicon.ico' | relative_url }}">

<link
  rel="shortcut icon"
  href="{{ '/assets/icons/favicon.ico' | relative_url }}">

<link
  rel="apple-touch-icon"
  href="{{ '/assets/icons/apple-touch-icon.png' | relative_url }}">

<!-- =========================================================
     PWA / MANIFEST
========================================================= -->

<link
  rel="manifest"
  href="{{ '/site.webmanifest' | relative_url }}">

<!-- =========================================================
     PERFORMANCE OPTIMIZATION
========================================================= -->

<link
  rel="preconnect"
  href="https://fonts.googleapis.com">

<link
  rel="preconnect"
  href="https://fonts.gstatic.com"
  crossorigin>

<link
  rel="dns-prefetch"
  href="//cdn.jsdelivr.net">

<!-- =========================================================
     MAIN STYLESHEET
========================================================= -->

<link
  rel="stylesheet"
  href="{{ '/assets/css/main.css' | relative_url }}">

<!-- =========================================================
     PRELOAD HERO BACKGROUND
========================================================= -->

<link
  rel="preload"
  as="image"
  href="{{ '/assets/images/backgrounds/header-bg.webp' | relative_url }}">

<!-- =========================================================
     OPEN GRAPH FOUNDATION
========================================================= -->

<meta
  property="og:type"
  content="website">

<meta
  property="og:site_name"
  content="{{ site.title }}">

<meta
  property="og:title"
  content="{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}">

<meta
  property="og:description"
  content="{{ page.description | default: site.description | strip_html | strip_newlines | truncate: 160 }}">

<meta
  property="og:image"
  content="{{ '/assets/images/branding/logo-main.png' | absolute_url }}">

<meta
  property="og:url"
  content="{{ page.url | absolute_url }}">

<meta
  property="og:locale"
  content="en_US">

<!-- =========================================================
     TWITTER / X CARD
========================================================= -->

<meta
  name="twitter:card"
  content="summary_large_image">

<meta
  name="twitter:title"
  content="{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}">

<meta
  name="twitter:description"
  content="{{ page.description | default: site.description | strip_html | strip_newlines | truncate: 160 }}">

<meta
  name="twitter:image"
  content="{{ '/assets/images/branding/logo-main.png' | absolute_url }}">

<!-- =========================================================
     EDUCATIONAL / SEMANTIC IDENTITY
========================================================= -->

<meta
  name="subject"
  content="Biology, Reflective Learning, Socratic Education">

<meta
  name="keywords"
  content="Biology, Education, Reflective Thinking, Leadership, Human Behaviour, Learning, Socratic">

<!-- =========================================================
     STRUCTURED DATA
========================================================= -->

{% include seo/structured-data.html %}

<!-- =========================================================
     MARKED.JS
========================================================= -->

<script
  src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"
  defer>
</script>

<!-- =========================================================
     CUSTOM HEAD SCRIPTS
========================================================= -->

{% include head-scripts.html %}
