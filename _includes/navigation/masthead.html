<div class="masthead">
  <div class="masthead__inner-wrap">
    <div class="masthead__menu">
      <nav id="site-nav" class="greedy-nav" aria-label="Primary navigation">
        {% if site.logo %}
          <a class="site-logo" href="{{ '/' | relative_url }}">
            <img src="{{ site.logo | relative_url }}" alt="{{ site.title | escape }}">
          </a>
        {% endif %}

        <a class="site-title" href="{{ '/' | relative_url }}">{{ site.title }}</a>

        <ul class="visible-links">
          {%- for link in site.data.navigation.main -%}
            <li class="masthead__menu-item">
              <a href="{{ link.url | relative_url }}"{% if link.description %} title="{{ link.description | escape }}"{% endif %}>{{ link.title }}</a>
            </li>
          {%- endfor -%}
        </ul>

        {% if site.search == true %}
          <button class="search__toggle" type="button" aria-label="Toggle search">
            <span class="visually-hidden">{{ site.data.ui-text[site.locale].search_label | default: 'Toggle search' }}</span>
            <span aria-hidden="true">⌕</span>
          </button>
        {% endif %}

        <button class="greedy-nav__toggle hidden" type="button" aria-label="Toggle menu">
          <span class="visually-hidden">{{ site.data.ui-text[site.locale].menu_label | default: 'Toggle menu' }}</span>
          <div class="navicon"></div>
        </button>

        <ul class="hidden-links hidden"></ul>
      </nav>
    </div>
  </div>
</div>
