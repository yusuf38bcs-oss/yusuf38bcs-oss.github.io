<!-- Synaptic Masthead — Production Mobile-Ready -->
<header class="masthead z-header" role="banner">
  <div class="masthead__inner-wrap">
    
    <!-- Site Title / Logo -->
    <div class="masthead__title">
      <a href="{{ '/' | relative_url }}" aria-label="Learning Biology For Life — Home">
        Learning Biology For Life
      </a>
    </div>

    <!-- Mobile Hamburger Toggle -->
    <button 
      class="masthead__menu-toggle neural-menu-toggle" 
      type="button"
      aria-expanded="false"
      aria-controls="site-nav-drawer"
      aria-label="Open navigation menu"
      data-nav-toggle
    >
      <span class="hamburger-bar" aria-hidden="true"></span>
      <span class="hamburger-bar" aria-hidden="true"></span>
      <span class="hamburger-bar" aria-hidden="true"></span>
    </button>

    <!-- Desktop Navigation (Minimal Mistakes Compatible) -->
    <nav class="masthead__menu greedy-nav" id="site-nav" role="navigation" aria-label="Main navigation">
      <ul class="visible-links">
        {%- for link in site.data.navigation.main -%}
          <li class="masthead__menu-item">
            <a href="{{ link.url | relative_url }}"{% if link.description %} title="{{ link.description }}"{% endif %}{% if link.target %} target="{{ link.target }}"{% endif %}>
              {{ link.title }}
            </a>
          </li>
        {%- endfor -%}
      </ul>
      {% if site.search == true %}
        <button class="search__toggle" type="button">
          <span class="visually-hidden">{{ site.data.ui-text[site.locale].search_label | default: "Toggle search" }}</span>
          <svg class="icon" width="16" height="16" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 15.99 16"><path d="M15.5 13.3 12.2 10a6.8 6.8 0 0 0 1-3.6 6.9 6.9 0 1 0-6.9 6.9 6.8 6.8 0 0 0 3.6-1l3.3 3.3a.9.9 0 0 0 1.3 0 .9.9 0 0 0 0-1.3zM2.4 6.4a4 4 0 1 1 4 4 4 4 0 0 1-4-4z" fill="currentColor"/></svg>
        </button>
      {% endif %}
    </nav>

    <!-- Mobile Drawer (Hidden on Desktop) -->
    <div class="mobile-menu nav-drawer" id="site-nav-drawer" data-nav-drawer aria-hidden="true">
      <ul class="mobile-menu__list">
        {%- for link in site.data.navigation.main -%}
          <li>
            <a href="{{ link.url | relative_url }}"{% if link.description %} title="{{ link.description }}"{% endif %}>
              {{ link.title }}
            </a>
          </li>
        {%- endfor -%}
      </ul>
    </div>

  </div>
</header>
