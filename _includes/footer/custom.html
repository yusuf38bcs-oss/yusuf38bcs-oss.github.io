<style>
/* --- BUTTON STYLING --- */
.newsletter-trigger-btn {
  background-color: #000000;
  color: #FFFFFF;
  font-family: 'Helvetica', 'Arial', sans-serif;
  font-size: 15px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 1px;
  padding: 15px 30px;
  border: none;
  border-radius: 4px;
  cursor: pointer;
  box-shadow: 0 4px 6px rgba(0,0,0,0.1);
  transition: all 0.3s ease;
  display: block;
  margin: 20px auto;
  width: 100%;
  max-width: 280px;
}

.newsletter-trigger-btn:hover {
  background-color: #1B262C;
  letter-spacing: 1.5px;
}

/* --- MODAL OVERLAY --- */
.brevo-overlay-container {
  display: none; 
  position: fixed;
  z-index: 9999999;
  left: 0; top: 0;
  width: 100%; height: 100%;
  background-color: rgba(0,0,0,0.8);
  backdrop-filter: blur(4px);
}

/* --- MODAL BOX --- */
.brevo-modal-window {
  background-color: #ffffff;
  margin: 10% auto;
  padding: 15px;
  border-radius: 8px;
  width: 90%;
  max-width: 560px;
  position: relative;
  box-shadow: 0 20px 40px rgba(0,0,0,0.4);
  box-sizing: border-box;
}

/* --- CLOSE BUTTON --- */
.close-x {
  position: absolute;
  top: -15px;
  right: -15px;
  background: #000;
  color: #fff;
  width: 30px;
  height: 30px;
  border-radius: 50%;
  text-align: center;
  line-height: 28px;
  font-size: 20px;
  cursor: pointer;
  border: 2px solid #fff;
  box-sizing: border-box;
}

/* --- MOBILE RESPONSIVENESS --- */
@media screen and (max-width: 600px) {
  .newsletter-trigger-btn {
    max-width: 100%;
    font-size: 14px;
    padding: 12px 20px;
  }
  .brevo-modal-window {
    width: 95%;
    margin: 15% auto;
    padding: 10px;
  }
  .close-x {
    top: -12px;
    right: -5px;
  }
}
</style>

<div style="text-align: center; padding: 30px 20px; margin-top: 40px; border-top: 1px solid #e1e8ed;">
  
  <h3 style="margin-top: 0; color: #0b5394;">Join the Synaptic Bridge</h3>

<script>
function openBrevoModal() {
  document.getElementById("brevoPopup").style.display = "block";
  document.body.style.overflow = "hidden"; // Prevents background scrolling
}

function closeBrevoModal() {
  document.getElementById("brevoPopup").style.display = "none";
  document.body.style.overflow = "auto"; // Restores scrolling
}

// Close if user clicks the dark background overlay
window.onclick = function(event) {
  var modal = document.getElementById("brevoPopup");
  if (event.target === modal) {
    closeBrevoModal();
  }
}
</script>
