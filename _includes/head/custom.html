{% comment %}
  Custom head extension only. Do not re-include head/head.html here;
  default.html already loads _includes/head.html.
{% endcomment %}

<script>
  window.LBFL_AI_ENDPOINT = "https://api.learningbiologyforlife.org";
  window.dataLayer = window.dataLayer || [];
  window.gtag = window.gtag || function(){ window.dataLayer.push(arguments); };

  window.lbflLoadScript = window.lbflLoadScript || function (src, attrs) {
    return new Promise(function (resolve, reject) {
      if (!src) return reject(new Error("Missing script source"));
      var existing = document.querySelector('script[src="' + src.replace(/"/g, '\\"') + '"]');
      if (existing) {
        if (existing.dataset.loaded === "true") return resolve(existing);
        existing.addEventListener("load", function () { resolve(existing); }, { once: true });
        existing.addEventListener("error", reject, { once: true });
        return;
      }
      var s = document.createElement("script");
      s.src = src;
      s.async = true;
      if (attrs) {
        Object.keys(attrs).forEach(function (key) {
          if (attrs[key] === true) s.setAttribute(key, "");
          else if (attrs[key] !== false && attrs[key] != null) s.setAttribute(key, attrs[key]);
        });
      }
      s.onload = function () { s.dataset.loaded = "true"; resolve(s); };
      s.onerror = reject;
      document.head.appendChild(s);
    });
  };

  window.lbflWhenIdle = window.lbflWhenIdle || function (callback, timeout) {
    if ("requestIdleCallback" in window) {
      window.requestIdleCallback(callback, { timeout: timeout || 2500 });
    } else {
      window.setTimeout(callback, timeout || 1500);
    }
  };
</script>

<!-- Consent Mode defaults: safe before analytics/ad scripts are loaded. -->
<script>
  window.gtag('consent', 'default', {
    'analytics_storage': 'denied',
    'ad_storage': 'denied',
    'ad_user_data': 'denied',
    'ad_personalization': 'denied',
    'functionality_storage': 'granted',
    'security_storage': 'granted',
    'wait_for_update': 500
  });
</script>

<script>
  (function () {
    "use strict";

    var marketingLoaded = false;
    var translateLoaded = false;

    function onceOnInteraction(callback) {
      var fired = false;
      var events = ["pointerdown", "keydown", "touchstart", "scroll"];
      function handler() {
        if (fired) return;
        fired = true;
        events.forEach(function (eventName) {
          window.removeEventListener(eventName, handler, { passive: true });
        });
        callback();
      }
      events.forEach(function (eventName) {
        window.addEventListener(eventName, handler, { passive: true, once: true });
      });
    }

    function loadMarketingScripts() {
      if (marketingLoaded) return;
      marketingLoaded = true;

      window.lbflLoadScript("https://www.googletagmanager.com/gtm.js?id=GTM-WPZ6MPK4")
        .then(function () { window.dataLayer.push({ event: "gtm.js" }); })
        .catch(function () {});

      window.lbflLoadScript(
        "https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9144658795059352",
        { crossorigin: "anonymous" }
      ).catch(function () {});
    }

    window.googleTranslateElementInit = function () {
      if (!window.google || !window.google.translate || !document.getElementById("google_translate_element")) return;
      new window.google.translate.TranslateElement({
        pageLanguage: "en",
        includedLanguages: "bn,en",
        layout: window.google.translate.TranslateElement.InlineLayout.SIMPLE,
        autoDisplay: false
      }, "google_translate_element");
    };

    function loadTranslate() {
      if (translateLoaded) return;
      translateLoaded = true;
      window.lbflLoadScript("https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit")
        .catch(function () {});
    }

    window.lbflLoadTranslate = loadTranslate;

    document.addEventListener("DOMContentLoaded", function () {
      document.querySelectorAll(".lbfl-translate-shell").forEach(function (shell) {
        shell.addEventListener("toggle", function () {
          if (shell.open) loadTranslate();
        });
      });
    });

    window.lbflWhenIdle(loadMarketingScripts, 3200);
    onceOnInteraction(loadMarketingScripts);
  })();
</script>
