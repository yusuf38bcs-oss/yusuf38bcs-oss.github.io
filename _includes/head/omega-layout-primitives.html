{% comment %}
  Omega layout primitives.
  Isolated head-level design-system utilities for W3C/Every Layout patterns.
  These classes are additive and do not replace Minimal Mistakes or existing LBFL styles.
{% endcomment %}

<style>
  :root {
    --lbfl-bg-oklch: oklch(0.18 0.02 260);
    --lbfl-surface-oklch: oklch(0.22 0.025 260);
    --lbfl-border-oklch: oklch(0.34 0.035 250 / 0.55);
    --lbfl-text-oklch: oklch(0.95 0.012 260);
    --lbfl-muted-oklch: oklch(0.72 0.03 250);
    --lbfl-accent-oklch: oklch(0.85 0.15 190);
    --lbfl-accent-ghost-oklch: oklch(0.78 0.13 190 / 0.18);
    --lbfl-purple-oklch: oklch(0.48 0.18 300);
    --s-2: 0.444rem;
    --s-1: 0.667rem;
    --s0: 1rem;
    --s1: 1.5rem;
    --s2: 2.25rem;
    --s3: 3.375rem;
    --s4: 5.063rem;
  }

  html { background-color: #020617; background-color: var(--lbfl-bg-oklch); }

  .l-center {
    box-sizing: content-box;
    max-inline-size: var(--center-measure, 1180px);
    margin-inline: auto;
    padding-inline: var(--center-gutter, clamp(1rem, 3vw, 1.5rem));
  }

  .stack { display: flex; flex-direction: column; justify-content: flex-start; }
  .stack > * { margin-block: 0; }
  .stack > * + * { margin-block-start: var(--stack-space, var(--s1)); }

  .l-cluster { overflow: hidden; }
  .l-cluster > .flex-container {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: var(--cluster-gap, var(--s1));
    justify-content: var(--cluster-justify, flex-start);
  }

  .l-switcher > * {
    display: flex;
    flex-wrap: wrap;
    gap: var(--switcher-gap, var(--s1));
  }
  .l-switcher > * > * {
    flex-grow: 1;
    flex-basis: calc((var(--switcher-threshold, 30rem) - 100%) * 999);
    min-inline-size: 0;
  }

  .l-sidebar {
    display: flex;
    flex-wrap: wrap;
    gap: var(--sidebar-gap, var(--s2));
    align-items: stretch;
  }
  .l-sidebar > .sidebar {
    flex: 1 1 var(--sidebar-size, 22rem);
    min-inline-size: min(100%, var(--sidebar-size, 22rem));
  }
  .l-sidebar > .not-sidebar {
    flex: 999 1 var(--not-sidebar-min, 38rem);
    min-inline-size: min(100%, var(--not-sidebar-min, 38rem));
  }

  .txt-venus {
    font-size: clamp(2.45rem, 7vw, 5rem) !important;
    line-height: 1.03 !important;
    letter-spacing: -0.045em !important;
    font-weight: 900 !important;
  }

  .txt-venus-small {
    font-size: clamp(1.05rem, 2.2vw, 1.45rem) !important;
    line-height: 1.12 !important;
    font-weight: 850 !important;
    letter-spacing: -0.025em !important;
  }

  .txt-intro {
    color: #cbd5e1;
    color: var(--lbfl-muted-oklch);
    font-size: clamp(1rem, 2vw, 1.25rem);
    line-height: 1.68;
  }

  .button,
  .button--ghost {
    min-height: 48px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 0.6rem;
    padding: var(--btn-padding-block, 0.82rem) var(--btn-padding-inline, 1.35rem);
    border-radius: 12px;
    font-weight: 850;
    text-decoration: none !important;
    line-height: 1.1;
    transition: transform 0.18s ease, box-shadow 0.18s ease, border-color 0.18s ease, background-color 0.18s ease;
  }

  .button {
    color: #020617 !important;
    background: #00f5d4;
    background: var(--lbfl-accent-oklch);
    border: 1px solid transparent;
    box-shadow: 0 12px 28px rgba(0, 245, 212, 0.18);
  }

  .button--ghost {
    color: #e2e8f0 !important;
    background: rgba(2, 6, 23, 0.34);
    border: 1px solid rgba(0, 245, 212, 0.24);
  }

  .button:hover,
  .button:focus-visible,
  .button--ghost:hover,
  .button--ghost:focus-visible {
    transform: translateY(-1px);
    outline: 2px solid rgba(0, 245, 212, 0.68);
    outline-offset: 3px;
  }

  .global-header {
    background-color: #020617 !important;
    background-color: var(--lbfl-bg-oklch) !important;
  }

  .global-nav {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
  }

  @supports not (color: oklch(0.18 0.02 260)) {
    :root {
      --lbfl-bg-oklch: #020617;
      --lbfl-surface-oklch: #0d1527;
      --lbfl-border-oklch: rgba(148, 163, 184, 0.18);
      --lbfl-text-oklch: #f8fafc;
      --lbfl-muted-oklch: #94a3b8;
      --lbfl-accent-oklch: #00f5d4;
      --lbfl-accent-ghost-oklch: rgba(0, 245, 212, 0.18);
      --lbfl-purple-oklch: #7b2cbf;
    }
  }
</style>
