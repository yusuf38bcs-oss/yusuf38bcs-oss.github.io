<style>
  #gdpr-banner {
    position: fixed !important;
    left: 50% !important;
    bottom: calc(0.7rem + env(safe-area-inset-bottom)) !important;
    z-index: 999999 !important;
    width: min(94vw, 760px) !important;
    transform: translateX(-50%) !important;
    display: none !important;
    grid-template-columns: minmax(0, 1fr) auto !important;
    align-items: center !important;
    gap: 0.72rem !important;
    padding: 0.72rem 0.85rem !important;
    color: #e2e8f0 !important;
    background: rgba(2, 6, 23, 0.96) !important;
    border: 1px solid rgba(0, 212, 178, 0.28) !important;
    border-radius: 18px !important;
    box-shadow: 0 18px 46px rgba(0, 0, 0, 0.5) !important;
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif !important;
  }

  #gdpr-banner.is-visible { display: grid !important; }
  #gdpr-banner .gdpr-text { margin: 0 !important; line-height: 1.42 !important; }
  #gdpr-banner .gdpr-buttons { display: flex !important; gap: 0.45rem !important; }
  #gdpr-banner button {
    min-width: 78px !important;
    min-height: 40px !important;
    padding: 0.46rem 0.72rem !important;
    border-radius: 11px !important;
    cursor: pointer !important;
    font-weight: 800 !important;
  }
  #gdpr-banner .gdpr-accept {
    color: #020617 !important;
    background: #00d4b2 !important;
    border: 1px solid #00d4b2 !important;
  }
  #gdpr-banner .gdpr-decline {
    color: #f8fafc !important;
    background: #1d4ed8 !important;
    border: 1px solid rgba(96, 165, 250, 0.65) !important;
  }

  @media (max-width: 560px) {
    #gdpr-banner {
      grid-template-columns: 1fr !important;
      gap: 0.5rem !important;
      padding: 0.65rem !important;
    }
    #gdpr-banner .gdpr-buttons {
      display: grid !important;
      grid-template-columns: 1fr 1fr !important;
    }
    #gdpr-banner button { width: 100% !important; min-width: 0 !important; }
  }
</style>

<script>
  (function () {
    "use strict";

    var CONSENT_KEY = "cookie-consent";
    var ADSENSE_SRC = "https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9144658795059352";

    function getCookieConsent() {
      var match = document.cookie.match(new RegExp("(?:^|; )" + CONSENT_KEY + "=([^;]*)"));
      return match ? decodeURIComponent(match[1]) : null;
    }

    function getConsent() {
      try {
        return window.localStorage ? localStorage.getItem(CONSENT_KEY) || getCookieConsent() : getCookieConsent();
      } catch (error) {
        return getCookieConsent();
      }
    }

    function setConsent(value) {
      try {
        if (window.localStorage) localStorage.setItem(CONSENT_KEY, value);
      } catch (error) {}
      document.cookie = CONSENT_KEY + "=" + encodeURIComponent(value) + "; Max-Age=31536000; Path=/; SameSite=Lax; Secure";
    }

    function getBanner() {
      return document.querySelector("#gdpr-banner[data-cookie-banner]");
    }

    function hideBanner() {
      var banner = getBanner();
      if (!banner) return;
      banner.classList.remove("is-visible");
      banner.setAttribute("hidden", "hidden");
    }

    function showBanner() {
      if (getConsent()) return;
      var banner = getBanner();
      if (!banner) return;
      banner.removeAttribute("hidden");
      banner.classList.add("is-visible");
    }

    function pushConsentState(state) {
      window.dataLayer = window.dataLayer || [];
      window.dataLayer.push({ event: "lbfl_consent_update", consent_state: state });
      if (typeof window.gtag === "function") {
        window.gtag("consent", "update", {
          analytics_storage: state === "granted" ? "granted" : "denied",
          ad_storage: state === "granted" ? "granted" : "denied",
          ad_user_data: state === "granted" ? "granted" : "denied",
          ad_personalization: state === "granted" ? "granted" : "denied"
        });
      }
    }

    function loadAdSense() {
      if (document.querySelector('script[data-cookie-managed="adsense"], script[src*="pagead2.googlesyndication.com/pagead/js/adsbygoogle.js"]')) return;
      var script = document.createElement("script");
      script.async = true;
      script.src = ADSENSE_SRC;
      script.crossOrigin = "anonymous";
      script.dataset.cookieManaged = "adsense";
      document.head.appendChild(script);
    }

    function applyConsent(state) {
      if (state !== "granted" && state !== "denied") return;
      setConsent(state);
      pushConsentState(state);
      hideBanner();
      if (state === "granted") loadAdSense();
    }

    document.addEventListener("click", function (event) {
      var button = event.target && event.target.closest ? event.target.closest("[data-cookie-consent-action]") : null;
      if (!button) return;
      var action = (button.getAttribute("data-cookie-consent-action") || "").toLowerCase();
      if (action !== "accept" && action !== "decline") return;
      event.preventDefault();
      applyConsent(action === "accept" ? "granted" : "denied");
    }, true);

    function initialize() {
      var consent = getConsent();
      if (consent === "granted") {
        pushConsentState("granted");
        loadAdSense();
      } else if (consent === "denied") {
        pushConsentState("denied");
      } else {
        window.setTimeout(showBanner, 600);
      }
    }

    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", initialize, { once: true });
    } else {
      initialize();
    }
  })();
</script>
