<style id="lbfl-homepage-mobile-layer-fix">
  /*
   * Mobile/tablet layer contract.
   *
   * Earlier homepage foundations introduce desktop grids at 40rem and 48rem.
   * Keep the compact composition authoritative through 64rem so those legacy
   * rules cannot compress the editorial layers at 768px or in mobile browsers
   * that expose a wider layout viewport.
   */
  @media (max-width: 64rem) {
    :root {
      --lbfl-header-height: 64px;
    }

    .lbfl-home-v2-active .lbfl-premium-header,
    .lbfl-home-v2-active .lbfl-premium-header__inner {
      height: var(--lbfl-header-height) !important;
      min-height: var(--lbfl-header-height) !important;
    }

    .lbfl-home-v2-active .lbfl-premium-header__inner {
      width: min(100% - 1rem, 76rem);
      gap: 0.35rem;
    }

    .lbfl-home-v2-active .lbfl-premium-header__brand {
      flex: 1 1 auto;
      min-width: 0;
    }

    .lbfl-home-v2-active .lbfl-premium-header__logo {
      width: 38px;
      height: 38px;
      flex-basis: 38px;
    }

    .lbfl-home-v2-active .lbfl-premium-header__desktop-nav {
      display: none !important;
    }

    .lbfl-home-v2-active .lbfl-premium-header__menu {
      display: block !important;
    }

    .lbfl-home-v2-active .lbfl-premium-header__control-label {
      position: absolute;
      width: 1px;
      height: 1px;
      margin: -1px;
      padding: 0;
      overflow: hidden;
      clip: rect(0 0 0 0);
      white-space: nowrap;
      border: 0;
    }

    .lbfl-home-v2-active .lbfl-premium-header__search-panel,
    .lbfl-home-v2-active .lbfl-premium-header__menu-panel {
      position: fixed !important;
      top: calc(var(--lbfl-header-height) + 0.5rem) !important;
      right: 0.5rem !important;
      left: 0.5rem !important;
      width: auto !important;
      max-width: none !important;
      max-height: calc(100dvh - var(--lbfl-header-height) - 1rem) !important;
      overflow-x: hidden !important;
      overflow-y: auto !important;
      overscroll-behavior: contain;
    }

    /* Keep the artwork, blend, and copy inside one stacking context. */
    .lbfl-home-v2-active .lbfl-premium-hero {
      display: grid;
      grid-template-columns: minmax(0, 1fr) !important;
      min-height: 0 !important;
      background: #071525;
    }

    .lbfl-home-v2-active .lbfl-premium-hero::before {
      z-index: 2;
      background:
        radial-gradient(
          circle at 82% 18%,
          rgba(66, 199, 232, 0.12),
          transparent 19rem
        ),
        linear-gradient(
          90deg,
          #071525 0%,
          rgba(7, 21, 37, 0.98) 30%,
          rgba(7, 21, 37, 0.9) 52%,
          rgba(7, 21, 37, 0.42) 78%,
          rgba(7, 21, 37, 0.2) 100%
        ),
        linear-gradient(
          180deg,
          rgba(7, 21, 37, 0.04) 0%,
          rgba(7, 21, 37, 0.12) 72%,
          #071525 100%
        );
    }

    .lbfl-home-v2-active .lbfl-premium-hero__copy {
      position: relative;
      z-index: 3;
      grid-column: 1;
      grid-row: 1;
      width: min(100%, 52rem);
      margin: 0;
      padding:
        clamp(2.25rem, 7vw, 4rem)
        clamp(1rem, 5vw, 2.5rem)
        clamp(2.5rem, 8vw, 4.5rem);
    }

    .lbfl-home-v2-active .lbfl-premium-cell {
      position: absolute !important;
      inset: 0 !important;
      z-index: 1;
      grid-column: 1;
      grid-row: 1;
      width: 100%;
      height: 100%;
      min-height: 0 !important;
      pointer-events: none;
    }

    .lbfl-home-v2-active .lbfl-premium-cell__canvas {
      width: 100%;
      height: 100%;
      min-height: 0 !important;
      background: transparent;
    }

    .lbfl-home-v2-active .lbfl-premium-cell__canvas::after {
      background:
        linear-gradient(
          90deg,
          rgba(7, 21, 37, 0.84) 0%,
          rgba(7, 21, 37, 0.34) 54%,
          rgba(7, 21, 37, 0.03) 100%
        ),
        linear-gradient(
          180deg,
          rgba(7, 21, 37, 0.04),
          rgba(7, 21, 37, 0.32)
        );
    }

    .lbfl-home-v2-active .lbfl-premium-cell__image {
      object-position: 72% center;
      opacity: 0.9;
    }

    .lbfl-home-v2-active .lbfl-home-v2 .lbfl-premium-hero h1 {
      max-width: 15ch;
      font-size: clamp(2.5rem, 7vw, 4.25rem);
      line-height: 1;
    }

    /* Reset desktop placement before applying the compact reading order. */
    .lbfl-home-v2-active .lbfl-home-v2__featured,
    .lbfl-home-v2-active .lbfl-home-v2__bridge,
    .lbfl-home-v2-active .lbfl-home-v2__editorial {
      grid-template-columns: minmax(0, 1fr) !important;
      grid-auto-flow: row;
      align-items: start;
    }

    .lbfl-home-v2-active .lbfl-home-v2__featured > *,
    .lbfl-home-v2-active .lbfl-home-v2__bridge > *,
    .lbfl-home-v2-active .lbfl-home-v2__editorial > * {
      grid-column: auto !important;
      grid-row: auto !important;
      min-width: 0;
      width: 100%;
      max-width: 100%;
    }

    .lbfl-home-v2-active .lbfl-home-v2__featured-intro {
      position: static !important;
      top: auto !important;
    }

    .lbfl-home-v2-active .lbfl-home-v2__learning-list,
    .lbfl-home-v2-active .lbfl-home-v2__bridge-principles,
    .lbfl-home-v2-active .lbfl-home-v2__method-list,
    .lbfl-home-v2-active .lbfl-reflection-lab__grid {
      grid-template-columns: minmax(0, 1fr) !important;
    }

    .lbfl-home-v2-active .lbfl-home-v2__learning-list > *,
    .lbfl-home-v2-active .lbfl-home-v2__bridge-principles > *,
    .lbfl-home-v2-active .lbfl-home-v2__method-list > *,
    .lbfl-home-v2-active .lbfl-reflection-lab__grid > * {
      min-width: 0;
      max-width: 100%;
    }

    /* Keep each Experience card in reading order at tablet widths too. */
    .lbfl-home-v2-active .lbfl-home-v2 .lbfl-home-v2__learning-route a {
      grid-template-columns: minmax(0, 1fr) !important;
      grid-template-rows: repeat(4, auto) !important;
      overflow-wrap: anywhere;
    }

    .lbfl-home-v2-active .lbfl-home-v2__learning-route .lbfl-home-v2__lesson-number {
      grid-row: auto !important;
      min-width: 0;
      width: max-content;
      max-width: 100%;
      justify-content: flex-start;
    }

    .lbfl-home-v2-active .lbfl-home-v2__learning-route a > strong,
    .lbfl-home-v2-active .lbfl-home-v2__learning-route a > p,
    .lbfl-home-v2-active .lbfl-home-v2__learning-route a > small {
      grid-column: 1;
      min-width: 0;
      max-width: 100%;
    }

    .lbfl-home-v2-active .lbfl-home-v2__learning-route::before,
    .lbfl-home-v2-active .lbfl-home-v2__critical-cycle::before {
      left: 1rem;
    }
  }

  @media (max-width: 48rem) {
    .lbfl-home-v2-active .lbfl-home-v2__pathway-grid,
    .lbfl-home-v2-active .lbfl-home-v2__repair-loop {
      grid-template-columns: minmax(0, 1fr) !important;
    }

    .lbfl-home-v2-active .lbfl-home-v2__pathway-card,
    .lbfl-home-v2-active .lbfl-home-v2__pathway-link {
      min-height: 0;
    }

    .lbfl-home-v2-active .lbfl-home-v2__repair-loop li:not(:last-child)::after {
      right: auto;
      top: auto;
      bottom: -0.9rem;
      left: 50%;
      transform: translateX(-50%) rotate(90deg);
    }
  }

  @media (max-width: 30rem) {
    :root {
      --lbfl-header-height: 60px;
    }

    .lbfl-home-v2-active .lbfl-premium-header__inner {
      width: calc(100% - 0.75rem);
      gap: 0.18rem;
    }

    .lbfl-home-v2-active .lbfl-premium-header__logo {
      width: 34px;
      height: 34px;
      flex-basis: 34px;
    }

    .lbfl-home-v2-active .lbfl-premium-header__brand-copy small {
      display: none;
    }

    .lbfl-home-v2-active .lbfl-premium-header__search > summary,
    .lbfl-home-v2-active .lbfl-premium-header__menu > summary {
      width: 40px;
      min-width: 40px;
      padding-inline: 0.35rem;
    }

    .lbfl-home-v2-active .lbfl-premium-hero::before {
      background:
        linear-gradient(
          90deg,
          #071525 0%,
          rgba(7, 21, 37, 0.98) 42%,
          rgba(7, 21, 37, 0.68) 76%,
          rgba(7, 21, 37, 0.34) 100%
        ),
        linear-gradient(
          180deg,
          rgba(7, 21, 37, 0.08),
          #071525 100%
        );
    }

    .lbfl-home-v2-active .lbfl-premium-hero__copy {
      padding: 2rem 0.85rem 2.5rem;
    }

    .lbfl-home-v2-active .lbfl-home-v2 .lbfl-premium-hero h1 {
      font-size: clamp(2.25rem, 12vw, 3.15rem);
    }

    .lbfl-home-v2-active .lbfl-premium-hero .lbfl-home-v2__actions--primary {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
    }

    .lbfl-home-v2-active .lbfl-premium-hero .lbfl-home-v2__button {
      width: 100%;
      min-width: 0;
    }

    .lbfl-home-v2-active .lbfl-reflection-lab__continue ul {
      display: grid;
    }

    .lbfl-home-v2-active .lbfl-reflection-lab__continue a {
      width: 100%;
      justify-content: space-between;
    }
  }

  @media (max-width: 22rem) {
    .lbfl-home-v2-active .lbfl-language-switcher__link.is-active,
    .lbfl-home-v2-active .lbfl-language-switcher__divider {
      display: none;
    }
  }
</style>
