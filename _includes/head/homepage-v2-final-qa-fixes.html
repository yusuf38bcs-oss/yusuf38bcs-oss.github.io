<script>
  (function () {
    "use strict";

    function syncConsentState() {
      var banner = document.querySelector("#gdpr-banner[data-cookie-banner]");
      var visible = !!(
        banner &&
        !banner.hasAttribute("hidden") &&
        banner.classList.contains("is-visible")
      );

      document.documentElement.classList.toggle(
        "lbfl-consent-visible",
        visible
      );

      window.dispatchEvent(
        new CustomEvent(
          visible ? "lbfl:consent-shown" : "lbfl:consent-hidden"
        )
      );
    }

    function initializeConsentObserver() {
      var banner = document.querySelector("#gdpr-banner[data-cookie-banner]");
      if (!banner) return;

      new MutationObserver(syncConsentState).observe(banner, {
        attributes: true,
        attributeFilter: ["class", "hidden"]
      });

      syncConsentState();
    }

    if (document.readyState === "loading") {
      document.addEventListener(
        "DOMContentLoaded",
        initializeConsentObserver,
        { once: true }
      );
    } else {
      initializeConsentObserver();
    }
  })();
</script>
