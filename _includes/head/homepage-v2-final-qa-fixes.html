<script>
  (function () {
    "use strict";

    function closeSiblingDetails(activeDetails) {
      document
        .querySelectorAll(".lbfl-premium-header details[open]")
        .forEach(function (details) {
          if (details !== activeDetails) {
            details.removeAttribute("open");
          }
        });
    }

    function initializeHeaderDetails() {
      document
        .querySelectorAll(".lbfl-premium-header details")
        .forEach(function (details) {
          details.addEventListener("toggle", function () {
            if (details.open) {
              closeSiblingDetails(details);
            }
          });
        });

      document.addEventListener("keydown", function (event) {
        if (event.key !== "Escape") {
          return;
        }

        var openDetails = document.querySelector(
          ".lbfl-premium-header details[open]"
        );

        if (!openDetails) {
          return;
        }

        var summary = openDetails.querySelector("summary");
        openDetails.removeAttribute("open");

        if (summary) {
          summary.focus();
        }
      });

      document.addEventListener("pointerdown", function (event) {
        var openDetails = document.querySelector(
          ".lbfl-premium-header details[open]"
        );

        if (openDetails && !openDetails.contains(event.target)) {
          openDetails.removeAttribute("open");
        }
      });
    }

    function syncConsentState() {
      var banner = document.querySelector(
        "#gdpr-banner[data-cookie-banner]"
      );

      var visible = !!(
        banner &&
        !banner.hasAttribute("hidden") &&
        banner.classList.contains("is-visible")
      );

      document.documentElement.classList.toggle(
        "lbfl-consent-visible",
        visible
      );

      window.dispatchEvent(
        new CustomEvent(
          visible
            ? "lbfl:consent-shown"
            : "lbfl:consent-hidden"
        )
      );
    }

    function initializeConsentObserver() {
      var banner = document.querySelector(
        "#gdpr-banner[data-cookie-banner]"
      );

      if (!banner) {
        return;
      }

      new MutationObserver(syncConsentState).observe(
        banner,
        {
          attributes: true,
          attributeFilter: ["class", "hidden"]
        }
      );

      syncConsentState();
    }

    function initializeStageD1() {
      initializeHeaderDetails();
      initializeConsentObserver();
    }

    if (document.readyState === "loading") {
      document.addEventListener(
        "DOMContentLoaded",
        initializeStageD1,
        { once: true }
      );
    } else {
      initializeStageD1();
    }
  })();
</script>
