<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#071525">

{% seo %}
{% include head/polyglot-seo-overrides.html %}

<link rel="icon" type="image/x-icon" href="{{ '/assets/images/favicon.ico' | relative_url }}">
<link rel="apple-touch-icon" href="{{ '/assets/images/apple-touch-icon.png' | relative_url }}">

{% assign lbfl_main_css = '/assets/css/main.css' | relative_url %}
<link rel="preload" href="{{ lbfl_main_css }}?v={{ site.time | date: '%Y%m%d' }}" as="style">
<link rel="stylesheet" href="{{ lbfl_main_css }}?v={{ site.time | date: '%Y%m%d' }}" media="print" onload="this.media='all'">
<noscript><link rel="stylesheet" href="{{ lbfl_main_css }}?v={{ site.time | date: '%Y%m%d' }}"></noscript>

<style>
  html.lbfl-home-v2-document,
  html.lbfl-home-v2-document body {
    margin: 0;
    min-height: 100%;
    scroll-behavior: auto !important;
    background: #071525;
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }

  .lbfl-home-v2-active {
    overflow-x: hidden;
  }

  .lbfl-home-v2-active *,
  .lbfl-home-v2-active *::before,
  .lbfl-home-v2-active *::after {
    box-sizing: border-box;
  }

  .lbfl-home-v2-active .initial-content {
    min-height: 1px;
  }

  .lbfl-premium-header {
    position: sticky;
    top: 0;
    z-index: 9999;
    min-height: 74px;
    color: #e8f7f4;
    background: rgba(7, 21, 37, 0.96);
    border-bottom: 1px solid rgba(66, 199, 232, 0.16);
    backdrop-filter: blur(14px);
  }

  .lbfl-premium-header__inner {
    width: min(100% - 1.25rem, 1280px);
    min-height: 74px;
    margin-inline: auto;
    display: flex;
    align-items: center;
    gap: clamp(0.55rem, 1.8vw, 1.25rem);
  }

  .lbfl-premium-header__brand {
    min-width: 0;
    display: inline-flex;
    align-items: center;
    gap: 0.6rem;
    color: #ffffff;
    text-decoration: none;
  }

  .lbfl-premium-header__logo {
    width: 42px;
    height: 42px;
    flex: 0 0 42px;
    object-fit: contain;
  }

  .lbfl-premium-header__brand-copy {
    display: grid;
    gap: 0.05rem;
    line-height: 1.05;
  }

  .lbfl-premium-header__brand-copy strong {
    color: #ffffff;
    font-size: 1.04rem;
    letter-spacing: 0.08em;
  }

  .lbfl-premium-header__brand-copy small {
    color: #9fc5c0;
    font-size: 0.72rem;
    white-space: nowrap;
  }

  .lbfl-premium-header__desktop-nav {
    display: flex;
    flex: 1 1 auto;
    justify-content: flex-end;
    gap: 0.15rem;
  }

  .lbfl-premium-header__desktop-nav a,
  .lbfl-premium-header .lbfl-language-switcher__link {
    min-height: 44px;
    display: inline-flex;
    align-items: center;
    padding: 0.55rem 0.65rem;
    color: #d9ebe8;
    border-radius: 999px;
    text-decoration: none;
    font-size: 0.86rem;
    font-weight: 720;
  }

  .lbfl-premium-header__desktop-nav a:hover,
  .lbfl-premium-header__desktop-nav a:focus-visible,
  .lbfl-premium-header .lbfl-language-switcher__link:hover,
  .lbfl-premium-header .lbfl-language-switcher__link:focus-visible {
    color: #ffffff;
    background: rgba(66, 199, 232, 0.1);
  }

  .lbfl-premium-header__actions {
    display: inline-flex;
    align-items: center;
    gap: 0.3rem;
  }

  .lbfl-premium-header .lbfl-language-switcher {
    display: inline-flex;
    align-items: center;
  }

  .lbfl-premium-header .lbfl-language-switcher__divider {
    color: #5f7d7a;
  }

  .lbfl-premium-header__search,
  .lbfl-premium-header__menu {
    position: relative;
  }

  .lbfl-premium-header__search > summary,
  .lbfl-premium-header__menu > summary {
    min-width: 44px;
    min-height: 44px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 0.4rem;
    padding: 0.55rem 0.65rem;
    color: #e8f7f4;
    border: 1px solid rgba(159, 197, 192, 0.22);
    border-radius: 999px;
    cursor: pointer;
    list-style: none;
  }

  .lbfl-premium-header__search > summary::-webkit-details-marker,
  .lbfl-premium-header__menu > summary::-webkit-details-marker {
    display: none;
  }

  .lbfl-premium-header__search-panel,
  .lbfl-premium-header__menu-panel {
    position: absolute;
    top: calc(100% + 0.65rem);
    right: 0;
    z-index: 20;
    width: min(23rem, calc(100vw - 1.25rem));
    padding: 1rem;
    color: #143b3a;
    background: #ffffff;
    border: 1px solid #d7e4e1;
    border-radius: 1rem;
    box-shadow: 0 1.4rem 3rem rgba(0, 0, 0, 0.22);
  }

  .lbfl-premium-header__search-panel label {
    display: block;
    margin-bottom: 0.45rem;
    font-size: 0.85rem;
    font-weight: 800;
  }

  .lbfl-premium-header__search-row {
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 0.45rem;
  }

  .lbfl-premium-header__search-row input,
  .lbfl-premium-header__search-row button {
    min-height: 44px;
    border-radius: 0.7rem;
  }

  .lbfl-premium-header__search-row input {
    min-width: 0;
    padding-inline: 0.75rem;
    border: 1px solid #b8ccc8;
  }

  .lbfl-premium-header__search-row button {
    padding-inline: 0.9rem;
    color: #ffffff;
    background: #0d665d;
    border: 0;
    font-weight: 800;
  }

  .lbfl-premium-header__menu {
    display: none;
  }

  .lbfl-premium-header__menu-icon {
    width: 1rem;
    display: grid;
    gap: 0.2rem;
  }

  .lbfl-premium-header__menu-icon span {
    height: 2px;
    display: block;
    background: currentColor;
    border-radius: 999px;
  }

  .lbfl-premium-header__menu-panel {
    display: grid;
    gap: 0.25rem;
  }

  .lbfl-premium-header__menu-panel a {
    min-height: 44px;
    display: flex;
    align-items: center;
    padding: 0.65rem 0.75rem;
    color: #143b3a;
    border-radius: 0.65rem;
    text-decoration: none;
    font-weight: 750;
  }

  .lbfl-premium-header__menu-panel a:hover,
  .lbfl-premium-header__menu-panel a:focus-visible {
    background: #eaf4f2;
  }

  .lbfl-premium-hero {
    min-height: min(48rem, calc(100svh - 74px));
    padding-block: clamp(3.25rem, 8vw, 6.5rem);
    position: relative;
  }

  .lbfl-premium-hero::before {
    content: "";
    position: absolute;
    inset: 8% -12% auto 42%;
    height: 28rem;
    pointer-events: none;
    background: radial-gradient(circle, rgba(0, 168, 150, 0.16), transparent 68%);
  }

  .lbfl-premium-hero__copy {
    position: relative;
    z-index: 2;
  }

  .lbfl-premium-hero h1 span {
    color: #0d665d;
  }

  .lbfl-premium-hero__brand-line {
    margin: 1rem 0 0;
    color: #08736b;
    font-size: clamp(1rem, 2vw, 1.2rem);
    font-weight: 850;
  }

  .lbfl-premium-hero__signals {
    display: flex;
    flex-wrap: wrap;
    gap: 0.55rem;
    margin: 1.4rem 0 0;
    padding: 0;
    list-style: none;
  }

  .lbfl-premium-hero__signals li {
    min-height: 34px;
    display: inline-flex;
    align-items: center;
    padding: 0.42rem 0.7rem;
    color: #0d665d;
    background: rgba(13, 102, 93, 0.08);
    border: 1px solid rgba(13, 102, 93, 0.18);
    border-radius: 999px;
    font-size: 0.8rem;
    font-weight: 800;
  }

  .lbfl-premium-hero__diagnostic-note {
    max-width: 48rem;
    margin: 0.75rem 0 0;
    color: #667d7a;
    font-size: 0.78rem;
    line-height: 1.5;
  }

  .lbfl-premium-cell {
    position: relative;
    z-index: 1;
    margin: 0;
  }

  .lbfl-premium-cell__canvas {
    position: relative;
    width: min(100%, 31rem);
    aspect-ratio: 1 / 1;
    margin-inline: auto;
    border-radius: 50%;
    background:
      radial-gradient(circle at 42% 42%, rgba(255, 255, 255, 0.95), rgba(214, 242, 237, 0.88) 45%, rgba(0, 168, 150, 0.18) 72%, rgba(7, 21, 37, 0.08) 100%);
    border: 1px solid rgba(13, 102, 93, 0.22);
    box-shadow: inset 0 0 4rem rgba(13, 102, 93, 0.12), 0 2rem 4rem rgba(7, 21, 37, 0.15);
    overflow: hidden;
  }

  .lbfl-premium-cell__membrane {
    position: absolute;
    inset: 5%;
    border: 2px solid rgba(13, 102, 93, 0.34);
    border-radius: 48% 52% 46% 54%;
  }

  .lbfl-premium-cell__nucleus {
    position: absolute;
    width: 31%;
    height: 31%;
    left: 34%;
    top: 31%;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #c8f4ee, #2da798 72%);
    border: 2px solid rgba(7, 81, 75, 0.55);
    box-shadow: 0 0 0 0.5rem rgba(45, 167, 152, 0.1);
  }

  .lbfl-premium-cell__nucleolus {
    position: absolute;
    width: 9%;
    height: 9%;
    left: 45%;
    top: 42%;
    border-radius: 50%;
    background: #07544f;
  }

  .lbfl-premium-cell__er {
    position: absolute;
    width: 32%;
    height: 17%;
    border: 3px double rgba(8, 115, 107, 0.68);
    border-radius: 50%;
    transform: rotate(-16deg);
  }

  .lbfl-premium-cell__er--rough {
    left: 16%;
    top: 23%;
    box-shadow: 0 8px 0 -5px #07544f, 12px -4px 0 -6px #07544f;
  }

  .lbfl-premium-cell__er--smooth {
    right: 14%;
    bottom: 24%;
    transform: rotate(22deg);
  }

  .lbfl-premium-cell__golgi {
    position: absolute;
    width: 21%;
    height: 14%;
    right: 17%;
    top: 23%;
    border-top: 4px solid #42c7e8;
    border-bottom: 4px solid #42c7e8;
    border-radius: 50%;
    box-shadow: 0 7px 0 -3px #42c7e8, 0 14px 0 -6px #42c7e8;
    transform: rotate(-12deg);
  }

  .lbfl-premium-cell__mitochondrion {
    position: absolute;
    width: 18%;
    height: 10%;
    border-radius: 50%;
    background: repeating-linear-gradient(90deg, #f4b942 0 4px, #ffe2a1 4px 8px);
    border: 2px solid #b37b0d;
  }

  .lbfl-premium-cell__mitochondrion--one {
    left: 18%;
    bottom: 25%;
    transform: rotate(24deg);
  }

  .lbfl-premium-cell__mitochondrion--two {
    right: 16%;
    top: 48%;
    transform: rotate(-28deg);
  }

  .lbfl-premium-cell__chip {
    position: absolute;
    min-height: 32px;
    display: inline-flex;
    align-items: center;
    padding: 0.35rem 0.65rem;
    color: #ffffff;
    background: rgba(7, 21, 37, 0.88);
    border: 1px solid rgba(255, 255, 255, 0.18);
    border-radius: 999px;
    font-size: 0.74rem;
    font-weight: 850;
  }

  .lbfl-premium-cell__chip--learn { left: 5%; top: 8%; }
  .lbfl-premium-cell__chip--practise { right: 2%; top: 8%; }
  .lbfl-premium-cell__chip--master { right: 8%; bottom: 8%; }

  .lbfl-premium-cell figcaption {
    max-width: 34rem;
    margin: 0.85rem auto 0;
    color: #617a77;
    font-size: 0.78rem;
    line-height: 1.5;
    text-align: center;
  }

  .lbfl-home-v2-active .lbfl-home-v2 a.lbfl-home-v2__button--primary:link,
  .lbfl-home-v2-active .lbfl-home-v2 a.lbfl-home-v2__button--primary:visited,
  .lbfl-home-v2-active .lbfl-home-v2 a.lbfl-home-v2__button--primary:hover,
  .lbfl-home-v2-active .lbfl-home-v2 a.lbfl-home-v2__button--primary:focus-visible,
  .lbfl-home-v2-active .lbfl-home-v2 a.lbfl-home-v2__button--primary:active {
    color: #ffffff !important;
    -webkit-text-fill-color: #ffffff;
  }

  @media (max-width: 859px) {
    .lbfl-premium-header__desktop-nav {
      display: none;
    }

    .lbfl-premium-header__menu {
      display: block;
    }

    .lbfl-premium-header__control-label {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
  }

  @media (max-width: 520px) {
    .lbfl-premium-header__inner {
      width: min(100% - 0.75rem, 1280px);
      gap: 0.35rem;
    }

    .lbfl-premium-header__brand-copy small {
      display: none;
    }

    .lbfl-premium-header .lbfl-language-switcher__link {
      padding-inline: 0.35rem;
      font-size: 0.78rem;
    }

    .lbfl-premium-header__search > summary,
    .lbfl-premium-header__menu > summary {
      padding-inline: 0.55rem;
    }

    .lbfl-premium-hero {
      min-height: auto;
      padding-top: 3rem;
    }

    .lbfl-premium-hero__signals {
      gap: 0.4rem;
    }

    .lbfl-premium-cell__canvas {
      width: min(100%, 24rem);
    }
  }

  @media (prefers-reduced-motion: reduce) {
    .lbfl-premium-header,
    .lbfl-premium-cell__canvas,
    .lbfl-home-v2 a {
      scroll-behavior: auto !important;
      transition: none !important;
      animation: none !important;
    }
  }
</style>
