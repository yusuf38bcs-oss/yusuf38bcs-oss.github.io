<noscript><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Open+Sans:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet"></noscript>

<style>
  #gdpr-banner {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: 999999;
    display: none;
    align-items: center;
    justify-content: center;
    flex-wrap: wrap;
    gap: 0.85rem 1rem;
    padding: 1rem;
    background: rgba(15, 23, 42, 0.94);
    border-top: 1px solid rgba(0, 212, 178, 0.35);
    box-shadow: 0 -10px 30px rgba(0, 0, 0, 0.45);
    color: #e2e8f0;
    font-family: Inter, sans-serif;
    font-size: 0.875rem;
  }

  #gdpr-banner.is-visible { display: flex; }

  #gdpr-banner .gdpr-text {
    flex: 1 1 320px;
    max-width: 760px;
    line-height: 1.55;
    text-align: center;
  }

  #gdpr-banner .gdpr-buttons {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 0.55rem;
  }

  #gdpr-banner button {
    min-height: 44px;
    padding: 0.55rem 1rem;
    border-radius: 0.5rem;
    cursor: pointer;
    font-weight: 700;
  }

  .gdpr-accept {
    background: #00d4b2;
    color: #020617;
    border: 1px solid #00d4b2;
  }

  .gdpr-decline {
    background: transparent;
    color: #cbd5e1;
    border: 1px solid #334155;
  }

  @media (max-width: 560px) {
    #gdpr-banner { align-items: stretch; }
    #gdpr-banner .gdpr-text { text-align: left; }
    #gdpr-banner .gdpr-buttons { width: 100%; }
    #gdpr-banner button { flex: 1 1 130px; }
  }
</style>

<script>
  (function() {
    "use strict";

    var CONSENT_KEY = "cookie-consent";
    var ADSENSE_SRC = "https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9144658795059352";

    function onReady(callback) {
      if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", callback, { once: true });
      } else {
        callback();
      }
    }

    function getConsent() {
      try {
        return window.localStorage ? localStorage.getItem(CONSENT_KEY) : null;
      } catch (error) {
        return null;
      }
    }

    function setConsent(value) {
      try {
        if (window.localStorage) localStorage.setItem(CONSENT_KEY, value);
      } catch (error) {
        // Consent UI must remain functional even when storage is blocked.
      }
    }

    function pushConsentState(state) {
      window.dataLayer = window.dataLayer || [];
      window.dataLayer.push({ event: "lbfl_consent_update", consent_state: state });

      if (typeof window.gtag === "function") {
        if (state === "granted") {
          window.gtag("consent", "update", {
            analytics_storage: "granted",
            ad_storage: "granted",
            ad_user_data: "granted",
            ad_personalization: "granted"
          });
        } else {
          window.gtag("consent", "update", {
            analytics_storage: "denied",
            ad_storage: "denied",
            ad_user_data: "denied",
            ad_personalization: "denied"
          });
        }
      }
    }

    function getBanner() {
      return document.getElementById("gdpr-banner");
    }

    function showBanner() {
      var banner = getBanner();
      if (banner) banner.classList.add("is-visible");
    }

    function hideBanner() {
      var banner = getBanner();
      if (banner) banner.classList.remove("is-visible");
    }

    function loadAdSense() {
      if (document.querySelector('script[data-cookie-managed="adsense"], script[src*="pagead2.googlesyndication.com/pagead/js/adsbygoogle.js"]')) return;

      var script = document.createElement("script");
      script.async = true;
      script.src = ADSENSE_SRC;
      script.crossOrigin = "anonymous";
      script.dataset.cookieManaged = "adsense";
      document.head.appendChild(script);
    }

    function acceptCookies() {
      setConsent("granted");
      pushConsentState("granted");
      hideBanner();
      loadAdSense();
    }

    function declineCookies() {
      setConsent("denied");
      pushConsentState("denied");
      hideBanner();
    }

    window.gdprAccept = acceptCookies;
    window.gdprDecline = declineCookies;

    onReady(function() {
      var banner = getBanner();
      if (!banner) return;

      var consent = getConsent();
      if (consent === "granted") {
        pushConsentState("granted");
        loadAdSense();
        return;
      }

      if (consent === "denied") {
        pushConsentState("denied");
        return;
      }

      window.setTimeout(showBanner, 600);
    });
  })();
</script>
