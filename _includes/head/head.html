<link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}?v={{ site.time | date: '%Y%m%d' }}">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Open+Sans:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<noscript><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Open+Sans:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet"></noscript>

<style>
  #gdpr-banner {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    z-index: 999999;
    background: rgba(15, 23, 42, 0.95);
    backdrop-filter: blur(10px);
    border-top: 1px solid rgba(0, 245, 212, 0.2);
    padding: 1.5rem;
    font-family: 'Inter', sans-serif;
    font-size: 0.875rem;
    color: #e2e8f0;
    display: none;
    text-align: center;
    box-shadow: 0 -10px 30px rgba(0,0,0,0.5);
  }
  #gdpr-banner.is-visible { 
    display: flex; 
    flex-wrap: wrap;
    justify-content: center;
    align-items: center;
    gap: 1rem;
  }
  .gdpr-btn-group { display: flex; gap: 0.75rem; }
  #gdpr-banner button {
    padding: 0.5rem 1.25rem;
    border: none;
    border-radius: 0.375rem;
    cursor: pointer;
    font-weight: 600;
    transition: all 0.2s ease;
  }
  .gdpr-accept { 
    background: #00f5d4; 
    color: #020617; 
  }
  .gdpr-accept:hover { background: #00d4b2; }
  .gdpr-decline { 
    background: transparent; 
    color: #94a3b8; 
    border: 1px solid #334155 !important; 
  }
  .gdpr-decline:hover { color: #e2e8f0; border-color: #64748b !important; }
</style>

<script>
  document.addEventListener('DOMContentLoaded', function() {
    var banner = document.getElementById('gdpr-banner');
    var cookieTrigger = document.getElementById('cookie-consent-trigger');
    var adsenseClient = 'ca-pub-9144658795059352';

    // Issue: localStorage can throw in private/restricted browsers; wrap reads/writes so consent UI never breaks page JS.
    function getConsent() {
      try {
        return window.localStorage.getItem('cookie-consent');
      } catch (error) {
        return null;
      }
    }

    function setConsent(value) {
      try {
        window.localStorage.setItem('cookie-consent', value);
      } catch (error) {
        // If persistence is blocked, the current session still honors the button action.
      }
    }

    function showBanner() {
      if (!banner) return;
      banner.classList.add('is-visible');
      banner.removeAttribute('aria-hidden');
    }

    function hideBanner() {
      if (!banner) return;
      banner.classList.remove('is-visible');
      banner.setAttribute('aria-hidden', 'true');
    }

    function loadAdSense() {
      // Issue: repeated consent actions previously could append duplicate AdSense scripts.
      if (document.querySelector('script[data-cookie-managed="adsense"]')) return;

      var s = document.createElement('script');
      s.async = true;
      s.src = 'https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=' + adsenseClient;
      s.crossOrigin = 'anonymous';
      s.dataset.cookieManaged = 'adsense';
      document.head.appendChild(s);
    }

    window.gdprAccept = function() {
      setConsent('granted');
      hideBanner();
      loadAdSense();
    };

    window.gdprDecline = function() {
      setConsent('denied');
      hideBanner();
    };

    if (banner) {
      banner.addEventListener('click', function(event) {
        var actionButton = event.target.closest('[data-cookie-action]');
        if (!actionButton) return;

        if (actionButton.dataset.cookieAction === 'accept') {
          window.gdprAccept();
        } else if (actionButton.dataset.cookieAction === 'decline') {
          window.gdprDecline();
        }
      });
    }

    if (cookieTrigger) {
      cookieTrigger.addEventListener('click', function(event) {
        event.preventDefault();
        showBanner();
      });
    }

    var consent = getConsent();
    if (!consent) {
      showBanner();
    } else if (consent === 'granted') {
      loadAdSense();
    } else {
      hideBanner();
    }
  });
</script>
