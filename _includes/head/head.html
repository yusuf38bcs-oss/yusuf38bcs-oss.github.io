<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#020617">

{% seo %}

<link rel="icon" type="image/x-icon" href="{{ '/assets/images/favicon.ico' | relative_url }}">
<link rel="apple-touch-icon" href="{{ '/assets/images/apple-touch-icon.png' | relative_url }}">

<link rel="preload" href="{{ '/assets/css/main.css' | relative_url }}?v={{ site.time | date: '%Y%m%d' }}" as="style">
<link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}?v={{ site.time | date: '%Y%m%d' }}">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Open+Sans:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<noscript><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Open+Sans:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet"></noscript>

<style>
  #gdpr-banner {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    z-index: 999999;
    background: rgba(15, 23, 42, 0.95);
    backdrop-filter: blur(10px);
    border-top: 1px solid rgba(0, 245, 212, 0.2);
    padding: 1.5rem;
    font-family: 'Inter', sans-serif;
    font-size: 0.875rem;
    color: #e2e8f0;
    display: none;
    text-align: center;
    box-shadow: 0 -10px 30px rgba(0,0,0,0.5);
  }
  #gdpr-banner.is-visible { 
    display: flex; 
    flex-wrap: wrap;
    justify-content: center;
    align-items: center;
    gap: 1rem;
  }
  .gdpr-btn-group { display: flex; gap: 0.75rem; }
  #gdpr-banner button {
    padding: 0.5rem 1.25rem;
    border: none;
    border-radius: 0.375rem;
    cursor: pointer;
    font-weight: 600;
    transition: all 0.2s ease;
  }
  .gdpr-accept { 
    background: #00f5d4; 
    color: #020617; 
  }
  .gdpr-accept:hover { background: #00d4b2; }
  .gdpr-decline { 
    background: transparent; 
    color: #94a3b8; 
    border: 1px solid #334155 !important; 
  }
  .gdpr-decline:hover { color: #e2e8f0; border-color: #64748b !important; }
</style>

<script>
  document.addEventListener('DOMContentLoaded', function() {
    var consent = localStorage.getItem('cookie-consent');
    var banner = document.getElementById('gdpr-banner');
    var trigger = document.getElementById('cookie-consent-trigger');
    
    // Show banner if no consent history is found
    if (!consent && banner) {
      banner.classList.add('is-visible');
    } else if (consent === 'granted') {
      loadAdSense();
    }

    // Allow users to reopen the banner from the footer link
    if (trigger) {
      trigger.addEventListener('click', function(e) {
        e.preventDefault();
        if (banner) banner.classList.add('is-visible');
      });
    }

    window.gdprAccept = function() {
      localStorage.setItem('cookie-consent', 'granted');
      if (banner) banner.classList.remove('is-visible');
      loadAdSense();
    };
    
    window.gdprDecline = function() {
      localStorage.setItem('cookie-consent', 'denied');
      if (banner) banner.classList.remove('is-visible');
    };

    function loadAdSense() {
      // Prevent duplicate loading if they click accept multiple times
      if (document.getElementById('adsense-script')) return;
      
      var s = document.createElement('script');
      s.id = 'adsense-script';
      s.async = true;
      s.src = 'https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9144658795059352';
      s.crossOrigin = 'anonymous';
      document.head.appendChild(s);
    }
  });
</script>
