<style>
  #gdpr-banner {
    position: fixed !important;
    left: 50% !important;
    right: auto !important;
    bottom: calc(0.7rem + env(safe-area-inset-bottom)) !important;
    z-index: 999999 !important;
    width: min(94vw, 760px) !important;
    transform: translateX(-50%) !important;
    display: none !important;
    grid-template-columns: minmax(0, 1fr) auto !important;
    align-items: center !important;
    justify-content: stretch !important;
    gap: 0.72rem !important;
    padding: 0.72rem 0.85rem !important;
    background: rgba(2, 6, 23, 0.94) !important;
    border: 1px solid rgba(0, 212, 178, 0.28) !important;
    border-radius: 18px !important;
    box-shadow: 0 18px 46px rgba(0, 0, 0, 0.5), 0 0 22px rgba(0, 212, 178, 0.12) !important;
    backdrop-filter: blur(16px) saturate(1.15) !important;
    -webkit-backdrop-filter: blur(16px) saturate(1.15) !important;
    color: #e2e8f0 !important;
    font-family: Inter, sans-serif !important;
    font-size: 0.86rem !important;
  }

  #gdpr-banner.is-visible { display: grid !important; }

  #gdpr-banner .gdpr-text {
    flex: initial !important;
    max-width: none !important;
    margin: 0 !important;
    line-height: 1.42 !important;
    text-align: left !important;
    font-size: clamp(0.76rem, 2.7vw, 0.9rem) !important;
  }

  #gdpr-banner .gdpr-buttons {
    width: auto !important;
    display: flex !important;
    flex-wrap: nowrap !important;
    justify-content: flex-end !important;
    gap: 0.45rem !important;
  }

  #gdpr-banner button {
    flex: 0 0 auto !important;
    min-width: 78px !important;
    min-height: 40px !important;
    padding: 0.46rem 0.72rem !important;
    border-radius: 11px !important;
    cursor: pointer !important;
    font-weight: 900 !important;
    font-size: 0.86rem !important;
    line-height: 1 !important;
  }

  .gdpr-accept {
    background: #00d4b2 !important;
    color: #020617 !important;
    border: 1px solid #00d4b2 !important;
    box-shadow: 0 0 18px rgba(0, 212, 178, 0.24) !important;
  }

  .gdpr-decline {
    background: #1d4ed8 !important;
    color: #f8fafc !important;
    border: 1px solid rgba(96, 165, 250, 0.65) !important;
  }

  @media (max-width: 560px) {
    #gdpr-banner {
      width: min(94vw, 430px) !important;
      grid-template-columns: 1fr !important;
      gap: 0.5rem !important;
      padding: 0.6rem 0.68rem !important;
      border-radius: 16px !important;
    }

    #gdpr-banner .gdpr-text {
      font-size: 0.76rem !important;
      line-height: 1.34 !important;
    }

    #gdpr-banner .gdpr-buttons {
      width: 100% !important;
      display: grid !important;
      grid-template-columns: 1fr 1fr !important;
      gap: 0.5rem !important;
    }

    #gdpr-banner button {
      width: 100% !important;
      min-width: 0 !important;
      min-height: 38px !important;
      padding: 0.42rem 0.55rem !important;
      font-size: 0.84rem !important;
    }
  }
</style>

<script>
  (function() {
    "use strict";

    var CONSENT_KEY = "cookie-consent";
    var ADSENSE_SRC = "https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9144658795059352";

    function onReady(callback) {
      if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", callback, { once: true });
      } else {
        callback();
      }
    }

    function getConsent() {
      try {
        return window.localStorage ? localStorage.getItem(CONSENT_KEY) : null;
      } catch (error) {
        return null;
      }
    }

    function setConsent(value) {
      try {
        if (window.localStorage) localStorage.setItem(CONSENT_KEY, value);
      } catch (error) {
        // Consent UI must remain functional even when storage is blocked.
      }
    }

    function pushConsentState(state) {
      window.dataLayer = window.dataLayer || [];
      window.dataLayer.push({ event: "lbfl_consent_update", consent_state: state });

      if (typeof window.gtag === "function") {
        if (state === "granted") {
          window.gtag("consent", "update", {
            analytics_storage: "granted",
            ad_storage: "granted",
            ad_user_data: "granted",
            ad_personalization: "granted"
          });
        } else {
          window.gtag("consent", "update", {
            analytics_storage: "denied",
            ad_storage: "denied",
            ad_user_data: "denied",
            ad_personalization: "denied"
          });
        }
      }
    }

    function getBanner() {
      return document.getElementById("gdpr-banner");
    }

    function showBanner() {
      var banner = getBanner();
      if (banner) banner.classList.add("is-visible");
    }

    function hideBanner() {
      var banner = getBanner();
      if (banner) banner.classList.remove("is-visible");
    }

    function loadAdSense() {
      if (document.querySelector('script[data-cookie-managed="adsense"], script[src*="pagead2.googlesyndication.com/pagead/js/adsbygoogle.js"]')) return;

      var script = document.createElement("script");
      script.async = true;
      script.src = ADSENSE_SRC;
      script.crossOrigin = "anonymous";
      script.dataset.cookieManaged = "adsense";
      document.head.appendChild(script);
    }

    function acceptCookies() {
      setConsent("granted");
      pushConsentState("granted");
      hideBanner();
      loadAdSense();
    }

    function declineCookies() {
      setConsent("denied");
      pushConsentState("denied");
      hideBanner();
    }

    window.gdprAccept = acceptCookies;
    window.gdprDecline = declineCookies;

    onReady(function() {
      var banner = getBanner();
      if (!banner) return;

      var consent = getConsent();
      if (consent === "granted") {
        pushConsentState("granted");
        loadAdSense();
        return;
      }

      if (consent === "denied") {
        pushConsentState("denied");
        return;
      }

      window.setTimeout(showBanner, 600);
    });
  })();
</script>
