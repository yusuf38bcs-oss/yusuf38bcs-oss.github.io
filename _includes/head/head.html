<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#020617">

{% seo %}
{% include head/polyglot-seo-overrides.html %}

<link rel="icon" type="image/x-icon" href="{{ '/assets/images/favicon.ico' | relative_url }}">
<link rel="apple-touch-icon" href="{{ '/assets/images/apple-touch-icon.png' | relative_url }}">

<link rel="preload" href="{{ '/assets/css/main.css' | relative_url }}?v={{ site.time | date: '%Y%m%d' }}" as="style">
<link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}?v={{ site.time | date: '%Y%m%d' }}">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Open+Sans:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<noscript><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Open+Sans:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet"></noscript>

<style>
  #gdpr-banner {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    z-index: 999999;
    background: #0f172a;
    border-top: 1px solid rgba(0, 212, 178, 0.2);
    padding: 1rem;
    font-family: Inter, sans-serif;
    font-size: 0.875rem;
    color: #e2e8f0;
    display: none;
  }
  #gdpr-banner.is-visible { display: block; }
  #gdpr-banner button {
    margin-left: 0.75rem;
    padding: 0.5rem 1rem;
    border: none;
    border-radius: 0.375rem;
    cursor: pointer;
    font-weight: 600;
  }
  .gdpr-accept { background: #00d4b2; color: #020617; }
  .gdpr-decline { background: transparent; color: #94a3b8; border: 1px solid #334155 !important; }
</style>

<script>
  (function() {
    "use strict";

    var CONSENT_KEY = "cookie-consent";
    var ADSENSE_SRC = "https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9144658795059352";

    function onReady(callback) {
      if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", callback, { once: true });
      } else {
        callback();
      }
    }

    function getConsent() {
      try {
        return window.localStorage ? localStorage.getItem(CONSENT_KEY) : null;
      } catch (error) {
        return null;
      }
    }

    function setConsent(value) {
      try {
        if (window.localStorage) localStorage.setItem(CONSENT_KEY, value);
      } catch (error) {
        // Consent UI must remain functional even when storage is blocked.
      }
    }

    function getBanner() {
      return document.getElementById("gdpr-banner");
    }

    function showBanner() {
      var banner = getBanner();
      if (banner) banner.classList.add("is-visible");
    }

    function hideBanner() {
      var banner = getBanner();
      if (banner) banner.classList.remove("is-visible");
    }

    function loadAdSense() {
      if (document.querySelector('script[data-cookie-managed="adsense"]')) return;

      var script = document.createElement("script");
      script.async = true;
      script.src = ADSENSE_SRC;
      script.crossOrigin = "anonymous";
      script.dataset.cookieManaged = "adsense";
      document.head.appendChild(script);
    }

    function acceptCookies() {
      setConsent("granted");
      hideBanner();
      loadAdSense();
    }

    function declineCookies() {
      setConsent("denied");
      hideBanner();
    }

    window.gdprAccept = acceptCookies;
    window.gdprDecline = declineCookies;

    onReady(function() {
      var consent = getConsent();
      var banner = getBanner();

      if (banner) {
        banner.addEventListener("click", function(event) {
          var button = event.target.closest("[data-gdpr-consent]");
          if (!button) return;

          if (button.dataset.gdprConsent === "granted") {
            acceptCookies();
          } else {
            declineCookies();
          }
        });
      }

      if (!consent) {
        showBanner();
      } else if (consent === "granted") {
        loadAdSense();
      }
    });
  })();
</script>
