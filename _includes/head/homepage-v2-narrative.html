<style>

    border-left: 2px solid var(--lbfl-narrative-teal);
    transform: rotate(28deg);
  }

  [data-pathway-motif="branch"] .lbfl-home-v2__pathway-motif::before,
  [data-pathway-motif="branch"] .lbfl-home-v2__pathway-motif::after {
    content: "";

    left: -0.1rem;

    top: 2.7rem;
    transform: rotate(-35deg);
  }

  [data-pathway-motif="branch"] .lbfl-home-v2__pathway-motif::after {
    top: 5.4rem;
    transform: rotate(32deg);
  }

  }

  }

    border-radius: 999px;
  }

  .lbfl-reflection-lab,
  .lbfl-reflection-lab * {
    box-sizing: border-box;
  }

  .lbfl-reflection-lab {

    background:

    margin-inline: auto;
    padding-block: clamp(3.6rem, 7vw, 5.8rem);

    max-width: 50rem;
  }

    letter-spacing: 0.11em;
    text-transform: uppercase;
  }

  .lbfl-reflection-lab h2,
  .lbfl-reflection-lab h3 {
    margin: 0;
    color: #ffffff;
    text-wrap: balance;

  .lbfl-reflection-lab h2 {

    line-height: 1.7;
  }

    display: grid;
    gap: 1.2rem;
    margin-top: 2rem;
  }

  .lbfl-reflection-card {

    padding: clamp(1.3rem, 3vw, 2rem);

  .lbfl-reflection-card--lens {
    border-color: rgba(213, 168, 83, 0.28);
  }

  .lbfl-reflection-card h3 {
    font-size: clamp(1.35rem, 2.4vw, 1.8rem);
  }

    color: #c7dcda;
    line-height: 1.65;
  }

  .lbfl-reflection-card__question {
    margin: 1rem 0 0;
    font-weight: 700;
  }

    display: grid;
    gap: 0.9rem;
    margin-top: 1.3rem;
  }

  .lbfl-reasoning-form > div {
    display: grid;
    gap: 0.42rem;

  .lbfl-reasoning-form label {
    color: #eaf5f3;
    font-size: 0.84rem;
    font-weight: 800;
  }

    min-height: 44px;
    padding: 0.8rem 0.9rem;
    color: #f8fafc;
    background: rgba(2, 9, 16, 0.75);
    border: 1px solid rgba(66, 199, 232, 0.24);
    border-radius: 0.85rem;
    font: inherit;
  }

  .lbfl-reasoning-form textarea {
    resize: vertical;
  }

  .lbfl-reasoning-form button {
    min-height: 46px;
    justify-self: start;
    padding: 0.75rem 1.1rem;
    color: #04111d;
    background: #73d7e9;
    border: 0;
    border-radius: 999px;
    font-weight: 900;
    cursor: pointer;
  }

  .lbfl-reasoning-feedback {
    margin-top: 1rem;
    padding: 1rem;
    color: #dffaf5;
    background: rgba(12, 117, 107, 0.18);
    border: 1px solid rgba(143, 228, 217, 0.24);
    border-radius: 1rem;
  }

  .lbfl-reasoning-feedback p {
    margin: 0.45rem 0 0;
    line-height: 1.6;
  }

    margin: 1.2rem 0 0;
    padding: 0;
    border: 0;
  }

    margin: 0;
    color: #fff8e7;

    margin-top: 0.8rem;

    font-size: 0.82rem;
    font-style: normal;
    font-weight: 750;
  }

    margin-top: 1.1rem;

    border-top: 1px solid rgba(213, 168, 83, 0.18);
    font-size: 0.82rem;

    padding-top: 1.5rem;

    margin: 0 0 0.8rem;
    color: #e6c985;
    font-size: 0.74rem;
    font-weight: 900;
    letter-spacing: 0.11em;
    text-transform: uppercase;
  }

    display: flex;
    flex-wrap: wrap;
    gap: 0.65rem;
    margin: 0;
    padding: 0;
    list-style: none;

    min-height: 44px;
    display: inline-flex;
    align-items: center;
    gap: 0.42rem;
    padding: 0.65rem 0.85rem;
    color: #eaf5f3;
    border: 1px solid rgba(148, 163, 184, 0.22);
    border-radius: 999px;
    text-decoration: none;
    font-weight: 750;
  }

  .lbfl-reflection-lab__continue a:focus-visible span {
    transform: translateX(4px);
  }

  .lbfl-reflection-lab a:focus-visible,
  .lbfl-reflection-lab button:focus-visible,
  .lbfl-reflection-lab input:focus-visible,
  .lbfl-reflection-lab textarea:focus-visible {
    outline: 3px solid #ffb347;
    outline-offset: 3px;
  }

    .lbfl-home-v2__repair-loop,

    }

    .lbfl-reflection-lab__grid {
      grid-template-columns: minmax(0, 1.08fr) minmax(0, 0.92fr);
    }
  }

      grid-template-columns: minmax(17rem, 0.38fr) minmax(0, 0.62fr);
    }

      top: calc(var(--lbfl-header-height, 74px) + 1.5rem);

    .lbfl-home-v2__bridge {
      grid-template-columns: minmax(0, 0.9fr) minmax(0, 1.1fr);
    }

    .lbfl-home-v2__editorial {
      grid-template-columns: minmax(0, 1.15fr) minmax(18rem, 0.85fr);

      grid-template-columns: repeat(4, minmax(0, 1fr));

      grid-template-columns: repeat(4, minmax(0, 1fr));
    }
  }

    }
  }

    }

      grid-template-columns: minmax(0, 1fr) !important;
      grid-template-rows: auto auto auto auto !important;

      display: grid;
    }

    .lbfl-reflection-lab__continue a {
      width: 100%;
      justify-content: space-between;
