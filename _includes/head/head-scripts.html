{% if site.cookie_policy.enabled %}
<script src="https://www.termsfeed.com/public/cookie-consent/4.2.0/cookie-consent.js" charset="UTF-8"></script>
<script>
  document.addEventListener("DOMContentLoaded", function () {
    cookieconsent.run({
      notice_banner_type: "simple",
      consent_type: "express",
      palette: "dark",
      language: "{{ site.lang | default: 'en' }}",
      page_load_consent_levels: ["strictly-necessary"],
      notice_banner_reject_button_hide: false,
      preferences_center_close_button_hide: false,
      page_refresh_confirmation_buttons: false,
      website_name: {{ site.title | jsonify }},
      website_privacy_policy_url: "{{ '/privacy-policy/' | absolute_url }}"
    });
  });
</script>
{% endif %}

{% if site.analytics.provider == "google-gtag" and site.analytics.google.tracking_id %}
<script type="text/plain" data-cookie-consent="targeting" async src="https://www.googletagmanager.com/gtag/js?id={{ site.analytics.google.tracking_id }}"></script>
<script type="text/plain" data-cookie-consent="targeting">
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag("js", new Date());
  gtag("config", "{{ site.analytics.google.tracking_id }}", {
    anonymize_ip: {{ site.analytics.google.anonymize_ip | default: true | jsonify }}
  });
</script>
{% endif %}
