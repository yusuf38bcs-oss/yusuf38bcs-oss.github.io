     Artwork stays z-index 1.

      isolation: isolate;

      z-index: 1;

      height: 100%;

      min-width: 0;
      min-height: 0 !important;

      margin: 0;
    }

    .lbfl-home-v2-active
    .lbfl-premium-cell__canvas {

      width: 100%;
      height: 100%;

      inset: 0;

      width: 100%;
      height: 100%;

    .lbfl-premium-cell__image {
      position: absolute;

      inset: 0;

      width: 100%;
      height: 100%;

      object-fit:
        cover;

      object-position:
        78% center;

      opacity:
        0.86;

      filter:
        saturate(0.91)
        contrast(1.04);

      transform:
        scale(1.015);

      transform-origin:
        center;
    }

    /*
     * Full-width artwork vignette.
     *
     * There is intentionally no hard vertical stop:
     * the darkness reduces continuously from left to right.
     */
    .lbfl-home-v2-active
    .lbfl-premium-cell__canvas::after {
      background:
        linear-gradient(
          90deg,
