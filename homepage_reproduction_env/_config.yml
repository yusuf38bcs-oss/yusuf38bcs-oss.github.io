# =========================================================
# LEARNING BIOLOGY FOR LIFE
# Neural Educational Ecosystem
# =========================================================
# Refinement Check: This remains the core concept source.

title: "Learning Biology For Life"

description: >
  An educational neural network that harmonizes
  the foundational laws of biology
  with cognitive behavior
  through the contemplative mirror of Tafakkur.

url: "https://learningbiologyforlife.org"
baseurl: ""
locale: en-US
timezone: Asia/Dhaka
repository: yusuf38bcs-oss/yusuf38bcs-oss.github.io

# =========================================================
# THEME SYSTEM
# =========================================================
# Refinement Check: Active Remote Theme Minimal Mistakes.

remote_theme: "mmistakes/minimal-mistakes"
minimal_mistakes_skin: "dark"

logo: "/assets/images/branding/logo-main.png"

search: true
breadcrumbs: true
words_per_minute: 180
future: false
read_more: "enabled"

# =========================================================
# ECOSYSTEM COLLECTIONS (Active Registration - MANDATORY)
# =========================================================
# These collections (_biology, _life-practices, _socratic) must be
# registered here so they are accessible on the homepage and render
# unique permalinks based on taxonomies (Steps 10-12).

collections:
  biology:
    output: true
    permalink: /biology/:path/
  life-practices:
    output: true
    permalink: /life-practices/:path/
  socratic:
    output: true
    permalink: /socratic/:path/

# =========================================================
# DEFAULTS (Refined & Cleaned - Remove Duplicates)
# =========================================================
# Rules applied here allow you to REMOVE 'layout: single', 'toc: true',
# 'toc_sticky: true', and 'classes: wide' from your individual .md content files.

defaults:

  # 1. Scope Standard Blog Posts
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: false
      read_time: true
      share: true
      toc: true
      toc_sticky: true
      classes: wide

  # 2. Scope Static Pages (e.g., _pages directory)
  - scope:
      path: "_pages"
    values:
      layout: single
      author_profile: false
      classes: wide

  # 3. Scope Biology Academic Pillar (STEP 10 Rules)
  # Automatically enforce single layout, wide width, and sticky TOC.
  - scope:
      path: ""
      type: biology
    values:
      layout: single
      classes: wide
      author_profile: true # BCS Education alignment requirement
      toc: true
      toc_sticky: true

  # 4. Scope Life Practices Pillar (STEP 11 Rules)
  - scope:
      path: ""
      type: life-practices
    values:
      layout: single
      classes: wide
      toc: true
      toc_sticky: true

  # 5. Scope Socratic 4.0 Ecosystem (STEP 12 Rules)
  - scope:
      path: ""
      type: socratic
    values:
      layout: single
      classes: wide
      toc: true
      toc_sticky: true

# =========================================================
# AUTHOR (Identity Verification)
# =========================================================

author:
  name: "MD. YUSUF"

  avatar: "/assets/images/branding/logo-main.png"

  bio: >
    BCS Education Cadre Officer,
    multidisciplinary learner,
    systems thinker,
    reflective educator,
    and builder of neural educational ecosystems.

# =========================================================
# PLUGINS & ARCHITECTURE (Active Extensions)
# =========================================================

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-include-cache
  - jekyll-paginate
  - jekyll-remote-theme

# =========================================================
# THE REST (Clean & Functional)
# =========================================================

# Analytics + Telemetry (Google gtag)
analytics:
  provider: "google-gtag"
  google:
    tracking_id: "G-2SCLLF93NS"
    anonymize_ip: true

# Google Tag Manager
gtm: "GT-PBNRG22C"

# Google Site Verification
google_site_verification: "AW-18047859733"

# Markdown + Rendering (Kramdown/Rouge)
markdown: kramdown
highlighter: rouge
permalink: /:categories/:title/

kramdown:
  input: GFM
  syntax_highlighter: rouge

# Pagination settings
paginate: 6
paginate_path: /page:num/
pagination:
  enabled: true

# Social Identity
social:
  name: "Learning Biology For Life"
  links:
    - "https://github.com/yusuf38bcs-oss"

# SEO + Knowledge Architecture
category_archive:
  type: liquid
  path: /categories/

tag_archive:
  type: liquid
  path: /tags/

# Educational Knowledge Layer
include:
  - _pages
  - knowledge
  - assets

exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - .sass-cache
  - .jekyll-cache
  - README.md

# Performance + Build Stability (Compressed Assets)
sass:
  style: compressed

compress_html:
  clippings: all
  ignore:
    envs: development