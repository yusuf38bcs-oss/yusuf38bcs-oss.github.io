name: Learning Guide Contract Certification

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, edited]
    paths:
      - "_data/academic/learning_guide_contract_v1.json"
      - "docs/academic/conv04/LEARNING_METHOD_CENSUS.md"
      - "docs/academic/conv04/LEARNING_GUIDE_CONTRACT.md"
      - "docs/academic/conv04/CONV04_STATE.md"
      - ".github/scripts/validate-learning-guide-contract.rb"
      - ".github/workflows/learning-guide-contract-certification.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: learning-guide-contract-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  certify:
    name: CONV-04C-01 canonical learning-guide contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      CERTIFICATION_MODE: ${{ github.event_name == 'pull_request' && 'pull_request' || 'manual' }}
      PR_BASE_REF: ${{ github.event.pull_request.base.ref || 'main' }}
      PR_BASE_SHA: ${{ github.event.pull_request.base.sha || github.sha }}

    steps:
      - name: Check out immutable candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Authenticate exact head and protected base
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$CANDIDATE_SHA"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            remote="$(git ls-remote origin "refs/heads/$PR_BASE_REF" | awk '{print $1}')"
            test "$remote" = "$PR_BASE_SHA" || {
              echo "BASE CHANGED — RECERTIFICATION REQUIRED"
              exit 1
            }
            git merge-base --is-ancestor "$remote" "$actual" || {
              echo "STALE CANDIDATE — CURRENT BASE IS NOT AN ANCESTOR"
              exit 1
            }
          fi
          printf 'CONV-04C-01 exact head: %s\n' "$actual"

      - name: Set up Ruby
        uses: ruby/setup-ruby@a0102e0972be65f351c307e2d64b9314a57c8073 # v1
        with:
          ruby-version: "3.2"
          bundler-cache: false

      - name: Validate learning-guide contract
        shell: bash
        run: |
          set -euo pipefail
          ruby -c .github/scripts/validate-learning-guide-contract.rb
          ruby .github/scripts/validate-learning-guide-contract.rb
          git diff --check "$PR_BASE_SHA...HEAD"

      - name: Install Jekyll dependencies
        shell: bash
        run: |
          set -euo pipefail
          bundle install --jobs 4 --retry 3

      - name: Production Jekyll build
        shell: bash
        env:
          JEKYLL_ENV: production
        run: |
          set -euo pipefail
          bundle exec jekyll build
