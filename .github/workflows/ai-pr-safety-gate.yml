name: AI PR Safety Gate

on:
  pull_request_target:
    branches: ["staging"]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  guard:
    name: Trusted AI branch path safety
    runs-on: ubuntu-latest

    steps:
      - name: Enforce trusted AI PR safety contract
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys
          import urllib.request
          from pathlib import PurePosixPath

          allowed_prefixes = (
              "_posts/",
              "_pages/",
              "assets/images/",
              "assets/css/lesson/",
              "docs/",
          )

          blocked_prefixes = (
              ".github/",
              "worker/",
              "node_modules/",
              "vendor/",
          )

          blocked_exact = {
              "wrangler.jsonc",
              "wrangler.toml",
              "_config.yml",
              "Gemfile",
              "Gemfile.lock",
              "CNAME",
              ".env",
              ".env.local",
              "package.json",
              "package-lock.json",
              "worker/package.json",
              "worker/package-lock.json",
          }

          max_allowed_files = 5

          def fail(message: str) -> None:
              print(message, file=sys.stderr)
              sys.exit(1)

          event_path = os.environ.get("GITHUB_EVENT_PATH")
          if not event_path or not os.path.exists(event_path):
              fail("Missing GitHub event payload.")

          with open(event_path, "r", encoding="utf-8") as fh:
              event = json.load(fh)

          pr = event.get("pull_request")
          if not pr:
              result = {
                  "check": "trusted_ai_pr_safety_gate",
                  "status": "PASS",
                  "note": "No pull_request payload; workflow_dispatch/manual run only."
              }
              print(json.dumps(result, indent=2, ensure_ascii=False))
              summary_path = os.environ.get("GITHUB_STEP_SUMMARY")
              if summary_path:
                  with open(summary_path, "a", encoding="utf-8") as summary:
                      summary.write("```json\n" + json.dumps(result, indent=2, ensure_ascii=False) + "\n```\n")
              sys.exit(0)

          head_ref = pr.get("head", {}).get("ref", "")
          base_ref = pr.get("base", {}).get("ref", "")
          pr_number = pr.get("number")
          repository = os.environ.get("GITHUB_REPOSITORY", "")
          token = os.environ.get("GH_TOKEN", "")

          result = {
              "check": "trusted_ai_pr_safety_gate",
              "trigger": "pull_request_target",
              "base_ref": base_ref,
              "head_ref": head_ref,
              "pr_number": pr_number,
              "applies_to_ai_branch": head_ref.startswith("ai/"),
              "changed_file_count": 0,
              "changed_files": [],
              "max_allowed_files": max_allowed_files,
              "violations": [],
              "status": "PASS",
              "trusted_guard": True,
              "checkout_pr_code": False,
          }

          if not result["applies_to_ai_branch"]:
              result["note"] = "Non-ai/* branch; trusted safety gate recorded but not enforced."
              print(json.dumps(result, indent=2, ensure_ascii=False))
              summary_path = os.environ.get("GITHUB_STEP_SUMMARY")
              if summary_path:
                  with open(summary_path, "a", encoding="utf-8") as summary:
                      summary.write("```json\n" + json.dumps(result, indent=2, ensure_ascii=False) + "\n```\n")
              sys.exit(0)

          if base_ref != "staging":
              result["violations"].append(f"Unexpected base branch for AI PR: {base_ref}")

          if not pr_number or not repository or not token:
              fail("Missing pull request number, repository, or token.")

          def github_get_json(url: str):
              req = urllib.request.Request(
                  url,
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                      "User-Agent": "lbfl-trusted-ai-pr-safety-gate",
                  },
              )
              with urllib.request.urlopen(req, timeout=30) as response:
                  return json.loads(response.read().decode("utf-8"))

          changed_files = []
          page = 1
          while True:
              api_url = f"https://api.github.com/repos/{repository}/pulls/{pr_number}/files?per_page=100&page={page}"
              batch = github_get_json(api_url)
              if not batch:
                  break
              changed_files.extend(item.get("filename", "") for item in batch if item.get("filename"))
              if len(batch) < 100:
                  break
              page += 1
              if page > 10:
                  result["violations"].append("Too many changed-file pages to validate safely.")
                  break

          result["changed_files"] = changed_files
          result["changed_file_count"] = len(changed_files)

          if len(changed_files) > max_allowed_files:
              result["violations"].append(f"Too many files changed: {len(changed_files)}")

          for file_path in changed_files:
              normalized = str(PurePosixPath(file_path.replace("\\", "/")))

              if normalized.startswith("../") or normalized == ".." or normalized.startswith("/"):
                  result["violations"].append(f"Unsafe path traversal: {normalized}")

              if normalized in blocked_exact:
                  result["violations"].append(f"Blocked exact file: {normalized}")

              if normalized.startswith(blocked_prefixes):
                  result["violations"].append(f"Blocked path prefix: {normalized}")

              if not normalized.startswith(allowed_prefixes):
                  result["violations"].append(f"Path outside allowed AI zones: {normalized}")

          if result["violations"]:
              result["status"] = "FAIL"

          print(json.dumps(result, indent=2, ensure_ascii=False))
          summary_path = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary_path:
              with open(summary_path, "a", encoding="utf-8") as summary:
                  summary.write("```json\n" + json.dumps(result, indent=2, ensure_ascii=False) + "\n```\n")

          if result["status"] != "PASS":
              sys.exit(1)
          PY
