name: Academic Design System Certification

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, edited]
    paths:
      - "_data/academic/design_system_v1.json"
      - "assets/css/academic-design-system.css"
      - "assets/css/production-hotfix.css"
      - "_includes/head/head.html"
      - "_includes/head/custom.html"
      - "_layouts/default.html"
      - "_layouts/homepage-v3.html"
      - "_layouts/single.html"
      - "docs/academic/conv04/ACADEMIC_DESIGN_SYSTEM.md"
      - "docs/academic/conv04/CONV04_STATE.md"
      - ".github/scripts/validate-academic-design-system.rb"
      - ".github/workflows/academic-design-system-certification.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: academic-design-system-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  certify:
    name: CONV-04B core academic design system
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      PR_BASE_REF: ${{ github.event.pull_request.base.ref || 'main' }}
      PR_BASE_SHA: ${{ github.event.pull_request.base.sha || '9f20bfa7398db8c2e5f1dbdd3db61c43eef3e5bf' }}

    steps:
      - name: Check out immutable candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Authenticate exact head and protected base
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$CANDIDATE_SHA"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            remote="$(git ls-remote origin "refs/heads/$PR_BASE_REF" | awk '{print $1}')"
            test "$remote" = "$PR_BASE_SHA" || {
              echo "BASE CHANGED — RECERTIFICATION REQUIRED"
              exit 1
            }
            git merge-base --is-ancestor "$remote" "$actual" || {
              echo "STALE CANDIDATE — CURRENT BASE IS NOT AN ANCESTOR"
              exit 1
            }
          fi
          printf 'CONV-04B exact head: %s\n' "$actual"

      - name: Set up Ruby
        uses: ruby/setup-ruby@a0102e0972be65f351c307e2d64b9314a57c8073 # v1
        with:
          ruby-version: "3.2"
          bundler-cache: false

      - name: Validate design-system contract
        shell: bash
        run: |
          set -euo pipefail
          ruby -c .github/scripts/validate-academic-design-system.rb
          ruby .github/scripts/validate-academic-design-system.rb
          git diff --check "$PR_BASE_SHA...HEAD"

      - name: Install Jekyll dependencies
        shell: bash
        run: |
          set -euo pipefail
          bundle install --jobs 4 --retry 3

      - name: Production Jekyll build
        shell: bash
        env:
          JEKYLL_ENV: production
        run: |
          set -euo pipefail
          bundle exec jekyll clean
          bundle exec jekyll build --trace
