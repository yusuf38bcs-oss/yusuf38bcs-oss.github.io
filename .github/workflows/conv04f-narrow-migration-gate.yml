name: CONV-04F Narrow Migration Gate — Preflight
on:
  push:
    branches: [ci/conv04f-narrow-migration-gate-20261010]
  pull_request:
    paths:
      - scripts/ci/conv04f_narrow_migration_gate.py
      - scripts/ci/conv04f_practical_guard_inventory.py
      - .github/workflows/conv04f-narrow-migration-gate.yml
      - .github/scripts/validate-conv04f-zoology-practical-museum.rb
      - .github/scripts/validate-conv04f-zoology-practical-whole-mounts.rb
      - .github/scripts/validate-conv04f-zoology-practical-field-report.rb
      - .github/scripts/validate-conv04f-zoology-practical-temporary-mounts.rb
      - .github/scripts/validate-conv04f-zoology-practical-permanent-slides.rb
      - .github/scripts/validate-conv04f-zoology-practical-appendages.rb
      - .github/scripts/validate-conv04f-zoology-practical-dissection.rb
  workflow_dispatch:
permissions:
  contents: read
jobs:
  migration-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Positive and negative regression cases
        run: python scripts/ci/conv04f_narrow_migration_gate.py --self-test
      - name: Verify original Practical self-protection remains present
        run: python scripts/ci/conv04f_practical_guard_inventory.py
      - name: Verify independently authorized PR 468 exact candidate and blobs
        run: python scripts/ci/conv04f_narrow_migration_gate.py --verify

