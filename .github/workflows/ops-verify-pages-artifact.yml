name: Verify Pages Build and Optional Cache Purge

on:
  workflow_dispatch:
    inputs:
      target_sha:
        description: "Exact main commit SHA to verify; leave blank to use current main"
        required: false
        type: string
      purge_cache:
        description: "Purge approved Biology URLs after build verification"
        required: true
        default: false
        type: boolean
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/ops-verify-pages-artifact.yml"

permissions:
  contents: read
  actions: read

concurrency:
  group: ops-verify-pages-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-pages-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
      CF_TOKEN_PRIMARY: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_TOKEN_ALT: ${{ secrets.CF_API_TOKEN }}
      CF_TOKEN_ALT2: ${{ secrets.CLOUDFLARE_TOKEN }}
      CF_ZONE_ID_PRIMARY: ${{ secrets.CLOUDFLARE_ZONE_ID }}
      CF_ZONE_ID_ALT: ${{ secrets.CF_ZONE_ID }}
      PURGE_REQUESTED: ${{ inputs.purge_cache || false }}

    steps:
      - name: Resolve target SHA
        id: target
        shell: bash
        env:
          REQUESTED_SHA: ${{ inputs.target_sha || '' }}
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
        run: |
          set -euo pipefail

          requested_sha="${REQUESTED_SHA:-}"

          if [[ -n "$requested_sha" ]]; then
            target_sha="$requested_sha"
          elif [[ "$EVENT_NAME" == "pull_request" ]]; then
            target_sha="$PR_BASE_SHA"
          else
            target_sha="$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq '.sha')"
          fi

          [[ "$target_sha" =~ ^[0-9a-fA-F]{40}$ ]] || {
            echo "Target SHA must be an exact 40-character commit SHA."
            exit 1
          }

          echo "sha=${target_sha,,}" >> "$GITHUB_OUTPUT"
          echo "TARGET_SHA=${target_sha,,}"

      - name: Verify exact GitHub Pages deployment
        id: pages
        shell: bash
        env:
          TARGET_SHA: ${{ steps.target.outputs.sha }}
        run: |
          set -euo pipefail

          runs_json="$(gh api --paginate \
            "repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${TARGET_SHA}&per_page=100")"

          run_json="$(jq -c --arg sha "$TARGET_SHA" '
            .workflow_runs
            | map(select(
                .name == "Deploy to GitHub Pages"
                and (.event == "push" or .event == "workflow_dispatch")
                and .head_branch == "main"
                and .head_sha == $sha
              ))
            | sort_by(.run_number)
            | last // empty
          ' <<<"$runs_json")"

          [[ -n "$run_json" ]] || {
            echo "No successful-candidate Pages run found for exact SHA $TARGET_SHA."
            exit 1
          }

          run_id="$(jq -r '.id' <<<"$run_json")"
          run_status="$(jq -r '.status' <<<"$run_json")"
          run_conclusion="$(jq -r '.conclusion' <<<"$run_json")"
          run_url="$(jq -r '.html_url' <<<"$run_json")"

          [[ "$run_status" == "completed" ]] || {
            echo "Pages run is not completed."
            exit 1
          }

          [[ "$run_conclusion" == "success" ]] || {
            echo "Pages run did not succeed."
            exit 1
          }

          jobs_json="$(gh api --paginate \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/jobs?per_page=100")"

          build_conclusion="$(jq -r '
            [.jobs[] | select(.name == "build")]
            | last.conclusion // "missing"
          ' <<<"$jobs_json")"

          deploy_conclusion="$(jq -r '
            [.jobs[] | select(.name == "deploy")]
            | last.conclusion // "missing"
          ' <<<"$jobs_json")"

          [[ "$build_conclusion" == "success" ]] || {
            echo "GitHub Pages build job was not successful."
            exit 1
          }

          [[ "$deploy_conclusion" == "success" ]] || {
            echo "GitHub Pages deploy job was not successful."
            exit 1
          }

          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "run_url=$run_url" >> "$GITHUB_OUTPUT"
          echo "Exact GitHub Pages deployment verified: $run_url"

      - name: Check out exact deployed commit
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.target.outputs.sha }}
          fetch-depth: 1

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: false

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          bundle config set --local frozen false
          bundle install

      - name: Rebuild exact deployed commit
        shell: bash
        env:
          JEKYLL_ENV: production
          JEKYLL_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          bundle exec jekyll clean
          bundle exec jekyll build --trace

      - name: Verify Biology Matrix in exact rebuilt output
        shell: bash
        run: |
          set -euo pipefail

          biology_html="_site/biology/index.html"
          test -f "$biology_html" || {
            echo "Rebuilt output is missing /biology/index.html."
            exit 1
          }

          python3 - "$biology_html" <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          from urllib.parse import urlsplit
          import re
          import sys

          EXPECTED_METRICS = [94, 4, 3, 35225]
          SYSTEM_ROUTES = {
              "/biology/hsc-corner/botany/structures-functions-cell-organelles-part-1/",
              "/biology/hsc-corner/botany/structures-functions-cell-organelles-part-2/",
              "/biology/hsc-corner/botany/human-body-mysterious-workspace-central-dogma/",
              "/biology/higher-zoology-tree/animal-diversity/protozoa-reproduction-and-parasitism/",
              "/biology/higher-zoology-tree/animal-diversity/protozoa-body-covering-and-skeletal-structure-and-locomotion/",
              "/biology/higher-zoology-tree/biostatistics/measurements_of_central_tendency_problem_solving/",
              "/biology/higher-zoology-tree/biostatistics/measures_of_dispersion/",
              "/biology/higher-zoology-tree/biostatistics/z-test-z-test-and-its-significance-chi-square-test/",
              "/biology/higher-zoology-tree/genetics/test-safe-file/",
          }

          def normalize_route(value):
              path = urlsplit(value).path
              if not path:
                  return ""
              return path.rstrip("/") + "/"

          class MatrixParser(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=True)
                  self.card_routes = []
                  self.in_json_ld = False
                  self.json_ld_parts = []

              def handle_starttag(self, tag, attrs):
                  tag = tag.lower()
                  attrs_map = dict(attrs)

                  if tag == "a":
                      classes = set(attrs_map.get("class", "").split())
                      if "biology-matrix-card-link" in classes:
                          route = normalize_route(attrs_map.get("href", ""))
                          if route:
                              self.card_routes.append(route)

                  if (
                      tag == "script"
                      and attrs_map.get("type", "").lower()
                      == "application/ld+json"
                  ):
                      self.in_json_ld = True

              def handle_endtag(self, tag):
                  if tag.lower() == "script":
                      self.in_json_ld = False

              def handle_data(self, data):
                  if self.in_json_ld:
                      self.json_ld_parts.append(data)

          html = Path(sys.argv[1]).read_text(encoding="utf-8")
          metrics = [
              int(value.replace(",", ""))
              for value in re.findall(
                  r"biology-metric-value[^>]*>\s*([0-9,]+)\s*<",
                  html,
              )
          ][:4]

          parser = MatrixParser()
          parser.feed(html)

          card_routes = parser.card_routes
          card_route_set = set(card_routes)
          json_ld_text = "\n".join(parser.json_ld_parts)

          leaked_cards = sorted(SYSTEM_ROUTES & card_route_set)
          leaked_json_ld = sorted(
              route for route in SYSTEM_ROUTES if route in json_ld_text
          )

          print(f"REBUILT_METRICS={metrics}")
          print(f"REBUILT_CARD_COUNT={len(card_routes)}")
          print(f"REBUILT_UNIQUE_CARD_COUNT={len(card_route_set)}")
          print(f"REBUILT_SYSTEM_CARD_LEAKS={leaked_cards}")
          print(f"REBUILT_SYSTEM_JSONLD_LEAKS={leaked_json_ld}")

          if metrics != EXPECTED_METRICS:
              raise SystemExit(
                  f"Biology Matrix mismatch: expected {EXPECTED_METRICS}, got {metrics}"
              )

          if len(card_routes) != EXPECTED_METRICS[0]:
              raise SystemExit(
                  "Biology Matrix card count does not match the visible-node metric: "
                  f"expected {EXPECTED_METRICS[0]}, got {len(card_routes)}"
              )

          if len(card_route_set) != len(card_routes):
              raise SystemExit("Biology Matrix contains duplicate learner-facing card routes.")

          if leaked_cards or leaked_json_ld:
              details = []
              if leaked_cards:
                  details.append("cards=" + ", ".join(leaked_cards))
              if leaked_json_ld:
                  details.append("jsonld=" + ", ".join(leaked_json_ld))
              raise SystemExit(
                  "System-only routes leaked into learner-facing Matrix output: "
                  + "; ".join(details)
              )

          print("Exact deployed commit Matrix verification passed.")
          PY

      - name: Purge approved Biology URLs
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.purge_cache }}
        shell: bash
        run: |
          set -euo pipefail

          cf_token="${CF_TOKEN_PRIMARY:-}"
          [[ -n "$cf_token" ]] || cf_token="${CF_TOKEN_ALT:-}"
          [[ -n "$cf_token" ]] || cf_token="${CF_TOKEN_ALT2:-}"

          [[ -n "$cf_token" ]] || {
            echo "Cache purge was requested, but no supported Cloudflare API token secret is configured."
            echo "Configure one of: CLOUDFLARE_API_TOKEN, CF_API_TOKEN, CLOUDFLARE_TOKEN."
            exit 1
          }

          zone_id="${CF_ZONE_ID_PRIMARY:-}"
          [[ -n "$zone_id" ]] || zone_id="${CF_ZONE_ID_ALT:-}"

          if [[ -z "$zone_id" ]]; then
            zone_response="$(curl -fsS \
              -H "Authorization: Bearer ${cf_token}" \
              -H 'Content-Type: application/json' \
              'https://api.cloudflare.com/client/v4/zones?name=learningbiologyforlife.org&status=active')"

            [[ "$(jq -r '.success' <<<"$zone_response")" == "true" ]] || {
              echo "Cloudflare zone lookup failed."
              jq -c '{success, errors}' <<<"$zone_response"
              exit 1
            }

            zone_id="$(jq -r '.result[0].id // empty' <<<"$zone_response")"
          fi

          [[ -n "$zone_id" ]] || {
            echo "Could not resolve the Cloudflare zone ID."
            exit 1
          }

          purge_response="$(curl -fsS -X POST \
            -H "Authorization: Bearer ${cf_token}" \
            -H 'Content-Type: application/json' \
            --data '{"files":["https://learningbiologyforlife.org/biology/","https://learningbiologyforlife.org/biology/index.html"]}' \
            "https://api.cloudflare.com/client/v4/zones/${zone_id}/purge_cache")"

          [[ "$(jq -r '.success' <<<"$purge_response")" == "true" ]] || {
            echo "Cloudflare targeted cache purge failed."
            jq -c '{success, errors}' <<<"$purge_response"
            exit 1
          }

          echo "Targeted Biology cache purge succeeded."

      - name: Summary
        shell: bash
        env:
          TARGET_SHA: ${{ steps.target.outputs.sha }}
          RUN_URL: ${{ steps.pages.outputs.run_url }}
        run: |
          {
            echo "## Pages verification result"
            echo
            echo "- Target SHA: \`$TARGET_SHA\`"
            echo "- Pages deployment: $RUN_URL"
            echo "- Verification source: exact commit rebuilt with production Jekyll settings"
            echo "- Learner-facing card and ItemList JSON-LD checks: passed"
            echo "- Direct production curl: intentionally not used"
            echo "- Expired Pages artifact: not required"
            echo "- Cloudflare purge requested: \`$PURGE_REQUESTED\`"
            echo "- Purge scope: approved Biology URLs only"
          } >> "$GITHUB_STEP_SUMMARY"
