name: CONV-04E-02 BOT-08 Content Certification

on:
  pull_request:
    branches: ["main"]
    types: [opened, synchronize, reopened, ready_for_review, edited]
    paths:
      - "_biology/hsc-corner/botany/lecture-08-plastid-chloroplast.md"
      - "_biology/hsc-corner/botany/lecture-07-cell-wall-vacuole.md"
      - "_biology/hsc-corner/botany/index.md"
      - "_biology/hsc-corner/botany/chapter-01-cell-and-its-structure.md"
      - "_data/academic/hsc_botany_chapter01_scope_v1.json"
      - "_data/academic/conv04e_bot08_authorization_v1.json"
      - "_data/academic/conv04e_bot08_content_v1.json"
      - "docs/academic/conv04/ACADEMIC_ROUTE_LEDGER.json"
      - "docs/academic/conv04/BOT08_AUTHORIZATION.md"
      - "docs/academic/conv04/BOT08_CONTENT_REVIEW.md"
      - "docs/academic/conv04/CONV04_STATE.md"
      - "scripts/academic/validate_botany_bot08_content.py"
      - ".github/scripts/conv04e-bot08-browser-certification.mjs"
      - ".github/workflows/hsc-botany-bot08-content-certification.yml"
  workflow_dispatch:
    inputs:
      expected_main_sha:
        description: "Exact main SHA to certify"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: conv04e-bot08-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  certify:
    name: CONV-04E-02 BOT-08 exact-head certification
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      E02_AUTHORIZED_BASE: "cc10f1cb60828be6d8aac145ecc6964c845ac71b"
      CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.event.inputs.expected_main_sha || github.sha }}
      EXPECTED_MAIN_SHA: ${{ github.event.inputs.expected_main_sha || '' }}
      CERTIFICATION_MODE: ${{ github.event_name == 'pull_request' && 'pull_request' || 'manual' }}
      PR_BASE_REF: ${{ github.event.pull_request.base.ref || 'main' }}
      PR_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
      REPORT_DIR: conv04e-bot08-browser-report

    steps:
      - name: Check out immutable candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Authenticate exact head and live authority
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$CANDIDATE_SHA"
          git merge-base --is-ancestor "$E02_AUTHORIZED_BASE" "$actual"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            remote="$(git ls-remote origin "refs/heads/$PR_BASE_REF" | awk '{print $1}')"
            test "$remote" = "$PR_BASE_SHA" || { echo "BASE CHANGED — RECERTIFICATION REQUIRED"; exit 1; }
            git merge-base --is-ancestor "$remote" "$actual" || { echo "STALE CANDIDATE"; exit 1; }
          else
            test -n "$EXPECTED_MAIN_SHA" || { echo "expected_main_sha is required"; exit 1; }
            remote_main="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
            test "$remote_main" = "$EXPECTED_MAIN_SHA" || { echo "MAIN ADVANCED"; exit 1; }
            test "$actual" = "$EXPECTED_MAIN_SHA" || { echo "MANUAL HEAD MISMATCH"; exit 1; }
          fi

      - name: Set up Ruby
        uses: ruby/setup-ruby@a0102e0972be65f351c307e2d64b9314a57c8073 # v1
        with:
          ruby-version: "3.2"
          bundler-cache: false

      - name: Certify BOT-08 source and scope
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/academic/validate_botany_bot08_content.py
          python3 scripts/academic/validate_botany_bot08_content.py
          git diff --check "$E02_AUTHORIZED_BASE...HEAD"

      - name: Retain CONV-04 A-D and E-01
        shell: bash
        run: |
          set -euo pipefail
          ruby .github/scripts/validate-academic-surface-contract.rb
          ruby .github/scripts/validate-academic-design-system.rb
          ruby .github/scripts/validate-learning-guide-contract.rb
          ruby .github/scripts/validate-learning-guide-implementation.rb
          ruby .github/scripts/validate-gateway-convergence.rb
          ruby .github/scripts/validate-assessment-ownership.rb
          ruby .github/scripts/validate-assessment-gateway.rb
          ruby .github/scripts/validate-assessment-runtime-contract.rb
          ruby .github/scripts/validate-assessment-runtime-pilot.rb
          ruby .github/scripts/validate-assessment-runtime-second-bank.rb
          ruby .github/scripts/validate-assessment-runtime-third-bank.rb
          ruby .github/scripts/validate-conv04e-botany-gateway.rb
          python3 scripts/academic/validate_botany_chapter01_scope.py
          python3 scripts/academic/validate_botany_learner_content.py

      - name: Install Jekyll dependencies
        run: bundle install --jobs 4 --retry 3

      - name: Build exact-head production site
        shell: bash
        env:
          JEKYLL_ENV: production
        run: |
          set -euo pipefail
          bundle exec jekyll clean
          bundle exec jekyll build --trace
          test -f _site/biology/hsc-corner/botany/lecture-08-plastid-chloroplast/index.html
          ruby .github/scripts/validate-academic-surface-contract.rb
          ruby .github/scripts/validate-academic-design-system.rb
          ruby .github/scripts/validate-conv04e-botany-gateway.rb
          python3 scripts/academic/validate_botany_bot08_content.py

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install pinned browser dependencies
        shell: bash
        run: |
          set -euo pipefail
          node --check .github/scripts/conv04e-bot08-browser-certification.mjs
          npm install --no-save --ignore-scripts playwright@1.62.1 axe-core@4.13.0
          npx playwright install --with-deps chromium

      - name: Serve exact-head site
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --bind 127.0.0.1 --directory _site >"$RUNNER_TEMP/conv04e-bot08-http.log" 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/biology/hsc-corner/botany/lecture-08-plastid-chloroplast/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/conv04e-bot08-http.log"
          exit 1

      - name: Browser / Axe / keyboard / reflow / spacing / reduced-motion / no-JS
        run: |
          node .github/scripts/conv04e-bot08-browser-certification.mjs \
            --base-url http://127.0.0.1:4173 \
            --output-dir "$REPORT_DIR"

      - name: Preserve certification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conv04e-bot08-${{ env.CANDIDATE_SHA }}
          path: |
            conv04e-bot08-report.json
            ${{ env.REPORT_DIR }}
          if-no-files-found: warn
          retention-days: 30

      - name: Add summary
        if: always()
        shell: bash
        run: |
          if [ -f "$REPORT_DIR/summary.md" ]; then cat "$REPORT_DIR/summary.md" >> "$GITHUB_STEP_SUMMARY"; fi
