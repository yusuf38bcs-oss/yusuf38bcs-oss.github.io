name: CONV-04E-02 BOT-08 Certification
on:
  pull_request:
    branches: ["main"]
    types: [opened, synchronize, reopened, ready_for_review, edited]
    paths:
      - "_biology/hsc-corner/botany/lecture-08-plastid-chloroplast.md"
      - "_biology/hsc-corner/botany/lecture-07-cell-wall-vacuole.md"
      - "_biology/hsc-corner/botany/chapter-01-cell-and-its-structure.md"
      - "_biology/hsc-corner/botany/index.md"
      - "_data/academic/hsc_botany_chapter01_scope_v1.json"
      - "_data/academic/conv04e_botany_bot08_authorization_v1.json"
      - "_data/academic/conv04e_botany_bot08_v1.json"
      - "docs/academic/CONV-04E02_BOT08_CONTENT_REVIEW.md"
      - "docs/academic/conv04/BOTANY_BOT08_AUTHORIZATION.md"
      - "docs/academic/conv04/CONV04_STATE.md"
      - ".github/scripts/validate-conv04e-botany-bot08.py"
      - ".github/scripts/conv04e-botany-bot08-browser.mjs"
      - ".github/workflows/conv04e-botany-bot08-certification.yml"
  workflow_dispatch:
    inputs:
      expected_main_sha:
        description: "Exact main SHA to certify"
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: conv04e-bot08-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  certify:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.event.inputs.expected_main_sha || github.sha }}
      EXPECTED_MAIN_SHA: ${{ github.event.inputs.expected_main_sha || '' }}
      PR_BASE_REF: ${{ github.event.pull_request.base.ref || 'main' }}
      PR_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
      CERTIFICATION_MODE: ${{ github.event_name == 'pull_request' && 'pull_request' || 'manual' }}
      REPORT_DIR: conv04e-bot08-browser-report
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - name: Authenticate exact head and live base
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            remote="$(git ls-remote origin "refs/heads/$PR_BASE_REF" | awk '{print $1}')"
            test "$remote" = "$PR_BASE_SHA"
            git merge-base --is-ancestor "$remote" "$CANDIDATE_SHA"
          else
            test -n "$EXPECTED_MAIN_SHA"
            remote="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
            test "$remote" = "$EXPECTED_MAIN_SHA"
            test "$CANDIDATE_SHA" = "$EXPECTED_MAIN_SHA"
          fi
      - name: Validate BOT-08 source contract
        run: |
          python3 .github/scripts/validate-conv04e-botany-bot08.py
          python3 scripts/academic/validate_botany_chapter01_scope.py
          python3 scripts/academic/validate_botany_learner_content.py
          git diff --check "$PR_BASE_SHA...HEAD"
      - uses: ruby/setup-ruby@a0102e0972be65f351c307e2d64b9314a57c8073
        with:
          ruby-version: "3.2"
          bundler-cache: false
      - name: Retain CONV-04 contracts
        shell: bash
        run: |
          set -euo pipefail
          ruby .github/scripts/validate-academic-surface-contract.rb
          ruby .github/scripts/validate-academic-design-system.rb
          ruby .github/scripts/validate-learning-guide-contract.rb
          ruby .github/scripts/validate-learning-guide-implementation.rb
          ruby .github/scripts/validate-gateway-convergence.rb
          ruby .github/scripts/validate-assessment-ownership.rb
          ruby .github/scripts/validate-assessment-gateway.rb
          ruby .github/scripts/validate-assessment-runtime-contract.rb
          ruby .github/scripts/validate-assessment-runtime-pilot.rb
          ruby .github/scripts/validate-assessment-runtime-second-bank.rb
          ruby .github/scripts/validate-assessment-runtime-third-bank.rb
          ruby .github/scripts/validate-conv04e-botany-gateway.rb
      - name: Build production Jekyll
        env:
          JEKYLL_ENV: production
        run: |
          bundle install --jobs 4 --retry 3
          bundle exec jekyll clean
          bundle exec jekyll build --trace
          test -f _site/biology/hsc-corner/botany/lecture-08-plastid-chloroplast/index.html
          python3 .github/scripts/validate-conv04e-botany-bot08.py
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install browser dependencies
        run: |
          node --check .github/scripts/conv04e-botany-bot08-browser.mjs
          npm install --no-save --ignore-scripts playwright@1.62.1 axe-core@4.13.0
          npx playwright install --with-deps chromium
      - name: Serve exact-head site
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 --directory _site >"$RUNNER_TEMP/bot08-http.log" 2>&1 &
          for attempt in $(seq 1 30); do curl --fail --silent http://127.0.0.1:4173/biology/hsc-corner/botany/lecture-08-plastid-chloroplast/ >/dev/null && exit 0; sleep 1; done
          cat "$RUNNER_TEMP/bot08-http.log"; exit 1
      - name: Browser Axe runtime reflow
        run: node .github/scripts/conv04e-botany-bot08-browser.mjs --base-url http://127.0.0.1:4173 --output-dir "$REPORT_DIR"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: conv04e-bot08-${{ env.CANDIDATE_SHA }}
          path: ${{ env.REPORT_DIR }}
          if-no-files-found: warn
          retention-days: 30
