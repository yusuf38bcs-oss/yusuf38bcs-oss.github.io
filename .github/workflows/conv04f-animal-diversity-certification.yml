name: CONV-04F-03 Animal Diversity Certification

on:
  pull_request:
    branches: ["main"]
    types: [opened, synchronize, reopened, ready_for_review, edited]
    paths:
      - "_biology/higher-zoology-tree/animal-diversity/index.md"
      - "_biology/higher-zoology-tree/animal-diversity/course-index.md"
      - "_layouts/animal-diversity-course.html"
      - "_data/academic/conv04f_animal_diversity_authorization_v1.json"
      - "_data/academic/conv04f_animal_diversity_v1.json"
      - "docs/academic/conv04/ACADEMIC_ROUTE_LEDGER.json"
      - "docs/academic/conv04/CONV04_STATE.md"
      - "docs/academic/conv04/ANIMAL_DIVERSITY_F03_AUTHORIZATION.md"
      - "docs/academic/conv04/ANIMAL_DIVERSITY_F03_CONVERGENCE.md"
      - ".github/scripts/validate-conv04f-animal-diversity.rb"
      - ".github/scripts/conv04f-animal-diversity-browser-certification.mjs"
      - ".github/workflows/conv04f-animal-diversity-certification.yml"
  workflow_dispatch:
    inputs:
      expected_main_sha:
        description: "Exact main SHA to certify"
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: conv04f-animal-diversity-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  certify:
    name: CONV-04F-03 Animal Diversity gateway/course
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      F03_AUTHORIZED_BASE: "8330368a1c4bc8b7083d1528a3c50118217e258a"
      CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.event.inputs.expected_main_sha || github.sha }}
      EXPECTED_MAIN_SHA: ${{ github.event.inputs.expected_main_sha || '' }}
      CERTIFICATION_MODE: ${{ github.event_name == 'pull_request' && 'pull_request' || 'manual' }}
      PR_BASE_REF: ${{ github.event.pull_request.base.ref || 'main' }}
      PR_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
      REPORT_DIR: conv04f-animal-diversity-browser-report
    steps:
      - name: Check out immutable candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - name: Authenticate exact head and live authority
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$CANDIDATE_SHA"
          git merge-base --is-ancestor "$F03_AUTHORIZED_BASE" "$actual"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            remote="$(git ls-remote origin "refs/heads/$PR_BASE_REF" | awk '{print $1}')"
            test "$remote" = "$PR_BASE_SHA" || { echo "BASE CHANGED — RECERTIFICATION REQUIRED"; exit 1; }
            git merge-base --is-ancestor "$remote" "$actual" || { echo "STALE CANDIDATE"; exit 1; }
          else
            test -n "$EXPECTED_MAIN_SHA" || { echo "expected_main_sha is required"; exit 1; }
            remote_main="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
            test "$remote_main" = "$EXPECTED_MAIN_SHA" || { echo "MAIN ADVANCED"; exit 1; }
            test "$actual" = "$EXPECTED_MAIN_SHA" || { echo "MANUAL HEAD MISMATCH"; exit 1; }
          fi
      - name: Set up Ruby
        uses: ruby/setup-ruby@a0102e0972be65f351c307e2d64b9314a57c8073
        with:
          ruby-version: "3.2"
          bundler-cache: false
      - name: Certify F-03 source/layout preservation
        run: |
          ruby -c .github/scripts/validate-conv04f-animal-diversity.rb
          ruby .github/scripts/validate-conv04f-animal-diversity.rb
          git diff --check "$PR_BASE_SHA...HEAD"
      - name: Retain A-F-02 contracts
        shell: bash
        run: |
          set -euo pipefail
          ruby .github/scripts/validate-academic-surface-contract.rb
          ruby .github/scripts/validate-academic-design-system.rb
          ruby .github/scripts/validate-learning-guide-contract.rb
          ruby .github/scripts/validate-learning-guide-implementation.rb
          ruby .github/scripts/validate-gateway-convergence.rb
          ruby .github/scripts/validate-assessment-ownership.rb
          ruby .github/scripts/validate-assessment-gateway.rb
          ruby .github/scripts/validate-assessment-runtime-contract.rb
          ruby .github/scripts/validate-assessment-runtime-pilot.rb
          ruby .github/scripts/validate-assessment-runtime-second-bank.rb
          ruby .github/scripts/validate-assessment-runtime-third-bank.rb
          ruby .github/scripts/validate-conv04e-botany-gateway.rb
          python3 scripts/academic/validate_botany_chapter01_scope.py
          python3 scripts/academic/validate_botany_learner_content.py
          python3 scripts/academic/validate_botany_bot08_content.py
          ruby .github/scripts/validate-conv04f-hsc-zoology-gateway.rb
          ruby .github/scripts/validate-conv04f-higher-zoology-gateway.rb
      - name: Install Jekyll dependencies
        run: bundle install --jobs 4 --retry 3
      - name: Build exact-head production site
        env:
          JEKYLL_ENV: production
        run: |
          bundle exec jekyll clean
          bundle exec jekyll build --trace
          test -f _site/biology/animal-diversity/index.html
          test -f _site/biology/animal-diversity/course/index.html
          ruby .github/scripts/validate-academic-surface-contract.rb
          ruby .github/scripts/validate-academic-design-system.rb
          ruby .github/scripts/validate-conv04f-animal-diversity.rb
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install browser runtime
        run: |
          node --check .github/scripts/conv04f-animal-diversity-browser-certification.mjs
          npm install --no-save --ignore-scripts playwright@1.62.1 axe-core@4.13.0
          npx playwright install --with-deps chromium
      - name: Serve exact-head site
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 --directory _site >"$RUNNER_TEMP/f03-http.log" 2>&1 &
          for attempt in $(seq 1 30); do
            curl --fail --silent http://127.0.0.1:4173/biology/animal-diversity/ >/dev/null && exit 0
            sleep 1
          done
          cat "$RUNNER_TEMP/f03-http.log"
          exit 1
      - name: Browser / Axe / keyboard / reflow / spacing / motion / no-JS
        run: node .github/scripts/conv04f-animal-diversity-browser-certification.mjs --base-url http://127.0.0.1:4173 --output-dir "$REPORT_DIR"
      - name: Preserve evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conv04f-animal-diversity-${{ env.CANDIDATE_SHA }}
          path: ${{ env.REPORT_DIR }}
          if-no-files-found: warn
          retention-days: 30
