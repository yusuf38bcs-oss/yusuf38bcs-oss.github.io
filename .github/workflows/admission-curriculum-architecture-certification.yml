name: Admission Curriculum Architecture Certification

on:
  pull_request:
    paths:
      - "_pages/utility/editorial-policy.md"
      - "_data/admission/curriculum_architecture_v1.json"
      - "_data/admission/biology/reuse_audit_v1.json"
      - "_data/admission/biology/chapter_map_v1.json"
      - "_data/admission/biology/reference_policy_v1.json"
      - "_data/admission/biology/claim_source_matrix_v1.json"
      - "_data/admission/biology/reference_registry_v1.json"
      - "_data/admission/biology/r2-3_second_verification_v1.json"
      - "_data/admission/biology/pass2_claim_evidence_v1.json"
      - "_data/admission/biology/draft_remediation_gateway_v1.json"
      - "_data/admission/biology/drafts/b01_membrane_transport_shadow_v1.json"
      - "_data/admission/biology/sources/r2-2-shared-syllabus-photo-set.json"
      - "_data/admission/biology/engine_v1.json"
      - "_data/admission/biology/curriculum_coverage_v1.json"
      - "scripts/admission/validate_curriculum_architecture.rb"
      - "scripts/admission/validate_biology_engine.rb"
      - "scripts/admission/validate_biology_curriculum_coverage.rb"
      - ".github/workflows/admission-curriculum-architecture-certification.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: admission-curriculum-architecture-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  certify:
    name: R2.4.3 Biology physical-copy + B01 shadow convergence
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

    steps:
      - name: Check out immutable candidate head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.PR_HEAD_SHA }}
          persist-credentials: false

      - name: Enforce exact checked-out identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PR_HEAD_SHA"
          printf 'Admission R2.4.3 convergence certification head: %s\n' "$PR_HEAD_SHA"

      - name: Set up Ruby
        uses: ruby/setup-ruby@a0102e0972be65f351c307e2d64b9314a57c8073 # v1
        with:
          ruby-version: "3.2"
          bundler-cache: false

      - name: Validate Biology Admission engine
        run: ruby scripts/admission/validate_biology_engine.rb

      - name: Validate inherited Biology curriculum coverage
        run: ruby scripts/admission/validate_biology_curriculum_coverage.rb

      - name: Validate R2.4.3 physical-copy + B01 shadow convergence
        run: ruby scripts/admission/validate_curriculum_architecture.rb
