# Non-authorizing candidate fixture execution only.
# No privileged pull_request_target, no deployment, no write permission, no secrets.
name: YESAF M1 Candidate Boundary Fixtures

on:
  pull_request:
    branches: ["main"]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: yesaf-candidate-fixtures-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  candidate-tests:
    name: YESAF candidate boundary fixtures (non-authorizing)
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Fetch immutable fixture files as data without checking out PR code
        uses: actions/github-script@v7
        env:
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        with:
          script: |
            const fs = require('node:fs');
            const path = require('node:path');
            const crypto = require('node:crypto');
            const sha = String(process.env.CANDIDATE_SHA || '').toLowerCase();
            if (!/^[a-f0-9]{40}$/.test(sha)) throw new Error('Invalid candidate SHA');
            const files = [
              '.github/workflows/yesaf-production-authority-audit.yml',
              '.github/scripts/yesaf-production-authority-audit.mjs',
              '.github/scripts/test-yesaf-production-authority-audit.mjs',
              '.github/scripts/test-yesaf-trusted-boundary.mjs'
            ];
            const outputDir = path.join(process.env.RUNNER_TEMP, 'yesaf-candidate-fixtures');
            for (const rel of files) {
              const response = await github.rest.repos.getContent({
                ...context.repo, path: rel, ref: sha
              });
              const data = response.data;
              if (!data || Array.isArray(data) || data.type !== 'file' ||
                  data.path !== rel || data.encoding !== 'base64' ||
                  typeof data.content !== 'string') {
                throw new Error('Unexpected candidate file: ' + rel);
              }
              const buf = Buffer.from(data.content.replace(/\s/g, ''), 'base64');
              if (buf.length !== data.size || buf.length > 200000) {
                throw new Error('Candidate file size mismatch: ' + rel);
              }
              const gitSha = crypto.createHash('sha1')
                .update('blob ' + buf.length + String.fromCharCode(0))
                .update(buf).digest('hex');
              if (gitSha !== data.sha) {
                throw new Error('Candidate file hash mismatch: ' + rel);
              }
              const out = path.join(outputDir, rel);
              fs.mkdirSync(path.dirname(out), { recursive: true });
              fs.writeFileSync(out, buf, { flag: 'wx', mode: 0o600 });
            }
            core.info('Fetched SHA-bound candidate fixtures. No candidate code executed in this API step.');
      - name: Run unprivileged candidate-authored adversarial fixture tests
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/yesaf-candidate-fixtures"
          node --test \
            .github/scripts/test-yesaf-production-authority-audit.mjs \
            .github/scripts/test-yesaf-trusted-boundary.mjs
      - name: Explicitly mark test as non-authorizing
        shell: bash
        run: |
          printf '%s\n' 'YESAF candidate fixtures are a diagnostic test ONLY.'
          printf '%s\n' 'NO trusted-status issuance, required-check modification, merge, or deployment is authorized.'
