name: Verify P1.1 Staging Runtime

on:
  pull_request:
    branches: [staging]
    paths:
      - ".github/workflows/ops-p1-1-runtime-verification.yml"

permissions:
  contents: read

jobs:
  verify-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Verify staging Matrix and preserved routes
        shell: bash
        run: |
          set -euo pipefail

          STAGING="https://p1-1-biology-collection-sani.yusuf38bcs-oss-github-io.pages.dev"
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/150 Safari/537.36"
          WORKDIR="$(mktemp -d)"

          fetch() {
            local url="$1"
            local output="$2"
            curl -A "$UA" --fail --silent --show-error --location \
              --retry 4 --retry-delay 3 --retry-all-errors \
              --connect-timeout 15 --max-time 60 \
              "$url" -o "$output"
          }

          fetch "$STAGING/biology/" "$WORKDIR/staging-biology.html"

          python3 - "$WORKDIR/staging-biology.html" <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          import re
          import sys

          PRODUCTION_NODES = 103
          PRODUCTION_XP = 35315

          SYSTEM_ROUTES = {
              "/biology/hsc-corner/botany/structures-functions-cell-organelles-part-1/",
              "/biology/hsc-corner/botany/structures-functions-cell-organelles-part-2/",
              "/biology/hsc-corner/botany/human-body-mysterious-workspace-central-dogma/",
              "/biology/higher-zoology-tree/animal-diversity/protozoa-reproduction-and-parasitism/",
              "/biology/higher-zoology-tree/animal-diversity/protozoa-body-covering-and-skeletal-structure-and-locomotion/",
              "/biology/higher-zoology-tree/biostatistics/measurements_of_central_tendency_problem_solving/",
              "/biology/higher-zoology-tree/biostatistics/measures_of_dispersion/",
              "/biology/higher-zoology-tree/biostatistics/z-test-z-test-and-its-significance-chi-square-test/",
              "/biology/higher-zoology-tree/genetics/test-safe-file/",
          }

          REQUIRED_CARD_ROUTES = {
              "/biology/higher-zoology-tree/animal-diversity/protozoa-reproduction-parasitism/",
              "/biology/higher-zoology-tree/animal-diversity/protozoa-body-covering-skeletal-structure-locomotion/",
              "/biology/higher-zoology-tree/biostatistics/measures-of-central-tendency/",
              "/biology/higher-zoology-tree/biostatistics/measures-of-dispersion/",
              "/biology/higher-zoology-tree/biostatistics/z_test_problem_solving/",
              "/biology/higher-zoology-tree/genetics/",
          }

          REQUIRED_INDEXED_ROUTES = REQUIRED_CARD_ROUTES | {
              "/biology/hsc-corner/botany/lecture-01-cell-protoplasm-cell-theory/",
              "/biology/hsc-corner/botany/lecture-06-mitochondria/",
          }

          class MatrixParser(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=True)
                  self.metric_depth = 0
                  self.metric_values = []
                  self.metric_buffer = []
                  self.card_hrefs = set()
                  self.scripts = []
                  self.in_jsonld = False
                  self.script_buffer = []

              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)
                  classes = set(attrs.get("class", "").split())
                  if tag == "a" and "biology-matrix-card-link" in classes:
                      self.card_hrefs.add(attrs.get("href", ""))
                  if tag == "article" and "biology-metric-card" in classes:
                      self.metric_depth = 1
                      self.metric_buffer = []
                  elif self.metric_depth:
                      self.metric_depth += 1
                  if tag == "script" and attrs.get("type") == "application/ld+json":
                      self.in_jsonld = True
                      self.script_buffer = []

              def handle_endtag(self, tag):
                  if self.metric_depth:
                      self.metric_depth -= 1
                      if self.metric_depth == 0:
                          text = " ".join(self.metric_buffer)
                          match = re.search(r"\b([0-9][0-9,]*)\b", text)
                          if match:
                              self.metric_values.append(int(match.group(1).replace(",", "")))
                  if tag == "script" and self.in_jsonld:
                      self.in_jsonld = False
                      self.scripts.append("".join(self.script_buffer))

              def handle_data(self, data):
                  if self.metric_depth:
                      self.metric_buffer.append(data)
                  if self.in_jsonld:
                      self.script_buffer.append(data)

          parser = MatrixParser()
          parser.feed(Path(sys.argv[1]).read_text(encoding="utf-8"))
          jsonld = "\n".join(parser.scripts)

          if len(parser.metric_values) < 4:
              raise SystemExit(f"Unable to parse Matrix metrics: {parser.metric_values}")

          staging_nodes, staging_pillars, staging_prompts, staging_xp = parser.metric_values[:4]
          if (staging_nodes, staging_pillars, staging_prompts, staging_xp) != (94, 4, 3, 35225):
              raise SystemExit(
                  "Unexpected staging metrics: "
                  f"{staging_nodes}, {staging_pillars}, {staging_prompts}, {staging_xp}"
              )
          if PRODUCTION_NODES - staging_nodes != 9 or PRODUCTION_XP - staging_xp != 90:
              raise SystemExit("Production-to-staging metric delta is not 9 nodes and 90 XP")

          leaked_cards = sorted(SYSTEM_ROUTES & parser.card_hrefs)
          leaked_jsonld = sorted(route for route in SYSTEM_ROUTES if route in jsonld)
          if leaked_cards or leaked_jsonld:
              raise SystemExit(f"System route leakage: cards={leaked_cards}; jsonld={leaked_jsonld}")

          missing_cards = sorted(REQUIRED_CARD_ROUTES - parser.card_hrefs)
          missing_indexed = sorted(route for route in REQUIRED_INDEXED_ROUTES if route not in jsonld)
          if missing_cards or missing_indexed:
              raise SystemExit(
                  f"Canonical routes missing: cards={missing_cards}; jsonld={missing_indexed}"
              )

          number_match = re.search(r'"numberOfItems"\s*:\s*(\d+)', jsonld)
          if not number_match or int(number_match.group(1)) != staging_nodes:
              raise SystemExit("JSON-LD numberOfItems does not equal the visible node total")

          if len(parser.card_hrefs) != staging_nodes:
              raise SystemExit(
                  f"Card count {len(parser.card_hrefs)} does not equal node total {staging_nodes}"
              )

          print(
              "Matrix passed: staging=94 nodes/35225 XP; production reference=103/35315; "
              "9 system routes absent; canonical routes retained; JSON-LD count=94."
          )
          PY

          declare -A ROUTES=(
            ["/biology/hsc-corner/botany/structures-functions-cell-organelles-part-1/"]="/biology/hsc-corner/botany/chapter-01-cell-and-its-structure/"
            ["/biology/hsc-corner/botany/structures-functions-cell-organelles-part-2/"]="/biology/hsc-corner/botany/chapter-01-cell-and-its-structure/"
            ["/biology/hsc-corner/botany/human-body-mysterious-workspace-central-dogma/"]="/biology/hsc-corner/botany/chapter-01-cell-and-its-structure/"
            ["/biology/higher-zoology-tree/animal-diversity/protozoa-reproduction-and-parasitism/"]="/biology/higher-zoology-tree/animal-diversity/protozoa-reproduction-parasitism/"
            ["/biology/higher-zoology-tree/animal-diversity/protozoa-body-covering-and-skeletal-structure-and-locomotion/"]="/biology/higher-zoology-tree/animal-diversity/protozoa-body-covering-skeletal-structure-locomotion/"
            ["/biology/higher-zoology-tree/biostatistics/measurements_of_central_tendency_problem_solving/"]="/biology/higher-zoology-tree/biostatistics/measures-of-central-tendency/"
            ["/biology/higher-zoology-tree/biostatistics/measures_of_dispersion/"]="/biology/higher-zoology-tree/biostatistics/measures-of-dispersion/"
            ["/biology/higher-zoology-tree/biostatistics/z-test-z-test-and-its-significance-chi-square-test/"]="/biology/higher-zoology-tree/biostatistics/z_test_problem_solving/"
            ["/biology/higher-zoology-tree/genetics/test-safe-file/"]="/biology/higher-zoology-tree/genetics/"
          )

          for route in "${!ROUTES[@]}"; do
            target="${ROUTES[$route]}"
            file="$WORKDIR/route-$(printf '%s' "$route" | sha256sum | cut -d' ' -f1).html"
            fetch "$STAGING$route" "$file"
            grep -qi 'noindex' "$file" || {
              echo "Missing noindex marker on $route"
              exit 1
            }
            grep -Fq "$target" "$file" || {
              echo "Expected target $target missing from $route"
              exit 1
            }
            echo "Preserved route passed: $route -> $target"
          done

          echo "P1.1 staging runtime verification passed."
