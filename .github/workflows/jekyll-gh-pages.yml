# =========================================================================
# SOVEREIGN JEKYLL MASTER BUILD ENGINE
# Deploys to GitHub Pages with Jekyll 3.x (GitHub Pages compatible)
# =========================================================================

name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: false

      - name: Configure Bundler Deployment Settings
        run: |
          bundle config set --local frozen 'false'
          bundle install

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Clean Previous Site Output
        run: bundle exec jekyll clean

      - name: Build Jekyll Site
        run: bundle exec jekyll build --trace
        env:
          JEKYLL_ENV: production
          JEKYLL_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate Build Output
        run: |
          test -f _site/index.html || (echo "Missing index.html" && exit 1)
          test -f _site/assets/data/graph_manifest.json || (echo "Missing graph_manifest.json" && exit 1)
          test -f _site/assets/css/biology-matrix.css || (echo "Missing biology-matrix.css" && exit 1)
          test -f _site/assets/js/core/ai-core.js || (echo "Missing ai-core.js" && exit 1)

          if grep -q 'data-homepage-v2' _site/index.html; then
            echo "Validating Homepage v2 production output."
            grep -q 'id="lbfl-home-v2"' _site/index.html || (echo "Homepage v2 root missing" && exit 1)
            grep -q 'assets/js/home/homepage-v2.js' _site/index.html || (echo "Homepage v2 runtime missing" && exit 1)
            readarray -t ADSENSE_POLICY < <(ruby -ryaml -e '
              policy = YAML.safe_load(
                File.read("_data/adsense.yml"),
                permitted_classes: [],
                permitted_symbols: [],
                aliases: false
              ) || {}
              puts policy.fetch("mode", "")
              puts policy.fetch("certified_cmp_ready", false)
            ')
            ADSENSE_MODE="${ADSENSE_POLICY[0]:-}"
            ADSENSE_CMP_READY="${ADSENSE_POLICY[1]:-false}"
            if [[ "$ADSENSE_MODE" == "live" && "$ADSENSE_CMP_READY" == "true" ]]; then
              grep -q 'GTM-WPZ6MPK4' _site/index.html || (echo "Homepage v2 GTM configuration missing in certified live mode" && exit 1)
            elif grep -q 'GTM-WPZ6MPK4' _site/index.html; then
              echo "Homepage v2 GTM must remain suppressed outside certified live mode"
              exit 1
            else
              echo "Homepage v2 GTM suppression matches the current AdSense policy."
            fi
            grep -q 'translate.google.com/translate_a/element.js' _site/index.html || (echo "Homepage v2 Translate loader missing" && exit 1)
            grep -q 'analytics_storage.*denied' _site/index.html || (echo "Homepage v2 denied consent default missing" && exit 1)
            if grep -q 'synaptic-floating-ai-root' _site/index.html; then
              echo "Legacy Synaptic floating AI widget must not be injected into Homepage v2"
              exit 1
            fi
          else
            echo "Validating legacy homepage output."
            grep -q "api.learningbiologyforlife.org" _site/index.html || (echo "Synaptic AI endpoint config missing from legacy homepage" && exit 1)
            grep -q "assets/js/core/ai-core.js" _site/index.html || (echo "Synaptic AI core script missing from legacy homepage" && exit 1)
            grep -q "synaptic-floating-ai-root" _site/index.html || (echo "Synaptic floating AI widget missing from legacy homepage" && exit 1)
          fi

          test -f _site/biology/index.html || (echo "Missing /biology/" && exit 1)
          grep -q "biology-matrix-hub-wrapper" _site/biology/index.html || (echo "Biology Matrix wrapper missing from /biology/" && exit 1)
          grep -q "biology-matrix-card-link" _site/biology/index.html || (echo "Biology Matrix cards missing from /biology/" && exit 1)

          BOTANY_INDEX="_site/biology/hsc-corner/botany/index.html"
          test -f "$BOTANY_INDEX" || (echo "Missing Botany index output" && exit 1)
          grep -q 'lbfl-botany-index-release: 2026-07-22' "$BOTANY_INDEX" || (echo "Botany index release marker missing" && exit 1)
          grep -q 'lecture-01-cell-protoplasm-cell-theory' "$BOTANY_INDEX" || (echo "Botany Lecture 01 missing" && exit 1)
          grep -q 'lecture-02-plasma-membrane-fluid-mosaic-model' "$BOTANY_INDEX" || (echo "Botany Lecture 02 missing" && exit 1)
          grep -q 'lecture-03-cytoplasm-ribosome-protein-factory' "$BOTANY_INDEX" || (echo "Botany Lecture 03 missing" && exit 1)
          grep -q 'lecture-04-endoplasmic-reticulum-transport-network' "$BOTANY_INDEX" || (echo "Botany Lecture 04 missing" && exit 1)
          grep -q 'lecture-05-golgi-body-lysosome-peroxisome' "$BOTANY_INDEX" || (echo "Botany Lecture 05 missing" && exit 1)
          grep -q 'lecture-06-mitochondria' "$BOTANY_INDEX" || (echo "Botany Lecture 06 missing" && exit 1)

          python3 - "$BOTANY_INDEX" <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          from urllib.parse import urlsplit
          import re
          import sys

          REQUIRED_ACTIVE_ROUTES = {
              "/biology/hsc-corner/botany/lecture-01-cell-protoplasm-cell-theory/",
              "/biology/hsc-corner/botany/lecture-02-plasma-membrane-fluid-mosaic-model/",
              "/biology/hsc-corner/botany/lecture-03-cytoplasm-ribosome-protein-factory/",
              "/biology/hsc-corner/botany/lecture-04-endoplasmic-reticulum-transport-network/",
              "/biology/hsc-corner/botany/lecture-05-golgi-body-lysosome-peroxisome/",
              "/biology/hsc-corner/botany/lecture-06-mitochondria/",
          }
          FORBIDDEN_UPCOMING_ROUTES = {
              "/biology/hsc-corner/botany/lecture-04-endoplasmic-reticulum-transport-network/",
              "/biology/hsc-corner/botany/lecture-05-golgi-body-lysosome-peroxisome/",
              "/biology/hsc-corner/botany/lecture-06-mitochondria/",
          }
          FORBIDDEN_UPCOMING_LABELS = {
              "লেকচার ০৪",
              "লেকচার ০৫",
              "লেকচার ০৬",
              "lecture 04",
              "lecture 05",
              "lecture 06",
          }

          def normalize_space(value):
              return re.sub(r"\s+", " ", value).strip()

          def normalize_route(href):
              path = urlsplit(href).path
              if not path:
                  return ""
              return path.rstrip("/") + "/"

          class BotanyIndexParser(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=True)
                  self.in_h2 = False
                  self.heading_parts = []
                  self.current_section = None
                  self.active_heading_found = False
                  self.upcoming_heading_found = False
                  self.active_links = set()
                  self.upcoming_links = set()
                  self.upcoming_text_parts = []

              def handle_starttag(self, tag, attrs):
                  tag = tag.lower()
                  if tag == "h2":
                      self.in_h2 = True
                      self.heading_parts = []
                      return

                  if tag == "a" and self.current_section in {"active", "upcoming"}:
                      href = dict(attrs).get("href", "")
                      route = normalize_route(href)
                      if self.current_section == "active":
                          self.active_links.add(route)
                      else:
                          self.upcoming_links.add(route)

              def handle_endtag(self, tag):
                  if tag.lower() != "h2" or not self.in_h2:
                      return

                  heading = normalize_space("".join(self.heading_parts))
                  heading_lower = heading.casefold()

                  if "সক্রিয় chapter 01 লেকচার" in heading_lower or "active chapter 01 lectures" in heading_lower:
                      self.current_section = "active"
                      self.active_heading_found = True
                  elif "পরবর্তী লেকচার" in heading_lower or "next lessons" in heading_lower:
                      self.current_section = "upcoming"
                      self.upcoming_heading_found = True
                  else:
                      self.current_section = None

                  self.in_h2 = False
                  self.heading_parts = []

              def handle_data(self, data):
                  if self.in_h2:
                      self.heading_parts.append(data)
                  elif self.current_section == "upcoming":
                      self.upcoming_text_parts.append(data)

          html_path = Path(sys.argv[1])
          parser = BotanyIndexParser()
          parser.feed(html_path.read_text(encoding="utf-8"))

          if not parser.active_heading_found:
              raise SystemExit("Botany active Chapter 01 lesson section heading missing")

          missing_active = sorted(REQUIRED_ACTIVE_ROUTES - parser.active_links)
          if missing_active:
              raise SystemExit(
                  "Botany active lesson section is missing routes: "
                  + ", ".join(missing_active)
              )

          forbidden_routes = sorted(FORBIDDEN_UPCOMING_ROUTES & parser.upcoming_links)
          upcoming_text = normalize_space(" ".join(parser.upcoming_text_parts)).casefold()
          forbidden_labels = sorted(
              label
              for label in FORBIDDEN_UPCOMING_LABELS
              if label.casefold() in upcoming_text
          )

          if forbidden_routes or forbidden_labels:
              details = []
              if forbidden_routes:
                  details.append("routes=" + ", ".join(forbidden_routes))
              if forbidden_labels:
                  details.append("labels=" + ", ".join(forbidden_labels))
              raise SystemExit(
                  "Published Botany Lectures 04-06 must not appear in the "
                  "upcoming section: " + "; ".join(details)
              )

          print(
              "Botany section validation passed: "
              f"{len(REQUIRED_ACTIVE_ROUTES)} active routes verified; "
              f"upcoming heading present={parser.upcoming_heading_found}."
          )
          PY

          echo "Core build artifact validation passed."

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v4
        with:
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: _site/
          retention-days: 1

  deploy:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 20
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          timeout: '600000'
          reporting_interval: '10000'
          error_count: '60'
