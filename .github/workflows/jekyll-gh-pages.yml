# =========================================================================
# SOVEREIGN JEKYLL MASTER BUILD ENGINE (OMNIPOTENT ACTIONS PIPELINE)
# Forces GitHub to execute a clean, modern, native Jekyll compilation.
# Optimized for high-performance Socratic Matrix & Unified Dark Void Theme
# =========================================================================

name: Deploy Jekyll site to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true # OPTIMIZED: Instantly kills redundant intermediate builds to save deployment time

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository Node
        uses: actions/checkout@v4

      - name: Setup Pages Gateway
        uses: actions/configure-pages@v5

      - name: Build Jekyll Site Membrane (Native Pipeline Execution)
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      - name: Upload Compiled Production Artifacts
        uses: actions/upload-pages-artifact@v3

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy Sovereign Artifacts to Live Cloud
        id: deployment
        uses: actions/deploy-pages@v4
