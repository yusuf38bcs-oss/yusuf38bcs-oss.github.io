# =========================================================================
# SOVEREIGN JEKYLL MASTER BUILD ENGINE
# Deploys to GitHub Pages with Jekyll 3.x (GitHub Pages compatible)
# =========================================================================

name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: false

      - name: Configure Bundler Deployment Settings
        run: |
          bundle config set --local frozen 'false'
          bundle install

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Clean Previous Site Output
        run: bundle exec jekyll clean

      - name: Build Jekyll Site
        run: bundle exec jekyll build --trace
        env:
          JEKYLL_ENV: production
          JEKYLL_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate Build Output
        run: |
          test -f _site/index.html || (echo "Missing index.html" && exit 1)
          test -f _site/assets/data/graph_manifest.json || (echo "Missing graph_manifest.json" && exit 1)
          test -f _site/assets/css/biology-matrix.css || (echo "Missing biology-matrix.css" && exit 1)
          test -f _site/assets/js/core/ai-core.js || (echo "Missing ai-core.js" && exit 1)
          ! grep -R "<<<<<<<\|=======\|>>>>>>>" assets/js/core/ai-core.js || (echo "Unresolved merge conflict markers in ai-core.js" && exit 1)
          grep -q "api.learningbiologyforlife.org" _site/index.html || (echo "Synaptic AI endpoint config missing from homepage" && exit 1)
          grep -q "assets/js/core/ai-core.js" _site/index.html || (echo "Synaptic AI core script missing from homepage" && exit 1)
          grep -q "synaptic-floating-ai-root" _site/index.html || (echo "Synaptic floating AI widget missing from homepage" && exit 1)
          test -f _site/biology/index.html || (echo "Missing /biology/" && exit 1)
          grep -q "biology-matrix-hub-wrapper" _site/biology/index.html || (echo "Biology Matrix wrapper missing from /biology/" && exit 1)
          grep -q "biology-matrix-card-link" _site/biology/index.html || (echo "Biology Matrix cards missing from /biology/" && exit 1)
          echo "Core build artifact validation passed."

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages
          path: _site/
          retention-days: 1

  deploy:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 35
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: 1800000
          reporting_interval: 10000
          error_count: 30
