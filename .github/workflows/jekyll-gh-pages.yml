# =========================================================================
# SOVEREIGN JEKYLL MASTER BUILD ENGINE
# Deploys to GitHub Pages with Jekyll 3.x (GitHub Pages compatible)
# =========================================================================

name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: false

      - name: Configure Bundler Deployment Settings
        run: |
          bundle config set --local frozen 'false'
          bundle install

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Build Jekyll Site
        run: bundle exec jekyll build --trace
        env:
          JEKYLL_ENV: production
          JEKYLL_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate Build Output
        run: |
          test -f _site/index.html || (echo "Missing index.html" && exit 1)
          test -f _site/assets/data/graph_manifest.json || (echo "Missing graph_manifest.json" && exit 1)
          test -f _site/assets/css/biology-matrix.css || (echo "Missing biology-matrix.css" && exit 1)
          test -f _site/biology/index.html || (echo "Missing /biology/" && exit 1)
          grep -q "biology-matrix-hub-wrapper" _site/biology/index.html || (echo "Biology Matrix wrapper missing from /biology/" && exit 1)
          grep -q "biology-matrix-card-link" _site/biology/index.html || (echo "Biology Matrix cards missing from /biology/" && exit 1)
          test -f _site/privacy-policy/index.html || (echo "Missing /privacy-policy/" && exit 1)
          test -f _site/terms-and-conditions/index.html || (echo "Missing /terms-and-conditions/" && exit 1)
          test -f _site/disclaimer/index.html || (echo "Missing /disclaimer/" && exit 1)
          test -f _site/contact/index.html || (echo "Missing /contact/" && exit 1)
          test -f _site/cookie-preferences/index.html || (echo "Missing /cookie-preferences/" && exit 1)
          test -f _site/welcome/index.html || (echo "Missing /welcome/" && exit 1)
          test -f _site/thank-you/index.html || (echo "Missing /thank-you/" && exit 1)
          grep -q "formspree.io/f/mgodyrbq" _site/contact/index.html || (echo "Contact Formspree endpoint missing" && exit 1)
          test -f _site/life-philosophy/index.html || (echo "Missing /life-philosophy/" && exit 1)
          test -f _site/synaptic-bridge/index.html || (echo "Missing /synaptic-bridge/" && exit 1)
          test -f _site/life-practices/index.html || (echo "Missing /life-practices/" && exit 1)
          test -f _site/life-practices/cognitive-audit/index.html || (echo "Missing /life-practices/cognitive-audit/" && exit 1)
          test -f _site/socratic/multiple-intelligences/index.html || (echo "Missing /socratic/multiple-intelligences/" && exit 1)
          test -f _site/socratic/personality-archetypes/index.html || (echo "Missing /socratic/personality-archetypes/" && exit 1)
          test -f _site/matrix/behavioral-axis/index.html || (echo "Missing /matrix/behavioral-axis/" && exit 1)
          test -f _site/matrix/decision-making/index.html || (echo "Missing /matrix/decision-making/" && exit 1)
          test -f _site/matrix/leadership-dynamics/index.html || (echo "Missing /matrix/leadership-dynamics/" && exit 1)
          test -f _site/matrix/systems-thinking/index.html || (echo "Missing /matrix/systems-thinking/" && exit 1)
          test -f _site/matrix/neuroplasticity/index.html || (echo "Missing /matrix/neuroplasticity/" && exit 1)
          ruby -rjson -e 'JSON.parse(File.read("_site/assets/data/graph_manifest.json")); puts "Graph manifest JSON validated."'
          echo "Build artifacts, utility pages, Biology Matrix hub, and OMEGA routes validated."

      - name: Optional Edge Graph Sync Hook
        if: success()
        env:
          EDGE_SYNC_ENDPOINT: ${{ secrets.EDGE_SYNC_ENDPOINT }}
          EDGE_SYNC_SECRET_TOKEN: ${{ secrets.EDGE_SYNC_SECRET_TOKEN }}
        run: |
          if [ -z "$EDGE_SYNC_ENDPOINT" ] || [ -z "$EDGE_SYNC_SECRET_TOKEN" ]; then
            echo "Edge sync secrets not configured. Skipping optional graph sync."
            exit 0
          fi
          curl -X POST "$EDGE_SYNC_ENDPOINT" \
            -H "Authorization: Bearer $EDGE_SYNC_SECRET_TOKEN" \
            -H "Content-Type: application/json" \
            --data-binary "@_site/assets/data/graph_manifest.json" \
            --fail-with-body

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages
          path: _site/
          retention-days: 1

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages
