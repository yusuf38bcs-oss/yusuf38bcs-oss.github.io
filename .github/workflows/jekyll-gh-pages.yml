# =========================================================================
# SOVEREIGN JEKYLL MASTER BUILD ENGINE
# Deploys to GitHub Pages with Jekyll 3.x (GitHub Pages compatible)
# =========================================================================

name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write    # Changed to write so it can dynamically handle lock configurations
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: false # Disabled cache temporarily so it doesn't enforce a frozen Gemfile.lock

      - name: Configure Bundler Deployment Settings
        run: |
          bundle config set --local frozen 'false'
          bundle install

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Build Jekyll Site
        run: bundle exec jekyll build --trace
        env:
          JEKYLL_ENV: production
          JEKYLL_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate Build Output
        run: |
          test -f _site/index.html || (echo "Missing index.html" && exit 1)
          test -f _site/sitemap.xml || (echo "Missing sitemap.xml" && exit 1)
          echo "Build artifacts validated."

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site/

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          folder: _site