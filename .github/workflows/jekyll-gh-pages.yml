name: Deploy Jekyll Site

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Ruby Environment
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4' # Synchronized perfectly with your local Ruby 3.4 engine
          bundler-cache: true

      - name: Setup GitHub Pages Deployment Metadata
        uses: actions/configure-pages@v5

      - name: Compile Sovereign Production Site (Jekyll 4.x Force)
        run: bundle exec jekyll build
        env:
          JEKYLL_ENV: production

      - name: Upload Clean Compiled Artifacts
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy Artifacts to Live Server Nodes
        id: deployment
        uses: actions/deploy-pages@v4