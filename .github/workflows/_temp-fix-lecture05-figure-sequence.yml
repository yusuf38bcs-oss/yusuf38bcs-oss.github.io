name: Temporary Lecture 05 Figure Sequence Fix

on:
  push:
    branches:
      - lesson/botany-chapter-01-forensic-audit-lecture-05
    paths:
      - .github/workflows/_temp-fix-lecture05-figure-sequence.yml
  pull_request:
    branches:
      - staging
    paths:
      - .github/workflows/_temp-fix-lecture05-figure-sequence.yml

permissions:
  contents: write

jobs:
  fix-sequence:
    if: github.actor != 'github-actions[bot]' && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout actual PR branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref || github.ref_name }}
      - name: Correct figure sequence
        shell: bash
        run: |
          set -euo pipefail
          file='_biology/hsc-corner/botany/lecture-05-golgi-body-lysosome-peroxisome.md'
          sed -i 's/চিত্র ৪: Cell maintenance system — package, clean and protect\./চিত্র ২: Cell maintenance system — package, clean and protect./' "$file"
          sed -i 's/চিত্র ২: ER থেকে Golgi হয়ে final destination-এ cargo flow।/চিত্র ৩: ER থেকে Golgi হয়ে final destination-এ cargo flow।/' "$file"
          sed -i 's/চিত্র ৩: Golgi, lysosome ও peroxisome-এর core comparison।/চিত্র ৪: Golgi, lysosome ও peroxisome-এর core comparison।/' "$file"
          grep -n '<figcaption>' "$file"
          git diff --check
      - name: Commit corrected lesson
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _biology/hsc-corner/botany/lecture-05-golgi-body-lysosome-peroxisome.md
          git commit -m "Correct Lecture 05 figure sequence"
          git push origin "HEAD:${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
