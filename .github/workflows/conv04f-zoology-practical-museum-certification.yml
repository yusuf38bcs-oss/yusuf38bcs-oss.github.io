name: CONV-04F-09 Practical Museum Module Certification

on:
  pull_request:
    branches: ["main"]
    types: [opened, synchronize, reopened, ready_for_review, edited]
    paths:
      - "_biology/higher-zoology-tree/practical/01-museum-specimens-complete.bn.md"
      - "_data/zoology-practical-213106-coverage.json"
      - "_data/zoology-practical-museum-figures.json"
      - "_data/academic/course_contract_v1.json"
      - "_data/academic/conv04f_zoology_practical_museum_v1.json"
      - "assets/css/zoology-practical.css"
      - "assets/js/zoology-practical.js"
      - "assets/css/academic-design-system.css"
      - "assets/css/zoology-practical-museum-f09.css"
      - "docs/academic/conv04/ACADEMIC_ROUTE_LEDGER.json"
      - "docs/academic/conv04/CONV04_STATE.md"
      - "docs/academic/conv04/ZOOLOGY_PRACTICAL_MUSEUM_F09_AUTHORIZATION.md"
      - ".github/scripts/validate-conv04f-zoology-practical-museum.rb"
      - ".github/scripts/conv04f-zoology-practical-museum-browser-certification.mjs"
      - ".github/workflows/conv04f-zoology-practical-museum-certification.yml"
  workflow_dispatch:
    inputs:
      expected_main_sha:
        description: "Exact main SHA to certify"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: conv04f-practical-museum-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  preview:
    name: Deploy exact-head Cloudflare Pages preview
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CANDIDATE_SHA: ${{ github.event.pull_request.head.sha }}
      TARGET_BRANCH: ${{ github.event.pull_request.head.ref }}
      CLOUDFLARE_ACCOUNT_ID: "13e317d6883a0f258ad7ed490699f849"
      CLOUDFLARE_PAGES_PROJECT: "yusuf38bcs-oss-github-io"
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PAGES_DEPLOY_TOKEN }}
    steps:
      - name: Check out immutable candidate
        uses: actions/checkout@v5
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 1
          persist-credentials: false

      - name: Authenticate exact head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test -z "$(git status --porcelain)"

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: false

      - name: Build exact-head Jekyll preview
        shell: bash
        env:
          JEKYLL_ENV: production
          JEKYLL_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          bundle install --jobs 4 --retry 3
          bundle exec jekyll clean
          bundle exec jekyll build --trace
          test -f _site/biology/higher-zoology-tree/practical/museum-specimens/index.html

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Deploy immutable preview
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          npx --yes wrangler@latest pages deploy _site \
            --project-name "$CLOUDFLARE_PAGES_PROJECT" \
            --branch "$TARGET_BRANCH" \
            --commit-hash "$CANDIDATE_SHA" \
            --commit-message "LBFL F-09 Museum exact-head certification $CANDIDATE_SHA" \
            --commit-dirty=false

  certify:
    name: CONV-04F-09 Museum exact-head certification
    needs: [preview]
    if: ${{ always() && (needs.preview.result == 'success' || needs.preview.result == 'skipped') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      F09_AUTHORIZED_BASE: "f04ac472ee261fa19dc17de6052bde02b75e99c4"
      CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.event.inputs.expected_main_sha || github.sha }}
      EXPECTED_MAIN_SHA: ${{ github.event.inputs.expected_main_sha || '' }}
      PR_BASE_REF: ${{ github.event.pull_request.base.ref || 'main' }}
      PR_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
      REPORT_DIR: conv04f-zoology-practical-museum-browser-report

    steps:
      - name: Check out immutable candidate
        uses: actions/checkout@v5
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Authenticate exact head and live base
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          git merge-base --is-ancestor "$F09_AUTHORIZED_BASE" "$CANDIDATE_SHA"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            remote="$(git ls-remote origin "refs/heads/$PR_BASE_REF" | awk '{print $1}')"
            test "$remote" = "$PR_BASE_SHA" || { echo "BASE CHANGED — RECERTIFICATION REQUIRED"; exit 1; }
            test "$PR_BASE_SHA" = "$F09_AUTHORIZED_BASE" || { echo "F-09 AUTHORIZED BASE MISMATCH"; exit 1; }
            git merge-base --is-ancestor "$remote" "$CANDIDATE_SHA" || { echo "STALE CANDIDATE"; exit 1; }
          else
            test -n "$EXPECTED_MAIN_SHA"
            remote="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
            test "$remote" = "$EXPECTED_MAIN_SHA"
            test "$CANDIDATE_SHA" = "$EXPECTED_MAIN_SHA"
            echo "PR_BASE_SHA=$F09_AUTHORIZED_BASE" >> "$GITHUB_ENV"
          fi

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: false

      - name: Certify F-09 Museum preservation and scope
        shell: bash
        run: |
          set -euo pipefail
          ruby -c .github/scripts/validate-conv04f-zoology-practical-museum.rb
          ruby .github/scripts/validate-conv04f-zoology-practical-museum.rb
          ruby scripts/zoology/validate_practical_213106.rb
          ruby .github/scripts/validate-conv04f-zoology-practical-gateway.rb
          git diff --check "$PR_BASE_SHA...HEAD"

      - name: Retain CONV-04 academic contracts
        shell: bash
        run: |
          set -euo pipefail
          ruby .github/scripts/validate-academic-surface-contract.rb
          ruby .github/scripts/validate-academic-design-system.rb
          ruby .github/scripts/validate-learning-guide-contract.rb
          ruby .github/scripts/validate-learning-guide-implementation.rb
          ruby .github/scripts/validate-gateway-convergence.rb
          ruby .github/scripts/validate-assessment-ownership.rb
          ruby .github/scripts/validate-assessment-gateway.rb
          ruby .github/scripts/validate-assessment-runtime-contract.rb
          ruby .github/scripts/validate-assessment-runtime-pilot.rb
          ruby .github/scripts/validate-assessment-runtime-second-bank.rb
          ruby .github/scripts/validate-assessment-runtime-third-bank.rb
          ruby .github/scripts/validate-conv04e-botany-gateway.rb
          python3 scripts/academic/validate_botany_chapter01_scope.py
          python3 scripts/academic/validate_botany_learner_content.py
          python3 scripts/academic/validate_botany_bot08_content.py
          ruby .github/scripts/validate-conv04f-hsc-zoology-gateway.rb
          ruby .github/scripts/validate-conv04f-higher-zoology-gateway.rb
          ruby .github/scripts/validate-conv04f-animal-diversity.rb
          ruby .github/scripts/validate-conv04f-ecology-route-ownership.rb
          ruby .github/scripts/validate-ecology-course.rb
          ruby .github/scripts/validate-conv04f-genetics.rb
          ruby .github/scripts/validate-conv04f-digestive-gateway.rb
          ruby .github/scripts/validate-conv04f-blood-circulation-revision.rb
          ruby .github/scripts/validate-zoology-academic-design.rb

      - name: Build exact-head production Jekyll
        shell: bash
        env:
          JEKYLL_ENV: production
        run: |
          set -euo pipefail
          bundle install --jobs 4 --retry 3
          bundle exec jekyll clean
          bundle exec jekyll build --trace
          rendered="_site/biology/higher-zoology-tree/practical/museum-specimens/index.html"
          test -f "$rendered"
          grep -q 'data-lbfl-academic-surface="v1"' "$rendered"
          grep -q 'data-lbfl-academic-role="practical"' "$rendered"
          grep -q 'data-lbfl-learning-guide="canonical"' "$rendered"
          grep -q '/assets/css/zoology-practical-museum-f09.css' "$rendered"
          ruby .github/scripts/validate-conv04f-zoology-practical-museum.rb
          ruby scripts/zoology/validate_practical_213106.rb

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install browser runtime
        shell: bash
        run: |
          set -euo pipefail
          node --check .github/scripts/conv04f-zoology-practical-museum-browser-certification.mjs
          npm install --no-save --ignore-scripts playwright@1.62.1 axe-core@4.13.0
          npx playwright install --with-deps chromium

      - name: Serve exact-head site
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --bind 127.0.0.1 --directory _site >"$RUNNER_TEMP/f09-http.log" 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/biology/higher-zoology-tree/practical/museum-specimens/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/f09-http.log"
          exit 1

      - name: Browser / Axe / keyboard / reflow / spacing / reduced-motion / no-JS
        shell: bash
        run: |
          set -euo pipefail
          node .github/scripts/conv04f-zoology-practical-museum-browser-certification.mjs \
            --base-url http://127.0.0.1:4173 \
            --output-dir "$REPORT_DIR"

      - name: Preserve F-09 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conv04f-zoology-practical-museum-${{ env.CANDIDATE_SHA }}
          path: ${{ env.REPORT_DIR }}
          if-no-files-found: warn
          retention-days: 30
