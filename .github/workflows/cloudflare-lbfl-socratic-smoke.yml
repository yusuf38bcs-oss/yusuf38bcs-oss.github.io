name: LBFL OpenAI production smoke

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lbfl-openai-production-smoke
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PRODUCTION_URL: https://api.learningbiologyforlife.org
      FALLBACK_TEXT: Your answer could not be evaluated safely. Refine your explanation by naming the biological structure, causal mechanism, and expected outcome.

    steps:
      - name: Verify OpenAI-backed Worker health and version
        shell: bash
        run: |
          set -euo pipefail
          health="$RUNNER_TEMP/health.json"
          headers="$RUNNER_TEMP/health.headers"
          curl --fail --silent --show-error -D "$headers" -o "$health" "$PRODUCTION_URL/api/health"
          node - "$health" "$headers" <<'NODE'
          const fs=require('node:fs');
          const [bp,hp]=process.argv.slice(2);
          const b=JSON.parse(fs.readFileSync(bp,'utf8'));
          const h=fs.readFileSync(hp,'utf8');
          const version=h.match(/^x-lbfl-worker-version:\s*([^\r\n]+)/im)?.[1]?.trim()||'';
          const provider=h.match(/^x-lbfl-ai-provider:\s*([^\r\n]+)/im)?.[1]?.trim()||'';
          if(b.ok!==true) throw new Error('health.ok must be true');
          if(b.environment!=='production') throw new Error(`Unexpected environment: ${b.environment}`);
          if(b.provider!=='openai'||provider!=='openai') throw new Error('Worker is not serving OpenAI provider');
          if(b.openai_key_configured!==true) throw new Error('OPENAI_API_KEY is not configured on Worker');
          if(b.model!=='gpt-5.6-terra') throw new Error(`Unexpected model: ${b.model}`);
          if(b.worker_version_id!==version) throw new Error('Worker version header/body mismatch');
          if(!/^[0-9a-f]{8}(?:-[0-9a-f]{4}){3}-[0-9a-f]{12}$/i.test(version)) throw new Error('Invalid Worker version id');
          console.log(JSON.stringify(b,null,2));
          NODE

      - name: Verify browser CORS contract
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error -D "$RUNNER_TEMP/cors.headers" -o /dev/null \
            -H 'Origin: https://learningbiologyforlife.org' "$PRODUCTION_URL/api/health"
          grep -Eiq '^access-control-allow-origin:\s*https://learningbiologyforlife\.org\s*$' "$RUNNER_TEMP/cors.headers"

      - name: Verify genuine OpenAI-backed Socratic result
        shell: bash
        run: |
          set -euo pipefail
          result="$RUNNER_TEMP/socratic.json"
          curl --fail --silent --show-error \
            -H 'Origin: https://learningbiologyforlife.org' \
            -H 'Content-Type: application/json' \
            -H 'Accept: application/json' \
            --data '{"type":"socratic_reflex","anomaly_question":"Why does heart rate rise when arterial blood pressure suddenly falls?","student_hypothesis":"The baroreceptor reflex reduces vagal output and increases sympathetic drive to restore cardiac output and pressure.","page_context":"/biology/hsc-corner/zoology/baroreceptor-reflex/","attempt_count":1}' \
            "$PRODUCTION_URL/api/socratic" > "$result"
          node - "$result" "$FALLBACK_TEXT" <<'NODE'
          const fs=require('node:fs');
          const [path,fallback]=process.argv.slice(2);
          const r=JSON.parse(fs.readFileSync(path,'utf8'));
          for(const key of ['mastery_achieved','feedback_text','next_vector','strike_count']) if(!(key in r)) throw new Error(`Missing ${key}`);
          if(r.feedback_text===fallback) throw new Error('Deterministic fallback detected');
          if(typeof r.mastery_achieved!=='boolean') throw new Error('mastery_achieved must be boolean');
          if(typeof r.feedback_text!=='string'||r.feedback_text.length<5) throw new Error('feedback_text invalid');
          if(typeof r.next_vector!=='string'||!r.next_vector.startsWith('/')) throw new Error('next_vector invalid');
          if(!Number.isInteger(r.strike_count)||r.strike_count<1||r.strike_count>3) throw new Error('strike_count invalid');
          console.log(JSON.stringify(r,null,2));
          NODE

      - name: Summarize production smoke
        shell: bash
        run: |
          {
            echo '# LBFL OpenAI production smoke'
            echo '- Worker: `lbfl-socratic-ai`'
            echo '- Endpoint: `https://api.learningbiologyforlife.org`'
            echo '- Provider: `OpenAI`'
            echo '- Model: `gpt-5.6-terra`'
            echo '- Health/version: `PASS`'
            echo '- CORS: `PASS`'
            echo '- Genuine Socratic execution: `PASS`'
            echo '- Mutation: `none`'
          } >> "$GITHUB_STEP_SUMMARY"
