# Definitive Fix for invisible BOM character error.
# This workflow is sanitized to force-clean the source code before Jekyll runs.

name: Deploy Jekyll site to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # --- THE CRITICAL FIX STEP STARTS HERE ---
      - name: Forcefully Sanitizing _config.yml (Remove Invisible Character)
        run: |
          echo "Verifying initial file state (should show unexpected bytes):"
          head -c 10 _config.yml | od -t x1

          echo "Applying fix using 'sed' to remove leading BOM (EF BB BF)."
          sed -i '1s/^\xef\xbb\xbf//' _config.yml

          echo "Verifying clean file state (should show first configuration keywords):"
          head -c 10 _config.yml | od -t x1
          echo "File sanitation complete."
      # --- THE CRITICAL FIX STEP ENDS HERE ---

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'
          bundler-cache: true
          cache-version: 0

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5
        
      - name: Build with Jekyll
        run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
