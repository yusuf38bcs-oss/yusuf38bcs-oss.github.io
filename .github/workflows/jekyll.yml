name: Deploy Jekyll Site to GitHub Pages

on:
  push:
    branches: [ "main" ]
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run and latest signup
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup GitHub Pages Configuration
        uses: actions/configure-pages@v5

      - name: Setup Ruby and Bundler Cache
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3' # Dynamically boots up stable execution engine
          bundler-cache: true # Automatically runs 'bundle install' and caches your gems!

      - name: Build Site with Jekyll Core
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      - name: Upload Compiled Artifacts
        uses: actions/upload-pages-artifact@v3

      - name: Deploy Live to GitHub Pages Production
        id: deployment
        uses: actions/deploy-pages@v4
