name: Release Governance Gate

# The policy is loaded from the trusted default branch (`main`). It governs PRs
# whose base is either `main` or `staging`, evaluates PR metadata through GitHub
# APIs, executes no candidate code, and reports a dedicated required commit
# status on the exact PR head.
on:
  pull_request_target:
    branches: ["main", "staging"]
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft, edited, closed]
  # PR review submissions are not an executable trusted-base event.
  # Recheck via the protected pull_request_target path (PR edited/reopened)
  # and repository-required review/conversation protection instead.

permissions:
  contents: read
  pull-requests: read
  statuses: write

env:
  GOVERNANCE_SCRIPT: |
    const eventPull = context.payload.pull_request;
    const owner = context.repo.owner;
    const repo = context.repo.repo;
    const eventAction = String(context.payload.action || '');
    const mode = String(process.env.EVALUATION_MODE || '');
    const lockedHeadSha = String(process.env.LOCKED_HEAD_SHA || '').toLowerCase();

    const STATUS_CONTEXT = 'LBFL Trusted Release Governance';
    const PROTECTED_BASES = new Set(['main', 'staging']);
    const SOLO_MAINTAINER = 'yusuf38bcs-oss';
    const SOLO_EXCEPTION_LINE =
      'SOLO-MAINTAINER-EXCEPTION: LBFL-PERMANENT-SOLO-MAINTAINER';
    const SOLO_APPROVAL_LABEL = 'SOLO-MAINTAINER-APPROVAL:';
    const target_url =
      `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;

    if (!eventPull || !eventPull.head) {
      throw new Error('Pull-request identity is missing from the event payload.');
    }
    if (!/^[0-9a-f]{40}$/.test(lockedHeadSha)) {
      throw new Error('Concurrency lane must be bound to an exact 40-character SHA.');
    }

    async function countUnresolved(pull_number) {
      const query = `
        query($owner: String!, $repo: String!, $number: Int!, $cursor: String) {
          repository(owner: $owner, name: $repo) {
            pullRequest(number: $number) {
              reviewThreads(first: 100, after: $cursor) {
                nodes { isResolved }
                pageInfo { hasNextPage endCursor }
              }
            }
          }
        }
      `;

      let cursor = null;
      let unresolved = 0;
      do {
        const data = await github.graphql(query, {
          owner,
          repo,
          number: pull_number,
          cursor,
        });
        const threads = data.repository.pullRequest.reviewThreads;
        unresolved += threads.nodes.filter((thread) => !thread.isResolved).length;
        cursor = threads.pageInfo.hasNextPage ? threads.pageInfo.endCursor : null;
      } while (cursor);
      return unresolved;
    }

    async function determineAuthority(pull, headSha) {
      const pull_number = Number(pull.number);
      const author = String(pull.user?.login || '').toLowerCase();
      const headOwner = String(pull.head?.repo?.owner?.login || '').toLowerCase();
      const repoOwner = String(owner || '').toLowerCase();
      const body = String(pull.body || '');

      // Permanent SOLO authority is the only current promotion mechanism.
      // Independent GitHub review approval is NOT an authority source while
      // rulesets require 0 approving reviews: dismissals would leave a stale
      // green commit status without a trusted, synchronous required-review rule.
      // Review comments remain mandatory to resolve via the protected ruleset.
      // Any future independent-review policy requires a server-side rule first.
      core.info('GOVERNANCE_SOLO_ONLY: independent-review status authorization disabled.');

      const lines = body.split(/\r?\n/).map((line) => line.trim());
      const exceptionLines = lines.filter((line) =>
        line.startsWith('SOLO-MAINTAINER-EXCEPTION:')
      );
      const approvalLines = lines.filter((line) =>
        line.startsWith(SOLO_APPROVAL_LABEL)
      );
      const expectedApprovalLine = `${SOLO_APPROVAL_LABEL} ${headSha}`;

      const identityEligible =
        repoOwner === SOLO_MAINTAINER &&
        author === SOLO_MAINTAINER &&
        headOwner === SOLO_MAINTAINER;
      const markerEligible =
        exceptionLines.length === 1 &&
        exceptionLines[0] === SOLO_EXCEPTION_LINE &&
        approvalLines.length === 1 &&
        approvalLines[0] === expectedApprovalLine;

      if (!identityEligible || !markerEligible) {
        throw new Error(
          'No valid permanent solo-maintainer ' +
          `authority. The owner-authored PR body must contain exactly "${SOLO_EXCEPTION_LINE}" ` +
          `and "${expectedApprovalLine}". A new commit invalidates the marker.`
        );
      }
      return 'solo-maintainer-exact-head';
    }


    // CONV04F_TRUSTED_MIGRATION_POLICY_V1: One-time seven-file protection.
    // Executes ONLY from protected main's pull_request_target governance.
    // A separate SHA-scoped authorization status is deliberately forbidden:
    // the existing required LBFL Trusted Release Governance check owns this decision.
    async function verifyOneTimePracticalValidatorMigration(pull, headSha, baseSha) {
      if (Number(pull.number) !== 468) return;
      if (String(pull.base?.ref || '') !== 'main') {
        throw new Error('PR #468 migration authority requires protected main.');
      }
      if (String(pull.head?.ref || '') !==
          'repair/conv04f-retained-validator-j-compat-20261010') {
        throw new Error('PR #468 migration branch identity mismatch.');
      }
      const permitted = {
            ".github/scripts/validate-conv04f-zoology-practical-museum.rb": [
                  "43aa1d96c71e524f0af4eca954766e51e9c423f5",
                  "57fa42431ced38f17dd48dbb76be2acf0f324487"
            ],
            ".github/scripts/validate-conv04f-zoology-practical-whole-mounts.rb": [
                  "fc9b9f07164676798b4f98fe7802053dddd0f929",
                  "51ea08d567ae46cfa8732c6538457f970bc2f832"
            ],
            ".github/scripts/validate-conv04f-zoology-practical-field-report.rb": [
                  "cef2b7aca4f5a388421d89e39213947016341e43",
                  "ab1c600a75611c41a349a4e9fbc15084e09eca21"
            ],
            ".github/scripts/validate-conv04f-zoology-practical-temporary-mounts.rb": [
                  "4e588a411174b23225a8bb5d796e77f48af573ac",
                  "6f9ff0be5ad7c9a244b5c1e468bc89306cbae335"
            ],
            ".github/scripts/validate-conv04f-zoology-practical-permanent-slides.rb": [
                  "7efc49f9a063385e18dda50221f30bfb865f2cdb",
                  "cac8c14cbc6e3ef22ac871a8e63a450016fbda81"
            ],
            ".github/scripts/validate-conv04f-zoology-practical-appendages.rb": [
                  "e0b25189300804447108bcc201e97653330e0e87",
                  "669f6acd66e87922e5cd3a6007aa3ff50c20e4ee"
            ],
            ".github/scripts/validate-conv04f-zoology-practical-dissection.rb": [
                  "7318e8c3215838093b68978760746e9c4240fb72",
                  "f3ba18ec34ccf13f13203ed7eac8c14d0dcb7e3c"
            ]
      };
      const expectedPaths = Object.keys(permitted).sort();
      const actualFiles = await github.paginate(github.rest.pulls.listFiles, {
        owner, repo, pull_number: 468, per_page: 100,
      });
      if (
        actualFiles.length !== expectedPaths.length ||
        actualFiles.some((f) => f.status !== 'modified') ||
        actualFiles.map((f) => String(f.filename)).sort().join('\n') !==
          expectedPaths.join('\n')
      ) {
        throw new Error('PR #468 migration touched files beyond the exact protected seven.');
      }

      async function protectedTree(revision) {
        const commit = await github.rest.git.getCommit({
          owner, repo, commit_sha: revision,
        });
        const treeSha = String(commit.data.tree?.sha || '');
        if (!/^[0-9a-f]{40}$/.test(treeSha)) {
          throw new Error('Missing authenticated tree SHA for migration revision.');
        }
        const response = await github.rest.git.getTree({
          owner, repo, tree_sha: treeSha, recursive: 'true',
        });
        if (response.data.truncated) {
          throw new Error('Migration protected tree inspection was truncated.');
        }
        const found = new Map();
        for (const entry of response.data.tree || []) {
          if (Object.prototype.hasOwnProperty.call(permitted, entry.path)) {
            if (found.has(entry.path)) {
              throw new Error('Duplicate protected path in Git tree.');
            }
            found.set(entry.path, entry);
          }
        }
        if (found.size !== expectedPaths.length) {
          throw new Error('Missing protected validator in authenticated Git tree.');
        }
        return found;
      }
      const [baseTree, headTree] = await Promise.all([
        protectedTree(baseSha), protectedTree(headSha),
      ]);
      for (const path of expectedPaths) {
        const [approvedBefore, approvedAfter] = permitted[path];
        const before = baseTree.get(path);
        const after = headTree.get(path);
        if (
          before.sha !== approvedBefore || after.sha !== approvedAfter ||
          before.mode !== '100644' || after.mode !== '100644' ||
          before.type !== 'blob' || after.type !== 'blob'
        ) {
          throw new Error('Protected validator SHA/mode/type mismatch: ' + path);
        }
      }
      core.info('CONV04F_TRUSTED_MIGRATION_PASS: PR #468 exact seven-file SHA/mode/type verified.');
    }

    async function evaluatePull(initialPull) {
      const pull_number = Number(initialPull.number);
      if (!pull_number) {
        throw new Error('Pull-request number is missing or malformed.');
      }

      // Never trust event-payload promotion metadata. Re-read the PR before
      // evaluating draft state, exact head/base identity, or authority.
      const freshResponse = await github.rest.pulls.get({ owner, repo, pull_number });
      const pull = freshResponse.data;
      const headSha = String(pull.head?.sha || '').toLowerCase();
      const headOwner = String(pull.head?.repo?.owner?.login || '').toLowerCase();
      const headRef = String(pull.head?.ref || '');
      const payloadBaseSha = String(pull.base?.sha || '').toLowerCase();
      const baseRef = String(pull.base?.ref || '');

      if (!/^[0-9a-f]{40}$/.test(headSha)) {
        throw new Error('PR head must be an exact 40-character SHA.');
      }
      if (headSha !== lockedHeadSha) {
        throw new Error(
          `PR #${pull_number} refreshed to ${headSha}, but this evaluator owns ` +
          `concurrency lane ${lockedHeadSha}; aborting stale-lane evaluation.`
        );
      }
      if (!PROTECTED_BASES.has(baseRef)) {
        core.info(`Ignoring governance evaluation for unprotected base ${baseRef}.`);
        return;
      }

      async function reportStatus(state, description) {
        await github.rest.repos.createCommitStatus({
          owner,
          repo,
          sha: headSha,
          state,
          context: STATUS_CONTEXT,
          description: String(description).slice(0, 140),
          target_url,
        });
      }

      await reportStatus('pending', 'Trusted exact-head governance evaluation is running.');

      try {
        if (pull.state !== 'open') {
          throw new Error('Only open PRs have promotion authority.');
        }
        if (pull.draft) {
          throw new Error('Draft PRs have no promotion authority.');
        }
        if (!/^[0-9a-f]{40}$/.test(payloadBaseSha) || !baseRef) {
          throw new Error('Target base identity is incomplete or malformed.');
        }
        if (!headOwner || !headRef) {
          throw new Error('Head repository identity is incomplete.');
        }

        const openPulls = await github.paginate(github.rest.pulls.list, {
          owner,
          repo,
          state: 'open',
          per_page: 100,
        });
        const sharedProtectedHeadPulls = openPulls.filter((candidate) => {
          const candidateNumber = Number(candidate.number);
          const candidateBase = String(candidate.base?.ref || '');
          const candidateHeadSha = String(candidate.head?.sha || '').toLowerCase();
          return (
            candidateNumber !== pull_number &&
            PROTECTED_BASES.has(candidateBase) &&
            candidateHeadSha === headSha
          );
        });
        if (sharedProtectedHeadPulls.length !== 0) {
          const conflicts = sharedProtectedHeadPulls
            .map((candidate) => `#${candidate.number}->${candidate.base?.ref || 'unknown'}`)
            .sort()
            .join(', ');
          throw new Error(
            `Head ${headSha} is shared by multiple protected-base PRs: ` +
            `#${pull_number}->${baseRef}, ${conflicts}. Trusted governance status is ambiguous.`
          );
        }

        const baseBranch = await github.rest.repos.getBranch({ owner, repo, branch: baseRef });
        const currentBaseSha = String(baseBranch.data.commit?.sha || '').toLowerCase();
        if (currentBaseSha !== payloadBaseSha) {
          throw new Error(
            `Target base advanced from ${payloadBaseSha} to ${currentBaseSha}; rerun at the new base.`
          );
        }

        const comparison = await github.rest.repos.compareCommitsWithBasehead({
          owner,
          repo,
          basehead: `${currentBaseSha}...${headSha}`,
        });
        const mergeBaseSha = String(comparison.data.merge_base_commit?.sha || '').toLowerCase();
        if (mergeBaseSha !== currentBaseSha) {
          throw new Error(
            `Candidate ${headSha} does not contain current ${baseRef}@${currentBaseSha}.`
          );
        }

        await verifyOneTimePracticalValidatorMigration(pull, headSha, currentBaseSha);

        let authority = await determineAuthority(pull, headSha);
        let unresolved = await countUnresolved(pull_number);
        if (unresolved !== 0) {
          throw new Error(`${unresolved} unresolved review thread(s) remain.`);
        }

        // Same-SHA concurrency serializes this evaluation against all current
        // events for the same head. Re-read ambiguity, PR state/draft, authority,
        // and review threads immediately before publishing success.
        const finalOpenPulls = await github.paginate(github.rest.pulls.list, {
          owner,
          repo,
          state: 'open',
          per_page: 100,
        });
        const finalConflicts = finalOpenPulls.filter((candidate) => {
          const candidateNumber = Number(candidate.number);
          const candidateBase = String(candidate.base?.ref || '');
          const candidateHeadSha = String(candidate.head?.sha || '').toLowerCase();
          return (
            candidateNumber !== pull_number &&
            PROTECTED_BASES.has(candidateBase) &&
            candidateHeadSha === headSha
          );
        });
        if (finalConflicts.length !== 0) {
          const conflicts = finalConflicts
            .map((candidate) => `#${candidate.number}->${candidate.base?.ref || 'unknown'}`)
            .sort()
            .join(', ');
          throw new Error(
            `Head ${headSha} became shared before success: ${conflicts}. ` +
            'Trusted governance status is ambiguous.'
          );
        }

        const finalResponse = await github.rest.pulls.get({ owner, repo, pull_number });
        const finalPull = finalResponse.data;
        const finalHeadSha = String(finalPull.head?.sha || '').toLowerCase();
        const finalBaseRef = String(finalPull.base?.ref || '');
        const finalBaseSha = String(finalPull.base?.sha || '').toLowerCase();
        if (
          finalPull.state !== 'open' ||
          finalPull.draft ||
          finalHeadSha !== headSha ||
          finalHeadSha !== lockedHeadSha ||
          finalBaseRef !== baseRef ||
          finalBaseSha !== currentBaseSha
        ) {
          throw new Error(
            `PR #${pull_number} state or exact head/base identity changed before success; rerun.`
          );
        }

        authority = await determineAuthority(finalPull, headSha);
        unresolved = await countUnresolved(pull_number);
        if (unresolved !== 0) {
          throw new Error(`${unresolved} unresolved review thread(s) remain.`);
        }

        await reportStatus(
          'success',
          `PASS at ${headSha.slice(0, 12)}: ${authority}; zero unresolved threads.`
        );
        core.info(
          `RELEASE_GOVERNANCE_GATE_PASS at ${headSha}: authority=${authority}, ` +
          'current base contained, zero unresolved threads.'
        );
      } catch (error) {
        await reportStatus('failure', `FAIL: ${error.message || error}`);
        throw error;
      }
    }

    let targetPulls = [];
    if (mode === 'current') {
      targetPulls = [eventPull];
      core.info(
        `Evaluating current PR #${eventPull.number} at head ${eventPull.head?.sha || 'unknown'} ` +
        `inside lane ${lockedHeadSha}.`
      );
    } else if (mode === 'released') {
      if (!['closed', 'synchronize'].includes(eventAction)) {
        core.info(`No released-head refresh is needed for action ${eventAction}.`);
        return;
      }
      const affectedHeadSha = String(
        eventAction === 'synchronize'
          ? context.payload.before || ''
          : eventPull.head?.sha || ''
      ).toLowerCase();
      if (!/^[0-9a-f]{40}$/.test(affectedHeadSha)) {
        throw new Error('Released head must be an exact 40-character SHA.');
      }
      if (affectedHeadSha !== lockedHeadSha) {
        throw new Error(
          `Released head ${affectedHeadSha} does not match concurrency lane ${lockedHeadSha}.`
        );
      }

      const openPulls = await github.paginate(github.rest.pulls.list, {
        owner,
        repo,
        state: 'open',
        per_page: 100,
      });
      targetPulls = openPulls.filter((candidate) => {
        const candidateNumber = Number(candidate.number);
        const candidateBase = String(candidate.base?.ref || '');
        const candidateHeadSha = String(candidate.head?.sha || '').toLowerCase();
        return (
          candidateNumber !== Number(eventPull.number) &&
          PROTECTED_BASES.has(candidateBase) &&
          candidateHeadSha === affectedHeadSha
        );
      });
      core.info(
        `Released head ${affectedHeadSha}; re-evaluating ` +
        `${targetPulls.length} open protected-base survivor(s).`
      );
    } else {
      throw new Error(`Unknown governance evaluation mode: ${mode || 'empty'}.`);
    }

    const evaluationErrors = [];
    for (const pull of targetPulls) {
      try {
        await evaluatePull(pull);
      } catch (error) {
        evaluationErrors.push(`#${pull.number}: ${error.message || error}`);
      }
    }
    if (evaluationErrors.length !== 0) {
      throw new Error(evaluationErrors.join(' | '));
    }

jobs:
  current-head-governance:
    name: Trusted governance — current head
    # Drafts rerun only when head/base/eligibility can invalidate a prior trusted status.
    # Non-Drafts continue to evaluate on every configured PR/review event.
    if: >-
      github.event.action != 'closed' &&
      (
        github.event.pull_request.base.ref == 'main' ||
        github.event.pull_request.base.ref == 'staging'
      ) &&
      (
        github.event.pull_request.draft == false ||
        (
          github.event_name == 'pull_request_target' &&
          (
            contains(
              fromJSON('["opened","synchronize","reopened","converted_to_draft"]'),
              github.event.action
            ) ||
            (
              github.event.action == 'edited' &&
              github.event.changes.base != null
            )
          )
        )
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: release-governance-${{ github.event.pull_request.head.sha }}
      cancel-in-progress: false
    env:
      EVALUATION_MODE: current
      LOCKED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Evaluate current exact-head policy
        uses: actions/github-script@v8
        with:
          script: ${{ env.GOVERNANCE_SCRIPT }}

  released-head-refresh:
    name: Trusted governance — released head survivors
    if: github.event.action == 'closed' || github.event.action == 'synchronize'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: release-governance-${{ github.event.action == 'synchronize' && github.event.before || github.event.pull_request.head.sha }}
      cancel-in-progress: false
    env:
      EVALUATION_MODE: released
      LOCKED_HEAD_SHA: ${{ github.event.action == 'synchronize' && github.event.before || github.event.pull_request.head.sha }}
    steps:
      - name: Re-evaluate surviving PRs on released head
        uses: actions/github-script@v8
        with:
          script: ${{ env.GOVERNANCE_SCRIPT }}