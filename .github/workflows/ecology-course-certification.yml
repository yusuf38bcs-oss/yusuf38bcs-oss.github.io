name: Ecology V2 10-Lecture Exact-Head Certification

on:
  pull_request:
    branches: ["staging", "main"]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "_biology/higher-zoology-tree/ecology/**"
      - "_layouts/single.html"
      - "_includes/head/head.html"
      - "assets/css/zoology-academic.css"
      - ".github/scripts/validate-ecology-course.rb"
      - ".github/scripts/ecology-presentation-browser-certification.mjs"
      - ".github/workflows/ecology-course-certification.yml"
      - ".github/workflows/ecology-production-live-certification.yml"
      - ".github/scripts/ecology-production-live-certification.mjs"
      - "ecology-sitemap.xml"
      - "robots.txt"
      - "_pages/hubs/biology.md"
      - "_pages/ecology-v2-gateway.md"
      - "_pages/ecology-v2-gateway.bn.md"
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: ecology-v2-10-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  certify:
    name: certify
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CERTIFICATION_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Check out immutable candidate head
        uses: actions/checkout@v5
        with: {ref: "${{ env.CERTIFICATION_HEAD_SHA }}", fetch-depth: 0, persist-credentials: false}
      - name: Authenticate exact head and current protected base
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"; test "$actual" = "$PR_HEAD_SHA" || { echo "HEAD CHANGED — RECERTIFICATION REQUIRED"; exit 1; }
          remote="$(git ls-remote origin "refs/heads/$PR_BASE_REF" | awk '{print $1}')"; test "$remote" = "$PR_BASE_SHA" || { echo "BASE CHANGED — RECERTIFICATION REQUIRED"; exit 1; }
          git fetch --no-tags origin "refs/heads/$PR_BASE_REF:refs/remotes/origin/$PR_BASE_REF"; git merge-base --is-ancestor "$remote" "$actual" || { echo "STALE PR HEAD — CURRENT BASE IS NOT AN ANCESTOR"; exit 1; }
      - name: Set up Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b
        with: {ruby-version: "3.2", bundler-cache: true}
      - name: Validate Ecology V2 source contract
        run: ruby .github/scripts/validate-ecology-course.rb
      - name: Build exact-head production site
        run: JEKYLL_ENV=production bundle exec jekyll clean && JEKYLL_ENV=production bundle exec jekyll build --trace
      - name: Validate rendered bilingual routes
        run: ruby .github/scripts/validate-ecology-course.rb
      - name: Set up Node
        uses: actions/setup-node@v4
        with: {node-version: "24"}
      - name: Install pinned browser dependencies
        run: npm install --no-save --ignore-scripts playwright@1.62.1 axe-core@4.13.0 && npx playwright install --with-deps chromium
      - name: Serve exact-head build
        shell: bash
        run: |
          python3 -m http.server 4173 --directory _site >/tmp/ecology-v2-http.log 2>&1 &
          for i in $(seq 1 20); do curl --fail --silent http://127.0.0.1:4173/biology/higher-zoology-tree/ecology/ >/dev/null && exit 0; sleep 1; done; exit 1
      - name: Certify bilingual presentation at 390/768/1280
        run: node .github/scripts/ecology-presentation-browser-certification.mjs --site-dir _site --base-url http://127.0.0.1:4173 --output-dir ecology-v2-10-browser-report
      - name: Preserve browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with: {name: "ecology-v2-10-${{ env.CERTIFICATION_HEAD_SHA }}", path: ecology-v2-10-browser-report, if-no-files-found: error, retention-days: 30}
      - name: Record exact-head PASS
        if: success()
        run: |
          echo "ECOLOGY_V2_10_EXACT_HEAD_PASS" >> "$GITHUB_STEP_SUMMARY"
          echo "- 10 lecture pairs / 20 learner pages" >> "$GITHUB_STEP_SUMMARY"
          echo "- 60 lecture viewport checks at 390 / 768 / 1280" >> "$GITHUB_STEP_SUMMARY"
          echo "- previous Ecology lecture set removed" >> "$GITHUB_STEP_SUMMARY"