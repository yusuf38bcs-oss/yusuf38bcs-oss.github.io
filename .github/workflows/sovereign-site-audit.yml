name: Sovereign Site Audit v4

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: false

      - name: Install Dependencies
        run: |
          bundle config set --local frozen 'false'
          bundle install

      - name: Clean Previous Site Output
        run: bundle exec jekyll clean

      - name: Build Site for Audit
        run: bundle exec jekyll build --trace
        env:
          JEKYLL_ENV: production

      - name: Run 14 Phase Sovereign Audit
        run: python3 scripts/sovereign_site_audit.py

      - name: Upload Audit Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sovereign-site-audit-v4
          path: audit-reports/sovereign-site-audit-v4.json
          retention-days: 14
