name: LBFL OpenAI Execution Proof

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prove-openai-execution:
    name: Prove lbfl-socratic-ai uses OpenAI
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      PRODUCTION_URL: https://api.learningbiologyforlife.org
      MODEL: gpt-5.6-terra
      FALLBACK_TEXT: Your answer could not be evaluated safely. Refine your explanation by naming the biological structure, causal mechanism, and expected outcome.

    steps:
      - name: Fail closed on OpenAI credential
        shell: bash
        run: |
          set -euo pipefail
          test -n "$OPENAI_API_KEY" || { echo "OPENAI_API_KEY is missing"; exit 1; }

      - name: Prove direct OpenAI key, model, and Structured Outputs
        shell: bash
        run: |
          set -euo pipefail
          body="$RUNNER_TEMP/openai-direct.json"
          response="$RUNNER_TEMP/openai-direct-response.json"
          cat > "$body" <<'JSON'
          {
            "model":"gpt-5.6-terra",
            "store":false,
            "reasoning":{"effort":"low"},
            "max_output_tokens":200,
            "input":[{"role":"user","content":"Return the required JSON status."}],
            "text":{"format":{"type":"json_schema","name":"lbfl_openai_proof","strict":true,"schema":{"type":"object","properties":{"status":{"type":"string","enum":["LBFL_OPENAI_OK"]}},"required":["status"],"additionalProperties":false}}}
          }
          JSON
          status="$(curl --silent --show-error -o "$response" -w '%{http_code}' \
            -H 'Content-Type: application/json' \
            -H "Authorization: Bearer $OPENAI_API_KEY" \
            --data-binary "@$body" https://api.openai.com/v1/responses)"
          echo "OpenAI Responses API HTTP status: $status"
          if [[ "$status" != "200" ]]; then
            node - "$response" <<'NODE'
          const fs=require('node:fs'); const j=JSON.parse(fs.readFileSync(process.argv[2],'utf8')); console.error(j?.error?.message||JSON.stringify(j));
          NODE
            exit 1
          fi
          node - "$response" <<'NODE'
          const fs=require('node:fs');
          const data=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          const message=(data.output||[]).find(x=>x.type==='message');
          const item=(message?.content||[]).find(x=>x.type==='output_text');
          if(!item?.text) throw new Error('No output_text from OpenAI');
          const parsed=JSON.parse(item.text);
          if(parsed.status!=='LBFL_OPENAI_OK') throw new Error('Structured output mismatch');
          console.log('Direct OpenAI execution: PASS');
          NODE

      - name: Verify production Worker OpenAI binding
        id: health
        shell: bash
        run: |
          set -euo pipefail
          health="$RUNNER_TEMP/health.json"; headers="$RUNNER_TEMP/health.headers"
          curl --fail --silent --show-error -D "$headers" -o "$health" "$PRODUCTION_URL/api/health"
          node - "$health" "$headers" "$GITHUB_OUTPUT" <<'NODE'
          const fs=require('node:fs');
          const [bp,hp,out]=process.argv.slice(2);
          const b=JSON.parse(fs.readFileSync(bp,'utf8')); const h=fs.readFileSync(hp,'utf8');
          const version=h.match(/^x-lbfl-worker-version:\s*([^\r\n]+)/im)?.[1]?.trim()||'';
          const provider=h.match(/^x-lbfl-ai-provider:\s*([^\r\n]+)/im)?.[1]?.trim()||'';
          if(b.ok!==true||b.provider!=='openai'||provider!=='openai'||b.openai_key_configured!==true||b.model!=='gpt-5.6-terra'||b.worker_version_id!==version) throw new Error('Production OpenAI health contract failed');
          fs.appendFileSync(out,`worker_version_id=${version}\n`);
          console.log(JSON.stringify(b,null,2));
          NODE

      - name: Require genuine OpenAI-backed Socratic result
        shell: bash
        run: |
          set -euo pipefail
          result="$RUNNER_TEMP/socratic.json"
          curl --fail --silent --show-error \
            -H 'Origin: https://learningbiologyforlife.org' \
            -H 'Content-Type: application/json' \
            --data '{"type":"socratic_reflex","anomaly_question":"Why does heart rate rise when arterial blood pressure suddenly falls?","student_hypothesis":"The baroreceptor reflex reduces vagal output and increases sympathetic drive to restore cardiac output and pressure.","page_context":"/biology/hsc-corner/zoology/baroreceptor-reflex/","attempt_count":1}' \
            "$PRODUCTION_URL/api/socratic" > "$result"
          node - "$result" "$FALLBACK_TEXT" <<'NODE'
          const fs=require('node:fs'); const [path,fallback]=process.argv.slice(2); const r=JSON.parse(fs.readFileSync(path,'utf8'));
          for(const k of ['mastery_achieved','feedback_text','next_vector','strike_count']) if(!(k in r)) throw new Error(`Missing ${k}`);
          if(r.feedback_text===fallback) throw new Error('Deterministic fallback detected');
          console.log(JSON.stringify(r,null,2));
          NODE

      - name: Record genuine OpenAI execution proof
        shell: bash
        env:
          WORKER_VERSION_ID: ${{ steps.health.outputs.worker_version_id }}
        run: |
          {
            echo '# LBFL OpenAI execution proof'
            echo '- Worker: `lbfl-socratic-ai`'
            echo '- Endpoint: `https://api.learningbiologyforlife.org`'
            echo "- Worker version ID: \`$WORKER_VERSION_ID\`"
            echo '- Provider: `OpenAI`'
            echo '- Model: `gpt-5.6-terra`'
            echo '- Direct Responses API + Structured Outputs: `PASS`'
            echo '- Deterministic fallback detected: `NO`'
            echo '- Genuine OpenAI-backed Socratic execution: `PASS`'
            echo '- Mutation: `none`'
          } >> "$GITHUB_STEP_SUMMARY"
