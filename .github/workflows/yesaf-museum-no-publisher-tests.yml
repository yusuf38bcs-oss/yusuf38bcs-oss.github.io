# Unprivileged source-only security regression; NOT a production release check.
name: YESAF E4 Museum Writer Containment Fixtures
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - ".github/workflows/conv04f-zoology-practical-museum-certification.yml"
      - ".github/scripts/test-yesaf-museum-no-publisher.mjs"
      - ".github/workflows/yesaf-museum-no-publisher-tests.yml"
permissions:
  contents: read
jobs:
  museum-writer-containment:
    name: Museum source publisher removed (non-authorizing)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out immutable PR head without stored credentials
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Confirm exact candidate source
        env:
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Run negative Museum credential / writer scope fixtures
        run: node --test .github/scripts/test-yesaf-museum-no-publisher.mjs
