# Unprivileged, additive Museum successor regression; not production approval.
name: YESAF E4 Museum Read-Only Successor Fixtures
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - ".github/workflows/yesaf-museum-readonly-certification.yml"
      - ".github/scripts/test-yesaf-museum-no-publisher.mjs"
      - ".github/workflows/yesaf-museum-no-publisher-tests.yml"
permissions:
  contents: read
jobs:
  museum-readonly-successor:
    name: Museum immutable legacy + successor read-only fixtures
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out exact candidate with no stored credentials
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Confirm immutable candidate HEAD
        env:
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Execute fail-closed successor and predecessor source tests
        run: node --test .github/scripts/test-yesaf-museum-no-publisher.mjs
