name: HSC Botany BOT-07 Learner Content Certification

on:
  pull_request:
    branches: ["main"]
    types: [opened, synchronize, reopened, ready_for_review, edited]
    paths:
      - "_biology/hsc-corner/botany/lecture-07-cell-wall-vacuole.md"
      - "_biology/hsc-corner/botany/lecture-08-*.md"
      - "_biology/hsc-corner/botany/lecture-06-mitochondria.md"
      - "_biology/hsc-corner/botany/chapter-01-cell-and-its-structure.md"
      - "_biology/hsc-corner/botany/index.md"
      - "_data/academic/hsc_botany_chapter01_scope_v1.json"
      - "docs/academic/CONV-03C01_BOT07_CONTENT_REVIEW.md"
      - "scripts/academic/validate_botany_learner_content.py"
      - "scripts/academic/validate_botany_chapter01_scope.py"
      - ".github/workflows/hsc-botany-bot07-content-certification.yml"
  workflow_dispatch:
    inputs:
      expected_main_sha:
        description: "Exact main SHA to certify"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: hsc-botany-bot07-content-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  certify:
    name: CONV-03C-01 BOT-07 learner content
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.event.inputs.expected_main_sha || github.sha }}
      EXPECTED_MAIN_SHA: ${{ github.event.inputs.expected_main_sha || '' }}
      PR_BASE_REF: ${{ github.event.pull_request.base.ref || 'main' }}
      PR_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}

    steps:
      - name: Check out immutable candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Authenticate exact head and live base
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$CANDIDATE_SHA"

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            remote="$(git ls-remote origin "refs/heads/$PR_BASE_REF" | awk '{print $1}')"
            test "$remote" = "$PR_BASE_SHA" || { echo "BASE CHANGED — RECERTIFICATION REQUIRED"; exit 1; }
            git merge-base --is-ancestor "$remote" "$actual" || { echo "STALE CANDIDATE"; exit 1; }
          else
            test -n "$EXPECTED_MAIN_SHA" || { echo "expected_main_sha is required"; exit 1; }
            remote_main="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
            test "$remote_main" = "$EXPECTED_MAIN_SHA" || { echo "MAIN ADVANCED"; exit 1; }
            test "$actual" = "$EXPECTED_MAIN_SHA" || { echo "MANUAL HEAD MISMATCH"; exit 1; }
          fi

          printf 'CONV-03C-01 exact head: %s\n' "$CANDIDATE_SHA"

      - name: Validate BOT-07 learner content
        run: python3 scripts/academic/validate_botany_learner_content.py

      - name: Validate Chapter-01 scope after BOT-07
        run: python3 scripts/academic/validate_botany_chapter01_scope.py

      - name: Preserve BOT-07 certification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hsc-botany-bot07-content-${{ env.CANDIDATE_SHA }}
          path: |
            bot07-learner-content-report.json
            hsc-botany-chapter01-scope-report.json
          if-no-files-found: error
          retention-days: 30
