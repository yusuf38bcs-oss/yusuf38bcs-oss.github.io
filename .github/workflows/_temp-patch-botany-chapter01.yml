name: Temporary Botany Chapter 01 Production Patch

on:
  push:
    branches:
      - lesson/botany-chapter-01-forensic-audit-lecture-05
    paths:
      - scripts/_patch_botany_chapter01_runner.py
      - scripts/_patch_botany_chapter01_code.lzma.b64
      - scripts/_lecture05_payload.lzma.b64
      - .github/workflows/_temp-patch-botany-chapter01.yml
  pull_request:
    branches:
      - staging
    paths:
      - scripts/_patch_botany_chapter01_runner.py
      - scripts/_patch_botany_chapter01_code.lzma.b64
      - scripts/_lecture05_payload.lzma.b64
      - .github/workflows/_temp-patch-botany-chapter01.yml

permissions:
  contents: write

jobs:
  apply-production-fix:
    if: github.actor != 'github-actions[bot]' && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout actual audit branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref || github.ref_name }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deterministic dependencies
        run: python -m pip install --disable-pip-version-check pillow pyyaml beautifulsoup4
      - name: Apply and validate production fix
        run: python scripts/_patch_botany_chapter01_runner.py
      - name: Commit production set and remove bootstrap
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "No generated changes."; exit 1; }
          git commit -m "Audit Botany Chapter 01 and publish Lecture 05"
          git push origin "HEAD:${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
