# YESAF E4 successor guard v2 — candidate only until separately owner-approved
# one-time predecessor-policy migration. This workflow is READ-ONLY.
name: CONV-04F-09 Zooplankton Successor Guard V2

on:
  pull_request_target:
    branches: ["main"]
    types: [opened, synchronize, reopened, ready_for_review, edited]

permissions:
  actions: read
  contents: read
  pull-requests: read

concurrency:
  group: conv04f-practical-zooplankton-successor-guard-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  trusted_successor_guard:
    name: Trusted predecessor R91 successor immutability v2
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout only the immutable trusted-main workflow revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Review immutable successor and exact retirement blob (no secrets)
        uses: actions/github-script@v8
        with:
          script: |
            const { pathToFileURL } = require('node:url');
            const { resolve } = require('node:path');
            const code = pathToFileURL(resolve(process.env.GITHUB_WORKSPACE,
              '.github/scripts/yesaf-e4-successor-v2-policy.mjs')).href;
            const { auditTrustedSuccessor } = await import(code);
            await auditTrustedSuccessor({ github, context, core, guardName: 'R91' });
