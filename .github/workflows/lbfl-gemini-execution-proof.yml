name: LBFL Gemini Execution Proof

on:
  pull_request:
    branches: ["main"]
    types: [opened, reopened, synchronize]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prove-gemini-execution:
    name: Prove lbfl-socratic-ai uses Gemini
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.ref == 'cloudflare/phase1-worker-ownership' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      WORKER_URL: https://lbfl-socratic-ai.yusuf-38bcs.workers.dev

    steps:
      - name: Checkout immutable PR head
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Fail closed on prerequisites
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GEMINI_API_KEY" || { echo "GEMINI_API_KEY is missing"; exit 1; }
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          fi

      - name: Verify Worker health and Gemini binding
        id: health
        shell: bash
        run: |
          set -euo pipefail
          health="$RUNNER_TEMP/health.json"
          curl --fail --silent --show-error "$WORKER_URL/api/health" > "$health"
          node - "$health" "$GITHUB_OUTPUT" <<'NODE'
          const fs = require('node:fs');
          const [healthPath, outputPath] = process.argv.slice(2);
          const health = JSON.parse(fs.readFileSync(healthPath, 'utf8'));
          if (health.ok !== true) throw new Error('Worker health is not OK');
          if (health.gemini_key_configured !== true) throw new Error('Worker does not report GEMINI_API_KEY configured');
          if (typeof health.model !== 'string' || !health.model) throw new Error('Worker model is missing');
          fs.appendFileSync(outputPath, `model=${health.model}\n`);
          fs.appendFileSync(outputPath, `worker_version_id=${health.worker_version_id || ''}\n`);
          console.log(JSON.stringify({
            ok: health.ok,
            service: health.service,
            model: health.model,
            gemini_key_configured: health.gemini_key_configured,
            worker_version_id: health.worker_version_id
          }, null, 2));
          NODE

      - name: Require genuine Gemini-backed Socratic result
        id: socratic
        shell: bash
        run: |
          set -euo pipefail
          result="$RUNNER_TEMP/socratic.json"
          headers="$RUNNER_TEMP/socratic.headers"
          curl --fail --silent --show-error \
            -D "$headers" \
            -H 'Content-Type: application/json' \
            -H 'Accept: application/json' \
            --data '{"type":"socratic_reflex","anomaly_question":"Why does heart rate rise when arterial blood pressure suddenly falls?","student_hypothesis":"The baroreceptor reflex reduces vagal output and increases sympathetic drive to restore cardiac output and pressure.","page_context":"/biology/hsc-corner/zoology/baroreceptor-reflex/","attempt_count":1}' \
            "$WORKER_URL/api/socratic" > "$result"
          node - "$result" "$GITHUB_OUTPUT" <<'NODE'
          const fs = require('node:fs');
          const [resultPath, outputPath] = process.argv.slice(2);
          const result = JSON.parse(fs.readFileSync(resultPath, 'utf8'));
          for (const key of ['mastery_achieved', 'feedback_text', 'next_vector', 'strike_count']) {
            if (!(key in result)) throw new Error(`Missing key: ${key}`);
          }
          const fallbackText = 'Your answer could not be evaluated safely. Refine your explanation by naming the biological structure, causal mechanism, and expected outcome.';
          const isFallback = result.mastery_achieved === false &&
            result.feedback_text === fallbackText &&
            result.next_vector === '/biology/' &&
            result.strike_count === 1;
          fs.appendFileSync(outputPath, `fallback=${isFallback ? 'true' : 'false'}\n`);
          console.log(JSON.stringify(result, null, 2));
          if (isFallback) {
            console.error('FAIL: GEMINI_API_KEY is configured but the Worker returned its deterministic safeFallback response.');
            process.exitCode = 2;
          }
          NODE

      - name: Diagnose basic Gemini generateContent when Worker fell back
        if: failure() && steps.socratic.outputs.fallback == 'true'
        id: basic
        continue-on-error: true
        shell: bash
        env:
          MODEL: ${{ steps.health.outputs.model }}
        run: |
          set -euo pipefail
          body="$RUNNER_TEMP/gemini-basic.json"
          printf '%s' '{"contents":[{"parts":[{"text":"Reply with exactly OK"}]}],"generationConfig":{"temperature":0}}' > "$body"
          response="$RUNNER_TEMP/gemini-basic-response.json"
          status="$(curl --silent --show-error \
            -o "$response" -w '%{http_code}' \
            -H 'Content-Type: application/json' \
            -H "x-goog-api-key: $GEMINI_API_KEY" \
            --data-binary "@$body" \
            "https://generativelanguage.googleapis.com/v1beta/models/${MODEL}:generateContent")"
          echo "Basic Gemini generateContent HTTP status: $status"
          node - "$response" <<'NODE'
          const fs = require('node:fs');
          const path = process.argv[2];
          const text = fs.readFileSync(path, 'utf8');
          console.log(text.slice(0, 1600));
          NODE
          if [[ "$status" != "200" ]]; then
            echo "basic_ok=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          echo "basic_ok=true" >> "$GITHUB_OUTPUT"

      - name: Diagnose Gemini structured output when basic call works
        if: failure() && steps.socratic.outputs.fallback == 'true' && steps.basic.outputs.basic_ok == 'true'
        id: structured
        continue-on-error: true
        shell: bash
        env:
          MODEL: ${{ steps.health.outputs.model }}
        run: |
          set -euo pipefail
          body="$RUNNER_TEMP/gemini-structured.json"
          cat > "$body" <<'JSON'
          {
            "contents": [{"parts": [{"text": "Evaluate this statement: the baroreceptor reflex raises heart rate after a sudden fall in arterial pressure. Return the requested JSON."}]}],
            "generationConfig": {
              "responseMimeType": "application/json",
              "responseSchema": {
                "type": "object",
                "properties": {
                  "mastery_achieved": {"type": "boolean"},
                  "feedback_text": {"type": "string"},
                  "next_vector": {"type": "string"},
                  "strike_count": {"type": "integer"}
                },
                "required": ["mastery_achieved", "feedback_text", "next_vector", "strike_count"]
              }
            }
          }
          JSON
          response="$RUNNER_TEMP/gemini-structured-response.json"
          status="$(curl --silent --show-error \
            -o "$response" -w '%{http_code}' \
            -H 'Content-Type: application/json' \
            -H "x-goog-api-key: $GEMINI_API_KEY" \
            --data-binary "@$body" \
            "https://generativelanguage.googleapis.com/v1beta/models/${MODEL}:generateContent")"
          echo "Structured Gemini generateContent HTTP status: $status"
          node - "$response" <<'NODE'
          const fs = require('node:fs');
          const path = process.argv[2];
          const text = fs.readFileSync(path, 'utf8');
          console.log(text.slice(0, 2000));
          NODE
          if [[ "$status" != "200" ]]; then
            echo "structured_ok=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          echo "structured_ok=true" >> "$GITHUB_OUTPUT"

      - name: Classify Gemini execution failure
        if: failure() && steps.socratic.outputs.fallback == 'true'
        shell: bash
        env:
          BASIC_OK: ${{ steps.basic.outputs.basic_ok }}
          STRUCTURED_OK: ${{ steps.structured.outputs.structured_ok }}
        run: |
          set -euo pipefail
          if [[ "$BASIC_OK" != "true" ]]; then
            echo "DIAGNOSIS: basic Gemini generateContent failed. Investigate API key restrictions, model access, quota/billing, or provider availability."
          elif [[ "$STRUCTURED_OK" != "true" ]]; then
            echo "DIAGNOSIS: basic Gemini works, but structured output failed. Investigate responseSchema/responseMimeType compatibility."
          else
            echo "DIAGNOSIS: direct basic and structured Gemini calls work, but the Worker still fell back. Investigate Worker request construction, parsing, or runtime-specific behavior."
          fi
          exit 1

      - name: Record genuine Gemini execution proof
        if: success()
        shell: bash
        env:
          MODEL: ${{ steps.health.outputs.model }}
          WORKER_VERSION_ID: ${{ steps.health.outputs.worker_version_id }}
        run: |
          {
            echo '# LBFL Gemini execution proof'
            echo
            echo '- Worker: `lbfl-socratic-ai`'
            echo "- Endpoint: \`$WORKER_URL\`"
            echo "- Worker version ID: \`$WORKER_VERSION_ID\`"
            echo "- Model: \`$MODEL\`"
            echo '- Gemini secret binding: `PASS`'
            echo '- Deterministic fallback detected: `NO`'
            echo '- Genuine Gemini-backed Socratic execution: `PASS`'
            echo '- Custom domain/route mutation: `none`'
          } >> "$GITHUB_STEP_SUMMARY"
