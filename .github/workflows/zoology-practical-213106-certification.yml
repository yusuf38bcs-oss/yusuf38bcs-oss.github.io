name: Zoology Practical-I 213106 Certification

on:
  pull_request:
    branches: ["main"]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "_biology/higher-zoology-tree/practical/**"
      - "_biology/higher-zoology-tree/index.md"
      - "_biology/higher-zoology-tree/index.bn.md"
      - "_data/navigation.yml"
      - "_layouts/single.html"
      - "assets/css/zoology-practical.css"
      - "assets/js/zoology-practical.js"
      - "_data/zoology-practical-213106-coverage.json"
      - "_data/zoology-practical-museum-figures.json"
      - "assets/biology/higher-zoology-tree/practical/museum-specimens/**"
      - "scripts/zoology/validate_practical_213106.rb"
      - ".github/workflows/zoology-practical-213106-certification.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zoology-practical-213106-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  certify:
    name: Practical-I content + route contract
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      PR_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
      R101_AUTHORIZED_BASE: "d86325ec281e21de1a208f1a1f31ecb531821eb4"
      R101_REPORT_DIR: conv04f-zoology-practical-field-report-browser-report

    steps:
      - name: Check out immutable candidate head
        uses: actions/checkout@v5
        with:
          ref: ${{ env.PR_HEAD_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Enforce exact checked-out identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PR_HEAD_SHA"

      - name: Set up Ruby
        uses: ruby/setup-ruby@a0102e0972be65f351c307e2d64b9314a57c8073 # v1
        with:
          ruby-version: "3.2"
          bundler-cache: false

      - name: Install Ruby dependencies
        run: |
          bundle config set --local frozen 'false'
          bundle install

      - name: Validate Practical-I source contract
        run: ruby scripts/zoology/validate_practical_213106.rb

      - name: Bootstrap R101 Field Report exact-head preservation gate
        if: ${{ hashFiles('.github/scripts/validate-conv04f-zoology-practical-field-report.rb') != '' }}
        shell: bash
        run: |
          set -euo pipefail
          comparison_base="$PR_BASE_SHA"
          if [[ -z "$comparison_base" ]]; then
            comparison_base="$(git rev-parse HEAD^)"
          fi

          if git cat-file -e "$comparison_base:.github/scripts/validate-conv04f-zoology-practical-field-report.rb" 2>/dev/null; then
            echo "R101 retained successor/maintenance mode: $comparison_base"
          else
            test "$comparison_base" = "$R101_AUTHORIZED_BASE"
            echo "R101 bootstrap mode: authenticated authorized base $comparison_base"
          fi

          ruby -c .github/scripts/validate-conv04f-zoology-practical-field-report.rb
          PR_BASE_SHA="$comparison_base" ruby .github/scripts/validate-conv04f-zoology-practical-field-report.rb
          git diff --check "$comparison_base...HEAD"

      - name: Build exact Jekyll candidate
        env:
          JEKYLL_ENV: production
          JEKYLL_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bundle exec jekyll build --trace

      - name: Set up Node for R101 browser gate
        if: ${{ hashFiles('.github/scripts/conv04f-zoology-practical-field-report-browser-certification.mjs') != '' }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"

      - name: Install pinned R101 browser runtime
        if: ${{ hashFiles('.github/scripts/conv04f-zoology-practical-field-report-browser-certification.mjs') != '' }}
        shell: bash
        run: |
          set -euo pipefail
          node --check .github/scripts/conv04f-zoology-practical-field-report-browser-certification.mjs
          npm install --no-save --ignore-scripts playwright@1.62.1 axe-core@4.13.0
          npx playwright install --with-deps chromium

      - name: Serve and certify R101 Field Report browser contract
        if: ${{ hashFiles('.github/scripts/conv04f-zoology-practical-field-report-browser-certification.mjs') != '' }}
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --bind 127.0.0.1 --directory _site >"$RUNNER_TEMP/r101-http.log" 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/biology/higher-zoology-tree/practical/field-report/ >/dev/null; then
              break
            fi
            if [[ "$attempt" = "30" ]]; then
              cat "$RUNNER_TEMP/r101-http.log"
              exit 1
            fi
            sleep 1
          done
          node .github/scripts/conv04f-zoology-practical-field-report-browser-certification.mjs \
            --base-url http://127.0.0.1:4173 \
            --output-dir "$R101_REPORT_DIR"

      - name: Preserve R101 bootstrap browser evidence
        if: ${{ always() && hashFiles('.github/scripts/conv04f-zoology-practical-field-report-browser-certification.mjs') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: conv04f-r101-bootstrap-${{ env.PR_HEAD_SHA }}
          path: ${{ env.R101_REPORT_DIR }}
          if-no-files-found: warn
          retention-days: 30

      - name: Assert all practical routes render
        shell: bash
        run: |
          set -euo pipefail
          test -f _site/biology/higher-zoology-tree/practical/index.html
          test -f _site/biology/higher-zoology-tree/practical/museum-specimens/index.html
          test -f _site/biology/higher-zoology-tree/practical/permanent-slides/index.html
          test -f _site/biology/higher-zoology-tree/practical/whole-mounts/index.html
          test -f _site/biology/higher-zoology-tree/practical/dissection/index.html
          test -f _site/biology/higher-zoology-tree/practical/temporary-mounts/index.html
          test -f _site/biology/higher-zoology-tree/practical/appendages/index.html
          test -f _site/biology/higher-zoology-tree/practical/zooplankton/index.html
          test -f _site/biology/higher-zoology-tree/practical/field-report/index.html


      - name: Assert Museum verified-image R1 contract
        shell: bash
        run: |
          set -euo pipefail
          ASSET_DIR="_site/assets/biology/higher-zoology-tree/practical/museum-specimens"
          PAGE="_site/biology/higher-zoology-tree/practical/museum-specimens/index.html"
          test -d "$ASSET_DIR"
          test "$(find "$ASSET_DIR" -maxdepth 1 -type f -name '*.svg' | wc -l | tr -d ' ')" = "48"
          test "$(grep -o 'class="museum-specimen-figure"' "$PAGE" | wc -l | tr -d ' ')" = "0"
          test -f "$ASSET_DIR/museum-verified-core15.webp"
          test "$(grep -o 'class="museum-verified-figure"' "$PAGE" | wc -l | tr -d ' ')" = "15"
          if grep -Eq '<code>[^<]*/assets/biology/higher-zoology-tree/practical/museum-specimens/[^<]*</code>' "$PAGE"; then
            echo "Internal museum asset path leaked as visible code in student-facing page" >&2
            exit 1
          fi
          if grep -Eqi 'local asset path' "$PAGE"; then
            echo "Developer-facing asset-path wording leaked into student-facing page" >&2
            exit 1
          fi
