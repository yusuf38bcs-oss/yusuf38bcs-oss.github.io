name: Ecology V2 10 Live Production Certification
on:
  workflow_run:
    workflows: ["Deploy to GitHub Pages"]
    types: [completed]
  workflow_dispatch:
permissions: {contents: read}
concurrency: {group: ecology-v2-10-live-production, cancel-in-progress: false}
jobs:
  certify-live:
    name: 20-page bilingual canonical production probe
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      TARGET_MAIN_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      PRODUCTION_URL: https://learningbiologyforlife.org
      CLOUDFLARE_WORKER_SCRIPT: ${{ vars.CLOUDFLARE_WORKER_SCRIPT }}
    steps:
      - name: Check out trusted current main
        uses: actions/checkout@v5
        with: {ref: main, fetch-depth: 1, persist-credentials: false}
      - name: Authenticate current main
        run: |
          set -euo pipefail; test "$(git rev-parse HEAD)" = "$TARGET_MAIN_SHA"; test "$(git ls-remote origin refs/heads/main | awk '{print $1}')" = "$TARGET_MAIN_SHA"
      - name: Validate production certification credential
        env: {PRODUCTION_CERTIFICATION_BYPASS_TOKEN: "${{ secrets.PRODUCTION_CERTIFICATION_BYPASS_TOKEN }}"}
        run: '[[ "$PRODUCTION_CERTIFICATION_BYPASS_TOKEN" =~ ^[0-9a-f]{64}$ ]]'
      - name: Resolve canonical exact-main Cloudflare production deployment
        id: production
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
        shell: bash
        run: |
          set -euo pipefail; test "$CLOUDFLARE_WORKER_SCRIPT" = "synapticai-proxy"; evidence="$RUNNER_TEMP/ecology-v2-prod.json"; out="$RUNNER_TEMP/ecology-v2-prod.out"
          for attempt in $(seq 1 40); do : > "$out"; python3 .github/scripts/resolve-cloudflare-targets.py --repository "$GITHUB_REPOSITORY" --sha "$TARGET_MAIN_SHA" --pages-environment production --cloudflare-account-id "$CLOUDFLARE_ACCOUNT_ID" --cloudflare-pages-project "$CLOUDFLARE_PAGES_PROJECT" --cloudflare-worker-script "$CLOUDFLARE_WORKER_SCRIPT" --wait-seconds 0 --site-config _data/ai.yml --output "$evidence" --github-output "$out" || true; if python3 - "$evidence" "$TARGET_MAIN_SHA" <<'PY2'
          import json,sys
          e=json.load(open(sys.argv[1])); p=e.get('pages',{}); s=sys.argv[2]
          raise SystemExit(0 if e.get('target_sha')==s and p.get('exact_head') is True and p.get('deployed_sha')==s and p.get('canonical') is True and p.get('branch')=='main' and p.get('environment')=='production' and p.get('status')=='success' and p.get('deployment_id') and str(p.get('url','')).startswith('https://') else 1)
PY2
          then cat "$out" >> "$GITHUB_OUTPUT"; exit 0; fi; sleep 15; done; cat "$evidence"; exit 1
      - name: Probe all 20 bilingual Ecology lecture pages
        env:
          EXACT_DEPLOYMENT_URL: ${{ steps.production.outputs.pages_url }}
          PRODUCTION_CERTIFICATION_BYPASS_TOKEN: ${{ secrets.PRODUCTION_CERTIFICATION_BYPASS_TOKEN }}
        run: node .github/scripts/ecology-production-live-certification.mjs --base-url "$PRODUCTION_URL" --exact-deployment-url "$EXACT_DEPLOYMENT_URL" --output ecology-live-evidence/ecology-v2-10-live.json
      - name: Re-authenticate main
        run: 'test "$(git ls-remote origin refs/heads/main | awk ''{print $1}'')" = "$TARGET_MAIN_SHA"'
      - name: Record live PASS
        run: |
          cat ecology-live-evidence/ecology-v2-10-live.json
          echo "ECOLOGY_V2_10_LIVE_PASS" >> "$GITHUB_STEP_SUMMARY"
