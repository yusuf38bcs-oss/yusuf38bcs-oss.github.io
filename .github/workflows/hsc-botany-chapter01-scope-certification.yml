name: HSC Botany Chapter-01 Textbook Provenance Gate Certification

on:
  pull_request:
    paths:
      - "_data/academic/hsc_botany_chapter01_scope_v1.json"
      - "_biology/hsc-corner/botany/chapter-01-cell-and-its-structure.md"
      - "_biology/hsc-corner/botany/lecture-*.md"
      - "scripts/academic/validate_botany_chapter01_scope.py"
      - "docs/architecture/CONV-03B2_HSC_BOTANY_TEXTBOOK_PROVENANCE_GATE.md"
      - ".github/workflows/hsc-botany-chapter01-scope-certification.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hsc-botany-ch01-textbook-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  certify:
    name: CONV-03B.2 textbook provenance and custody HOLD
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

    steps:
      - name: Check out immutable candidate
        uses: actions/checkout@v5
        with:
          ref: ${{ env.PR_HEAD_SHA }}
          persist-credentials: false

      - name: Enforce exact checked-out identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PR_HEAD_SHA"
          printf 'CONV-03B.2 exact head: %s\n' "$PR_HEAD_SHA"

      - name: Validate textbook provenance and page-custody gate
        run: python3 scripts/academic/validate_botany_chapter01_scope.py

      - name: Preserve CONV-03B.2 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hsc-botany-chapter01-textbook-gate-${{ env.PR_HEAD_SHA }}
          path: hsc-botany-chapter01-scope-report.json
          if-no-files-found: error
