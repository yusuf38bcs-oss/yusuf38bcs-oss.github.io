name: Academic Surface Contract Certification

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "docs/academic/conv04/**"
      - ".github/scripts/validate-academic-surface-contract.rb"
      - ".github/workflows/academic-surface-contract-certification.yml"
      - "index.html"
      - "_data/homepage.yml"
      - "_config.yml"
      - "_layouts/**"
      - "_includes/**"
      - "_biology/**"
      - "_mcq-arena/**"
      - "_socratic/**"
      - "_pages/**"
      - "_sass/**"
      - "assets/css/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: academic-surface-contract-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  certify:
    name: CONV-04 progressive academic surface contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

    steps:
      - name: Check out immutable candidate
        uses: actions/checkout@v5
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          persist-credentials: false

      - name: Enforce exact checked-out identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          printf 'CONV-04 exact head: %s\n' "$CANDIDATE_SHA"

      - name: Set up Ruby
        uses: ruby/setup-ruby@a0102e0972be65f351c307e2d64b9314a57c8073 # v1
        with:
          ruby-version: "3.2"

      - name: Validate Academic Surface Contract
        shell: bash
        run: |
          set -euo pipefail
          ruby -c .github/scripts/validate-academic-surface-contract.rb
          ruby .github/scripts/validate-academic-surface-contract.rb

      - name: Preserve contract evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: academic-surface-contract-${{ env.CANDIDATE_SHA }}
          path: academic-surface-contract-report.json
          if-no-files-found: error
          retention-days: 30
