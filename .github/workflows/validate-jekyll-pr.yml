name: Validate Jekyll PR

on:
  pull_request:
    branches: ["staging", "main"]
  push:
    branches: ["staging"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: false

      - name: Install Dependencies
        run: |
          bundle config set --local frozen 'false'
          bundle install

      - name: Validate Biology Admission Engine
        run: ruby scripts/admission/validate_biology_engine.rb

      - name: Validate Biology 2016-17 Audit Pilot
        run: ruby scripts/admission/validate_biology_audit.rb

      - name: Clean Previous Build
        run: bundle exec jekyll clean

      - name: Build Jekyll Site
        run: bundle exec jekyll build --trace
        env:
          JEKYLL_ENV: production
          JEKYLL_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate Core Output
        run: |
          test -f _site/index.html || (echo "Missing index.html" && exit 1)
          test -f _site/biology/index.html || (echo "Missing /biology/" && exit 1)
          echo "Jekyll validation passed."
