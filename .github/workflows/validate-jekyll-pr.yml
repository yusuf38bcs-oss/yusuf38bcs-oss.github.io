name: Validate Jekyll PR

on:
  pull_request:
    branches: ["staging", "main"]
  push:
    branches: ["staging"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout immutable event head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Assert exact PR head and current base identity
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          actual_head="$(git rev-parse HEAD)"
          test "$actual_head" = "$PR_HEAD_SHA" || { echo "HEAD CHANGED — RECERTIFICATION REQUIRED"; exit 1; }
          remote_base="$(git ls-remote origin "refs/heads/$PR_BASE_REF" | awk '{print $1}')"
          test -n "$remote_base"
          test "$remote_base" = "$PR_BASE_SHA" || { echo "BASE CHANGED — RECERTIFICATION REQUIRED"; exit 1; }
          git fetch --no-tags origin "refs/heads/$PR_BASE_REF:refs/remotes/origin/$PR_BASE_REF"
          test "$(git rev-parse "refs/remotes/origin/$PR_BASE_REF")" = "$remote_base"
          git merge-base --is-ancestor "$remote_base" "$actual_head" || { echo "STALE PR HEAD — CURRENT BASE IS NOT AN ANCESTOR"; exit 1; }
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: false
      - name: Install Dependencies
        run: |
          bundle config set --local frozen 'false'
          bundle install
      - name: Validate Biology Admission Engine
        run: ruby scripts/admission/validate_biology_engine.rb
      - name: Test Biology Audit Validator Regressions
        run: ruby scripts/admission/test_validate_biology_audit.rb
      - name: Validate Biology 2016-17 Audit Pilot
        run: ruby scripts/admission/validate_biology_audit.rb
      - name: Clean Previous Build
        run: bundle exec jekyll clean
      - name: Build Jekyll Site
        run: bundle exec jekyll build --trace
        env:
          JEKYLL_ENV: production
          JEKYLL_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Validate Core Output
        run: |
          test -f _site/index.html
          test -f _site/biology/index.html
          echo "Jekyll validation passed."

  deploy-lbfl-socratic-smoke:
    name: Deploy lbfl-socratic-ai isolated smoke
    needs: validate
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.ref == 'cloudflare/phase1-worker-ownership' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      WORKER_URL: https://lbfl-socratic-ai.yusuf-38bcs.workers.dev
    steps:
      - name: Checkout immutable PR head
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Fail closed on credentials and Worker identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$GEMINI_API_KEY"
          node <<'NODE'
          const fs=require('node:fs');
          const c=JSON.parse(fs.readFileSync('wrangler.jsonc','utf8'));
          if(c.name!=='lbfl-socratic-ai') throw new Error(`Refusing Worker name: ${c.name}`);
          if(c.main!=='worker/src/index.ts') throw new Error(`Unexpected entrypoint: ${c.main}`);
          if(c.routes||c.route||c.custom_domain||c.custom_domains) throw new Error('Isolated deploy must not declare routes/custom domains');
          if(c.workers_dev!==true) throw new Error('workers_dev must be enabled');
          NODE
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - name: Install locked Worker dependencies
        working-directory: worker
        run: npm ci
      - name: Deploy only lbfl-socratic-ai
        working-directory: worker
        run: npx wrangler deploy --config ../wrangler.jsonc
      - name: Configure Gemini secret
        working-directory: worker
        run: printf '%s' "$GEMINI_API_KEY" | npx wrangler secret put GEMINI_API_KEY --config ../wrangler.jsonc
      - name: Verify isolated Worker health and version
        id: health
        shell: bash
        run: |
          set -euo pipefail
          body="$RUNNER_TEMP/health.json"; headers="$RUNNER_TEMP/health.headers"; ok=false
          for _ in $(seq 1 20); do
            if curl --fail --silent --show-error -D "$headers" -o "$body" "$WORKER_URL/api/health"; then ok=true; break; fi
            sleep 3
          done
          test "$ok" = true
          node - "$body" "$headers" "$GITHUB_OUTPUT" <<'NODE'
          const fs=require('node:fs'); const [bp,hp,out]=process.argv.slice(2); const b=JSON.parse(fs.readFileSync(bp,'utf8')); const h=fs.readFileSync(hp,'utf8'); const v=h.match(/^x-lbfl-worker-version:\s*([^\r\n]+)/im)?.[1]?.trim()||''; if(b.ok!==true||b.environment!=='production'||b.gemini_key_configured!==true||b.service!=='LBFL Synaptic AI Edge Worker'||b.worker_version_id!==v) throw new Error('Isolated health/version contract failed'); fs.appendFileSync(out,`worker_version_id=${v}\n`); console.log(JSON.stringify(b,null,2));
          NODE
      - name: Wait for genuine Gemini-backed Socratic execution
        shell: bash
        run: |
          set -euo pipefail
          result="$RUNNER_TEMP/socratic.json"
          genuine=false
          for attempt in $(seq 1 15); do
            curl --fail --silent --show-error \
              -H 'Content-Type: application/json' \
              --data '{"type":"socratic_reflex","anomaly_question":"Why does heart rate rise when arterial blood pressure suddenly falls?","student_hypothesis":"The baroreceptor reflex reduces vagal output and increases sympathetic drive to restore cardiac output and pressure.","page_context":"/biology/","attempt_count":1}' \
              "$WORKER_URL/api/socratic" > "$result"
            if node - "$result" <<'NODE'
          const fs=require('node:fs'); const r=JSON.parse(fs.readFileSync(process.argv[2],'utf8')); for(const k of ['mastery_achieved','feedback_text','next_vector','strike_count']) if(!(k in r)) process.exit(1); const fallback='Your answer could not be evaluated safely. Refine your explanation by naming the biological structure, causal mechanism, and expected outcome.'; process.exit(r.feedback_text===fallback ? 2 : 0);
          NODE
            then
              genuine=true
              cat "$result"
              break
            fi
            echo "Gemini-backed response not ready yet (attempt $attempt/15); retrying..."
            sleep 4
          done
          test "$genuine" = true

  cutover-lbfl-production:
    name: Controlled production cutover with rollback
    needs: deploy-lbfl-socratic-smoke
    if: >-
      github.event_name == 'pull_request' &&
      github.event.action == 'reopened' &&
      github.event.pull_request.head.ref == 'cloudflare/phase1-worker-ownership' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency:
      group: lbfl-production-domain-cutover
      cancel-in-progress: false
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      HOSTNAME: api.learningbiologyforlife.org
      OLD_SERVICE: synapticai-proxy
      NEW_SERVICE: lbfl-socratic-ai
      NEW_WORKER_URL: https://lbfl-socratic-ai.yusuf-38bcs.workers.dev
    steps:
      - name: Checkout immutable PR head
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Execute guarded custom-domain transfer
        id: cutover
        shell: bash
        run: bash .github/scripts/lbfl-production-cutover.sh
      - name: Record cutover summary
        if: always()
        shell: bash
        run: |
          echo "# LBFL controlled production cutover" >> "$GITHUB_STEP_SUMMARY"
          echo "- Hostname: $HOSTNAME" >> "$GITHUB_STEP_SUMMARY"
          echo "- Previous owner: $OLD_SERVICE" >> "$GITHUB_STEP_SUMMARY"
          echo "- Intended owner: $NEW_SERVICE" >> "$GITHUB_STEP_SUMMARY"
          echo "- Result: ${{ steps.cutover.outputs.cutover_status || 'failed-or-rolled-back' }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Candidate version: ${{ steps.cutover.outputs.candidate_version || 'unavailable' }}" >> "$GITHUB_STEP_SUMMARY"
