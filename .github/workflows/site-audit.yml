name: Sovereign Site Audit

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run Site Audit Engine
        run: |
          python scripts/site_audit_engine.py --root . --output-dir audit-reports --fail-on none

      - name: Upload Audit Report
        uses: actions/upload-artifact@v4
        with:
          name: sovereign-site-audit-report
          path: audit-reports/
          retention-days: 7
