name: LBFL Production Domain Cutover

on:
  pull_request:
    branches: ["main"]
    types: [reopened]

permissions:
  contents: read

concurrency:
  group: lbfl-production-domain-cutover
  cancel-in-progress: false

jobs:
  cutover:
    if: ${{ github.event.pull_request.head.ref == 'cloudflare/phase1-worker-ownership' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      HOSTNAME: api.learningbiologyforlife.org
      OLD_SERVICE: synapticai-proxy
      NEW_SERVICE: lbfl-socratic-ai
      NEW_WORKER_URL: https://lbfl-socratic-ai.yusuf-38bcs.workers.dev
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Checkout immutable cutover head
        uses: actions/checkout@v5
        with:
          ref: ${{ env.EXPECTED_HEAD }}
          persist-credentials: false
      - name: Fail closed on cutover prerequisites
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test -n "$ACCOUNT_ID" && test -n "$API_TOKEN"
          grep -Eq '"name"[[:space:]]*:[[:space:]]*"lbfl-socratic-ai"' wrangler.jsonc
      - name: Capture current production and candidate state
        id: preflight
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p cutover-evidence
          api="https://api.cloudflare.com/client/v4/accounts/$ACCOUNT_ID/workers/domains"
          curl --fail --silent --show-error -H "Authorization: Bearer $API_TOKEN" "$api" > cutover-evidence/domains-before.json
          node - cutover-evidence/domains-before.json "$HOSTNAME" "$OLD_SERVICE" "$GITHUB_OUTPUT" <<'NODE'
          const fs=require('node:fs'); const [p,h,s,o]=process.argv.slice(2); const j=JSON.parse(fs.readFileSync(p,'utf8')); const d=(j.result||[]).find(x=>x.hostname===h); if(j.success!==true||!d) throw new Error('Current domain not found'); if(d.service!==s) throw new Error(`Expected ${s}, found ${d.service}`); if(!d.zone_id||!d.zone_name) throw new Error('Zone metadata missing'); fs.appendFileSync(o,`zone_id=${d.zone_id}\nzone_name=${d.zone_name}\nold_service=${d.service}\n`); console.log(JSON.stringify(d,null,2));
          NODE
          curl --fail --silent --show-error -D cutover-evidence/old-health.headers "https://$HOSTNAME/api/health" > cutover-evidence/old-health.json
          curl --fail --silent --show-error -D cutover-evidence/new-health.headers "$NEW_WORKER_URL/api/health" > cutover-evidence/new-health.json
          node - cutover-evidence/new-health.json cutover-evidence/new-health.headers "$GITHUB_OUTPUT" <<'NODE'
          const fs=require('node:fs'); const [p,h,o]=process.argv.slice(2); const j=JSON.parse(fs.readFileSync(p,'utf8')); const hs=fs.readFileSync(h,'utf8'); const v=hs.match(/^x-lbfl-worker-version:\s*([^\r\n]+)/im)?.[1]?.trim()||''; if(j.ok!==true||j.gemini_key_configured!==true||j.worker_version_id!==v) throw new Error('Candidate not ready'); fs.appendFileSync(o,`candidate_version=${v}\n`); console.log(JSON.stringify({candidate_version:v,health:j},null,2));
          NODE
      - name: Transfer custom domain and verify with automatic rollback
        id: cutover
        env:
          ZONE_ID: ${{ steps.preflight.outputs.zone_id }}
          ZONE_NAME: ${{ steps.preflight.outputs.zone_name }}
          CANDIDATE_VERSION: ${{ steps.preflight.outputs.candidate_version }}
        shell: bash
        run: |
          set -Eeuo pipefail
          api="https://api.cloudflare.com/client/v4/accounts/$ACCOUNT_ID/workers/domains"; changed=0
          attach(){ local s="$1"; printf '{"hostname":"%s","service":"%s","zone_id":"%s","zone_name":"%s"}' "$HOSTNAME" "$s" "$ZONE_ID" "$ZONE_NAME" > "$RUNNER_TEMP/body.json"; curl --fail --silent --show-error -X PUT -H 'Content-Type: application/json' -H "Authorization: Bearer $API_TOKEN" --data-binary "@$RUNNER_TEMP/body.json" "$api"; }
          owner(){ curl --fail --silent --show-error -H "Authorization: Bearer $API_TOKEN" "$api" > "$RUNNER_TEMP/domains.json"; node - "$RUNNER_TEMP/domains.json" "$HOSTNAME" <<'NODE'
          const fs=require('node:fs'); const [p,h]=process.argv.slice(2); const j=JSON.parse(fs.readFileSync(p,'utf8')); process.stdout.write((j.result||[]).find(x=>x.hostname===h)?.service||'');
          NODE
          }
          rollback(){ rc=$?; if [[ "$changed" = 1 ]]; then attach "$OLD_SERVICE" > cutover-evidence/rollback.json || true; for i in $(seq 1 30); do [[ "$(owner || true)" = "$OLD_SERVICE" ]] && break; sleep 2; done; fi; exit "$rc"; }
          trap rollback ERR
          attach "$NEW_SERVICE" > cutover-evidence/domain-attach.json; changed=1
          for i in $(seq 1 30); do [[ "$(owner)" = "$NEW_SERVICE" ]] && break; sleep 2; done
          test "$(owner)" = "$NEW_SERVICE"
          ok=0
          for i in $(seq 1 20); do if curl --fail --silent --show-error -D cutover-evidence/prod-health.headers "https://$HOSTNAME/api/health" > cutover-evidence/prod-health.json; then if node - cutover-evidence/prod-health.json cutover-evidence/prod-health.headers "$CANDIDATE_VERSION" <<'NODE'
          const fs=require('node:fs'); const [p,h,e]=process.argv.slice(2); const j=JSON.parse(fs.readFileSync(p,'utf8')); const hs=fs.readFileSync(h,'utf8'); const v=hs.match(/^x-lbfl-worker-version:\s*([^\r\n]+)/im)?.[1]?.trim()||''; process.exit(j.ok===true&&j.gemini_key_configured===true&&j.worker_version_id===e&&v===e?0:1);
          NODE
          then ok=1; break; fi; fi; sleep 2; done
          test "$ok" = 1
          curl --fail --silent --show-error -D cutover-evidence/cors.headers -o /dev/null -H 'Origin: https://learningbiologyforlife.org' "https://$HOSTNAME/api/health"
          grep -Eiq '^access-control-allow-origin:\s*https://learningbiologyforlife\.org\s*$' cutover-evidence/cors.headers
          curl --fail --silent --show-error -D cutover-evidence/socratic.headers -H 'Origin: https://learningbiologyforlife.org' -H 'Content-Type: application/json' --data '{"type":"socratic_reflex","anomaly_question":"Why does heart rate rise when arterial blood pressure suddenly falls?","student_hypothesis":"The baroreceptor reflex reduces vagal output and increases sympathetic drive to restore cardiac output and pressure.","page_context":"/biology/","attempt_count":1}' "https://$HOSTNAME/api/socratic" > cutover-evidence/socratic.json
          node - cutover-evidence/socratic.json cutover-evidence/socratic.headers "$CANDIDATE_VERSION" <<'NODE'
          const fs=require('node:fs'); const [p,h,e]=process.argv.slice(2); const r=JSON.parse(fs.readFileSync(p,'utf8')); const hs=fs.readFileSync(h,'utf8'); for(const k of ['mastery_achieved','feedback_text','next_vector','strike_count']) if(!(k in r)) throw new Error(`Missing ${k}`); if(r.feedback_text==='Your answer could not be evaluated safely. Refine your explanation by naming the biological structure, causal mechanism, and expected outcome.') throw new Error('Fallback detected'); const v=hs.match(/^x-lbfl-worker-version:\s*([^\r\n]+)/im)?.[1]?.trim()||''; if(v!==e) throw new Error('Version mismatch'); console.log(JSON.stringify(r,null,2));
          NODE
          trap - ERR; echo 'cutover_status=pass' >> "$GITHUB_OUTPUT"
      - name: Summarize controlled cutover
        if: always()
        shell: bash
        run: echo "LBFL cutover status: ${{ steps.cutover.outputs.cutover_status || 'failed-or-rolled-back' }}" >> "$GITHUB_STEP_SUMMARY"
