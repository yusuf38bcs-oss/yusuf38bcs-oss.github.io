name: Animal Diversity Import Bootstrap

on:
  push:
    branches:
      - animal-diversity/10-course-reconstruction
    paths:
      - '.animal-diversity-import/payload.tar.gz'
      - '.github/workflows/animal-diversity-import-bootstrap.yml'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Check out payload commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: animal-diversity/10-course-reconstruction
          fetch-depth: 0

      - name: Authenticate payload commit
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"

      - name: Verify and import normalized course payload
        shell: bash
        run: |
          set -euo pipefail
          actual="$(sha256sum .animal-diversity-import/payload.tar.gz | awk '{print $1}')"
          expected="5b097f55574ccd25b1d291c277ffa0e39991add1d80a8c0bb86e35107898e12e"
          test "$actual" = "$expected"
          tar -xzf .animal-diversity-import/payload.tar.gz

          if ! grep -q '^require "date"$' .github/scripts/validate-animal-diversity-10.rb; then
            sed -i '2irequire "date"' .github/scripts/validate-animal-diversity-10.rb
          fi

          ruby .github/scripts/validate-animal-diversity-10.rb

          git add _biology/higher-zoology-tree/animal-diversity \
                  _data/animal-diversity-10.yml \
                  _data/animal-diversity-10-assets.yml \
                  _layouts/animal-diversity-course.html \
                  assets/biology/animal-diversity \
                  .github/scripts/validate-animal-diversity-10.rb \
                  .github/scripts/animal-diversity-browser-certification.mjs \
                  .github/workflows/animal-diversity-10-certification.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Animal Diversity: import reviewed ten-lecture course"
          git push origin HEAD:animal-diversity/10-course-reconstruction
