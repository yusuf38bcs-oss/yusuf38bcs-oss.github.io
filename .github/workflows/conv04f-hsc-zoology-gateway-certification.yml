name: CONV-04F-01 HSC Zoology Gateway Certification

on:
  pull_request:
    branches: ["main"]
    types: [opened, synchronize, reopened, ready_for_review, edited]
    paths:
      - "_biology/hsc-corner/zoology/index.md"
      - "_data/academic/conv04f_hsc_zoology_gateway_v1.json"
      - "docs/academic/conv04/ACADEMIC_ROUTE_LEDGER.json"
      - "docs/academic/conv04/CONV04_STATE.md"
      - "docs/academic/conv04/ZOOLOGY_GATEWAY_F01_AUTHORIZATION.md"
      - ".github/scripts/validate-conv04f-hsc-zoology-gateway.rb"
      - ".github/scripts/conv04f-hsc-zoology-browser-certification.mjs"
      - ".github/workflows/conv04f-hsc-zoology-gateway-certification.yml"
  workflow_dispatch:
    inputs:
      expected_main_sha:
        description: "Exact main SHA to certify"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: conv04f-hsc-zoology-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  certify:
    name: CONV-04F-01 HSC Zoology gateway
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      F01_AUTHORIZED_BASE: "b73d04616498649b8db66afef2d80103329118f5"
      CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.event.inputs.expected_main_sha || github.sha }}
      EXPECTED_MAIN_SHA: ${{ github.event.inputs.expected_main_sha || '' }}
      CERTIFICATION_MODE: ${{ github.event_name == 'pull_request' && 'pull_request' || 'manual' }}
      PR_BASE_REF: ${{ github.event.pull_request.base.ref || 'main' }}
      PR_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
      REPORT_DIR: conv04f-hsc-zoology-browser-report

    steps:
      - name: Check out immutable candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Authenticate exact head and current base
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$CANDIDATE_SHA"
          git merge-base --is-ancestor "$F01_AUTHORIZED_BASE" "$actual"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            remote="$(git ls-remote origin "refs/heads/$PR_BASE_REF" | awk '{print $1}')"
            test "$remote" = "$PR_BASE_SHA" || { echo "BASE CHANGED — RECERTIFICATION REQUIRED"; exit 1; }
            git merge-base --is-ancestor "$remote" "$actual" || { echo "STALE CANDIDATE"; exit 1; }
          else
            test -n "$EXPECTED_MAIN_SHA"
            remote="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
            test "$remote" = "$EXPECTED_MAIN_SHA"
            test "$actual" = "$EXPECTED_MAIN_SHA"
          fi

      - name: Set up Ruby
        uses: ruby/setup-ruby@a0102e0972be65f351c307e2d64b9314a57c8073
        with:
          ruby-version: "3.2"
          bundler-cache: false

      - name: Certify F-01 source and retained contracts
        shell: bash
        run: |
          set -euo pipefail
          ruby -c .github/scripts/validate-conv04f-hsc-zoology-gateway.rb
          ruby .github/scripts/validate-conv04f-hsc-zoology-gateway.rb
          ruby .github/scripts/validate-academic-surface-contract.rb
          ruby .github/scripts/validate-academic-design-system.rb
          ruby .github/scripts/validate-learning-guide-contract.rb
          ruby .github/scripts/validate-learning-guide-implementation.rb
          ruby .github/scripts/validate-gateway-convergence.rb
          ruby .github/scripts/validate-zoology-academic-design.rb
          ruby .github/scripts/validate-assessment-ownership.rb
          ruby .github/scripts/validate-assessment-gateway.rb
          ruby .github/scripts/validate-assessment-runtime-contract.rb
          ruby .github/scripts/validate-assessment-runtime-pilot.rb
          ruby .github/scripts/validate-assessment-runtime-second-bank.rb
          ruby .github/scripts/validate-assessment-runtime-third-bank.rb
          ruby .github/scripts/validate-conv04e-botany-gateway.rb
          python3 scripts/academic/validate_botany_chapter01_scope.py
          python3 scripts/academic/validate_botany_bot08_content.py
          if [ -n "$PR_BASE_SHA" ]; then
            diff_base="$PR_BASE_SHA"
          else
            diff_base="$(git rev-parse HEAD^)"
          fi
          git diff --check "$diff_base...HEAD"

      - name: Build production Jekyll
        env:
          JEKYLL_ENV: production
          JEKYLL_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bundle install --jobs 4 --retry 3
          bundle exec jekyll clean
          bundle exec jekyll build --trace
          test -f _site/biology/hsc-corner/zoology/index.html
          ruby .github/scripts/validate-conv04f-hsc-zoology-gateway.rb
          ruby .github/scripts/validate-gateway-convergence.rb
          ruby .github/scripts/validate-zoology-academic-design.rb
          ruby .github/scripts/validate-academic-surface-contract.rb

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install browser runtime
        run: |
          node --check .github/scripts/conv04f-hsc-zoology-browser-certification.mjs
          npm install --no-save --package-lock=false --ignore-scripts playwright@1.62.1 axe-core@4.13.0
          npx playwright install --with-deps chromium

      - name: Serve exact-head site
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 --directory _site >"$RUNNER_TEMP/conv04f-http.log" 2>&1 &
          for i in $(seq 1 30); do
            curl --fail --silent http://127.0.0.1:4173/biology/hsc-corner/zoology/ >/dev/null && exit 0
            sleep 1
          done
          cat "$RUNNER_TEMP/conv04f-http.log"
          exit 1

      - name: Browser / Axe / keyboard / reflow / spacing / reduced-motion / no-JS
        run: |
          node .github/scripts/conv04f-hsc-zoology-browser-certification.mjs \
            --base-url http://127.0.0.1:4173 \
            --output-dir "$REPORT_DIR"

      - name: Preserve F-01 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conv04f-hsc-zoology-${{ env.CANDIDATE_SHA }}
          path: ${{ env.REPORT_DIR }}
          if-no-files-found: warn
          retention-days: 30
