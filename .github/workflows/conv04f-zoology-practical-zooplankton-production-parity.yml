name: CONV-04F-09 Zooplankton Production Parity

on:
  push:
    branches: ["main"]
    paths:
      - "_biology/higher-zoology-tree/practical/07-zooplankton.bn.md"
      - "_data/academic/conv04f_zoology_practical_zooplankton_v1.json"
      - "assets/css/zoology-practical.css"
      - "assets/js/zoology-practical.js"
      - "assets/css/academic-design-system.css"
      - "_includes/education/learning-guide-cta.html"
      - "docs/academic/conv04/ACADEMIC_ROUTE_LEDGER.json"
      - "docs/academic/conv04/CONV04_STATE.md"
      - "docs/academic/conv04/ZOOLOGY_PRACTICAL_ZOOPLANKTON_F09_R90_AUTHORIZATION.md"
      - "docs/academic/conv04/ZOOLOGY_PRACTICAL_ZOOPLANKTON_F09_R91_IMPLEMENTATION.md"
      - ".github/scripts/validate-conv04f-zoology-practical-zooplankton.rb"
      - ".github/scripts/conv04f-zoology-practical-zooplankton-browser-certification.mjs"
      - ".github/workflows/conv04f-zoology-practical-zooplankton-certification.yml"
      - ".github/workflows/conv04f-zoology-practical-zooplankton-production-parity.yml"
  pull_request_target:
    branches: ["main"]
    types: [opened, synchronize, reopened, ready_for_review, edited]
    paths:
      - "_biology/higher-zoology-tree/practical/07-zooplankton.bn.md"
      - "_data/academic/conv04f_zoology_practical_zooplankton_v1.json"
      - "assets/css/zoology-practical.css"
      - "assets/js/zoology-practical.js"
      - "assets/css/academic-design-system.css"
      - "_includes/education/learning-guide-cta.html"
      - "docs/academic/conv04/ACADEMIC_ROUTE_LEDGER.json"
      - "docs/academic/conv04/CONV04_STATE.md"
      - "docs/academic/conv04/ZOOLOGY_PRACTICAL_ZOOPLANKTON_F09_R90_AUTHORIZATION.md"
      - "docs/academic/conv04/ZOOLOGY_PRACTICAL_ZOOPLANKTON_F09_R91_IMPLEMENTATION.md"
      - ".github/scripts/validate-conv04f-zoology-practical-zooplankton.rb"
      - ".github/scripts/conv04f-zoology-practical-zooplankton-browser-certification.mjs"
      - ".github/workflows/conv04f-zoology-practical-zooplankton-certification.yml"
      - ".github/workflows/conv04f-zoology-practical-zooplankton-production-parity.yml"
permissions:
  contents: read
  pull-requests: read

concurrency:
  group: conv04f-practical-zooplankton-production
  cancel-in-progress: false

jobs:
  trusted_successor_guard:
    name: Trusted predecessor R91 successor immutability
    if: ${{ github.event_name == 'pull_request_target' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Reject candidate rewrites of retained R91 enforcement
        uses: actions/github-script@v8
        with:
          script: |
            const protectedPaths = new Set([
              "_data/academic/conv04f_zoology_practical_zooplankton_v1.json",
              "docs/academic/conv04/ZOOLOGY_PRACTICAL_ZOOPLANKTON_F09_R90_AUTHORIZATION.md",
              "docs/academic/conv04/ZOOLOGY_PRACTICAL_ZOOPLANKTON_F09_R91_IMPLEMENTATION.md",
              ".github/scripts/validate-conv04f-zoology-practical-zooplankton.rb",
              ".github/scripts/conv04f-zoology-practical-zooplankton-browser-certification.mjs",
              ".github/workflows/conv04f-zoology-practical-zooplankton-certification.yml",
              ".github/workflows/conv04f-zoology-practical-zooplankton-production-parity.yml"
            ]);
            const expectedChangedFiles = context.payload.pull_request.changed_files;
            if (!Number.isInteger(expectedChangedFiles) || expectedChangedFiles < 0) {
              core.setFailed("TRUSTED R91 GUARD CANNOT AUTHENTICATE pull_request.changed_files");
              return;
            }
            if (expectedChangedFiles > 3000) {
              core.setFailed(`TRUSTED R91 GUARD FAIL-CLOSED: PR has ${expectedChangedFiles} changed files, exceeding GitHub List PR Files completeness limit of 3000`);
              return;
            }
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
              per_page: 100
            });
            if (files.length !== expectedChangedFiles) {
              core.setFailed(`TRUSTED R91 GUARD INCOMPLETE PR FILE METADATA: expected ${expectedChangedFiles}, received ${files.length}`);
              return;
            }
            const touched = new Set();
            for (const file of files) {
              if (protectedPaths.has(file.filename)) touched.add(file.filename);
              if (file.previous_filename && protectedPaths.has(file.previous_filename)) touched.add(file.previous_filename);
            }
            if (touched.size) {
              core.setFailed(`SUCCESSOR CHANGED OR RENAMED TRUSTED R91 ENFORCEMENT ARTIFACT: ${[...touched].sort().join(", ")}`);
            } else {
              core.info(`Trusted predecessor R91 successor immutability: PASS; complete ${files.length}/${expectedChangedFiles} file metadata checked including rename sources`);
            }

  production:
    name: Exact-main Cloudflare production + Zooplankton DOM
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      TARGET_SHA: ${{ github.sha }}
      PRODUCTION_URL: "https://learningbiologyforlife.org"
      EVIDENCE_DIR: conv04f09-r81-production-parity
      CLOUDFLARE_ACCOUNT_ID: "13e317d6883a0f258ad7ed490699f849"
      CLOUDFLARE_PAGES_PROJECT: "yusuf38bcs-oss-github-io"
    steps:
      - name: Check out exact main
        uses: actions/checkout@v5
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - name: Authenticate exact current main
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          remote="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          test "$remote" = "$TARGET_SHA" || { echo "MAIN MOVED — ABORT"; exit 1; }
          test -z "$(git status --porcelain)"
          retained_base="$(git rev-parse "$TARGET_SHA^")"
          test -n "$retained_base"
          echo "PR_BASE_SHA=$retained_base" >> "$GITHUB_ENV"
          echo "Retained R91 comparison base: $retained_base"
      - name: Set up Ruby
        uses: ruby/setup-ruby@a0102e0972be65f351c307e2d64b9314a57c8073
        with:
          ruby-version: "3.2"
          bundler-cache: false
      - name: Build exact-main production site
        shell: bash
        env:
          JEKYLL_ENV: production
          JEKYLL_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_DIR"
          ruby -c .github/scripts/validate-conv04f-zoology-practical-zooplankton.rb
          ruby .github/scripts/validate-conv04f-zoology-practical-zooplankton.rb
          ruby scripts/zoology/validate_practical_213106.rb
          bundle install --jobs 4 --retry 3
          bundle exec jekyll clean
          bundle exec jekyll build --trace
          test -f _site/biology/higher-zoology-tree/practical/zooplankton/index.html
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install reviewed Wrangler
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --ignore-scripts wrangler@4.147.0
          npx --no-install wrangler --version | grep -F "4.147.0"
      - name: Deploy exact SHA to Cloudflare Pages production
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          remote="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          test "$remote" = "$TARGET_SHA" || { echo "MAIN MOVED BEFORE DEPLOY — ABORT"; exit 1; }
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test -n "$CLOUDFLARE_API_TOKEN"
          npx --no-install wrangler pages deploy _site \
            --project-name "$CLOUDFLARE_PAGES_PROJECT" \
            --branch main \
            --commit-hash "$TARGET_SHA" \
            --commit-message "LBFL F-09 R91 production parity $TARGET_SHA" \
            --commit-dirty=false | tee "$EVIDENCE_DIR/wrangler-pages-deploy.log"
      - name: Resolve exact successful production deployment
        id: resolve
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 40); do
            python3 .github/scripts/resolve-cloudflare-targets.py \
              --repository "$GITHUB_REPOSITORY" \
              --sha "$TARGET_SHA" \
              --pages-environment production \
              --cloudflare-account-id "$CLOUDFLARE_ACCOUNT_ID" \
              --cloudflare-pages-project "$CLOUDFLARE_PAGES_PROJECT" \
              --wait-seconds 0 \
              --site-config _data/ai.yml \
              --output "$EVIDENCE_DIR/cloudflare-production.json" \
              --github-output "$RUNNER_TEMP/pages.out"
            if python3 - "$EVIDENCE_DIR/cloudflare-production.json" "$TARGET_SHA" <<'PY'
          import json,sys
          e=json.load(open(sys.argv[1],encoding="utf-8"))
          p=e.get("pages",{})
          ok=(e.get("target_sha")==sys.argv[2] and p.get("exact_head") is True and
              p.get("deployed_sha")==sys.argv[2] and p.get("canonical") is True and
              p.get("branch")=="main" and p.get("environment")=="production" and
              p.get("status")=="success" and bool(p.get("deployment_id")) and
              str(p.get("url","")).startswith("https://"))
          raise SystemExit(0 if ok else 1)
          PY
            then
              cat "$RUNNER_TEMP/pages.out" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 15
          done
          cat "$EVIDENCE_DIR/cloudflare-production.json"
          exit 1
      - name: Install browser dependencies
        shell: bash
        run: |
          set -euo pipefail
          node --check .github/scripts/conv04f-zoology-practical-zooplankton-browser-certification.mjs
          npm install --no-save --ignore-scripts playwright@1.62.1 axe-core@4.13.0
          npx playwright install --with-deps chromium
      - name: Certify immutable Cloudflare deployment
        shell: bash
        env:
          EXACT_URL: ${{ steps.resolve.outputs.pages_url }}
        run: |
          set -euo pipefail
          test -n "$EXACT_URL"
          node .github/scripts/conv04f-zoology-practical-zooplankton-browser-certification.mjs \
            --base-url "$EXACT_URL" \
            --output-dir "$EVIDENCE_DIR/immutable"
      - name: Certify canonical LBFL production
        shell: bash
        run: |
          set -euo pipefail
          node .github/scripts/conv04f-zoology-practical-zooplankton-browser-certification.mjs \
            --base-url "$PRODUCTION_URL" \
            --output-dir "$EVIDENCE_DIR/canonical-production"
      - name: Re-authenticate main
        shell: bash
        run: |
          set -euo pipefail
          remote="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          test "$remote" = "$TARGET_SHA" || { echo "MAIN MOVED DURING CERTIFICATION"; exit 1; }
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
      - name: Preserve production parity evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conv04f09-r81-production-parity-${{ env.TARGET_SHA }}
          path: ${{ env.EVIDENCE_DIR }}
          if-no-files-found: warn
          retention-days: 30
