name: CONV-04F-09-R101 Field Report Certification

on:
  pull_request:
    branches: ["main"]
    types: [opened, synchronize, reopened, ready_for_review, edited]
    paths:
      - "_biology/higher-zoology-tree/practical/08-field-report.bn.md"
      - "_data/academic/course_contract_v1.json"
      - "_data/zoology-practical-213106-coverage.json"
      - "_data/academic/conv04f_zoology_practical_field_report_v1.json"
      - "assets/css/zoology-practical.css"
      - "assets/js/zoology-practical.js"
      - "assets/css/academic-design-system.css"
      - "_includes/education/learning-guide-cta.html"
      - "docs/academic/conv04/ACADEMIC_ROUTE_LEDGER.json"
      - "docs/academic/conv04/CONV04_STATE.md"
      - "docs/academic/conv04/ZOOLOGY_PRACTICAL_FIELD_REPORT_F09_R100_AUTHORIZATION.md"
      - "docs/academic/conv04/ZOOLOGY_PRACTICAL_FIELD_REPORT_F09_R101_IMPLEMENTATION.md"
      - "docs/academic/conv04/ZOOLOGY_PRACTICAL_FIELD_REPORT_F09_R101_A11Y_EVIDENCE.md"
      - "docs/academic/conv04/ZOOLOGY_PRACTICAL_FIELD_REPORT_F09_R101_ALLOWLIST.md"
      - "docs/academic/conv04/ZOOLOGY_PRACTICAL_FIELD_REPORT_F09_R101_BROWSER_EVIDENCE.md"
      - "docs/academic/conv04/ZOOLOGY_PRACTICAL_FIELD_REPORT_F09_R101_CERTIFICATION.md"
      - "docs/academic/conv04/ZOOLOGY_PRACTICAL_FIELD_REPORT_F09_R101_PRODUCTION_EVIDENCE.md"
      - "docs/academic/conv04/ZOOLOGY_PRACTICAL_FIELD_REPORT_F09_R101_REGRESSION.md"
      - "docs/academic/conv04/ZOOLOGY_PRACTICAL_FIELD_REPORT_F09_R101_SCOPE.md"
      - ".github/scripts/validate-conv04f-zoology-practical-field-report.rb"
      - ".github/scripts/conv04f-zoology-practical-field-report-browser-certification.mjs"
      - ".github/workflows/conv04f-zoology-practical-field-report-successor-guard.yml"
      - ".github/workflows/conv04f-zoology-practical-field-report-certification.yml"
      - ".github/workflows/conv04f-zoology-practical-field-report-production-parity.yml"

permissions:
  contents: read

concurrency:
  group: conv04f-practical-field-report-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  preview_build:
    name: Build validated exact-head preview artifact
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CANDIDATE_SHA: ${{ github.event.pull_request.head.sha }}
      PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
      PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
      SITE_ARTIFACT: conv04f09-r101-site
    steps:
      - name: Check out immutable candidate
        uses: actions/checkout@v5
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Ruby
        uses: ruby/setup-ruby@a0102e0972be65f351c307e2d64b9314a57c8073
        with:
          ruby-version: "3.2"
          bundler-cache: false

      - name: Authenticate exact head, live base, and R101 scope
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$PR_BASE_SHA" = "d86325ec281e21de1a208f1a1f31ecb531821eb4"
          remote="$(git ls-remote origin "refs/heads/$PR_BASE_REF" | awk '{print $1}')"
          test "$remote" = "$PR_BASE_SHA" || { echo "BASE CHANGED — RECERTIFICATION REQUIRED"; exit 1; }
          git merge-base --is-ancestor "$PR_BASE_SHA" "$CANDIDATE_SHA" || { echo "STALE CANDIDATE"; exit 1; }
          test -z "$(git status --porcelain)"
          ruby -c .github/scripts/validate-conv04f-zoology-practical-field-report.rb
          ruby .github/scripts/validate-conv04f-zoology-practical-field-report.rb
          git diff --check "$PR_BASE_SHA...HEAD"

      - name: Build exact-head Jekyll preview artifact
        shell: bash
        env:
          JEKYLL_ENV: production
        run: |
          set -euo pipefail
          bundle install --jobs 4 --retry 3
          bundle exec jekyll clean
          JEKYLL_GITHUB_TOKEN="${{ github.token }}" bundle exec jekyll build --trace
          test -f _site/biology/higher-zoology-tree/practical/field-report/index.html

      - name: Upload validated site artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.SITE_ARTIFACT }}-${{ env.CANDIDATE_SHA }}
          path: _site
          if-no-files-found: error
          retention-days: 7

  certify:
    name: CONV-04F-09-R101 Field Report exact-head certification
    needs: [preview_build]
    if: ${{ always() && needs.preview_build.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      R101_AUTHORIZED_BASE: "d86325ec281e21de1a208f1a1f31ecb531821eb4"
      CANDIDATE_SHA: ${{ github.event.pull_request.head.sha }}
      PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
      PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
      REPORT_DIR: conv04f-zoology-practical-field-report-browser-report
    steps:
      - name: Check out immutable candidate
        uses: actions/checkout@v5
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Authenticate exact head and live base
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$PR_BASE_SHA" = "$R101_AUTHORIZED_BASE"
          git merge-base --is-ancestor "$R101_AUTHORIZED_BASE" "$CANDIDATE_SHA"
          remote="$(git ls-remote origin "refs/heads/$PR_BASE_REF" | awk '{print $1}')"
          test "$remote" = "$PR_BASE_SHA" || { echo "BASE CHANGED — RECERTIFICATION REQUIRED"; exit 1; }
          git merge-base --is-ancestor "$remote" "$CANDIDATE_SHA" || { echo "STALE CANDIDATE"; exit 1; }

      - name: Set up Ruby
        uses: ruby/setup-ruby@a0102e0972be65f351c307e2d64b9314a57c8073
        with:
          ruby-version: "3.2"
          bundler-cache: false

      - name: Certify R101 Field Report preservation and scope
        shell: bash
        run: |
          set -euo pipefail
          ruby -c .github/scripts/validate-conv04f-zoology-practical-field-report.rb
          ruby .github/scripts/validate-conv04f-zoology-practical-field-report.rb
          ruby scripts/zoology/validate_practical_213106.rb
          ruby .github/scripts/validate-conv04f-zoology-practical-gateway.rb
          ruby .github/scripts/validate-conv04f-zoology-practical-museum.rb
          git diff --check "$PR_BASE_SHA...HEAD"

      - name: Retain CONV-04 academic contracts
        shell: bash
        run: |
          set -euo pipefail
          ruby .github/scripts/validate-academic-surface-contract.rb
          ruby .github/scripts/validate-academic-design-system.rb
          ruby .github/scripts/validate-learning-guide-contract.rb
          ruby .github/scripts/validate-learning-guide-implementation.rb
          ruby .github/scripts/validate-gateway-convergence.rb
          ruby .github/scripts/validate-assessment-ownership.rb
          ruby .github/scripts/validate-assessment-gateway.rb
          ruby .github/scripts/validate-assessment-runtime-contract.rb
          ruby .github/scripts/validate-assessment-runtime-pilot.rb
          ruby .github/scripts/validate-assessment-runtime-second-bank.rb
          ruby .github/scripts/validate-assessment-runtime-third-bank.rb
          ruby .github/scripts/validate-conv04e-botany-gateway.rb
          python3 scripts/academic/validate_botany_chapter01_scope.py
          python3 scripts/academic/validate_botany_learner_content.py
          python3 scripts/academic/validate_botany_bot08_content.py
          ruby .github/scripts/validate-conv04f-hsc-zoology-gateway.rb
          ruby .github/scripts/validate-conv04f-higher-zoology-gateway.rb
          ruby .github/scripts/validate-conv04f-animal-diversity.rb
          ruby .github/scripts/validate-conv04f-ecology-route-ownership.rb
          ruby .github/scripts/validate-ecology-course.rb
          ruby .github/scripts/validate-conv04f-genetics.rb
          ruby .github/scripts/validate-conv04f-digestive-gateway.rb
          ruby .github/scripts/validate-conv04f-blood-circulation-revision.rb
          ruby .github/scripts/validate-zoology-academic-design.rb

      - name: Build exact-head production Jekyll
        shell: bash
        env:
          JEKYLL_ENV: production
        run: |
          set -euo pipefail
          bundle install --jobs 4 --retry 3
          bundle exec jekyll clean
          bundle exec jekyll build --trace
          rendered="_site/biology/higher-zoology-tree/practical/field-report/index.html"
          test -f "$rendered"
          grep -q 'data-lbfl-academic-surface="v1"' "$rendered"
          grep -q 'data-lbfl-academic-role="practical"' "$rendered"
          grep -q 'data-lbfl-learning-guide="canonical"' "$rendered"
          ruby .github/scripts/validate-conv04f-zoology-practical-field-report.rb
          ruby scripts/zoology/validate_practical_213106.rb

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install browser runtime
        shell: bash
        run: |
          set -euo pipefail
          node --check .github/scripts/conv04f-zoology-practical-field-report-browser-certification.mjs
          npm install --no-save --ignore-scripts playwright@1.62.1 axe-core@4.13.0
          npx playwright install --with-deps chromium

      - name: Serve exact-head site
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --bind 127.0.0.1 --directory _site >"$RUNNER_TEMP/r101-http.log" 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/biology/higher-zoology-tree/practical/field-report/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat "$RUNNER_TEMP/r101-http.log"
          exit 1

      - name: Browser / Axe / keyboard / reflow / spacing / reduced-motion / no-JS
        shell: bash
        run: |
          set -euo pipefail
          node .github/scripts/conv04f-zoology-practical-field-report-browser-certification.mjs \
            --base-url http://127.0.0.1:4173 \
            --output-dir "$REPORT_DIR"

      - name: Preserve R101 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conv04f-zoology-practical-field-report-${{ env.CANDIDATE_SHA }}
          path: ${{ env.REPORT_DIR }}
          if-no-files-found: warn
          retention-days: 30
