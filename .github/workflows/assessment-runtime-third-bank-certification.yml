name: Assessment Runtime Third Bank Certification

on:
  pull_request:
    branches: ["main"]
    types: [opened, synchronize, reopened, ready_for_review, edited]
    paths:
      - "_mcq-arena/academic/zoology-respiratory-system-mcq-5.md"
      - "assets/js/learning/academic-assessment-runtime.js"
      - "_data/academic/assessment_runtime_third_bank_authorization_v1.json"
      - "_data/academic/assessment_runtime_third_bank_v1.json"
      - "docs/academic/conv04/ASSESSMENT_RUNTIME_THIRD_BANK.md"
      - "docs/academic/conv04/ASSESSMENT_RUNTIME_THIRD_BANK_AUTHORIZATION.md"
      - "docs/academic/conv04/CONV04_STATE.md"
      - ".github/scripts/validate-assessment-runtime-third-bank.rb"
      - ".github/scripts/assessment-runtime-third-bank-browser-certification.mjs"
      - ".github/workflows/assessment-runtime-third-bank-certification.yml"
  workflow_dispatch:
    inputs:
      expected_main_sha:
        description: "Exact main SHA to certify"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: assessment-runtime-third-bank-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  certify:
    name: CONV-04D-06 Zoology Respiratory System runtime migration
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      D06_AUTHORIZED_BASE: "d623e0016fdc98ee7b6ddc3b21a7c60c8383965b"
      CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.event.inputs.expected_main_sha || github.sha }}
      EXPECTED_MAIN_SHA: ${{ github.event.inputs.expected_main_sha || '' }}
      CERTIFICATION_MODE: ${{ github.event_name == 'pull_request' && 'pull_request' || 'manual' }}
      PR_BASE_REF: ${{ github.event.pull_request.base.ref || 'main' }}
      PR_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
      REPORT_DIR: assessment-runtime-third-bank-browser-report

    steps:
      - name: Check out immutable candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Authenticate exact head and current authority
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$CANDIDATE_SHA"
          git merge-base --is-ancestor "$D06_AUTHORIZED_BASE" "$actual" || {
            echo "D-06 AUTHORIZED BASE IS NOT ANCESTOR"
            exit 1
          }

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            remote="$(git ls-remote origin "refs/heads/$PR_BASE_REF" | awk '{print $1}')"
            test "$remote" = "$PR_BASE_SHA" || {
              echo "BASE CHANGED — RECERTIFICATION REQUIRED"
              exit 1
            }
            git merge-base --is-ancestor "$remote" "$actual" || {
              echo "STALE CANDIDATE — CURRENT BASE IS NOT ANCESTOR"
              exit 1
            }
          else
            test -n "$EXPECTED_MAIN_SHA" || {
              echo "expected_main_sha is required for manual certification"
              exit 1
            }
            remote_main="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
            test "$remote_main" = "$EXPECTED_MAIN_SHA" || {
              echo "MAIN ADVANCED — MANUAL RECERTIFICATION REQUIRED"
              exit 1
            }
            test "$actual" = "$EXPECTED_MAIN_SHA" || {
              echo "MANUAL CHECKOUT IS NOT THE EXPECTED MAIN SHA"
              exit 1
            }
          fi

      - name: Set up Ruby
        uses: ruby/setup-ruby@a0102e0972be65f351c307e2d64b9314a57c8073 # v1
        with:
          ruby-version: "3.2"
          bundler-cache: false

      - name: Validate D-06 source and content preservation
        shell: bash
        run: |
          set -euo pipefail
          ruby -c .github/scripts/validate-assessment-runtime-third-bank.rb
          ruby .github/scripts/validate-assessment-runtime-third-bank.rb
          if [ -n "$PR_BASE_SHA" ]; then
            git diff --check "$PR_BASE_SHA...HEAD"
          else
            git diff --check HEAD^...HEAD
          fi

      - name: Retain A-D contracts
        shell: bash
        run: |
          set -euo pipefail
          ruby .github/scripts/validate-academic-surface-contract.rb
          ruby .github/scripts/validate-academic-design-system.rb
          ruby .github/scripts/validate-learning-guide-contract.rb
          ruby .github/scripts/validate-learning-guide-implementation.rb
          ruby .github/scripts/validate-gateway-convergence.rb
          ruby .github/scripts/validate-assessment-ownership.rb
          ruby .github/scripts/validate-assessment-gateway.rb
          ruby .github/scripts/validate-assessment-runtime-contract.rb
          ruby .github/scripts/validate-assessment-runtime-pilot.rb
          ruby .github/scripts/validate-assessment-runtime-second-bank.rb

      - name: Install Jekyll dependencies
        shell: bash
        run: |
          set -euo pipefail
          bundle install --jobs 4 --retry 3

      - name: Build exact-head production site
        shell: bash
        env:
          JEKYLL_ENV: production
        run: |
          set -euo pipefail
          bundle exec jekyll clean
          bundle exec jekyll build --trace
          test -f _site/mcq-arena/academic/zoology-respiratory-system-mcq-5/index.html
          ruby .github/scripts/validate-assessment-runtime-third-bank.rb

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install browser runtime
        shell: bash
        run: |
          set -euo pipefail
          node --check .github/scripts/assessment-runtime-third-bank-browser-certification.mjs
          npm install --no-save --ignore-scripts playwright@1.62.1 axe-core@4.10.3
          npx playwright install --with-deps chromium

      - name: Start exact-head local site
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --bind 127.0.0.1 --directory _site >"$RUNNER_TEMP/assessment-runtime-third-bank-http.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/assessment-runtime-third-bank-http.pid"
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:4173/mcq-arena/academic/zoology-respiratory-system-mcq-5/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/assessment-runtime-third-bank-http.log"
          exit 1

      - name: Certify D-06 browser behavior
        shell: bash
        run: |
          set -euo pipefail
          node .github/scripts/assessment-runtime-third-bank-browser-certification.mjs \
            --base-url http://127.0.0.1:4173 \
            --output-dir "$REPORT_DIR"

      - name: Add browser evidence to summary
        if: always()
        shell: bash
        run: |
          if [[ -f "$REPORT_DIR/summary.md" ]]; then
            cat "$REPORT_DIR/summary.md" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Preserve browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: assessment-runtime-third-bank-browser-${{ env.CANDIDATE_SHA }}
          path: ${{ env.REPORT_DIR }}
          if-no-files-found: warn
          retention-days: 30
