name: CONV-04F Trusted One-Time Migration Authorization
# Policy and token run exclusively from authenticated main; NEVER execute candidate code.
on:
  pull_request_target:
    branches: ["main"]
    types: [opened, synchronize, reopened, ready_for_review, edited]
    paths:
      - ".github/scripts/validate-conv04f-zoology-practical-museum.rb"
      - ".github/scripts/validate-conv04f-zoology-practical-whole-mounts.rb"
      - ".github/scripts/validate-conv04f-zoology-practical-field-report.rb"
      - ".github/scripts/validate-conv04f-zoology-practical-temporary-mounts.rb"
      - ".github/scripts/validate-conv04f-zoology-practical-permanent-slides.rb"
      - ".github/scripts/validate-conv04f-zoology-practical-appendages.rb"
      - ".github/scripts/validate-conv04f-zoology-practical-dissection.rb"
permissions:
  contents: read
  pull-requests: read
  statuses: write
jobs:
  trusted-migration-authorization:
    if: github.event.pull_request.number == 468
    runs-on: ubuntu-latest
    steps:
      - name: Set pending exact-head authorization status
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea
        with:
          script: |
            const pr = context.payload.pull_request;
            await github.rest.repos.createCommitStatus({
              ...context.repo, sha: pr.head.sha, state: 'pending',
              context: 'LBFL Trusted Practical Migration Authorization',
              description: 'Trusted exact-head migration validation in progress',
              target_url: context.serverUrl + '/' + context.repo.owner + '/' + context.repo.repo + '/actions/runs/' + context.runId
            });
      - name: Checkout immutable trusted main base, NOT candidate
        id: checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Trusted positive and negative regression
        id: regression
        run: python3 scripts/ci/conv04f_narrow_migration_gate.py --self-test
      - name: Authenticate owner-authorized current head and exact seven blobs
        id: authorize
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ci/conv04f_narrow_migration_gate.py --authorize
      - name: Publish final trusted status to live PR HEAD (not base SHA)
        if: always()
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea
        env:
          CHECKOUT_OUTCOME: ${{ steps.checkout.outcome }}
          REGRESSION_OUTCOME: ${{ steps.regression.outcome }}
          AUTH_OUTCOME: ${{ steps.authorize.outcome }}
        with:
          script: |
            const pull_number = context.payload.pull_request.number;
            const eventHead = context.payload.pull_request.head.sha;
            const eventBase = context.payload.pull_request.base.sha;
            const fresh = (await github.rest.pulls.get({...context.repo, pull_number})).data;
            const main = (await github.rest.repos.getBranch({...context.repo, branch: 'main'})).data;
            if (fresh.head.sha !== eventHead) {
              core.setFailed('Stale PR event; never publish success for a changed head');
              return;
            }
            const currentBase = main.commit.sha;
            const bodyLines = (fresh.body || '').split(/\r?\n/).map(line => line.trim());
            const soloLine = 'SOLO-MAINTAINER-EXCEPTION: LBFL-PERMANENT-SOLO-MAINTAINER';
            const approvalLine = 'SOLO-MAINTAINER-APPROVAL: ' + eventHead;
            const liveOwnerAuthority =
              fresh.state === 'open' && !fresh.draft &&
              fresh.user?.login === 'yusuf38bcs-oss' &&
              fresh.head.repo?.full_name === 'yusuf38bcs-oss/yusuf38bcs-oss.github.io' &&
              bodyLines.filter(line => line.startsWith('SOLO-MAINTAINER-EXCEPTION:')).length === 1 &&
              bodyLines.filter(line => line.startsWith('SOLO-MAINTAINER-APPROVAL:')).length === 1 &&
              bodyLines.includes(soloLine) && bodyLines.includes(approvalLine);
            const gatePassed =
              liveOwnerAuthority &&
              process.env.CHECKOUT_OUTCOME === 'success' &&
              process.env.REGRESSION_OUTCOME === 'success' &&
              process.env.AUTH_OUTCOME === 'success' &&
              currentBase === eventBase &&
              fresh.base.sha === currentBase &&
              fresh.base.ref === 'main';
            await github.rest.repos.createCommitStatus({
              ...context.repo, sha: eventHead,
              state: gatePassed ? 'success' : 'failure',
              context: 'LBFL Trusted Practical Migration Authorization',
              description: gatePassed ? 'Trusted 7-blob exact-head migration: PASS' :
                'Trusted migration HOLD: test, authority, or current-base mismatch',
              target_url: context.serverUrl + '/' + context.repo.owner + '/' + context.repo.repo + '/actions/runs/' + context.runId
            });
            if (!gatePassed) core.setFailed('Fail-closed migration authorization');
