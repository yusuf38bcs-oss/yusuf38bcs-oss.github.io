ecology:
  quiz_title: "Population Ecology & Ecosystem Dynamics Matrix"
  time_limit_mins: 15
  questions:
    - id: "eco_q1"
      question_text: "মানুষ, হাতি অথবা তিমি মাছের মতো K-selected প্রজাতিসমূহ পপ্যুলেশন ইকোলজির কোন ধরণের বেঁচে থাকার বক্ররেখা (Survivorship Curve) প্রদর্শন করে?"
      correct_key: "a"
      explanation: "K-selected প্রজাতিসমূহ (যেমন: মানুষ) অত্যন্ত কম সংখ্যায় সন্তান জন্ম দেয় কিন্তু তাদের সর্বোচ্চ অভিভাবকত্ব ও কেয়ারিং (Parental Care) প্রদান করে। এর ফলে জীবনের শুরুর দিকে এদের মৃত্যুহার থাকে নগণ্য, এবং শেষভাগে এসে বার্ধক্যজনিত কারণে উচ্চ মৃত্যুহার দেখা যায়। এটিই হলো Type I Survivorship Curve।"
      options:
        - key: "a"
          text: "Type I (Late Death Profile)"
        - key: "b"
          text: "Type II (Constant Constant-Mortality Profile)"
        - key: "c"
          text: "Type III (Early Larval Death Profile)"
        - key: "d"
          text: "Geometric Boom-and-Bust Curve"

    - id: "eco_q2"
      question_text: "পরিবেশের ধারণক্ষমতা (Carrying Capacity - K) যখন পপ্যুলেশনের বর্তমান আকার (N) এর সমান হয়ে যায়, তখন লজিস্টিক বৃদ্ধি সমীকরণের বৃদ্ধির হার (dN/dt) কত হবে?"
      correct_key: "c"
      explanation: "লজিস্টিক গ্রোথ সমীকরণটি হলো dN/dt = rN[(K-N)/K]। যখন N = K হয়, তখন পরিবেশগত বাধা ফ্যাক্টর (K-N)/K এর মান হয়ে যায় (K-K)/K = 0। ফলস্বরূপ, সম্পূর্ণ সমীকরণের মান শূন্য (0) হয়ে যায়, যা নির্দেশ করে পপ্যুলেশনটি তার স্থিতিশীল সর্বোচ্চ শিখরে পৌঁছে গেছে।"
      options:
        - key: "a"
          text: "সর্বোচ্চ জ্যামিতিক বিস্ফোরণ ঘটবে"
        - key: "b"
          text: "ঋণাত্মক গ্রোথ রেট শুরু হবে"
        - key: "c"
          text: "বৃদ্ধি সম্পূর্ণ স্তব্ধ বা শূন্য (0) হয়ে যাবে"
        - key: "d"
          text: "অন্তর্নিহিত বৃদ্ধির হার (r) দ্বিগুণ হবে"

    - id: "eco_q3"
      question_text: "তীব্র প্রতিযোগিতা এবং স্ট্রিনজেন্ট টেরিটোরিয়াল আচরণের কারণে কোনো বনের উদ্ভিদের মধ্যে কোন ধরণের পপ্যুলেশন বিস্তৃতি (Population Dispersion) দেখা যায়?"
      correct_key: "b"
      explanation: "যখন কোনো পপ্যুলেশনের সদস্যদের মধ্যে সীমিত সম্পদের জন্য তীব্র প্রতিযোগিতা বা নিজের এলাকা ধরে রাখার প্রবণতা (Territorial behavior) কাজ করে, তখন তারা একে অপরের থেকে সমান দূরত্ব বজায় রেখে অবস্থান করে। একে সুষম বা Uniform Dispersion বলা হয়।"
      options:
        - key: "a"
          text: "Clumped Dispersion (পুঞ্জীভূত বিন্যাস)"
        - key: "b"
          text: "Uniform Dispersion (সুষম জ্যামিতিক বিন্যাস)"
        - key: "c"
          text: "Random Dispersion (দৈব বিন্যাস)"
        - key: "d"
          text: "Stratified Bio-Layer Matrix"
