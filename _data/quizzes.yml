genetics:
  quiz_title: "Genetics & Laws of Inheritance"
  time_limit_mins: 15
  questions:
    - id: q1
      question_text: "Which phenotypic ratio represents dominant epistasis in classical genetic inheritance interactions?"
      options:
        - a: "9:3:3:1"
        - b: "12:3:1"
        - c: "9:7"
        - d: "15:1"
      correct_key: "b"
      explanation: "Dominant epistasis occurs when a dominant allele at one locus masks expression at another locus, producing a 12:3:1 ratio instead of the standard dihybrid 9:3:3:1."

    - id: q2
      question_text: "Which enzyme relieves torsional strain ahead of the replication fork?"
      options:
        - a: "DNA Polymerase III"
        - b: "RNA Primase"
        - c: "DNA Topoisomerase (Gyrase)"
        - d: "DNA Ligase"
      correct_key: "c"
      explanation: "Topoisomerases introduce temporary breaks into the DNA backbone to relieve supercoiling tension generated by helicase unwinding."

    - id: q3
      question_text: "What is the primary function of the enzyme DNA ligase during DNA replication?"
      options:
        - a: "Synthesizing RNA primers"
        - b: "Unwinding the DNA double helix"
        - c: "Joining Okazaki fragments on the lagging strand"
        - d: "Proofreading newly synthesized DNA"
      correct_key: "c"
      explanation: "DNA ligase catalyzes the formation of phosphodiester bonds between adjacent DNA fragments, specifically sealing the nicks between Okazaki fragments on the lagging strand."

cell_biology:
  quiz_title: "Cell Biology & Physiology"
  time_limit_mins: 10
  questions:
    - id: q1
      question_text: "Which organelle is primarily responsible for ATP synthesis via oxidative phosphorylation?"
      options:
        - a: "Endoplasmic Reticulum"
        - b: "Golgi Apparatus"
        - c: "Mitochondria"
        - d: "Lysosome"
      correct_key: "c"
      explanation: "Mitochondria house the electron transport chain and ATP synthase complexes on their inner membrane, making them the primary site of aerobic ATP production."

    - id: q2
      question_text: "During which phase of the cell cycle does DNA replication occur?"
      options:
        - a: "G1 Phase"
        - b: "S Phase"
        - c: "G2 Phase"
        - d: "M Phase"
      correct_key: "b"
      explanation: "The S (Synthesis) phase is the specific period during interphase when the cell replicates its entire genome in preparation for mitosis."

ecology:
  quiz_title: "Population Ecology"
  time_limit_mins: 12
  questions:
    - id: q1
      question_text: "Which type of survivorship curve characterizes species that produce large numbers of offspring with high juvenile mortality?"
      options:
        - a: "Type I"
        - b: "Type II"
        - c: "Type III"
        - d: "Type IV"
      correct_key: "c"
      explanation: "Type III survivorship curves show high early mortality with relatively low death rates for survivors, typical of organisms like marine invertebrates and plants that produce many offspring."

    - id: q2
      question_text: "In the logistic growth model, what does the parameter K represent?"
      options:
        - a: "Intrinsic rate of increase"
        - b: "Carrying capacity"
        - c: "Population density"
        - d: "Generation time"
      correct_key: "b"
      explanation: "K represents the carrying capacity — the maximum population size that a particular environment can sustain indefinitely given available resources."

zoology:
  quiz_title: "Animal Diversity & Classification"
  time_limit_mins: 15
  questions:
    - id: q1
      question_text: "Which phylum is characterized by a water vascular system and radial symmetry in adults?"
      options:
        - a: "Cnidaria"
        - b: "Echinodermata"
        - c: "Arthropoda"
        - d: "Mollusca"
      correct_key: "b"
      explanation: "Echinoderms (e.g., starfish, sea urchins) possess a unique water vascular system used for locomotion and feeding, along with pentaradial symmetry in adults."

    - id: q2
      question_text: "In the classification hierarchy, which rank is immediately above 'Family'?"
      options:
        - a: "Genus"
        - b: "Order"
        - c: "Class"
        - d: "Phylum"
      correct_key: "b"
      explanation: "The standard taxonomic hierarchy is: Kingdom → Phylum → Class → Order → Family → Genus → Species. Therefore, Order ranks immediately above Family."

    - id: q3
      question_text: "Which protozoan group is exclusively parasitic and lacks locomotor organelles in the adult stage?"
      options:
        - a: "Rhizopoda"
        - b: "Ciliata"
        - c: "Sporozoa"
        - d: "Flagellata"
      correct_key: "c"
      explanation: "Sporozoans (Apicomplexa) are entirely parasitic and adult forms typically lack structures for locomotion, relying on host transmission."

physiology:
  quiz_title: "Human Physiology & Organ Systems"
  time_limit_mins: 15
  questions:
    - id: q1
      question_text: "Which blood vessel carries oxygenated blood from the lungs to the heart?"
      options:
        - a: "Pulmonary artery"
        - b: "Pulmonary vein"
        - c: "Superior vena cava"
        - d: "Aorta"
      correct_key: "b"
      explanation: "The pulmonary vein is unique among veins in that it carries oxygenated blood, transporting it from the lungs back to the left atrium of the heart."

    - id: q2
      question_text: "Which enzyme is responsible for the breakdown of starch into maltose in the oral cavity?"
      options:
        - a: "Pepsin"
        - b: "Lipase"
        - c: "Salivary amylase"
        - d: "Trypsin"
      correct_key: "c"
      explanation: "Salivary amylase (ptyalin) begins carbohydrate digestion by hydrolyzing starch into maltose and dextrins in the mouth."

    - id: q3
      question_text: "The baroreceptor reflex primarily regulates which physiological parameter?"
      options:
        - a: "Blood glucose"
        - b: "Blood pressure"
        - c: "Body temperature"
        - d: "Respiratory rate"
      correct_key: "b"
      explanation: "Baroreceptors located in the carotid sinus and aortic arch detect changes in arterial blood pressure and trigger autonomic responses to restore homeostasis."

botany:
  quiz_title: "Cell Organelles & Plant Biology"
  time_limit_mins: 12
  questions:
    - id: q1
      question_text: "Which organelle is responsible for photosynthesis in plant cells?"
      options:
        - a: "Mitochondria"
        - b: "Chloroplast"
        - c: "Ribosome"
        - d: "Peroxisome"
      correct_key: "b"
      explanation: "Chloroplasts contain chlorophyll and the thylakoid membrane system where the light-dependent reactions of photosynthesis occur."

    - id: q2
      question_text: "Which structure maintains turgor pressure and provides structural support in plant cells?"
      options:
        - a: "Cell membrane"
        - b: "Central vacuole"
        - c: "Nucleus"
        - d: "Golgi apparatus"
      correct_key: "b"
      explanation: "The central vacuole in plant cells stores water and solutes; when full, it exerts turgor pressure against the cell wall, maintaining rigidity."

    - id: q3
      question_text: "Which cell organelle is known as the 'powerhouse of the cell' due to ATP production?"
      options:
        - a: "Nucleus"
        - b: "Chloroplast"
        - c: "Mitochondria"
        - d: "Lysosome"
      correct_key: "c"
      explanation: "Mitochondria generate ATP through cellular respiration, earning them the title 'powerhouse of the cell' across both plant and animal kingdoms."