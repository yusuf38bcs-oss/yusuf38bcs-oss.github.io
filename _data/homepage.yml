assessment_loop:
  eyebrow: "Assessment and feedback"
  title: "Turn every attempt into better understanding"
  summary: "Practice is useful only when learners can see what happened, why it happened and what to repair next."
  result: "A visible path from first attempt to corrected understanding."
  steps:
    - "Learn"
    - "Attempt"
    - "Submit"
    - "Score"
    - "Read explanation"
    - "Repair misconception"

synaptic_bridge:
  eyebrow: "Learning design"
  name: "The Synaptic Bridge"
  title: "Connect explanation, practice and reflection"
  summary: "LBFL links concept learning, visual reasoning, assessment feedback and reflective questioning so that learners can move from remembering information to explaining biological relationships."
  principles:
    - title: "Understand"
      text: "Begin with a clear concept and the language needed to explain it."
    - title: "Visualise"
      text: "Use diagrams, comparisons and systems thinking to organise relationships."
    - title: "Apply"
      text: "Test understanding through MCQs, questions and structured tasks."
    - title: "Reflect"
      text: "Identify misconceptions and rebuild the explanation in your own words."
  action_label: "Explore Socratic learning"
  action_url: "/socratic/"

editorial_trust:
  eyebrow: "Editorial trust"
  title: "Biology teaching grounded in reflection and evidence"
  summary: "Lessons are developed for Bangladeshi learners with Bangla-first explanation, English technical terms and explicit academic review."
