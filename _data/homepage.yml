featured_route:
  enabled: true
  eyebrow: "Featured connected journey"
  title: "Inside the Cell"
  title_accent: "Six Functions. One Living System."
  summary: "Follow the cell from organisation and selective exchange to protein production, internal transport, molecular processing and usable energy."
  lesson_count: 6
  chapter_url: "/biology/hsc-corner/botany/chapter-01-cell-and-its-structure/"
  start_url: "/biology/hsc-corner/botany/lecture-01-cell-protoplasm-cell-theory/"
  flow:
    - "Identity"
    - "Boundary"
    - "Production"
    - "Transport"
    - "Processing"
    - "Energy"

latest_learning:
  mode: explicit-curation
  maximum_items: 6
  selection_policy: "Render only the explicitly listed learner-facing items below. Do not mutate lesson or collection front matter for homepage eligibility."
  items:
    - id: cell-protoplasm-cell-theory
      title: "Cell, Protoplasm and Cell Theory"
      label: "Lecture 01"
      function: "Cellular identity"
      question: "What makes a cell the fundamental unit of life?"
      pathway: "HSC Botany"
      url: "/biology/hsc-corner/botany/lecture-01-cell-protoplasm-cell-theory/"
    - id: plasma-membrane-fluid-mosaic-model
      title: "Plasma Membrane and Fluid Mosaic Model"
      label: "Lecture 02"
      function: "Selective exchange"
      question: "How does the plasma membrane control movement?"
      pathway: "HSC Botany"
      url: "/biology/hsc-corner/botany/lecture-02-plasma-membrane-fluid-mosaic-model/"
    - id: cytoplasm-ribosome-protein-factory
      title: "Cytoplasm and Ribosome: Protein Factory of the Cell"
      label: "Lecture 03"
      function: "Protein production"
      question: "How do cytoplasm and ribosomes build proteins?"
      pathway: "HSC Botany"
      url: "/biology/hsc-corner/botany/lecture-03-cytoplasm-ribosome-protein-factory/"
    - id: endoplasmic-reticulum-transport-network
      title: "Endoplasmic Reticulum: Transport Network of the Cell"
      label: "Lecture 04"
      function: "Internal transport"
      question: "How does the ER organise cellular movement?"
      pathway: "HSC Botany"
      url: "/biology/hsc-corner/botany/lecture-04-endoplasmic-reticulum-transport-network/"
    - id: golgi-body-lysosome-peroxisome
      title: "Golgi Body, Lysosome and Peroxisome"
      label: "Lecture 05"
      function: "Processing and recycling"
      question: "How do Golgi bodies, lysosomes and peroxisomes coordinate cellular maintenance?"
      pathway: "HSC Botany"
      url: "/biology/hsc-corner/botany/lecture-05-golgi-body-lysosome-peroxisome/"
    - id: mitochondria-powerhouse
      title: "Mitochondria: Powerhouse of the Cell"
      label: "Lecture 06"
      function: "Cellular energy"
      question: "How do mitochondria release usable energy?"
      pathway: "HSC Botany"
      url: "/biology/hsc-corner/botany/lecture-06-mitochondria/"
  forbidden_collections:
    - redirects
  exclude_internal_paths:
    - ".github/"
    - "audit-reports/"
    - "docs/"

synaptic_bridge:
  eyebrow: "The LBFL method"
  name: "The Synaptic Bridge"
  title: "From Observation to Evidence-Based Explanation"
  summary: "Every LBFL lesson moves through one memorable critical-thinking cycle so that biological facts become connected explanations."
  principles:
    - title: "Observe"
      text: "Notice biological structure, pattern, change or relationship accurately."
    - title: "Question"
      text: "Identify what needs explaining and challenge the first assumption."
    - title: "Connect"
      text: "Link structure, function, evidence and prior knowledge."
    - title: "Explain"
      text: "Construct an answer, test it and revise it through reflection."
  action_label: "Explore Socratic learning"
  action_url: "/socratic/"

assessment_loop:
  eyebrow: "Feedback that changes thinking"
  title: "Do Not Just Check the Answer. Repair the Reasoning."
  summary: "Every attempt should reveal what you understand, where the reasoning broke and which concept needs rebuilding."
  result: "Reattempt returns the learner to a stronger prediction, keeping the cycle active."
  steps:
    - title: "Attempt"
      text: "Commit to an answer and make the reasoning visible."
    - title: "Feedback"
      text: "Compare the reasoning with evidence and explanation."
    - title: "Repair"
      text: "Identify and rebuild the mistaken concept."
    - title: "Reattempt"
      text: "Apply the corrected idea in a new context."

editorial_trust:
  eyebrow: "How LBFL content is built"
  title: "Biology Teaching Designed for Clarity, Evidence and Revision"
  summary: "Credibility comes from a transparent learning and review process, supported by an accountable educator."
  author: "Md. Yusuf"
  role: "Zoology Educator and Editorial Lead"
  affiliation: "Bangladesh Civil Service - General Education"
  methods:
    - title: "Curriculum Alignment"
      text: "National syllabus and chapter alignment are stated clearly."
    - title: "Constructive Alignment"
      text: "Objectives, explanations, activities and assessment are connected."
    - title: "Evidence and References"
      text: "Scientific references and further reading support major claims."
    - title: "Review and Correction"
      text: "Content is designed for academic review, revision history and correction."
  profile_url: "/about/"
  contact_url: "/contact/"

reflection_lab:
  eyebrow: "Reflection lab"
  title: "One Question Can Reveal How You Think"
  summary: "Test a biological explanation, then consider a clearly separated reflective worldview lens."
  challenge_title: "Test an Explanation"
  challenge_question: "A cell with severe DNA damage continues dividing and fails to activate apoptosis. Which tumour-suppressor transcription factor is most likely impaired?"
  reflection_title: "Signs Within and Beyond"
  reflection_prompt: "What does the organisation of a living system reveal about interdependence, order and the limits of human understanding?"
  continue_links:
