sets:
  - id: "urban-heat"
    title: "Why Street Trees Cool Cities"
    topic: "Urban ecology"
    level: "Academic practice"
    minutes: 20
    passage:
      - "On hot summer days, two streets in the same city can feel surprisingly different. One may be lined with concrete walls and parked cars, while another is shaded by mature trees. The contrast is not only visual. Trees alter the local environment in several ways, and these changes can reduce the amount of heat experienced by pedestrians and nearby buildings."
      - "The most obvious mechanism is shade. Leaves intercept solar radiation before it reaches pavements, walls and people. A shaded surface usually gains less heat during the day and therefore releases less stored heat later. This matters because materials such as asphalt and dark roofing can absorb substantial energy when exposed to direct sunlight. The benefit of shade, however, depends on the size and position of the canopy. A young tree with a small crown cannot provide the same coverage as a mature tree."
      - "Trees can also cool the air through transpiration. Water absorbed by roots moves through the plant and is released from leaves as water vapour. The change from liquid water to vapour uses energy, which can lower temperatures around the leaf surface. This process is influenced by soil moisture, species and weather. During drought, some trees reduce water loss by closing their stomata, so the cooling effect may become weaker."
      - "Urban planners therefore need to consider more than the number of trees planted. Survival, canopy growth, access to soil and water, and placement near heat-exposed routes all influence long-term performance. A planting programme that counts seedlings but ignores these conditions may look ambitious on paper while producing little shade years later. In contrast, protecting existing mature trees can preserve cooling benefits immediately while new trees establish."
    questions:
      - id: "heat-q1"
        type: "True / False / Not Given"
        prompt: "The passage states that tree shade can reduce the amount of heat stored by urban surfaces."
        options: ["True", "False", "Not Given"]
        answer: "True"
        evidence: "The second paragraph says shaded surfaces gain less heat and later release less stored heat."
        explanation: "This directly matches the passage, so the statement is True."
        tag: "detail"
      - id: "heat-q2"
        type: "True / False / Not Given"
        prompt: "Young trees usually cool streets more effectively than mature trees because their leaves transpire faster."
        options: ["True", "False", "Not Given"]
        answer: "False"
        evidence: "The passage says a young tree with a small crown cannot provide the same shade coverage as a mature tree."
        explanation: "The claim reverses the passage's comparison. No statement says young trees transpire faster."
        tag: "contradiction"
      - id: "heat-q3"
        type: "True / False / Not Given"
        prompt: "The passage gives an exact percentage by which transpiration lowers street-level air temperature."
        options: ["True", "False", "Not Given"]
        answer: "Not Given"
        evidence: "Transpiration is described qualitatively, but no percentage reduction is supplied."
        explanation: "Because the passage provides no exact percentage, the information is Not Given."
        tag: "not-given"
      - id: "heat-q4"
        type: "Multiple choice"
        prompt: "Why may drought reduce the cooling effect of some trees?"
        options:
          - "Their roots stop absorbing all water permanently."
          - "They may close their stomata and reduce water loss."
          - "Their canopies immediately become larger."
          - "They reflect more solar radiation from roads."
        answer: "They may close their stomata and reduce water loss."
        evidence: "The third paragraph links drought with stomatal closure and weaker cooling."
        explanation: "Reduced water loss means less transpiration, so less energy is used in evaporation."
        tag: "cause-effect"
      - id: "heat-q5"
        type: "Sentence completion"
        prompt: "A planting programme may fail to provide much future shade if it focuses on counting seedlings but ignores their _____."
        options: ["leaf colour", "survival conditions", "street names", "flowering season"]
        answer: "survival conditions"
        evidence: "The final paragraph highlights survival, canopy growth, soil, water and placement as long-term conditions."
        explanation: "The sentence summarizes the contrast between counting seedlings and supporting their survival and growth."
        tag: "summary"
      - id: "heat-q6"
        type: "Matching heading"
        prompt: "Choose the best heading for the passage."
        options:
          - "Why cities should remove mature trees"
          - "A single mechanism explains all urban cooling"
          - "Cooling through several pathways and planning choices"
          - "How to measure rainfall with street trees"
        answer: "Cooling through several pathways and planning choices"
        evidence: "The passage combines shade, transpiration and long-term planning conditions."
        explanation: "The best heading captures both the biological mechanisms and the planning decisions discussed throughout."
        tag: "main-idea"

  - id: "retrieval-learning"
    title: "Why Remembering Can Strengthen Learning"
    topic: "Learning science"
    level: "Academic practice"
    minutes: 20
    passage:
      - "Students often judge a study session by how familiar the material feels. Re-reading a page can create a sense of fluency because the words become easier to process. Yet familiarity is not the same as the ability to produce an idea later without support. A learner may recognise a definition immediately when seeing it and still struggle to explain it from memory during an exam."
      - "Retrieval practice takes a different approach. Instead of presenting the information again, it asks the learner to reconstruct it. This can be done with a short quiz, a blank-page summary, flash cards used carefully, or a question answered without looking at notes. The effort involved is important because it reveals what can actually be recalled and where memory is incomplete."
      - "Effective retrieval is usually followed by feedback. If a learner confidently recalls an incorrect idea and never checks it, the error can persist. Comparing an attempted answer with a reliable source allows the learner to correct mistakes and notice missing details. For this reason, retrieval practice is not simply repeated testing; it is a cycle of recall, checking and adjustment."
      - "Spacing also changes the difficulty of retrieval. Trying to recall something immediately after reading may be easy, while returning to it later requires more reconstruction. If the delay is so long that nothing can be remembered, the task may become unproductive. The useful interval therefore depends on prior knowledge and the complexity of the material. A good study plan adjusts the delay rather than assuming one schedule will suit every topic."
    questions:
      - id: "retrieval-q1"
        type: "True / False / Not Given"
        prompt: "The passage treats familiarity with a text as identical to being able to explain it later from memory."
        options: ["True", "False", "Not Given"]
        answer: "False"
        evidence: "The first paragraph explicitly distinguishes familiarity from later unsupported recall."
        explanation: "The statement contradicts the passage, so it is False."
        tag: "contradiction"
      - id: "retrieval-q2"
        type: "Multiple choice"
        prompt: "What is a central feature of retrieval practice according to the passage?"
        options:
          - "Seeing the same information repeatedly"
          - "Reconstructing information without first looking at the answer"
          - "Avoiding all forms of feedback"
          - "Using only one study schedule for every topic"
        answer: "Reconstructing information without first looking at the answer"
        evidence: "The second paragraph defines retrieval as reconstructing information rather than presenting it again."
        explanation: "The defining action is active recall without immediate access to the source."
        tag: "definition"
      - id: "retrieval-q3"
        type: "Sentence completion"
        prompt: "After retrieval, checking an attempted answer can expose mistakes and _____."
        options: ["increase familiarity only", "remove all difficulty", "reveal missing details", "guarantee a perfect score"]
        answer: "reveal missing details"
        evidence: "The third paragraph says checking helps correct mistakes and notice missing details."
        explanation: "This option directly completes the idea expressed in the passage."
        tag: "detail"
      - id: "retrieval-q4"
        type: "True / False / Not Given"
        prompt: "The passage recommends exactly seven days between every retrieval attempt."
        options: ["True", "False", "Not Given"]
        answer: "Not Given"
        evidence: "No fixed number of days is provided; the interval is said to depend on prior knowledge and complexity."
        explanation: "Because no seven-day rule appears, the information is Not Given."
        tag: "not-given"
      - id: "retrieval-q5"
        type: "Multiple choice"
        prompt: "Why can feedback matter after a confident retrieval attempt?"
        options:
          - "Confidence always proves the answer is correct."
          - "An unchecked incorrect idea can remain in memory."
          - "Feedback prevents any future forgetting."
          - "Feedback makes spacing unnecessary."
        answer: "An unchecked incorrect idea can remain in memory."
        evidence: "The third paragraph warns that confidently recalled errors can persist if they are never checked."
        explanation: "Feedback provides the comparison needed to detect and correct a mistaken recall."
        tag: "reasoning"
      - id: "retrieval-q6"
        type: "Matching heading"
        prompt: "Choose the best heading for the passage."
        options:
          - "Familiarity, retrieval, feedback and spacing in learning"
          - "Why all tests should be removed from education"
          - "A fixed timetable for every learner"
          - "How handwriting speed determines memory"
        answer: "Familiarity, retrieval, feedback and spacing in learning"
        evidence: "Those four ideas structure the passage from beginning to end."
        explanation: "The heading captures the passage's full scope without adding claims that are not discussed."
        tag: "main-idea"

  - id: "pollinator-corridors"
    title: "Small Habitats, Connected Landscapes"
    topic: "Conservation biology"
    level: "Academic practice"
    minutes: 20
    passage:
      - "A city park may contain flowering plants, but for a small insect the surrounding landscape can determine whether that park is easy to reach. Roads, buildings and intensively managed lawns may separate feeding or nesting sites. Conservation projects sometimes respond by creating a sequence of smaller habitat patches rather than relying on one isolated green space."
      - "These patches are often described as stepping stones or corridors, although the two designs are not identical. A corridor is physically continuous, while stepping stones are separate patches close enough to be used in sequence. Both approaches aim to make movement across a modified landscape easier. Their value depends on the species involved: a gap that is trivial for a strong flyer may be a major barrier for an insect that normally moves only short distances."
      - "Plant choice also matters. A visually attractive garden can still provide limited food if most flowers bloom at the same time. A longer flowering season can be created by combining species that bloom in different months. Nesting resources may be equally important. Some pollinators use bare soil, hollow stems or cavities, so a project designed only around nectar can overlook other stages of the life cycle."
      - "Monitoring is needed because planting alone does not prove that connectivity has improved. Researchers may compare visitation, movement or occupancy before and after habitat changes, while also considering weather and seasonal variation. Even then, a rise in insect numbers at one patch does not automatically show that individuals are moving successfully between patches. Evidence about movement must match the question being asked."
    questions:
      - id: "corridor-q1"
        type: "True / False / Not Given"
        prompt: "The passage says corridors and stepping stones are exactly the same landscape design."
        options: ["True", "False", "Not Given"]
        answer: "False"
        evidence: "The second paragraph distinguishes continuous corridors from separate stepping-stone patches."
        explanation: "Because the passage explicitly says the designs are not identical, the statement is False."
        tag: "comparison"
      - id: "corridor-q2"
        type: "Multiple choice"
        prompt: "Why can the same gap affect two insect species differently?"
        options:
          - "All insects use identical movement ranges."
          - "Movement ability differs among species."
          - "Only plant colour determines movement."
          - "Roads increase the flight strength of every species."
        answer: "Movement ability differs among species."
        evidence: "The passage contrasts strong flyers with insects that normally move only short distances."
        explanation: "Connectivity must be evaluated relative to the movement capacity of the target species."
        tag: "inference"
      - id: "corridor-q3"
        type: "Sentence completion"
        prompt: "Combining plants that flower in different months can extend the _____."
        options: ["road network", "flowering season", "building height", "monitoring budget"]
        answer: "flowering season"
        evidence: "The third paragraph states this directly."
        explanation: "Different flowering times can provide food over a longer portion of the year."
        tag: "detail"
      - id: "corridor-q4"
        type: "True / False / Not Given"
        prompt: "The passage reports that one particular city increased pollinator abundance by exactly 32 percent."
        options: ["True", "False", "Not Given"]
        answer: "Not Given"
        evidence: "No named city or numerical percentage is supplied."
        explanation: "The passage discusses monitoring principles but gives no such result."
        tag: "not-given"
      - id: "corridor-q5"
        type: "Multiple choice"
        prompt: "What limitation of nectar-focused projects is identified?"
        options:
          - "They can ignore nesting resources needed by some pollinators."
          - "They always reduce the number of flowers."
          - "They prevent researchers from observing weather."
          - "They make corridors physically continuous."
        answer: "They can ignore nesting resources needed by some pollinators."
        evidence: "The third paragraph lists bare soil, hollow stems and cavities as nesting resources."
        explanation: "Food is only one requirement; habitat design may also need to support nesting."
        tag: "systems-thinking"
      - id: "corridor-q6"
        type: "Matching heading"
        prompt: "Choose the best heading for the final paragraph."
        options:
          - "Why planting itself proves movement"
          - "Matching monitoring evidence to the connectivity question"
          - "The colour preferences of urban gardeners"
          - "Why seasonal variation should never be measured"
        answer: "Matching monitoring evidence to the connectivity question"
        evidence: "The paragraph warns that higher numbers at one patch do not automatically prove movement between patches."
        explanation: "The paragraph is about choosing evidence that actually tests the intended connectivity claim."
        tag: "evidence"
