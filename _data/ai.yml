endpoint: "https://api.learningbiologyforlife.org"
cooldownMs: 1200
maxRetries: 3
cacheEnabled: true
memoryEnabled: true
analytics: true

provider: "openai"
models:
  fast: "gpt-5.6-luna"
  deep: "gpt-5.6-terra"
  image: "gpt-image-2"
  audio: "gpt-4o-mini-tts"

defaults:
  reasoningEffort: "low"
  store: false
