provider: "gemini"
public_scope: "socratic_mentor"
endpoint: "https://api.learningbiologyforlife.org"
cooldownMs: 1200
maxRetries: 3
cacheEnabled: true
memoryEnabled: true
analytics: true

models:
  fast: "gemini-2.5-flash"
  deep: "gemini-2.5-pro-preview-06-05"
  image: "gemini-2.0-flash-preview-image-generation"
  audio: "gemini-2.5-flash-preview-tts"

defaults:
  temperature: 0.7
  topP: 0.95
  topK: 40
