name = "synapticai-proxy"
main = "src/index.ts"
compatibility_date = "2026-06-18"
workers_dev = true
preview_urls = true

[version_metadata]
binding = "CF_VERSION_METADATA"

[vars]
OPENAI_MODEL = "gpt-5.6-terra"
