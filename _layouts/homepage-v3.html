<!doctype html>
<html lang="{{ page.lang | default: 'en' }}" class="no-js lbfl-home-v3-document">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="{{ page.robots | default: 'noindex,nofollow' }}">
    <meta name="color-scheme" content="light dark">
    <meta name="theme-color" content="#06272d">
    <title>{{ page.title | escape }}</title>
    <meta name="description" content="{{ page.description | escape }}">
    <link rel="stylesheet" href="{{ '/assets/css/homepage-v3.css' | relative_url }}?v=v3.4-0f050cf8-a34cd46970eb-4e59e7ab4713">
    <style>
      @media (max-width: 1024px) {
        .no-js .lbfl-v3-header__inner { flex-wrap: wrap; padding-block: 8px; }
        .no-js .lbfl-v3-nav { display: flex; order: 3; flex: 1 0 100%; margin-left: 0; overflow-x: auto; }
        .no-js .lbfl-v3-menu-button { display: none; }
      }

      @media print {
        .lbfl-home-v3 .lbfl-v3-hero,
        .lbfl-home-v3 .lbfl-v3-journey,
        .lbfl-home-v3 .lbfl-v3-continue,
        .lbfl-home-v3 .lbfl-v3-footer { background: #fff !important; color: #000 !important; }
        .lbfl-home-v3 .lbfl-v3-hero *,
        .lbfl-home-v3 .lbfl-v3-journey *,
        .lbfl-home-v3 .lbfl-v3-continue *,
        .lbfl-home-v3 .lbfl-v3-footer * { color: #000 !important; }
      }
    </style>
  </head>
  <body class="lbfl-home-v3">
    <a class="lbfl-v3-skip" href="#main-content">Skip to main content</a>
    {% include home-v3/header.html %}
    <main id="main-content" class="lbfl-v3-main" tabindex="-1">
      {{ content }}
    </main>
    {% include home-v3/footer.html %}
    <script src="{{ '/assets/js/home/homepage-v3.js' | relative_url }}?v=v3.4-0f050cf8-a34cd46970eb-4e59e7ab4713" defer></script>
  </body>
</html>
