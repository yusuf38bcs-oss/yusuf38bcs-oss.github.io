<!doctype html>
<html lang="{{ site.lang | default: 'en' }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
    <meta name="description" content="{{ page.description | default: site.description }}">

    <link rel="stylesheet" href="{{ '/assets/css/synaptic.css' | relative_url }}">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js" defer></script>
  </head>

  <body>
    {% include header.html %}

    <main>
      {{ content }}
    </main>

    <script>
      window.SynapticAI_Data = {
        config: {{ site.data.ai | jsonify }},
        page: {
          title: {{ page.title | jsonify }},
          excerpt: {{ page.excerpt | strip_html | jsonify }},
          categories: {{ page.categories | jsonify }},
          tags: {{ page.tags | jsonify }},
          url: {{ page.url | jsonify }}
        }
      };
    </script>

    <script src="{{ '/assets/js/aicore.js' | relative_url }}" defer></script>
    <script src="{{ '/assets/js/mcq-engine.js' | relative_url }}" defer></script>
    <script src="{{ '/assets/js/mi-engine.js' | relative_url }}" defer></script>
    <script src="{{ '/assets/js/personality-engine.js' | relative_url }}" defer></script>
  </body>
</html>
