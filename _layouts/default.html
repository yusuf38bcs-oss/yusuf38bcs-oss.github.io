<!DOCTYPE html>
<html lang="{{ site.lang | default: 'en-US' }}" data-theme="dark" style="background-color: #020617 !important;">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  
  <style>
  html, body { background-color: #020617; }
  </style>
    
   </head>

<body class="unified-ecosystem-dark-body">

  {% if site.gtm_id %}
    {% include body/gtm-body.html %}
  {% endif %}

  {% include navigation/masthead.html %}

  <div class="global-ambient-matrix-backdrop" aria-hidden="true">
    <canvas id="neural-network"></canvas>
  </div>

  <div class="main-content-render-viewport" id="synaptic-viewport-root">
    {{ content }}
  </div>

  {% include body/synaptic-ai.html %}

  {% include footer/neural-footer.html %}

  <script src="{{ '/assets/js/core/synaptic-guard.js' | relative_url }}"></script>
  <script defer src="{{ '/assets/js/core/theme-controller.js' | relative_url }}?v={{ site.time | date: '%Y%m%d%H%M%S' }}"></script>
  <script defer src="{{ '/assets/js/core/performance-guard.js' | relative_url }}?v={{ site.time | date: '%Y%m%d%H%M%S' }}"></script>
  <script defer src="{{ '/assets/js/core/menu-scroll.js' | relative_url }}?v={{ site.time | date: '%Y%m%d%H%M%S' }}"></script>
  <script defer src="{{ '/assets/js/core/semantic-linker.js' | relative_url }}?v={{ site.time | date: '%Y%m%d%H%M%S' }}"></script>
  <script defer src="{{ '/assets/js/core/analytics-engine.js' | relative_url }}?v={{ site.time | date: '%Y%m%d%H%M%S' }}"></script>
  <script defer src="{{ '/assets/js/core/socratic-component.js' | relative_url }}?v={{ site.time | date: '%Y%m%d%H%M%S' }}"></script>
  <script defer src="{{ '/assets/js/core/synapse-effects.js' | relative_url }}?v={{ site.time | date: '%Y%m%d%H%M%S' }}"></script>
  
  <script defer src="{{ '/assets/js/core/main.js' | relative_url }}?v={{ site.time | date: '%Y%m%d%H%M%S' }}"></script>

  {% if page.url == "/" %}
    <script defer src="{{ '/assets/js/core/neural-bg.js' | relative_url }}?v={{ site.time | date: '%Y%m%d%H%M%S' }}"></script>
    <script defer src="{{ '/assets/js/home/hero-effects.js' | relative_url }}?v={{ site.time | date: '%Y%m%d%H%M%S' }}"></script>
    <script defer src="{{ '/assets/js/home/neural-flow.js' | relative_url }}?v={{ site.time | date: '%Y%m%d%H%M%S' }}"></script>
    <script defer src="{{ '/assets/js/home/neural-interactions.js' | relative_url }}?v={{ site.time | date: '%Y%m%d%H%M%S' }}"></script>
    <script defer src="{{ '/assets/js/home/section-transitions.js' | relative_url }}?v={{ site.time | date: '%Y%m%d%H%M%S' }}"></script>
  {% endif %}

</body>
</html>
