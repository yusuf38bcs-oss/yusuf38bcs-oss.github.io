---
layout: default
---

<article class="synaptic-single-post-container" itemscope itemtype="http://schema.org/BlogPosting">
  <div class="page-layout-grid">
    
    <main class="page-main-article">
      <header class="page-content-header">
        
        <div class="post-meta-strip-specs" style="display:flex; gap:12px; font-size:0.82rem; color:#64748b; font-weight:700; text-transform:uppercase; margin-bottom:0.75rem;">
          <time datetime="{{ page.date | date_to_xmlschema }}" itemprop="datePublished">⚡ {{ page.date | date: "%B %d, %Y" }}</time>
          <span>•</span>
          <span>
            {% assign words = content | number_of_words %}
            {{ words | divided_by: 180 | plus: 1 }} Min Read
          </span>
        </div>

        <h1 class="page-main-title" itemprop="headline">{{ page.title }}</h1>
        <div class="header-matrix-line"></div>
      </header>

      <div class="page-rendered-markdown-body" itemprop="articleBody">
        {{ content }}
      </div>
    </main>

    <aside class="page-sidebar-viewport">
      {% include navigation/contextual-sidebar.html %}
    </aside>

  </div>
</article>
