---
layout: default
---

<div class="synaptic-home-layout">
  {{ content }}
</div>

<style>

/* =========================================================
   GLOBAL HOME RESET
========================================================= */

.layout--home,
.layout--home body,
.layout--home #main,
.layout--home .initial-content,
.layout--home .page,
.layout--home .page__inner-wrap,
.layout--home .page__content{

  width:100%;
  max-width:100%;
  margin:0;
  padding:0;
  float:none;
}

/* =========================================================
   REMOVE MINIMAL MISTAKES ARTICLE CONSTRAINTS
========================================================= */

.layout--home .page{
  margin:0 !important;
}

.layout--home .page__inner-wrap{
  margin:0 !important;
  padding:0 !important;
}

.layout--home .page__content{
  margin:0 !important;
  padding:0 !important;
}

/* =========================================================
   GLOBAL BODY FOUNDATION
========================================================= */

body.layout--home{

  background:
    radial-gradient(circle at top,#07111d,#020812 65%);

  color:#eef7ff;

  overflow-x:hidden;

  scroll-behavior:smooth;
}

/* =========================================================
   HOME ROOT
========================================================= */

.synaptic-home-layout{

  position:relative;

  width:100%;

  min-height:100vh;

  isolation:isolate;
}

/* =========================================================
   FIX STICKY HEADER LAYERING
========================================================= */

.synaptic-home-layout header{
  z-index:999;
}

/* =========================================================
   IMAGE SAFETY
========================================================= */

.synaptic-home-layout img{
  max-width:100%;
  height:auto;
}

/* =========================================================
   MOBILE OPTIMIZATION
========================================================= */

@media (max-width:768px){

  html{
    font-size:15px;
  }

  .synaptic-home-layout{
    overflow:hidden;
  }

}

</style>
