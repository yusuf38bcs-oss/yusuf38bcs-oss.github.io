---
layout: default
---

<article class="article-layout">
  <div>
    <header class="article-header">
      <h1>{{ page.title }}</h1>
      {% if page.description %}
        <p class="hero__lead">{{ page.description }}</p>
      {% endif %}
    </header>
    <div class="article-content">
      {{ content }}
    </div>
  </div>
</article>
